<style>

         --accent:#6b5228;

         --r-lg: 46px; --r-md: 26px; --r-pill: 999px;
         --glass: rgba(255,255,255,.42);
         --glass-line: rgba(255,255,255,.62);
         --glass-hi: inset 0 1px 0 rgba(255,255,255,.85); }

  /* 苹果式毛玻璃：半透明底 + 高斯模糊 + 饱和度提升 + 顶部高光内描边 */
  .glass{
    background: var(--glass);
    -webkit-backdrop-filter: blur(26px) saturate(180%);
    backdrop-filter: blur(26px) saturate(180%);
    border: 1px solid var(--glass-line);
    box-shadow: 0 12px 30px -16px rgba(50,48,42,.38), var(--glass-hi);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%; overflow:hidden; color:var(--ink);
    background:
      radial-gradient(120% 78% at 50% -10%, #d8d7d2 0%, #c2c1bc 38%, #a9a9a3 66%, #96968f 100%);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased; overscroll-behavior:none}
  a{color:inherit;text-decoration:none}
  img{display:block}

  /* 背景：暖色天顶 + 地面倒影 */
  .bg{position:fixed; inset:0; pointer-events:none; z-index:0}
  .bg::before{content:""; position:absolute; inset:-24% -12% auto -12%; height:70vh;
    background:radial-gradient(46% 78% at 50% 0%,rgba(255,255,255,.62),transparent 72%),
               radial-gradient(38% 64% at 18% 8%,rgba(255,246,229,.45),transparent 74%),
               radial-gradient(34% 58% at 82% 4%,rgba(214,228,255,.40),transparent 74%)}
  .bg::after{content:""; position:absolute; left:0; right:0; bottom:0; height:38vh;
    background:linear-gradient(to top,rgba(120,120,114,.42) 0%,rgba(140,140,133,.18) 44%,transparent 100%)}

  .stage{position:fixed; inset:0; z-index:1; display:flex; flex-direction:column}

  /* ---------- 顶部标题（随卡片切换） ---------- */
  .head{padding:clamp(26px,4.4vh,54px) 24px 0; text-align:center; flex:none}
  .eyebrow{font-size:10.5px; letter-spacing:.34em; text-transform:uppercase; color:var(--accent); opacity:.85}
  .title{margin-top:clamp(10px,1.6vh,18px); min-height:2.2em}
  .title .en{font-size:clamp(21px,3.1vw,38px); font-weight:500; letter-spacing:-.02em; line-height:1.18;
    transition:opacity .22s}
  .title .cn{font-size:clamp(11.5px,1.15vw,13px); color:var(--dim); margin-top:7px; transition:opacity .22s}
  .title.swap .en,.title.swap .cn{opacity:0}
  .sub{margin-top:clamp(12px,1.8vh,20px); display:inline-flex; align-items:center; gap:10px;
    font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim2);
    padding:8px 18px; border-radius:var(--r-pill);
    background:var(--glass); border:1px solid var(--glass-line);
    -webkit-backdrop-filter:blur(22px) saturate(180%); backdrop-filter:blur(22px) saturate(180%);
    box-shadow:var(--glass-hi)}
  .sub b{color:var(--dim); font-weight:400; letter-spacing:.18em}
  .sub i{width:3px; height:3px; border-radius:50%; background:var(--dim2); font-style:normal}

  /* ---------- 横向封面流 ---------- */
  .wrap{flex:1; min-height:0; display:flex; align-items:center; position:relative;
    padding-bottom:clamp(52px,9vh,96px)}
  .track{
    display:flex; align-items:center; gap:var(--gap);
    overflow-x:auto; overflow-y:hidden; width:100%;
    padding-inline:calc(50% - var(--cw)/2);
    scroll-snap-type:x mandatory; perspective:1800px; perspective-origin:50% 50%;
    scrollbar-width:none; -ms-overflow-style:none; cursor:grab; position:relative;
    padding-block:clamp(18px,4vh,52px);
  }
  .track::-webkit-scrollbar{display:none}
  .track.dragging{cursor:grabbing; scroll-snap-type:none}
  .card{
    flex:0 0 var(--cw); aspect-ratio:16/9; scroll-snap-align:center;
    position:relative; border-radius:var(--r-lg); overflow:hidden; background:#101218;
    transform-style:preserve-3d; will-change:transform,opacity;
    box-shadow:0 34px 70px -30px rgba(40,38,32,.55), 0 2px 10px rgba(40,38,32,.12),
               inset 0 0 0 1px rgba(255,255,255,.55);
  }
  .card img{width:100%; height:100%; object-fit:cover; filter:saturate(.9) brightness(.86); transition:filter .4s;
    border-radius:var(--r-lg)}
  .card.on img{filter:saturate(1) brightness(1)}
  .card::after{content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(to top,rgba(5,6,9,.7),transparent 46%)}
  .card .hint{position:absolute; left:50%; bottom:clamp(14px,2vw,24px); transform:translateX(-50%);
    font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--accent);
    padding:8px 16px; border-radius:var(--r-pill); white-space:nowrap; z-index:2;
    background:var(--glass); border:1px solid var(--glass-line);
    -webkit-backdrop-filter:blur(20px) saturate(180%); backdrop-filter:blur(20px) saturate(180%);
    box-shadow:var(--glass-hi);
    opacity:0; transition:opacity .3s, transform .3s}
  .card.on:hover .hint{opacity:1; transform:translateX(-50%) translateY(-2px)}
  .card:not(.on){cursor:pointer}

  /* 左右切换按钮 */
  .nav{
    position:absolute; top:50%; transform:translateY(-50%); z-index:6;
    width:clamp(46px,4.4vw,58px); height:clamp(46px,4.4vw,58px); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(17px,1.7vw,21px); line-height:1; color:var(--ink); cursor:pointer;
    border:1px solid var(--glass-line);
    background:var(--glass);
    -webkit-backdrop-filter:blur(26px) saturate(180%); backdrop-filter:blur(26px) saturate(180%);
    box-shadow:0 16px 40px -18px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.16);
    transition:transform .2s, border-color .2s, color .2s, opacity .2s;
    user-select:none; -webkit-user-select:none;
  }
  .nav:hover{border-color:rgba(232,199,154,.55); color:var(--accent); transform:translateY(-50%) scale(1.06)}
  .nav:active{transform:translateY(-50%) scale(.96)}
  .nav.prev{left:clamp(10px,2.2vw,34px)}
  .nav.next{right:clamp(10px,2.2vw,34px)}
  .nav[disabled]{opacity:.28; pointer-events:none}

  /* 地面倒影 */
  .floor{position:absolute; left:0; right:0; bottom:0; height:26vh; pointer-events:none; z-index:2;
    background:radial-gradient(58% 100% at 50% 100%,rgba(232,199,154,.07),transparent 72%)}

  /* ---------- 底部 ---------- */
  .bar{position:absolute; left:50%; transform:translateX(-50%); bottom:clamp(14px,2.4vh,26px);
    width:clamp(150px,16vw,240px); height:4px; border-radius:999px;
    background:rgba(28,28,26,.16); overflow:hidden; z-index:5;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
  .bar i{display:block; height:100%; width:0; border-radius:999px;
    background:var(--accent); box-shadow:0 0 10px rgba(232,199,154,.55);
    transition:width .22s ease}

  /* ---------- 进入场景 ---------- */
  .viewer{position:fixed; inset:0; z-index:100; background:#000; display:none; opacity:0; transition:opacity .4s}
  .viewer.on{display:block}
  .viewer.shown{opacity:1}
  .viewer iframe{width:100%; height:100%; border:0; display:block; background:#05060a}
  .veil{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:#05060a; transition:opacity .55s; z-index:3}
  .veil.off{opacity:0; pointer-events:none}
  .dot{width:6px; height:6px; border-radius:50%; background:var(--accent); opacity:.35; animation:pulse 1.25s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.18; transform:scale(.8)}50%{opacity:.85; transform:scale(1.15)}}
  .vbar{position:absolute; left:0; right:0; display:flex; align-items:center; gap:14px;
    padding:clamp(13px,2vw,22px) clamp(15px,2.4vw,30px); z-index:4; pointer-events:none}
  .vbar.top{top:0; background:linear-gradient(to bottom,rgba(4,5,8,.85),transparent)}
  .vbar.bottom{bottom:0; background:linear-gradient(to top,rgba(4,5,8,.85),transparent); justify-content:center}
  .vbar > *{pointer-events:auto}
  .vtitle{flex:1; min-width:0}
  .vtitle .en{font-size:14.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .vtitle .cn{font-size:11.5px; color:var(--dim); margin-top:2px}
  .vbtn{font:inherit; font-size:11.5px; letter-spacing:.08em; color:var(--ink); cursor:pointer;
    background:var(--glass); border:1px solid var(--glass-line); border-radius:var(--r-pill);
    padding:8px 16px; -webkit-backdrop-filter:blur(24px) saturate(180%); backdrop-filter:blur(24px) saturate(180%);
    box-shadow:var(--glass-hi); transition:.2s; white-space:nowrap}
  .vbtn:hover{border-color:rgba(232,199,154,.5); color:var(--accent)}
  .vcount{font-size:11px; letter-spacing:.14em; color:var(--dim2); font-variant-numeric:tabular-nums; padding:0 4px}
  .varrow{width:44px; height:44px; border-radius:50%; border:1px solid var(--glass-line);
    background:var(--glass); -webkit-backdrop-filter:blur(24px) saturate(180%); backdrop-filter:blur(24px) saturate(180%);
    box-shadow:var(--glass-hi); color:var(--ink);
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px; transition:.2s}
  .varrow:hover{border-color:rgba(232,199,154,.55); color:var(--accent)}

  @media (max-width:720px){
    :root{--cw: 84vw}
    .sub{letter-spacing:.14em}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important; animation:none!important}
    .track{scroll-behavior:auto}
  }
</style>
</head>

<div class="bg"></div>

<div class="stage">

<script>
var WORKS = [

];
var SRC = {"A01":"_extracted/a01-twin-peaks-lodge/TwinPeaks-BlackLodge/TwinPeaks-BlackLodge.html","A02":"_extracted/a02-ashtray-maze/ashtray-maze/standalone/ashtray-maze.html","A03":"_extracted/a03-aurora-hourglass/aurora-hourglass/index.html","A04":"_extracted/a04-autumn-farm/index.html","A05":"_extracted/a05-cliff-lighthouse-cafe/cliff-lighthouse-cafe/index.html","A06":"_extracted/a06-cloud-post-office/cloud-post-office/index.html","A07":"_extracted/a07-fbc-quarry/fbc-quarry/standalone/fbc-quarry-07.html","A08":"_extracted/a08-fbc-redshift/fbc-redshift-archive/dist/FBC-Redshift-Archive.html","A09":"_extracted/a09-grand-hotel/grand-hotel-diorama/grand-hotel-diorama.html","A10":"_extracted/a10-lighthouse/lighthouse-scene/lighthouse.html","A11":"_extracted/a11-lunar-outpost/lunar-outpost/index-offline.html","A12":"_extracted/a12-monach-stutter-lab/monach_stutter_lab/monach_stutter_lab.html","A13":"_extracted/a13-mori-mart/mori-mart/index.html","A14":"_extracted/a14-polar-icebreaker/polar-icebreaker/polar-icebreaker.html","A15":"_extracted/a15-qipao-diorama/qipao-diorama/standalone/qipao-diorama.html","A16":"_extracted/a16-route66-diner/route66-diner/index.html","A17":"_extracted/a17-twin-peaks-red-room/twin-peaks-red-room/standalone/twin-peaks-red-room.html","A18":"_extracted/a18-whale-dream-atelier/whale-dream-atelier/dist/dream-weaver-atelier.html","A19":"_extracted/a19-stranger-things/hawkins-mirror/hawkins-mirror.html","A20":"_extracted/a20-moonlit-perfume-atelier/moonlit-perfume-atelier/index.html","A21":"_extracted/a21-ice-fire-mine-station/ice-fire-mine-station/index.html"};

var track = document.getElementById('track');
var cards = [];

WORKS.forEach(function (w, i) {
  var el = document.createElement('article');
  el.className = 'card';
  el.dataset.id = w.id;
  el.innerHTML = '<img src="previews/wall/' + w.id + '.jpg" alt="' + w.en + '" ' +
                 (i < 3 ? '' : 'loading="lazy" ') + 'decoding="async">' +
                 '<div class="hint">点击进入</div>';
  el.addEventListener('click', function () {
    if (el.classList.contains('on')) open(w.id);
    else center(i);
  });
  track.appendChild(el);
  cards.push({ el: el, w: w, i: i });
});

/* ---------- 排版：按距离做透视 ---------- */
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var current = -1;   // -1 让首次 layout() 必定刷新标题（否则首屏显示 HTML 占位文字）

function layout() {
  var mid = track.scrollLeft + track.clientWidth / 2;
  var half = Math.max(track.clientWidth * 0.5, 1);
  var best = 0, bestD = 1e9;
  for (var k = 0; k < cards.length; k++) {
    var c = cards[k];
    var box = c.el;
    var d = (box.offsetLeft + box.offsetWidth / 2 - mid) / half;
    if (Math.abs(d) < bestD) { bestD = Math.abs(d); best = k; }
    var ad = Math.min(1, Math.abs(d));
    if (!reduce) {
      var rot = -d * 20;
      var sc = 1 - ad * 0.13;
      var ty = ad * 10;
      box.style.transform = 'rotateY(' + rot.toFixed(2) + 'deg) scale(' + sc.toFixed(3) + ') translateY(' + ty.toFixed(1) + 'px)';
    }
    box.style.opacity = String(Math.max(0.34, 1 - ad * 0.58));
  }
  for (var q = 0; q < cards.length; q++) cards[q].el.classList.toggle('on', q === best);
  navPrev.disabled = best <= 0;
  navNext.disabled = best >= cards.length - 1;
  if (best !== current) setCurrent(best);
  var p = cards.length > 1 ? best / (cards.length - 1) : 0;
  document.getElementById('bar').style.width = (p * 100).toFixed(2) + '%';
}

function setCurrent(i) {
  current = i;
  var t = document.getElementById('title');
  t.classList.add('swap');
  setTimeout(function () {
    document.getElementById('tEn').textContent = cards[i].w.en;
    document.getElementById('tCn').textContent = cards[i].w.cn;
    document.getElementById('tIdx').textContent =
      String(i + 1).padStart(2, '0') + ' / ' + String(cards.length).padStart(2, '0');
    t.classList.remove('swap');
  }, 140);
}

function nearestIndex() {
  var mid = track.scrollLeft + track.clientWidth / 2, best = 0, bd = 1e9;
  for (var k = 0; k < cards.length; k++) {
    var d = Math.abs(cards[k].el.offsetLeft + cards[k].el.offsetWidth / 2 - mid);
    if (d < bd) { bd = d; best = k; }
  }
  return best;
}

/* 程序化滚动必须临时关掉 snap：mandatory 吸附会打断 scrollTo，每步少走约 40px。
   滚到位后立刻恢复，此时位置本身就是吸附点，不会跳动。 */
var snapTimer = 0;
function center(i) {
  var c = cards[i];
  var target = c.el.offsetLeft + c.el.offsetWidth / 2 - track.clientWidth / 2;
  track.style.scrollSnapType = 'none';
  clearTimeout(snapTimer);
  track.scrollTo({ left: target, behavior: reduce ? 'auto' : 'smooth' });
  snapTimer = setTimeout(function () { track.style.scrollSnapType = 'x mandatory'; }, reduce ? 40 : 640);
}

/* ---------- 滚轮 → 横向 ---------- */
track.addEventListener('wheel', function (e) {
  if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
  e.preventDefault();
  var step = Math.sign(e.deltaY);
  var atEdge = (step > 0 && track.scrollLeft >= track.scrollWidth - track.clientWidth - 2) ||
               (step < 0 && track.scrollLeft <= 2);
  if (atEdge) return;
  track.scrollLeft += e.deltaY * 1.15;
}, { passive: false });

/* ---------- 拖动 ---------- */
var down = false, startX = 0, startL = 0, moved = 0;
track.addEventListener('pointerdown', function (e) {
  if (e.button !== 0) return;
  down = true; moved = 0; startX = e.clientX; startL = track.scrollLeft;
  track.classList.add('dragging');
});
window.addEventListener('pointermove', function (e) {
  if (!down) return;
  var dx = e.clientX - startX;
  moved = Math.max(moved, Math.abs(dx));
  track.scrollLeft = startL - dx;
});
window.addEventListener('pointerup', function () {
  if (!down) return;
  down = false;
  track.classList.remove('dragging');
  if (moved < 6) return;
  var idx = 0, bestD = 1e9;
  var mid2 = track.scrollLeft + track.clientWidth / 2;
  for (var k = 0; k < cards.length; k++) {
    var dd = Math.abs(cards[k].el.offsetLeft + cards[k].el.offsetWidth / 2 - mid2);
    if (dd < bestD) { bestD = dd; idx = k; }
  }
  center(idx);
});

var raf = 0;
track.addEventListener('scroll', function () {
  if (raf) return;
  raf = requestAnimationFrame(function () { raf = 0; layout(); });
}, { passive: true });
window.addEventListener('resize', function () { layout(); });

var navPrev = document.getElementById('navPrev');
var navNext = document.getElementById('navNext');
navPrev.addEventListener('click', function () { center(Math.max(nearestIndex() - 1, 0)); });
navNext.addEventListener('click', function () { center(Math.min(nearestIndex() + 1, cards.length - 1)); });

function syncNav() {
  var i = nearestIndex();
  navPrev.disabled = i <= 0;
  navNext.disabled = i >= cards.length - 1;
}

document.addEventListener('keydown', function (e) {
  if (document.getElementById('viewer').classList.contains('on')) {
    if (e.key === 'Escape') closeViewer();
    else if (e.key === 'ArrowLeft') stepViewer(-1);
    else if (e.key === 'ArrowRight') stepViewer(1);
    return;
  }
  if (e.key === 'ArrowRight') { e.preventDefault(); center(Math.min(nearestIndex() + 1, cards.length - 1)); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); center(Math.max(nearestIndex() - 1, 0)); }
});

/* ---------- 进入 / 退出 ---------- */
var viewer = document.getElementById('viewer');
var frame = document.getElementById('frame');
var veil = document.getElementById('veil');
var vIndex = 0;

function open(id) {
  var i = WORKS.findIndex(function (x) { return x.id === id; });
  if (i < 0) return;
  vIndex = i;
  paintViewer();
  veil.classList.remove('off');
  viewer.classList.add('on');
  requestAnimationFrame(function () { viewer.classList.add('shown'); });
  frame.src = SRC[id];
  frame.onload = function () { setTimeout(function () { veil.classList.add('off'); }, 240); };
  if (history.replaceState) history.replaceState(null, '', '#' + id);
}

function paintViewer() {
  var w = WORKS[vIndex];
  document.getElementById('vEn').textContent = w.en;
  document.getElementById('vCn').textContent = w.cn;
  document.getElementById('vCount').textContent = (vIndex + 1) + ' / ' + WORKS.length;
}

function stepViewer(d) {
  vIndex = (vIndex + d + WORKS.length) % WORKS.length;
  frame.src = SRC[WORKS[vIndex].id];
  paintViewer();
  if (history.replaceState) history.replaceState(null, '', '#' + WORKS[vIndex].id);
}

function closeViewer() {
  viewer.classList.remove('shown');
  if (history.replaceState) history.replaceState(null, '', location.pathname);
  setTimeout(function () {
    viewer.classList.remove('on');
    frame.src = 'about:blank';
    veil.classList.remove('off');
  }, 400);
}

document.getElementById('vClose').addEventListener('click', closeViewer);
document.getElementById('vPrev').addEventListener('click', function () { stepViewer(-1); });
document.getElementById('vNext').addEventListener('click', function () { stepViewer(1); });

/* ---------- 启动 ---------- */
window.addEventListener('load', function () {
  layout();
  var id = location.hash.replace('#', '');
  if (id && SRC[id]) open(id);
});
requestAnimationFrame(function () { layout(); });
setTimeout(layout, 240);
</script>
</body>
</html>
