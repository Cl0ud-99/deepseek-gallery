<style>
  :root{ --bg:#b6bac2; --ink:#14161c; --dim:rgba(18,20,28,.60); --dim2:rgba(18,20,28,.38);
         --accent:#4d6bfe; --accent-2:#7a63ff;

         --r-lg: 46px; --r-md: 26px; --r-pill: 999px;
         --glass: rgba(255,255,255,.42);
         --glass-line: rgba(255,255,255,.62);
         --glass-hi: inset 0 1px 0 rgba(255,255,255,.85); }

  /* 苹果式毛玻璃：半透明底 + 高斯模糊 + 饱和度提升 + 顶部高光内描边 */
  .glass{
    background: var(--glass);
    -webkit-backdrop-filter: blur(26px) saturate(180%);
    backdrop-filter: blur(26px) saturate(180%);
    border: 1px solid var(--glass-line);
    box-shadow: 0 12px 30px -16px rgba(50,48,42,.38), var(--glass-hi);
  }
  *{box-sizing:border-box;margin:0;padding:0}

    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased; overscroll-behavior:none}
  a{color:inherit;text-decoration:none}
  img{display:block}

    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
  }
  img{
    -webkit-user-drag:none; user-drag:none; pointer-events:none;
    -webkit-user-select:none; user-select:none;
  }

  /* 背景：暖色天顶 + 地面倒影 */
  /* 加载态 */
  .boot{position:fixed; inset:0; z-index:9; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
    opacity:0; transition:opacity .4s ease}
  body.booting .boot{opacity:1}
  .boot-txt{font-size:11px; letter-spacing:.44em; text-transform:uppercase; color:var(--accent); opacity:.85; padding-left:.44em}
  .boot-bar{width:clamp(120px,13vw,170px); height:2px; border-radius:999px;
    background:rgba(20,22,28,.12); overflow:hidden}
  .boot-bar i{display:block; width:38%; height:100%; border-radius:999px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    animation:bootSlide 1.15s cubic-bezier(.45,0,.55,1) infinite}
  @keyframes bootSlide{0%{transform:translateX(-105%)}100%{transform:translateX(365%)}}

  /* 首帧先藏起来，等进场动画接管——否则会先亮一下再消失 */
  body.booting .stage, body.booting .ovbtn{opacity:0}

  .bg{position:fixed; inset:0; pointer-events:none; z-index:0}
  .bg::before{content:""; position:absolute; inset:-24% -12% auto -12%; height:70vh;
    background:radial-gradient(46% 78% at 50% 0%,rgba(255,255,255,.66),transparent 72%),
               radial-gradient(40% 66% at 16% 6%,rgba(77,107,254,.16),transparent 74%),
               radial-gradient(36% 60% at 84% 4%,rgba(122,99,255,.14),transparent 74%)}

  .stage{position:fixed; inset:0; z-index:1; display:flex; flex-direction:column}

  /* 底部毛玻璃渐变：把画面下缘可能露出的硬边柔化掉 */
  .stage::after{
    content:""; position:fixed; left:0; right:0; bottom:0; height:clamp(110px,16vh,180px);
    pointer-events:none; z-index:-1;   /* 必须低于卡片，否则会把最后一行洗白 */
    background:linear-gradient(to top,
      rgba(232,234,240,.92) 0%,
      rgba(228,230,238,.72) 28%,
      rgba(224,227,236,.38) 58%,
      rgba(220,224,234,0) 100%);
    /* 不用 backdrop-filter：它按元素矩形做模糊，边界反而会显出硬边 */
  }

  /* ---------- 顶部标题（随卡片切换） ---------- */
  .head{padding:clamp(58px,9.4vh,112px) 24px 0; text-align:center; flex:none;
    transition:opacity .34s ease}
  body.is-moving .head{opacity:0}      /* 转场时先让位，避免文字压在飞行的卡片上 */
  .eyebrow{font-size:10.5px; letter-spacing:.34em; text-transform:uppercase; color:var(--accent); opacity:.85}
  .title{margin-top:clamp(10px,1.6vh,18px); min-height:2.2em; margin-bottom:clamp(6px,1.2vh,14px)}
  .title .en{font-size:clamp(21px,3.1vw,38px); font-weight:500; letter-spacing:-.02em; line-height:1.18;
    transition:opacity .22s}
  .title .cn{font-size:clamp(11.5px,1.15vw,13px); color:var(--dim); margin-top:7px; transition:opacity .22s}
  .title.swap .en,.title.swap .cn{opacity:0}

  /* ---------- 横向封面流 ---------- */
  .wrap{flex:1; min-height:0; display:flex; align-items:center; position:relative;
    padding-bottom:clamp(52px,9vh,96px)}
  .track{
    display:flex; align-items:center; gap:var(--gap);
    overflow-x:auto; overflow-y:hidden; width:100%;
    padding-inline:calc(50% - var(--cw)/2);
    scroll-snap-type:x mandatory; perspective:1800px; perspective-origin:50% 50%;
    scrollbar-width:none; -ms-overflow-style:none; cursor:grab; position:relative;
    padding-block:clamp(18px,4vh,52px);
  }
  .track::-webkit-scrollbar{display:none}
  .track.dragging{cursor:grabbing; scroll-snap-type:none}
  .card{
    flex:0 0 var(--cw); aspect-ratio:16/9; scroll-snap-align:center; contain:layout paint;
    position:relative; border-radius:var(--r-lg); overflow:hidden;
    background:rgba(255,255,255,.34);      /* 图片未加载时的占位，加载后被盖住 */
    transform-style:preserve-3d; will-change:transform,opacity;

  .card .hint{position:absolute; left:50%; bottom:clamp(14px,2vw,24px); transform:translateX(-50%);
    font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--accent);
    padding:8px 16px; border-radius:var(--r-pill); white-space:nowrap; z-index:2;
    background:var(--glass); border:1px solid var(--glass-line);
    -webkit-backdrop-filter:blur(20px) saturate(180%); backdrop-filter:blur(20px) saturate(180%);
    box-shadow:var(--glass-hi);
    opacity:0; transition:opacity .3s, transform .3s}
  .card.on:hover .hint{opacity:1; transform:translateX(-50%) translateY(-2px)}
  .card:not(.on){cursor:pointer}

  /* 左右切换按钮 */
  .nav{
    position:absolute; top:50%; transform:translateY(-50%); z-index:6;
    width:clamp(46px,4.4vw,58px); height:clamp(46px,4.4vw,58px); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(17px,1.7vw,21px); line-height:1; color:var(--ink); cursor:pointer;
    border:1px solid var(--glass-line);
    background:var(--glass);
    -webkit-backdrop-filter:blur(26px) saturate(180%); backdrop-filter:blur(26px) saturate(180%);
    box-shadow:0 16px 40px -18px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.16);
    transition:transform .2s, border-color .2s, color .2s, opacity .2s;
    user-select:none; -webkit-user-select:none;
  }
  .nav:hover{border-color:rgba(77,107,254,.55); color:var(--accent); transform:translateY(-50%) scale(1.06)}
  .nav:active{transform:translateY(-50%) scale(.96)}
  .nav.prev{left:clamp(10px,2.2vw,34px)}
  .nav.next{right:clamp(10px,2.2vw,34px)}
  .nav[disabled]{opacity:.28; pointer-events:none}

  /* 地面倒影 */

  /* ---------- 底部 ---------- */
  .bar{position:absolute; left:50%; transform:translateX(-50%); bottom:clamp(14px,2.4vh,26px);
    width:clamp(150px,16vw,240px); height:4px; border-radius:999px;
    background:rgba(28,28,26,.16); overflow:hidden; z-index:5;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
  .bar i{display:block; height:100%; width:0; border-radius:999px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    box-shadow:0 0 12px rgba(77,107,254,.55);
    transition:width .22s ease}

  /* ---------- 总览按钮 ---------- */
  .ovbtn{
    position:fixed; top:clamp(14px,2.4vh,26px); right:clamp(14px,2.4vw,30px); z-index:20;
    display:inline-flex; align-items:center; gap:8px;
    font:inherit; font-size:12px; letter-spacing:.06em; color:var(--ink); cursor:pointer;
    padding:9px 16px 9px 13px; border-radius:var(--r-pill);
    background:var(--glass); border:1px solid var(--glass-line);
    -webkit-backdrop-filter:blur(26px) saturate(180%); backdrop-filter:blur(26px) saturate(180%);
    box-shadow:0 10px 26px -14px rgba(50,48,42,.5), var(--glass-hi);
    transition:transform .2s, color .2s, border-color .2s;
  }
  .ovbtn:hover{color:var(--accent); border-color:rgba(77,107,254,.45); transform:translateY(-1px)}
  .ovbtn svg{width:13px; height:13px; opacity:.8}

  /* ---------- 总览（网格）模式 ---------- */
  body.mode-grid .head{padding:clamp(14px,2.2vh,26px) 24px 0}
  body.mode-grid .wrap{padding-bottom:0}
  body.mode-grid .track{
    display:grid; grid-template-columns:repeat(5,1fr); grid-auto-rows:1fr;
    gap:clamp(10px,1.2vw,18px);
    overflow:visible; height:100%;
    padding:clamp(12px,2vh,26px) clamp(16px,3vw,46px) clamp(16px,2.6vh,32px);
    perspective:none; cursor:default;
  }
  body.mode-grid .card{
    /* 必须和横向模式同为 16:9：格子是 257x151(1.70)，若拉伸填满格子，
       转场时 sx≠sy 会把卡片压扁一下（'抽'的感觉） */
    width:100%; height:auto; aspect-ratio:16/9; align-self:center;
    border-radius:18px; cursor:pointer;
    background:transparent;
    box-shadow:0 6px 16px -12px rgba(28,32,44,.22), inset 0 0 0 1px rgba(255,255,255,.45);
  }
  body.mode-grid .card img{border-radius:inherit}
  body.mode-grid .card:hover img{transform:scale(1.05)}
  body.mode-grid .card .hint{display:none}
  body.mode-grid .nav,
  body.mode-grid .bar{display:none}
  body.mode-grid .title{display:none}
  @media (max-width:1200px){ body.mode-grid .track{grid-template-columns:repeat(4,1fr)} }
  @media (max-width:820px){ body.mode-grid .track{grid-template-columns:repeat(3,1fr)} }
  @media (max-width:560px){ body.mode-grid .track{grid-template-columns:repeat(2,1fr)} }

  /* ---------- 进入场景 ---------- */
  .viewer{position:fixed; inset:0; z-index:100; background:#000; display:none; opacity:0; transition:opacity .4s;
    visibility:hidden}
  .viewer.on{visibility:visible}
  .viewer.on{display:block}
  .viewer.shown{opacity:1}
  .viewer iframe{width:100%; height:100%; border:0; display:block; background:#05060a}
  .veil{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:#05060a; transition:opacity .55s; z-index:3}
  .veil.off{opacity:0; pointer-events:none}
  .dot{width:6px; height:6px; border-radius:50%; background:var(--accent); opacity:.35; animation:pulse 1.25s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.18; transform:scale(.8)}50%{opacity:.85; transform:scale(1.15)}}
  .vbar{position:absolute; left:0; right:0; display:flex; align-items:center; gap:14px;
    padding:clamp(13px,2vw,22px) clamp(15px,2.4vw,30px); z-index:4; pointer-events:none}
  .vbar.top{top:0; background:linear-gradient(to bottom,rgba(4,5,8,.85),transparent)}
  .vbar.bottom{bottom:0; background:linear-gradient(to top,rgba(4,5,8,.85),transparent); justify-content:center}
  .vbar > *{pointer-events:auto}
  .vtitle{flex:1; min-width:0}
  .vtitle .en{font-size:14.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .vtitle .cn{font-size:11.5px; color:var(--dim); margin-top:2px}
  .vbtn{font:inherit; font-size:11.5px; letter-spacing:.08em; color:var(--ink); cursor:pointer;
    background:var(--glass); border:1px solid var(--glass-line); border-radius:var(--r-pill);
    padding:8px 16px; -webkit-backdrop-filter:blur(24px) saturate(180%); backdrop-filter:blur(24px) saturate(180%);
    box-shadow:var(--glass-hi); transition:.2s; white-space:nowrap}
  .vbtn:hover{border-color:rgba(77,107,254,.55); color:var(--accent)}
  .varrow{width:44px; height:44px; border-radius:50%; border:1px solid var(--glass-line);
    background:var(--glass); -webkit-backdrop-filter:blur(24px) saturate(180%); backdrop-filter:blur(24px) saturate(180%);
    box-shadow:var(--glass-hi); color:var(--ink);
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px; transition:.2s}
  .varrow:hover{border-color:rgba(77,107,254,.55); color:var(--accent)}

  @media (max-width:720px){
    :root{--cw: 84vw}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important; animation:none!important}
    .track{scroll-behavior:auto}
  }
</style>

    box.style.opacity = String(Math.max(0.34, 1 - ad * 0.58));
  }
  for (var q = 0; q < cards.length; q++) cards[q].el.classList.toggle('on', q === best);
  navPrev.disabled = best <= 0;
  navNext.disabled = best >= cards.length - 1;
  if (best !== current) setCurrent(best);
  var p = cards.length > 1 ? best / (cards.length - 1) : 0;
  document.getElementById('bar').style.width = (p * 100).toFixed(2) + '%';
}

function setCurrent(i) {
  current = i;
  var t = document.getElementById('title');
  t.classList.add('swap');
  setTimeout(function () {
    document.getElementById('tEn').textContent = cards[i].w.en;
    document.getElementById('tCn').textContent = cards[i].w.cn;
    t.classList.remove('swap');
  }, 140);
}

function nearestIndex() {
  var mid = track.scrollLeft + track.clientWidth / 2, best = 0, bd = 1e9;
  for (var k = 0; k < cards.length; k++) {
    var d = Math.abs(cards[k].el.offsetLeft + cards[k].el.offsetWidth / 2 - mid);
    if (d < bd) { bd = d; best = k; }
  }
  return best;
}

/* 程序化滚动必须临时关掉 snap：mandatory 吸附会打断 scrollTo，每步少走约 40px。
   滚到位后立刻恢复，此时位置本身就是吸附点，不会跳动。 */
var snapTimer = 0;
function center(i) {
  var c = cards[i];
  var target = c.el.offsetLeft + c.el.offsetWidth / 2 - track.clientWidth / 2;
  track.style.scrollSnapType = 'none';
  clearTimeout(snapTimer);
  track.scrollTo({ left: target, behavior: reduce ? 'auto' : 'smooth' });
  snapTimer = setTimeout(function () { track.style.scrollSnapType = 'x mandatory'; }, reduce ? 40 : 640);
}

/* ---------- 滚轮 → 横向 ---------- */
track.addEventListener('wheel', function (e) {
  if (overview) return;
  if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
  e.preventDefault();
  var step = Math.sign(e.deltaY);
  var atEdge = (step > 0 && track.scrollLeft >= track.scrollWidth - track.clientWidth - 2) ||
               (step < 0 && track.scrollLeft <= 2);
  if (atEdge) return;
  track.scrollLeft += e.deltaY * 1.15;
}, { passive: false });

/* ---------- 拖动 ---------- */
var down = false, startX = 0, startL = 0, moved = 0;
track.addEventListener('pointerdown', function (e) {
  if (e.button !== 0) return;
  down = true; moved = 0; startX = e.clientX; startL = track.scrollLeft;
  track.classList.add('dragging');
});
window.addEventListener('pointermove', function (e) {
  if (!down) return;
  var dx = e.clientX - startX;
  moved = Math.max(moved, Math.abs(dx));
  track.scrollLeft = startL - dx;
});
window.addEventListener('pointerup', function () {
  if (!down) return;
  down = false;
  track.classList.remove('dragging');
  if (moved < 6) return;
  var idx = 0, bestD = 1e9;
  var mid2 = track.scrollLeft + track.clientWidth / 2;
  for (var k = 0; k < cards.length; k++) {
    var dd = Math.abs(cards[k].el.offsetLeft + cards[k].el.offsetWidth / 2 - mid2);
    if (dd < bestD) { bestD = dd; idx = k; }
  }
  center(idx);
});

var raf = 0;
track.addEventListener('scroll', function () {
  if (raf) return;
  raf = requestAnimationFrame(function () { raf = 0; layout(); });
}, { passive: true });
window.addEventListener('resize', function () { layout(); });

var navPrev = document.getElementById('navPrev');
var navNext = document.getElementById('navNext');
navPrev.addEventListener('click', function () { center(Math.max(nearestIndex() - 1, 0)); });
navNext.addEventListener('click', function () { center(Math.min(nearestIndex() + 1, cards.length - 1)); });

function syncNav() {
  var i = nearestIndex();
  navPrev.disabled = i <= 0;
  navNext.disabled = i >= cards.length - 1;
}

document.addEventListener('keydown', function (e) {
  if (document.getElementById('viewer').classList.contains('on')) {
    if (e.key === 'Escape') closeViewer();
    else if (e.key === 'ArrowLeft') stepViewer(-1);
    else if (e.key === 'ArrowRight') stepViewer(1);
    return;
  }
  if (overview) { if (e.key === 'Escape') setMode(false); return; }
  if (e.key === 'ArrowRight') { e.preventDefault(); center(Math.min(nearestIndex() + 1, cards.length - 1)); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); center(Math.max(nearestIndex() - 1, 0)); }
});

/* ---------- 进入 / 退出 ---------- */
var viewer = document.getElementById('viewer');
var frame = document.getElementById('frame');
var veil = document.getElementById('veil');
var vIndex = 0;

function open(id) {
  var i = WORKS.findIndex(function (x) { return x.id === id; });
  if (i < 0) return;
  vIndex = i;
  paintViewer();
  veil.classList.remove('off');
  viewer.classList.add('on');
  requestAnimationFrame(function () { viewer.classList.add('shown'); });
  frame.src = SRC[id];
  frame.onload = function () { setTimeout(function () { veil.classList.add('off'); }, 240); };
  if (history.replaceState) history.replaceState(null, '', '#' + id);
}

function paintViewer() {
  var w = WORKS[vIndex];
  document.getElementById('vEn').textContent = w.en;
  document.getElementById('vCn').textContent = w.cn;
}

function stepViewer(d) {
  vIndex = (vIndex + d + WORKS.length) % WORKS.length;
  frame.src = SRC[WORKS[vIndex].id];
  paintViewer();
  if (history.replaceState) history.replaceState(null, '', '#' + WORKS[vIndex].id);
}

function closeViewer() {
  viewer.classList.remove('shown');
  if (history.replaceState) history.replaceState(null, '', location.pathname);
  setTimeout(function () {
    viewer.classList.remove('on');
    frame.src = 'about:blank';
    veil.classList.remove('off');
  }, 400);
}

document.getElementById('vClose').addEventListener('click', closeViewer);
document.getElementById('vPrev').addEventListener('click', function () { stepViewer(-1); });
document.getElementById('vNext').addEventListener('click', function () { stepViewer(1); });

/* ---------- 总览：一次连续的位移+缩放，不切镜头 ---------- */
var transitioning = false;

function jumpTo(i) {
  track.style.scrollSnapType = 'none';
  track.scrollTop = 0;
  track.scrollLeft = cards[i].el.offsetLeft + cards[i].el.offsetWidth / 2 - track.clientWidth / 2;
}

function setMode(toGrid, focusIndex) {
  if (transitioning) return;
  transitioning = true;

  var els = cards.map(function (c) { return c.el; });

  /* 1. 记录起点：用 offsetLeft/Width —— 布局坐标，不含 3D 变换。
      getBoundingClientRect() 拿到的是旋转+缩放后的外接矩形，宽高比已经变形，
      sx≠sy 会把卡片压扁并飞到错误位置。 */
  var g0 = els.map(function (el) {
    return { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight };
  });
  var t0 = els.map(function (el) { return el.style.transform || 'none'; });
  var op0 = els.map(function (el) { return parseFloat(getComputedStyle(el).opacity) || 0; });
  var scroll0 = track.scrollLeft;   // offsetLeft 是相对内容原点，必须扣掉滚动量
  var box0 = track.getBoundingClientRect();   // 切换前后 track 自身也会移动（头部高度变了）

  document.body.classList.add('is-moving');
  els.forEach(function (el) { el.style.willChange = 'transform, opacity'; });

  /* 预选择优先：进入总览时直接取此刻真正居中的那张，
     不依赖 current（它在转场期间可能被置为 -1） */
  if (toGrid) lastFocus = nearestIndex();
  else if (typeof focusIndex !== 'number') focusIndex = lastFocus;

  /* 2. 切布局 */
  overview = toGrid;
  document.body.classList.toggle('mode-grid', toGrid);
  document.getElementById('ovLabel').textContent = toGrid ? '返回' : '总览';
  els.forEach(function (el) { el.style.transform = ''; el.style.opacity = ''; });


  void track.offsetWidth;

  if (!toGrid) {
    jumpTo(focusIndex);
    void track.offsetWidth;
    transitioning = false;
    current = -1;
    layout();
    transitioning = true;
  }

  /* 3. 记录终点：布局矩形 + 目标变换 */
  var g1 = els.map(function (el) {
    return { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight };
  });
  var scroll1 = track.scrollLeft;
  var box1 = track.getBoundingClientRect();
  var t1 = els.map(function (el) { return el.style.transform || 'none'; });
  var op1 = els.map(function (el) { return el.style.opacity ? parseFloat(el.style.opacity) : 1; });

  function compose(dx, dy, sx, sy, base) {
    var head = 'translate(' + dx.toFixed(2) + 'px,' + dy.toFixed(2) + 'px) scale(' + sx.toFixed(4) + ',' + sy.toFixed(4) + ')';
    return (base && base !== 'none') ? head + ' ' + base : head;
  }

  /* 4. 动画 */
  var rv0 = toGrid ? 46 : 18, rv1 = toGrid ? 18 : 46;   // 期望的视觉圆角
  anims = [];
  var vw = window.innerWidth, vh = window.innerHeight;
  var sel = toGrid ? lastFocus : focusIndex;      // 当前选中的那一张

  /* 四套飞入策略，每次进入总览随机选一套。
     用同一套能让整场转场保持统一的'镜头语言'，换套则每次开箱不一样。 */
  var ENTRIES = ['side', 'vertical', 'diagonal', 'bloom'];
  var entry = ENTRIES[Math.floor(Math.random() * ENTRIES.length)];

  els.forEach(function (el, i) {
    var dx, dy, sx, sy, base = t0[i], op = op0[i], delay = 0, culled = false;

    if (toGrid && i !== sel) {
      /* 其余卡片：按本次抽到的策略从画外飞入 */
      var sgn = Math.random() < 0.5 ? -1 : 1;
      if (entry === 'vertical') {                 // 上下
        dy = sgn * (vh * 0.5 + Math.random() * vh * 0.4);
        dx = (Math.random() - 0.5) * 160;
        sx = 0.9;
      } else if (entry === 'diagonal') {          // 斜角
        dx = sgn * (vw * 0.4 + Math.random() * vw * 0.3);
        dy = (Math.random() < 0.5 ? -1 : 1) * (vh * 0.34 + Math.random() * vh * 0.28);
        sx = 0.86;
      } else if (entry === 'bloom') {             // 原地放大淡入
        dx = 0; dy = 0;
        sx = 0.55 + Math.random() * 0.12;
      } else {                                    // 左右（默认）
        dx = sgn * (vw * 0.42 + Math.random() * vw * 0.38);
        dy = (Math.random() - 0.5) * 150;
        sx = 0.9;
      }
      sy = sx;
      base = 'none';
      op = 0;
      delay = Math.random() * (entry === 'bloom' ? 220 : 120);
    } else if (!toGrid && i !== sel && Math.abs(g1[i].x + g1[i].w / 2 - scroll1 + box1.left - vw / 2) > vw * 0.7) {
      /* 返回时，终点在画面外的卡片不横穿屏幕——原地缩小淡出即可，
         否则十几张同时掠过，选中那张的"一镜"就被淹没了 */
      dx = 0; dy = 0; sx = 1; sy = 1;
      base = 'none';
      culled = true;
    } else {
      /* 选中的那张：直接归位。
         用"中心点"算位移（宽度变了，左右边缘差和中心差不是一回事），
         并扣掉两端的滚动量（offsetLeft 含滚动偏移，纵向没有滚动）。 */
      dx = (g0[i].x + g0[i].w / 2 - scroll0 + box0.left) - (g1[i].x + g1[i].w / 2 - scroll1 + box1.left);
      dy = (g0[i].y + g0[i].h / 2 + box0.top) - (g1[i].y + g1[i].h / 2 + box1.top);
      sx = g0[i].w / Math.max(g1[i].w, 1);
      sy = sx;      // 统一缩放比 —— 横向 16:9 与网格 16:9 仍会有零点几个百分点误差,
                    // 分别取 sx/sy 会让卡片在动画中轻微变形（"抽一下"）
    }

    el.style.zIndex = (i === sel) ? 6 : 2;

    var moving = Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5 ||
                 Math.abs(sx - 1) > 0.004 || Math.abs(sy - 1) > 0.004;
    var turn = base !== t1[i];
    var faded = Math.abs(op - op1[i]) > 0.01;
    if (!moving && !turn && !faded) return;

    var isSel = (i === sel);
    var endOp = culled ? 0 : op1[i];
    var dur = culled ? 320 : (isSel ? 640 : 560);
    /* 选中的那张起手就快速收缩：它被放大到 3.4 倍时是一块深色大矩形，
       若慢起手会在第一行上方停留很久，把那排全遮住 */
    var ease = culled ? 'ease-out' : (isSel ? 'cubic-bezier(.14,.92,.22,1)' : 'cubic-bezier(.22,.8,.24,1)');
    /* 圆角会随 scale 一起缩放：元素放大 3.36 倍时，46px 在屏幕上是 154px。
       起始帧按缩放倍数反向补偿，视觉圆角才稳定。 */
    var sc0 = Math.max(Math.abs(sx), Math.abs(sy), 0.02);
    var cssR0 = Math.max(2, rv0 / sc0);
    var frames;
    if (toGrid && i !== sel) {
      /* 飞入的卡片：前半程保持全透明，接近落位才显现。
         否则 20 张半透明的卡同时在浅色背景上滑过，
         会形成一片片"把画面割开"的淡色矩形。 */
      var midS = sx + (1 - sx) * 0.7;
      var midTf = compose(dx * 0.3, dy * 0.3, midS, midS, base);
      /* 中段圆角必须跟着当时的缩放一起补偿。此前沿用起始帧的值，
         bloom（0.55 倍起）现身时缩放已到 0.93，视觉圆角会先大一圈再突然收小。 */
      var midRv = rv0 + (rv1 - rv0) * 0.7;
      var midR = Math.max(2, midRv / Math.max(midS, 0.02));
      frames = [
        { transform: compose(dx, dy, sx, sy, base), opacity: 0, borderRadius: cssR0.toFixed(2) + 'px', offset: 0 },
        { transform: midTf, opacity: 0, borderRadius: midR.toFixed(2) + 'px', offset: 0.68 },
        { transform: 'none', opacity: 1, borderRadius: rv1 + 'px', offset: 1 }
      ];
    } else {
      frames = [
        { transform: compose(dx, dy, sx, sy, base), opacity: op, borderRadius: cssR0.toFixed(2) + 'px', offset: 0 },
        { transform: culled ? 'scale(0.88)' : (t1[i] === 'none' ? 'none' : t1[i]),
          opacity: endOp, borderRadius: rv1 + 'px', offset: 1 }
      ];
    }
    anims.push(el.animate(frames, { duration: dur, delay: delay, easing: ease, fill: 'both' }));
  });

  Promise.all(anims.map(function (a) { return a.finished.catch(function () {}); })).then(function () {
    anims.forEach(function (a) { a.cancel(); });
    anims = [];
    els.forEach(function (el) { el.style.willChange = ''; el.style.zIndex = ''; });
    transitioning = false;                       // 必须先解锁，否则下面的 layout() 会被拦掉
    if (!toGrid) { track.style.scrollSnapType = ''; current = -1; layout(); }
    /* 等换字动画（.swap，140ms）在隐形状态下走完再淡入，
       否则头部的淡入和标题的闪换叠在一起，看起来就是"闪一下" */
    setTimeout(function () { document.body.classList.remove('is-moving'); }, 170);
  });
}

document.getElementById('ovBtn').addEventListener('click', function () { setMode(!overview); });

/* ---------- 禁止复制与拖拽 ---------- */
document.addEventListener('dragstart', function (e) { e.preventDefault(); }, true);
document.addEventListener('copy', function (e) { e.preventDefault(); });
document.addEventListener('cut', function (e) { e.preventDefault(); });
document.addEventListener('selectstart', function (e) {
  /* 输入框之类仍然允许选中 */
  if (e.target && /input|textarea/i.test(e.target.tagName)) return;
  e.preventDefault();
}, true);

/* ---------- 启动 ---------- */
/* 进场：整个展廊淡入放大，卡片按离中心的距离依次浮现 */
function playIntro() {
  var sel = nearestIndex();
  try {
    /* 选中那张从下方升起；它左边的从左侧飞入、右边的从右侧飞入；
       标题单独渐显。终点一律取内联样式，收尾不跳。 */
    cards.forEach(function (c, i) {
      var d = i - sel;
      var base = c.el.style.transform || 'none';
      var endOp = c.el.style.opacity ? parseFloat(c.el.style.opacity) : 1;
      var dx = 0, dy = 0;

      if (d === 0) {
        dy = Math.min(window.innerHeight * 0.22, 200);        // 从下往上
      } else {
        dx = (d < 0 ? -1 : 1) * (130 + Math.min(Math.abs(d), 7) * 92);   // 左右分侧
        dy = 46;
      }

      var start = 'translate(' + dx + 'px,' + dy + 'px)' + (base !== 'none' ? ' ' + base : '');
      var a = c.el.animate([
        { transform: start, opacity: 0 },
        { transform: base, opacity: endOp }
      ], {
        duration: 760,
        delay: Math.min(Math.abs(d) * 45, 380),
        easing: 'cubic-bezier(.22,.8,.24,1)',
        fill: 'both'
      });
      a.onfinish = function () { a.cancel(); };
    });

    var head = document.querySelector('.head');
    var h = head.animate([{ opacity: 0 }, { opacity: 1 }],
      { duration: 720, delay: 260, easing: 'ease-out', fill: 'both' });
    h.onfinish = function () { h.cancel(); };

    var bar = document.querySelector('.bar');
    var b2 = bar.animate([{ opacity: 0 }, { opacity: 1 }],
      { duration: 620, delay: 640, easing: 'ease-out', fill: 'both' });
    b2.onfinish = function () { b2.cancel(); };
  } catch (e) {}
}

function boot() {
  var id = location.hash.replace('#', '');

  if (id && SRC[id]) {
    layout();
    document.body.classList.remove('booting');
    open(id);
    return;
  }

  /* 每次打开随机落在某一件上，而不是永远从第一张开始 */
  jumpTo(Math.floor(Math.random() * cards.length));
  void track.offsetWidth;
  track.style.scrollSnapType = '';
  current = -1;
  layout();

  /* 弱网时图片可能还没到。等当前这张和左右邻居就位（最多 1.6s）再放出， */
  /* 否则用户看到的是几张空框加上一段没有内容的进场动画。 */
  var sel = nearestIndex();
  var wait = cards.slice(Math.max(0, sel - 1), Math.min(cards.length, sel + 2))
                  .map(function (c) { return c.el.querySelector('img'); })
                  .filter(Boolean);
  var left = wait.length, settled = false;

  function reveal() {
    if (settled) return;
    settled = true;
    document.body.classList.remove('booting');
    playIntro();
  }
  var guard = setTimeout(reveal, 1600);
  if (!wait.length) { clearTimeout(guard); reveal(); return; }
  wait.forEach(function (im) {
    if (im.complete) { if (--left === 0) { clearTimeout(guard); reveal(); } return; }
    var tick = function () { if (--left === 0) { clearTimeout(guard); reveal(); } };
    im.addEventListener('load', tick, { once: true });
    im.addEventListener('error', tick, { once: true });
  });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
requestAnimationFrame(function () { layout(); });
setTimeout(layout, 240);
</script>
</body>
