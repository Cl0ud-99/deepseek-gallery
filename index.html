<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" id="themeColor">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234d6bfe'/></svg>">
<title>DeepSeek Gallery — Programmatic WebGL Dioramas</title>
<meta name="description" content="Code-built WebGL dioramas. No model files, no textures — geometry, materials and lighting are generated live in the browser with Three.js.">
<meta property="og:title" content="DeepSeek Gallery — Programmatic WebGL Dioramas">
<meta property="og:description" content="Code-built WebGL dioramas. Open any piece and orbit it freely.">
<style>
  :root{ --bg:#b6bac2; --ink:#14161c; --dim:rgba(18,20,28,.60); --dim2:rgba(18,20,28,.38);
         --accent:#4d6bfe; --accent-2:#7a63ff;
         --cw: clamp(300px, 58vw, 940px); --gap: clamp(16px, 2vw, 34px);
         --r-lg: 18px; --r-md: 26px; --r-pill: 999px;
         --glass: rgba(255,255,255,.42);
         --glass-line: rgba(255,255,255,.62);
         --glass-hi: inset 0 1px 0 rgba(255,255,255,.85);
         --btn-h: clamp(34px, 3vw, 40px);
         --hover: 1.12;                       /* 所有可交互元素共用的悬停缩放（+12%） */
         --hover-t: .2s cubic-bezier(.2,.7,.3,1);
         --floor-1: rgba(232,234,240,.92); --floor-2: rgba(228,230,238,.72);
         --floor-3: rgba(224,227,236,.38); --floor-4: rgba(220,224,234,0); }

  /* ---------- 暗色模式 ---------- */
  body.dark{
    --ink:#f1f2f5; --dim:rgba(241,242,245,.62); --dim2:rgba(241,242,245,.36);
    --glass:rgba(28,31,40,.52);
    --glass-line:rgba(255,255,255,.14);
    --glass-hi:inset 0 1px 0 rgba(255,255,255,.12);
    --floor-1: rgba(14,16,21,.94); --floor-2: rgba(17,19,25,.74);
    --floor-3: rgba(19,21,28,.38); --floor-4: rgba(21,23,31,0);
  }
  /* 昼夜交叉淡入：背景是渐变，无法直接过渡，用一层不透明度来做 */
  .themefade{
    position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0;
    transition:opacity .55s cubic-bezier(.4,0,.2,1);
    background:radial-gradient(130% 86% at 50% -14%, #262a34 0%, #1d2029 34%, #171a21 62%, #121419 84%, #0d0e12 100%);
  }
  body.dark .themefade{opacity:1}
  /* 会随主题变色的元素统一做过渡（渐变类属性不可插值，单独交给 .themefade） */
  .eyebrow, .lead, .cta, .title, .bar,
  .nav, .ovbtn, .themebtn, .snd, .vbtn, .varrow, .vtitle{
    transition:color .5s ease, background-color .5s ease, border-color .5s ease, box-shadow .5s ease;
  }
  .bar i{transition:width .22s ease, background-color .5s ease}
  body.dark .bg::before{
    background:radial-gradient(46% 78% at 50% 0%,rgba(120,150,255,.16),transparent 72%),
               radial-gradient(40% 66% at 16% 6%,rgba(77,107,254,.14),transparent 74%),
               radial-gradient(36% 60% at 84% 4%,rgba(122,99,255,.12),transparent 74%);
  }
  body.dark .card{ box-shadow:0 30px 70px -30px rgba(0,0,0,.9), 0 2px 10px rgba(0,0,0,.5);
    background:rgba(255,255,255,.05) }


  /* 苹果式毛玻璃：半透明底 + 高斯模糊 + 饱和度提升 + 顶部高光内描边 */
  .glass{
    background: var(--glass);
    -webkit-backdrop-filter: blur(26px) saturate(180%);
    backdrop-filter: blur(26px) saturate(180%);
    border: 1px solid var(--glass-line);
    box-shadow: 0 12px 30px -16px rgba(50,48,42,.38), var(--glass-hi);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:#ffffff}
  html,body{height:100%; overflow:hidden; color:var(--ink);
    background:
      radial-gradient(130% 86% at 50% -14%, #e9ebf2 0%, #d3d7e0 34%, #b9bec9 62%, #9ba0ac 84%, #8b909c 100%);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased; overscroll-behavior:none}
  @supports (height:100dvh){ html,body{height:100dvh} }
  a{color:inherit;text-decoration:none}
  img{display:block}

  /* 禁止选中文字、拖拽图片 */
  body{
    -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
  }
  img{
    -webkit-user-drag:none; user-drag:none; pointer-events:none;
    -webkit-user-select:none; user-select:none;
  }

  /* 背景：暖色天顶 + 地面倒影 */
  /* 加载态 */
  .boot{position:fixed; inset:0; z-index:9; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
    opacity:0; transition:opacity .4s ease}
  body.booting .boot{opacity:1}
  .boot-txt{font-size:11px; letter-spacing:.44em; text-transform:uppercase; color:var(--accent); opacity:.85; padding-left:.44em}
  .boot-bar{width:clamp(120px,13vw,170px); height:2px; border-radius:999px;
    background:rgba(20,22,28,.12); overflow:hidden}
  .boot-bar i{display:block; width:38%; height:100%; border-radius:999px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    animation:bootSlide 1.15s cubic-bezier(.45,0,.55,1) infinite}
  @keyframes bootSlide{0%{transform:translateX(-105%)}100%{transform:translateX(365%)}}

  /* 首帧先藏起来，等进场动画接管——否则会先亮一下再消失 */
  body.booting .stage, body.booting .ovbtn{opacity:0}

  .bg{position:fixed; inset:0; pointer-events:none; z-index:0}
  .bg::before{content:""; position:absolute; inset:-24% -12% auto -12%; height:70vh;
    background:radial-gradient(46% 78% at 50% 0%,rgba(255,255,255,.66),transparent 72%),
               radial-gradient(40% 66% at 16% 6%,rgba(77,107,254,.16),transparent 74%),
               radial-gradient(36% 60% at 84% 4%,rgba(122,99,255,.14),transparent 74%)}

  .stage{position:fixed; inset:0; z-index:1; display:flex; flex-direction:column}

  /* 底部毛玻璃渐变：把画面下缘可能露出的硬边柔化掉 */
  .stage::after{
    content:""; position:fixed; left:0; right:0; bottom:0; height:clamp(110px,16vh,180px);
    pointer-events:none; z-index:-1;   /* 必须低于卡片，否则会把最后一行洗白 */
    background:linear-gradient(to top,
      var(--floor-1) 0%, var(--floor-2) 28%, var(--floor-3) 58%, var(--floor-4) 100%);
    /* 不用 backdrop-filter：它按元素矩形做模糊，边界反而会显出硬边 */
  }

  /* ---------- 顶部标题（随卡片切换） ---------- */
  .head{padding:clamp(18px,3vh,30px) 24px 0; text-align:center; flex:none;
    transition:opacity .34s ease}
  body.is-moving .head{opacity:0}      /* 转场时先让位，避免文字压在飞行的卡片上 */
  .eyebrow{font-size:10.5px; letter-spacing:.34em; text-transform:uppercase; color:var(--accent); opacity:.85}
  .lead{margin-top:12px; font-size:12.5px; color:var(--dim); letter-spacing:.01em; line-height:1.7}
  .lead .cta{color:var(--accent); border-bottom:1px solid rgba(77,107,254,.35); padding-bottom:1px;
    transition:border-color .2s}
  .lead .cta:hover{border-color:var(--accent)}
  /* 作品名：居中、在图片下方 */
  .caption{flex:none; text-align:center; padding:clamp(10px,2vh,22px) 24px clamp(58px,7.6vh,96px);
    transition:opacity .34s ease}
  body.is-moving .caption{opacity:0}
  body.mode-grid .caption{display:none}
  .title{margin:0; min-height:2.2em; margin-bottom:clamp(6px,1.2vh,14px)}
  /* 与顶部 DEEPSEEK GALLERY 同一套排版：大写 + 宽字距 */
  .title .en{font-size:clamp(13px,1.35vw,19px); font-weight:400; letter-spacing:.32em;
    text-transform:uppercase; line-height:1.5;
    margin-right:-.32em;            /* 抵消最后一个字符右侧的字距，保持视觉居中 */
    transition:opacity .22s}
  .title .cn{display:none}
  .title.swap .en,.title.swap .cn{opacity:0}

  /* ---------- 横向封面流 ---------- */
  .wrap{flex:1; min-height:0; display:flex; align-items:center; position:relative;
    padding-bottom:clamp(18px,3.4vh,40px)}
  .track{
    display:flex; align-items:center; gap:var(--gap);
    overflow-x:auto; overflow-y:hidden; width:100%;
    padding-inline:calc(50% - var(--cw)/2);
    scroll-snap-type:x mandatory; perspective:1800px; perspective-origin:50% 50%;
    scrollbar-width:none; -ms-overflow-style:none; cursor:default; position:relative;
    padding-block:clamp(18px,4vh,52px);
  }
  .track::-webkit-scrollbar{display:none}
  .track.dragging{cursor:grabbing; scroll-snap-type:none}
  .card{
    flex:0 0 var(--cw); aspect-ratio:16/9; scroll-snap-align:center; contain:layout paint;
    position:relative; border-radius:var(--r-lg); overflow:hidden;
    background:transparent;      /* 图片未加载时由 .noimg::before 占位，避免按压内缩时露出白边 */
    transform-style:preserve-3d; will-change:transform,opacity;
    box-shadow:0 34px 70px -30px rgba(28,32,44,.55), 0 2px 10px rgba(28,32,44,.12);
  }
  .card-inner{
    display:flex; flex-direction:column; gap:8px;
    width:100%; height:100%;
    transition:transform .16s cubic-bezier(.2,.8,.2,1);
    transform:translateZ(0);
  }
  .card{transition:scale .16s cubic-bezier(.2,.8,.2,1)}
  .card:active{scale:.975}
  .card img{width:100%; height:100%; object-fit:cover; border-radius:var(--r-lg)}
  body.mode-vertical:not(.mode-grid) .card{
    background-size:cover; background-position:center; background-repeat:no-repeat;
  }
  .card.noimg::before{content:attr(data-id); position:absolute; inset:0; display:flex;
    align-items:center; justify-content:center; font-size:12px; letter-spacing:.2em;
    color:var(--dim2); background:rgba(255,255,255,.5)}
  .card .hint{position:absolute; left:50%; bottom:clamp(14px,2vw,24px); transform:translateX(-50%);
    font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--accent);
    padding:8px 16px; border-radius:var(--r-pill); white-space:nowrap; z-index:2;
    background:var(--glass); border:1px solid var(--glass-line);
    -webkit-backdrop-filter:blur(20px) saturate(180%); backdrop-filter:blur(20px) saturate(180%);
    box-shadow:var(--glass-hi);
    opacity:0; transition:opacity .3s, transform .3s}
  .card.on:hover .hint{opacity:1; transform:translateX(-50%) translateY(-2px)}
  .card{cursor:default}
  .track{cursor:default}
  .track.dragging{cursor:grabbing; scroll-snap-type:none}

  /* 左右切换按钮 */
  .nav{
    position:absolute; top:50%; transform:translateY(-50%); z-index:6;
    width:clamp(46px,4.4vw,58px); height:clamp(46px,4.4vw,58px); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(17px,1.7vw,21px); line-height:1; color:var(--ink); cursor:pointer;
    border:1px solid var(--glass-line);
    background:var(--glass);
    -webkit-backdrop-filter:blur(26px) saturate(180%); backdrop-filter:blur(26px) saturate(180%);
    box-shadow:0 16px 40px -18px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.16);
    transition:transform .2s, border-color .2s, color .2s, opacity .2s;
    user-select:none; -webkit-user-select:none;
  }
  .nav:hover{border-color:rgba(77,107,254,.55); color:var(--accent); transform:translateY(-50%) scale(var(--hover))}
  .nav:active{transform:translateY(-50%) scale(.96)}
  .nav.prev{left:clamp(10px,2.2vw,34px)}
  .nav.next{right:clamp(10px,2.2vw,34px)}
  .nav[disabled]{opacity:.28; pointer-events:none}

  /* 地面倒影 */

  /* ---------- 底部 ---------- */
  /* 音效开关：与翻页按钮同一套玻璃样式，圆形、只留小图标 */
  .snd{
    width:44px; height:44px; border-radius:50%; padding:0; flex:none;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink); cursor:pointer;
    border:1px solid var(--glass-line);
    background:var(--glass);
    -webkit-backdrop-filter:blur(26px) saturate(180%); backdrop-filter:blur(26px) saturate(180%);
    box-shadow:0 16px 40px -18px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.16);
    transition:transform .2s, border-color .2s, color .2s, opacity .2s;
    -webkit-user-select:none; user-select:none;
  }
  .snd:hover{border-color:rgba(77,107,254,.55); color:var(--accent); transform:scale(var(--hover))}
  .snd:active{transform:scale(.96)}
  .snd .ico{display:block; width:17px; height:17px; opacity:.9}
  .snd .snd-waves, .snd .snd-mute{transition:opacity .16s ease}
  .snd .snd-waves{opacity:0}
  .snd .snd-mute{opacity:1}
  .snd.on .snd-waves{opacity:1}
  .snd.on .snd-mute{opacity:0}
  .snd.on{color:var(--accent); border-color:rgba(77,107,254,.55)}
  .snd.on .ico{opacity:1}
  /* 按钮：按下缩小，松手用轻微过冲回弹 */
  .credit,.ghost,.themebtn,.ovbtn,.snd,.vclose,.varrow,.cclose,.vbtn,.nav,.crow{
    transition:transform .24s cubic-bezier(.34,1.56,.64,1),
      color .2s ease, border-color .2s ease, background-color .2s ease, box-shadow .2s ease;
  }
  .credit:active,.ghost:active,.themebtn:active,.ovbtn:active,.snd:active,
  .vclose:active,.varrow:active,.cclose:active,.vbtn:active,.nav:active,.crow:active{
    transform:scale(.94);
  }

  /* 进度条：贴在页面最下沿，左右通栏 */
  .bar{position:fixed; left:0; right:0; bottom:0; z-index:8;
    width:100%; height:3px; border-radius:0;
    background:rgba(28,28,26,.13);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
  .bar i{display:block; position:relative; height:100%; width:0; border-radius:0;
    background:var(--accent);
    box-shadow:none;
    transition:width .22s ease}
  /* 进度头部的蓝鲸，跟着走，与进度条留一段空隙 */
  .bar i::after{
    content:""; position:absolute; left:100%; bottom:9px;
    width:26px; height:17px; margin-left:-12px;
    transition:transform .25s ease;
    background:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2044%2024'%3E%3Cpath%20d%3D'M2.5%2013.6c0-4.7%204.6-8.4%2010.6-8.4%205%200%208.3%202.3%2010.2%205.6l5.4-4.4-1.3%205.6%204.6%203.6-6.6.9c-1.7%203.2-5.1%205.3-9.9%205.3-6.2%200-11-3.5-11-8.2Z'%20fill%3D'%234d6bfe'%2F%3E%3Ccircle%20cx%3D'10.4'%20cy%3D'11.8'%20r%3D'1.5'%20fill%3D'%23fff'%2F%3E%3C%2Fsvg%3E") center/contain no-repeat;
    pointer-events:none;
  }
  /* 鲸鱼原生朝左，向右游时要镜像 */
  .bar.fwd i::after{transform:scaleX(-1)}

  /* ---------- 总览按钮 ---------- */
  /* 作者标识：左上角，小云 + 名字 + 邮箱 */
  .credit{
    position:fixed; top:clamp(14px,2.4vh,26px); left:clamp(14px,2.4vw,30px); z-index:20;
    width:var(--btn-h); height:var(--btn-h); border-radius:50%; padding:0; box-sizing:border-box;
    display:flex; align-items:center; justify-content:center; color:var(--ink); cursor:pointer;
    background:var(--glass); border:1px solid var(--glass-line);
    -webkit-backdrop-filter:blur(26px) saturate(180%); backdrop-filter:blur(26px) saturate(180%);
    box-shadow:0 10px 26px -14px rgba(50,48,42,.5), var(--glass-hi);
    transition:color .25s ease, background-color .5s ease, border-color .5s ease, box-shadow .5s ease, transform .25s;
  }
  .credit:hover{color:var(--accent); border-color:rgba(77,107,254,.45); transform:scale(var(--hover))}
  .credit svg{display:block; opacity:.9}

  /* 名片：以云朵为圆心展开的半透明遮罩 */
  .cardveil{
    position:fixed; inset:0; z-index:60; display:none; overflow:hidden;
    background:transparent;
  }
  .cardveil.on{display:block}
  /* 圆形擦除：只有一个纯色圆在缩放，走合成器，不逐帧重算滤镜 */
  .cardwipe{
    position:absolute; width:120px; height:120px; border-radius:50%;
    left:var(--cx,40px); top:var(--cy,40px);
    background:rgba(10,12,18,.93);
    transform:translate(-50%,-50%) scale(.001);
    transition:transform .58s cubic-bezier(.22,.68,.22,1);
    will-change:transform;
  }
  .cardveil.open .cardwipe{transform:translate(-50%,-50%) scale(var(--s,30))}
  .cardveil{cursor:pointer}
  .cardbox{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:min(90vw,420px); text-align:center; color:#f2f3f6;
    display:flex; flex-direction:column; align-items:center; gap:14px;
    opacity:0; transition:opacity .16s ease;
  }
  .cardveil.open .cardbox{opacity:1; transition:opacity .3s ease .2s}
  /* 关闭时文字立即撤掉，只保留圆形擦除动画，避免残留 */
  .cardveil.closing .cardbox{opacity:0!important; transition:none!important}
  .cardbox .bigcloud{opacity:.9}
  .cname{font-size:clamp(24px,3vw,32px); font-weight:500; letter-spacing:-.01em}
  .crole{font-size:12.5px; letter-spacing:.06em; color:rgba(242,243,246,.55); margin-top:-6px}
  .crow{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:12px 16px; border-radius:12px; font-size:12.5px;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.13);
    color:#e9ecf3; transition:background .2s, border-color .2s;
  }
  .crow:hover{background:rgba(255,255,255,.12); border-color:rgba(120,150,255,.5)}
  .crow .ck{letter-spacing:.16em; text-transform:uppercase; font-size:10.5px; color:rgba(242,243,246,.5)}
  .crow .cv{font-variant-numeric:tabular-nums}
  .cclose{
    margin-top:6px; font:inherit; font-size:11.5px; letter-spacing:.12em; text-transform:uppercase;
    color:rgba(242,243,246,.6); background:none; border:1px solid rgba(255,255,255,.16);
    padding:8px 18px; border-radius:999px; cursor:pointer; transition:.2s;
  }
  .cclose:hover{color:#fff; border-color:rgba(255,255,255,.4)}

  .topbar{
    position:fixed; top:clamp(14px,2.4vh,26px); right:clamp(14px,2.4vw,30px); z-index:20;
    display:flex; align-items:center; gap:10px;
  }
  /* 主题切换：与总览按钮同款圆形玻璃 */
  .themebtn{
    width:var(--btn-h); height:var(--btn-h); border-radius:50%; padding:0; box-sizing:border-box;
    display:flex; align-items:center; justify-content:center;
    line-height:1; color:var(--ink); cursor:pointer;
    border:1px solid var(--glass-line);
    border:1px solid var(--glass-line);
    background:var(--glass);
    -webkit-backdrop-filter:blur(26px) saturate(180%); backdrop-filter:blur(26px) saturate(180%);
    box-shadow:0 10px 26px -14px rgba(50,48,42,.5), var(--glass-hi);
    transition:transform .2s, border-color .2s, color .2s;
  }
  .themebtn:hover{color:var(--accent); border-color:rgba(77,107,254,.45); transform:scale(var(--hover))}
  .themebtn svg{display:block; opacity:.9}

  .ovbtn{
    display:inline-flex; align-items:center; gap:8px; height:var(--btn-h); box-sizing:border-box;
    font:inherit; font-size:12px; letter-spacing:.06em; color:var(--ink); cursor:pointer;
    padding:0 16px 0 13px; border-radius:var(--r-pill);
    overflow:hidden; white-space:nowrap;
    background:var(--glass); border:1px solid var(--glass-line);
    -webkit-backdrop-filter:blur(26px) saturate(180%); backdrop-filter:blur(26px) saturate(180%);
    box-shadow:0 10px 26px -14px rgba(50,48,42,.5), var(--glass-hi);
    transition:transform var(--hover-t), color .2s, border-color .2s, width .3s cubic-bezier(.2,.7,.3,1);
  }
  #ovLabel{display:inline-block; transition:opacity .16s ease}
  .ovbtn:hover{color:var(--accent); border-color:rgba(77,107,254,.45); transform:scale(var(--hover))}
  .ovbtn{position:relative; top:auto; right:auto}
  .ovbtn svg{width:13px; height:13px; opacity:.8}

  /* ---------- 总览（网格）模式 ---------- */
  /* 总览也保留品牌，位置与卡片预览一致 */
  /* 总览：平铺网格，卡片本身不再带 3D/缩放变换；作品名放在图片下方 */
  body.mode-grid .card{
    display:flex; flex-direction:column; gap:8px;
    width:auto; height:auto; aspect-ratio:auto; min-width:0;
    background:transparent; border:0; border-radius:var(--r-lg);
    box-shadow:0 34px 70px -30px rgba(28,32,44,.55), 0 2px 10px rgba(28,32,44,.12);
    overflow:visible; contain:none;
  }
  body.mode-grid .card img{
    width:100%; height:auto; aspect-ratio:16/9; object-fit:cover; display:block;
    border-radius:var(--r-lg); background:transparent;
    box-shadow:none;
    transition:transform .22s ease;
  }
  body.mode-grid .card:hover{
    transform:none!important; box-shadow:none; z-index:auto;
  }
  body.mode-grid .card:hover img{
    transform:translateY(-2px);
    box-shadow:none;
  }
  body.mode-grid .card-inner{gap:5px}
  /* 总览卡片：彻底去掉白色占位/阴影，只保留图片和标题 */
  body.mode-grid .card,
  body.mode-grid .card-inner,
  body.mode-grid .card-title,
  body.mode-grid .card img{
    background:transparent!important;
  }
  body.mode-grid .card{box-shadow:none!important}
  body.mode-grid .card img{box-shadow:none!important}
  body.mode-grid .card-title{
    display:block; position:static; transform:none; opacity:1;
    width:100%; max-width:100%; min-width:0; padding:0 2px; margin:0;
    background:none; border:0; border-radius:0; box-shadow:none;
    -webkit-backdrop-filter:none; backdrop-filter:none; text-shadow:none;
    color:var(--ink); font-size:8.9px; line-height:1.4; letter-spacing:.16em;
    text-transform:uppercase; text-align:center;
    white-space:normal; overflow:hidden; overflow-wrap:anywhere;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  }
  /* 总览里左右箭头与进度条都没有意义（网格是滚动的，不是翻页） */
  body.mode-grid .nav,
  body.mode-grid .bar{display:none}
  body.mode-grid .wrap{padding-bottom:0}
  body.mode-grid .track{
    display:grid; grid-template-columns:repeat(4,1fr);
    grid-auto-rows:auto; align-content:start;
    gap:clamp(10px,1.2vw,18px);
    /* 高度交给内容，超出时自身滚动 —— 不能用 height:100%，
       否则行高会被压缩到容器高度以下，卡片互相压住 */
    max-height:100%; overflow-y:auto; overflow-x:hidden;
    /* 上下留出与移轴带等高的缓冲区：滚到顶/底时，
       首行与末行不会被毛玻璃整片盖住 */
    padding:clamp(16px,3vw,46px);   /* 上下与左右同宽 */
    perspective:none; cursor:default;
    overflow-anchor:none;   /* 关掉滚动锚定：贴底时浏览器会为保持锚点偷偷改 scrollTop */
    scrollbar-width:none; -ms-overflow-style:none;
  }
  body.mode-grid .track::-webkit-scrollbar{display:none}

  /* 总览的自定义滚动条：玻璃质感，闲置 1s 后淡出 */
  .scr{position:absolute; right:calc(clamp(16px,3vw,46px) / 2.4);
    top:clamp(16px,3vw,46px); bottom:clamp(16px,3vw,46px);
    width:6px; border-radius:999px; z-index:9; display:none;
    opacity:0; transition:opacity .34s ease; pointer-events:none}
  body.mode-grid .scr{display:block}
  .scr.on{opacity:1}
  .scr.on{pointer-events:auto}
  .scr i{position:absolute; left:0; width:100%; border-radius:999px; cursor:grab; pointer-events:auto;
    background:rgba(255,255,255,.42);
    border:1px solid rgba(255,255,255,.55);
    -webkit-backdrop-filter:blur(14px) saturate(150%); backdrop-filter:blur(14px) saturate(150%);
    box-shadow:0 4px 14px -6px rgba(28,32,44,.35), inset 0 1px 0 rgba(255,255,255,.7);
    transition:background .2s}
  .scr i:hover{background:rgba(255,255,255,.62)}
  .scr i.drag{cursor:grabbing; background:rgba(255,255,255,.72)}

  /* 总览的移轴感：三层叠加做出"模糊半径渐变"。
     单层 backdrop-filter 只有恒定强度，靠遮罩淡出的只是可见度；
     叠三层不同半径、不同高度，边缘处累积成强模糊，向内逐级变弱。 */
  body.mode-grid{--tilt-h:clamp(200px,29.7vh,335px); --tilt-pad:calc(var(--tilt-h) * .86)}
  .tilt{--h:var(--tilt-h); position:absolute; inset:0; z-index:8; pointer-events:none; display:none}
  body.mode-grid .tilt{display:block}
  .tilt i{position:absolute; left:0; right:0; display:block; pointer-events:none; height:var(--h)}
  .tilt .t{top:0}
  .tilt .b{bottom:0}

  /* 外缘最强、向内逐级变弱：三层的"半径 × 覆盖范围"都递减 */
  .tilt .t3{height:calc(var(--h) * .45); -webkit-backdrop-filter:blur(11.9px) saturate(88%) brightness(.94); backdrop-filter:blur(11.9px) saturate(88%) brightness(.94);
    -webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 35%,transparent 100%);
            mask-image:linear-gradient(to bottom,#000 0%,#000 35%,transparent 100%)}
  .tilt .b3{height:calc(var(--h) * .45); -webkit-backdrop-filter:blur(11.9px) saturate(88%) brightness(.94); backdrop-filter:blur(11.9px) saturate(88%) brightness(.94);
    -webkit-mask-image:linear-gradient(to top,#000 0%,#000 35%,transparent 100%);
            mask-image:linear-gradient(to top,#000 0%,#000 35%,transparent 100%)}
  .tilt .t2{height:calc(var(--h) * .72); -webkit-backdrop-filter:blur(6.8px) saturate(88%) brightness(.94); backdrop-filter:blur(6.8px) saturate(88%) brightness(.94);
    -webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 42%,transparent 100%);
            mask-image:linear-gradient(to bottom,#000 0%,#000 42%,transparent 100%)}
  .tilt .b2{height:calc(var(--h) * .72); -webkit-backdrop-filter:blur(6.8px) saturate(88%) brightness(.94); backdrop-filter:blur(6.8px) saturate(88%) brightness(.94);
    -webkit-mask-image:linear-gradient(to top,#000 0%,#000 42%,transparent 100%);
            mask-image:linear-gradient(to top,#000 0%,#000 42%,transparent 100%)}
  .tilt .t1{-webkit-backdrop-filter:blur(2.55px) saturate(88%) brightness(.94); backdrop-filter:blur(2.55px) saturate(88%) brightness(.94);
    -webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 38%,transparent 100%);
            mask-image:linear-gradient(to bottom,#000 0%,#000 38%,transparent 100%)}
  .tilt .b1{-webkit-backdrop-filter:blur(2.55px) saturate(88%) brightness(.94); backdrop-filter:blur(2.55px) saturate(88%) brightness(.94);
    -webkit-mask-image:linear-gradient(to top,#000 0%,#000 38%,transparent 100%);
            mask-image:linear-gradient(to top,#000 0%,#000 38%,transparent 100%)}

  /* ---------- 进入场景 ---------- */
  .viewer{position:fixed; inset:0; z-index:100; background:#000; display:none; opacity:0; transition:opacity .4s;
    visibility:hidden}
  .viewer.on{visibility:visible}
  .viewer.on{display:block}
  .viewer.shown{opacity:1}
  /* 场景本身是 16:9，用 cover 方式放大居中，横竖屏都不留大片黑边 */
  /* 多数场景是 1280×720 的 16:9 画布居中；iframe 用固定 1280×720，
     再按屏幕 cover 缩放，场景画布本身才会铺满，而不是画布外再套一层黑边 */
  /* 场景自身会按 iframe 视口重新渲染（直接打开时 390×844 的 canvas 就是满屏），
     所以 iframe 必须铺满查看器，不要再给固定 1280×720 再缩放，否则场景被锁成 16:9 */
  .viewer iframe{
    position:absolute; inset:0;
    width:100%; height:100%;
    border:0; display:block; background:#05060a;
  }
  /* 加载页：底色随主题走（浅色/暗色），项目名用小号字距排版 */
  .veil{position:absolute; inset:0; display:flex; flex-direction:column; gap:22px;
    align-items:center; justify-content:center;
    background:#f2f4f8; color:#14161c; transition:opacity .55s; z-index:3}
  body.dark .veil{background:#05060a; color:#eef0f4}
  .veil.off{opacity:0; pointer-events:none}
  .vname{font-size:10.5px; letter-spacing:.34em; text-transform:uppercase;
    color:currentColor; opacity:.62; text-align:center; padding:0 24px;
    max-width:min(92vw,560px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .dot{width:6px; height:6px; border-radius:50%; background:var(--accent); opacity:.35; animation:pulse 1.25s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.18; transform:scale(.8)}50%{opacity:.85; transform:scale(1.15)}}
  /* 控件全部浮空，没有左右通栏的上下条；场景可以从 iframe 上沿到下沿 */
  .vtitle{
    position:absolute; z-index:5; pointer-events:none; min-width:0;
    left:calc(clamp(15px,2.4vw,30px) + env(safe-area-inset-left));
    right:calc(86px + env(safe-area-inset-right));
    top:calc(clamp(13px,2vw,22px) + env(safe-area-inset-top));
  }
  .vtitle .en{font-size:14.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .vtitle .cn{display:none}
  .vctl{
    position:absolute; z-index:5; left:50%; transform:translateX(-50%);
    bottom:calc(clamp(13px,2vw,22px) + env(safe-area-inset-bottom));
    display:flex; align-items:center; gap:14px; pointer-events:none;
  }
  .vctl > *{pointer-events:auto}
  .vbtn{font:inherit; font-size:11.5px; letter-spacing:.08em; color:var(--ink); cursor:pointer;
    background:var(--glass); border:1px solid var(--glass-line); border-radius:var(--r-pill);
    padding:8px 16px; -webkit-backdrop-filter:blur(24px) saturate(180%); backdrop-filter:blur(24px) saturate(180%);
    box-shadow:var(--glass-hi); transition:.2s; white-space:nowrap}
  .vbtn:hover{border-color:rgba(77,107,254,.55); color:var(--accent)}
  /* 返回：与云朵/太阳同款的圆形玻璃按钮，只留小叉 */
  .vclose{
    position:absolute; z-index:6; flex:none;
    top:calc(clamp(13px,2vw,22px) + env(safe-area-inset-top));
    right:calc(clamp(15px,2.4vw,30px) + env(safe-area-inset-right));
    width:44px; height:44px; border-radius:50%; padding:0;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink); cursor:pointer;
    border:1px solid var(--glass-line); background:var(--glass);
    -webkit-backdrop-filter:blur(26px) saturate(180%); backdrop-filter:blur(26px) saturate(180%);
    box-shadow:0 16px 40px -18px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.16);
    transition:transform .2s, border-color .2s, color .2s;
  }
  .vclose:hover{border-color:rgba(77,107,254,.55); color:var(--accent); transform:scale(var(--hover))}
  .vclose:active{transform:scale(.94)}
  .toast{
    position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom));
    transform:translate(-50%,10px); z-index:130;
    padding:9px 16px; border-radius:999px;
    background:rgba(10,12,18,.72); color:#f2f4f8;
    border:1px solid rgba(255,255,255,.18);
    -webkit-backdrop-filter:blur(18px) saturate(160%); backdrop-filter:blur(18px) saturate(160%);
    font-size:11.5px; letter-spacing:.08em; pointer-events:none;
    opacity:0; transition:opacity .2s ease, transform .2s ease;
  }
  .toast.on{opacity:1; transform:translate(-50%,0)}
  .varrow{width:44px; height:44px; border-radius:50%; border:1px solid var(--glass-line);
    background:var(--glass); -webkit-backdrop-filter:blur(24px) saturate(180%); backdrop-filter:blur(24px) saturate(180%);
    box-shadow:var(--glass-hi); color:var(--ink);
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px; transition:.2s}
  .varrow:hover{border-color:rgba(77,107,254,.55); color:var(--accent)}

  /* 带鱼屏：多出来的宽度给卡片间隙，而不是把卡片拉得更大 */
  @media (min-width:1600px){
    :root{ --gap: clamp(34px, 2.6vw, 76px); }
  }
  @media (min-width:2200px){
    :root{ --cw: clamp(760px, 44vw, 1080px); --gap: clamp(56px, 3vw, 96px); }
  }

  @media (max-width:720px){
    :root{--cw: 84vw}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important; animation:none!important}
    .track{scroll-behavior:auto}
  }

  /* 顶部工具组：桌面保持左右两端，移动端由媒体查询改成居中一行 */
  .dock{display:contents}
  .ghost{
    position:fixed; top:clamp(14px,2.4vh,26px);
    left:calc(clamp(14px,2.4vw,30px) + var(--btn-h) + 10px);
    z-index:20; width:var(--btn-h); height:var(--btn-h); border-radius:50%;
    padding:0; box-sizing:border-box; display:flex; align-items:center; justify-content:center;
    color:var(--ink); cursor:pointer; background:var(--glass); border:1px solid var(--glass-line);
    -webkit-backdrop-filter:blur(26px) saturate(180%); backdrop-filter:blur(26px) saturate(180%);
    box-shadow:0 10px 26px -14px rgba(50,48,42,.5), var(--glass-hi);
    transition:transform .25s, color .25s, border-color .25s;
  }
  .ghost:hover{color:var(--accent); border-color:rgba(77,107,254,.45); transform:scale(var(--hover))}
  .card-title{display:none}
  /* 顶栏和参考图一致：总览按钮只留网格图标，不显示文字 */
  #ovLabel{display:none}
  .ovbtn{width:var(--btn-h); padding:0; justify-content:center; border-radius:50%}


  /* ============================================================
     移动端移植层
     - 竖屏：纵向卡片流，卡片轻微叠在上一张后面
     - 横屏/桌面：保持原来的横向卡片流
     - 上下毛玻璃边缘只做背景，按钮、鲸鱼进度条永远在上层
     ============================================================ */

  /* 查看器标题：场景底色深浅不一，标题必须自带对比度 */
  .vtitle{color:#f2f4f8; text-shadow:0 1px 12px rgba(0,0,0,.65)}
  .vtitle .cn{color:rgba(242,244,248,.62)}

  /* 查看器上下栏：iframe 是独立文档，backdrop-filter 取不到场景内容，
     直接用深色半透明渐变，保证在任何场景上都呈现暗玻璃，而不是灰白条 */
  /* iframe 在移动端合成层里不参与父层半透明混色，深色半透明会被洗成灰白；
     移动端顶部用实色再渐隐，桌面端保留原来的半透明渐变 */
  @media (max-width:900px), (max-width:1000px) and (orientation:landscape) and (max-height:520px){
    .vbar.top{background:linear-gradient(to bottom,#0a0d13 0%,#0a0d13 66%,rgba(10,13,19,0) 100%)}
    .vbar.bottom{background:linear-gradient(to top,#0a0d13 0%,#0a0d13 66%,rgba(10,13,19,0) 100%)}
  }

  /* 展厅上下边缘的毛玻璃：z 7，低于进度条(8)与按钮(20) */
  .edge{position:fixed; left:0; right:0; z-index:2; pointer-events:none; display:none}
  .edge.top{top:0; height:calc(70px + env(safe-area-inset-top));
    background:linear-gradient(to bottom,rgba(233,235,242,.62) 0%,rgba(233,235,242,.26) 58%,rgba(233,235,242,0) 100%);
    -webkit-backdrop-filter:blur(18px) saturate(150%); backdrop-filter:blur(18px) saturate(150%);
    -webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 56%,transparent 100%);
            mask-image:linear-gradient(to bottom,#000 0%,#000 56%,transparent 100%);
  }
  .edge.bottom{bottom:0; height:calc(64px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,rgba(233,235,242,.66) 0%,rgba(233,235,242,.26) 55%,rgba(233,235,242,0) 100%);
    -webkit-backdrop-filter:blur(18px) saturate(150%); backdrop-filter:blur(18px) saturate(150%);
    -webkit-mask-image:linear-gradient(to top,#000 0%,#000 52%,transparent 100%);
            mask-image:linear-gradient(to top,#000 0%,#000 52%,transparent 100%);
  }
  body.dark .edge.top{background:linear-gradient(to bottom,rgba(10,12,18,.66) 0%,rgba(10,12,18,.28) 58%,rgba(10,12,18,0) 100%)}
  body.dark .edge.bottom{background:linear-gradient(to top,rgba(10,12,18,.70) 0%,rgba(10,12,18,.28) 55%,rgba(10,12,18,0) 100%)}

  /* iOS 打开图标：卡片图克隆 → 全屏 */
  .launch{position:fixed; z-index:120; overflow:hidden; background:#05060a; pointer-events:none;
    will-change:transform,opacity; box-shadow:0 30px 90px -18px rgba(0,0,0,.65)}
  .launch img{width:100%; height:100%; object-fit:cover; display:block}
  .launch-title{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    font-size:clamp(12px,3vw,20px); font-weight:500; letter-spacing:.18em;
    line-height:1.5; text-transform:uppercase; white-space:normal;
    max-width:calc(100vw - 48px); text-align:center;
    padding:9px 16px; border-radius:999px;
    background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.16);
    -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
    box-shadow:0 20px 60px -24px rgba(0,0,0,.55);}
  .launch.light .launch-title{background:rgba(255,255,255,.34); border-color:rgba(20,24,32,.12);
    box-shadow:0 20px 60px -24px rgba(20,24,32,.28);}
  .launch-dim{position:fixed; inset:0; z-index:90; background:rgba(5,6,10,.38); opacity:0;
    pointer-events:none; transition:opacity .28s ease;
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px)}
  .launch-dim.on{opacity:1}
  body.launching .stage{
    transform:scale(.965);
    filter:blur(6px);
    transition:transform .5s cubic-bezier(.2,.8,.2,1), filter .5s cubic-bezier(.2,.8,.2,1);
  }
  body.launching .dock,
  body.launching .head,
  body.launching .bar,
  body.launching .edge{opacity:0; transition:opacity .22s ease}

  @media (max-width:900px), (max-width:1000px) and (orientation:landscape) and (max-height:520px){
    .edge{display:block}
    /* Safari 横屏的标签栏/工具栏：把舞台、查看器、名片限制在 visualViewport 内 */
    .stage,.viewer,.cardveil,.boot{
      top:var(--vvt,0); left:0; right:0; bottom:auto;
      width:100%; height:var(--vvh,100%);
    }
    .edge,.head,.dock,.bar{position:absolute}
    .launch-dim{
      top:var(--vvt,0); left:0; right:0; bottom:auto;
      width:100%; height:var(--vvh,100%);
    }
    /* 页面本身只允许单指纵向/横向浏览，双指缩放交给 viewer 里的场景自己 */
    html,body{touch-action:pan-y}
    body:not(.mode-vertical):not(.mode-grid) .track{touch-action:pan-x}
    /* 轨道自成一个层，卡片内部的 z-index 不会越过上下玻璃 */
    body.mode-vertical .track, body.mode-grid .track{position:relative; z-index:0; isolation:isolate}
    :root{--btn-h:44px; --cw:92vw}
    /* 顶栏参考图：云朵+上传 在左，品牌居中，主题+总览 在右，同一行 */
    .head{position:fixed; top:calc(14px + env(safe-area-inset-top)); left:0; right:0;
      height:44px; padding:0; display:flex; align-items:center; justify-content:center;
      z-index:21; pointer-events:none; text-align:center}
    body.mode-vertical .head, body.mode-grid .head{opacity:1!important}
    .eyebrow{font-size:10px; letter-spacing:.28em; margin-right:-.28em}
    .lead{display:none}
    .dock{display:flex; position:fixed; top:calc(14px + env(safe-area-inset-top)); left:0; right:0;
      transform:none; z-index:20; gap:8px; align-items:center; white-space:nowrap;
      padding-left:calc(12px + env(safe-area-inset-left));
      padding-right:calc(12px + env(safe-area-inset-right))}
    .dock .credit{position:static; top:auto; left:auto; width:44px; height:44px}
    .dock .ghost{position:static; top:auto; left:auto; width:44px; height:44px}
    .dock .topbar{position:static; top:auto; right:auto; margin-left:auto; gap:8px}
    .themebtn{width:44px; height:44px}
    .ovbtn{width:44px; height:44px; padding:0}
    .snd{width:48px; height:48px}
    .bar{bottom:env(safe-area-inset-bottom)}
    /* 全屏：去掉底部标题区，标题进卡片 */
    .caption{display:none}
    .nav{display:none}
    .wrap{padding-bottom:0}
    .edge.top{height:calc(99px + env(safe-area-inset-top))}
    .edge.bottom{height:calc(83px + env(safe-area-inset-bottom))}
    /* 作品名：卡片正中，小号玻璃胶囊，只在当前卡片上出现 */
    .card-title{
      display:block; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
