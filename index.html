<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234d6bfe'/></svg>">
<title>DeepSeek Gallery — Programmatic WebGL Dioramas</title>
<meta name="description" content="A community gallery of dioramas built with code. No model files, no textures — geometry, materials and lighting are generated live in the browser with Three.js.">
<meta property="og:title" content="DeepSeek Gallery — Programmatic WebGL Dioramas">
<meta property="og:description" content="A community gallery of code-built dioramas. Open any piece and orbit it freely.">
<style>
  :root{ --bg:#b6bac2; --ink:#14161c; --dim:rgba(18,20,28,.60); --dim2:rgba(18,20,28,.38);
         --accent:#4d6bfe; --accent-2:#7a63ff;
         --cw: clamp(300px, 58vw, 940px); --gap: clamp(16px, 2vw, 34px);
         --r-lg: 18px; --r-md: 26px; --r-pill: 999px;
         --glass: rgba(255,255,255,.42);
         --glass-line: rgba(255,255,255,.62);
         --glass-hi: inset 0 1px 0 rgba(255,255,255,.85);
         --btn-h: clamp(34px, 3vw, 40px);
         --hover: 1.12;                       /* 所有可交互元素共用的悬停缩放（+12%） */
         --hover-t: .2s cubic-bezier(.2,.7,.3,1);
         --floor-1: rgba(232,234,240,.92); --floor-2: rgba(228,230,238,.72);
         --floor-3: rgba(224,227,236,.38); --floor-4: rgba(220,224,234,0); }

  /* ---------- 暗色模式 ---------- */
  body.dark{
    --ink:#f1f2f5; --dim:rgba(241,242,245,.62); --dim2:rgba(241,242,245,.36);
    --glass:rgba(28,31,40,.52);
    --glass-line:rgba(255,255,255,.14);
    --glass-hi:inset 0 1px 0 rgba(255,255,255,.12);
    --floor-1: rgba(14,16,21,.94); --floor-2: rgba(17,19,25,.74);
    --floor-3: rgba(19,21,28,.38); --floor-4: rgba(21,23,31,0);
  }
  /* 昼夜交叉淡入：背景是渐变，无法直接过渡，用一层不透明度来做 */
  .themefade{
    position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0;
    transition:opacity .55s cubic-bezier(.4,0,.2,1);
    background:radial-gradient(130% 86% at 50% -14%, #262a34 0%, #1d2029 34%, #171a21 62%, #121419 84%, #0d0e12 100%);
  }
  body.dark .themefade{opacity:1}

  /* 昼夜切换：以主题按钮为圆心的圆形擦除 */
  /* 放在内容之下、背景之上：只擦背景。用 clip-path 而不是缩放元素，
     否则渐变会被放大，铺满后与 .themefade 亮度对不上，撤掉时闪一下。 */
  .themewipe{
    position:fixed; inset:0; z-index:1; pointer-events:none; display:none;
    --cx:50%; --cy:50%; --r:0px;
    clip-path:circle(0px at var(--cx) var(--cy));
    transition:clip-path .7s cubic-bezier(.5,.02,.5,.98);
  }
  .themewipe.on{display:block}
  .themewipe.grow{clip-path:circle(var(--r) at var(--cx) var(--cy))}

  body.wipe-running .themefade,
  body.wipe-running .eyebrow, body.wipe-running .lead, body.wipe-running .cta,
  body.wipe-running .title, body.wipe-running .bar, body.wipe-running .card,
  body.wipe-running .nav, body.wipe-running .ovbtn, body.wipe-running .themebtn,
  body.wipe-running .snd, body.wipe-running .credit, body.wipe-running .caption{
    transition:none !important;
  }
  /* 会随主题变色的元素统一做过渡（渐变类属性不可插值，单独交给 .themefade） */
  .eyebrow, .lead, .cta, .title, .bar,
  .nav, .ovbtn, .themebtn, .snd, .vbtn, .varrow, .vtitle{
    transition:color .5s ease, background-color .5s ease, border-color .5s ease, box-shadow .5s ease;
  }
  .bar i{transition:width .22s ease, background-color .5s ease}
  body.dark .bg::before{
    background:radial-gradient(46% 78% at 50% 0%,rgba(120,150,255,.16),transparent 72%),
               radial-gradient(40% 66% at 16% 6%,rgba(77,107,254,.14),transparent 74%),
               radial-gradient(36% 60% at 84% 4%,rgba(122,99,255,.12),transparent 74%);
  }
  body.dark .card{ box-shadow:0 30px 70px -30px rgba(0,0,0,.9), 0 2px 10px rgba(0,0,0,.5);
    background:rgba(255,255,255,.05) }


  /* 苹果式毛玻璃：半透明底 + 高斯模糊 + 饱和度提升 + 顶部高光内描边 */
  .glass{
    background: var(--glass);
    -webkit-backdrop-filter: blur(26px) saturate(180%);
    backdrop-filter: blur(26px) saturate(180%);
    border: 1px solid var(--glass-line);
    box-shadow: 0 12px 30px -16px rgba(50,48,42,.38), var(--glass-hi);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%; overflow:hidden; color:var(--ink);
    background:
      radial-gradient(130% 86% at 50% -14%, #e9ebf2 0%, #d3d7e0 34%, #b9bec9 62%, #9ba0ac 84%, #8b909c 100%);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased; overscroll-behavior:none}
  a{color:inherit;text-decoration:none}
  img{display:block}

  /* 禁止选中文字、拖拽图片 */
  body{
    -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
  }
  img{
    -webkit-user-drag:none; user-drag:none; pointer-events:none;
    -webkit-user-select:none; user-select:none;
  }

  /* 背景：暖色天顶 + 地面倒影 */
  /* 加载态 */
  .boot{position:fixed; inset:0; z-index:9; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
    opacity:0; transition:opacity .4s ease}
  body.booting .boot{opacity:1}
  .boot-txt{font-size:11px; letter-spacing:.44em; text-transform:uppercase; color:var(--accent); opacity:.85; padding-left:.44em}
  .boot-bar{width:clamp(120px,13vw,170px); height:2px; border-radius:999px;
    background:rgba(20,22,28,.12); overflow:hidden}
  .boot-bar i{display:block; width:38%; height:100%; border-radius:999px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    animation:bootSlide 1.15s cubic-bezier(.45,0,.55,1) infinite}
  @keyframes bootSlide{0%{transform:translateX(-105%)}100%{transform:translateX(365%)}}

  /* 首帧先藏起来，等进场动画接管——否则会先亮一下再消失 */
  body.booting .stage, body.booting .ovbtn{opacity:0}

  .bg{position:fixed; inset:0; pointer-events:none; z-index:0}
  .bg::before{content:""; position:absolute; inset:-24% -12% auto -12%; height:70vh;
    background:radial-gradient(46% 78% at 50% 0%,rgba(255,255,255,.66),transparent 72%),
               radial-gradient(40% 66% at 16% 6%,rgba(77,107,254,.16),transparent 74%),
               radial-gradient(36% 60% at 84% 4%,rgba(122,99,255,.14),transparent 74%)}

  .stage{position:fixed; inset:0; z-index:1; display:flex; flex-direction:column}

  /* 底部毛玻璃渐变：把画面下缘可能露出的硬边柔化掉 */
  .stage::after{
    content:""; position:fixed; left:0; right:0; bottom:0; height:clamp(110px,16vh,180px);
    pointer-events:none; z-index:-1;   /* 必须低于卡片，否则会把最后一行洗白 */
    background:linear-gradient(to top,
      var(--floor-1) 0%, var(--floor-2) 28%, var(--floor-3) 58%, var(--floor-4) 100%);
    /* 不用 backdrop-filter：它按元素矩形做模糊，边界反而会显出硬边 */
  }

  /* ---------- 顶部标题（随卡片切换） ---------- */
  .head{padding:clamp(58px,9.4vh,112px) 24px 0; text-align:center; flex:none;
    transition:opacity .34s ease}
  body.is-moving .head{opacity:0}      /* 转场时先让位，避免文字压在飞行的卡片上 */
  .eyebrow{font-size:10.5px; letter-spacing:.34em; text-transform:uppercase; color:var(--accent); opacity:.85}
  .lead{margin-top:12px; font-size:12.5px; color:var(--dim); letter-spacing:.01em; line-height:1.7}
  .lead .cta{color:var(--accent); border-bottom:1px solid rgba(77,107,254,.35); padding-bottom:1px;
    transition:border-color .2s}
  .lead .cta:hover{border-color:var(--accent)}
  /* 作品名：居中、在图片下方 */
  .caption{flex:none; text-align:center; padding:clamp(10px,2vh,22px) 24px clamp(58px,7.6vh,96px);
    transition:opacity .34s ease}
  body.is-moving .caption{opacity:0}
  body.mode-grid .caption{display:none}
  .title{margin:0; min-height:2.2em; margin-bottom:clamp(6px,1.2vh,14px)}
  /* 与顶部 DEEPSEEK GALLERY 同一套排版：大写 + 宽字距 */
  .title .en{font-size:clamp(13px,1.35vw,19px); font-weight:400; letter-spacing:.32em;
    text-transform:uppercase; line-height:1.5;
    margin-right:-.32em;            /* 抵消最后一个字符右侧的字距，保持视觉居中 */
    transition:opacity .34s cubic-bezier(.4,0,.2,1)}
  .title .cn{display:none}
  .title.swap .en,.title.swap .cn{opacity:0}

  /* ---------- 横向封面流 ---------- */
  .wrap{flex:1; min-height:0; display:flex; align-items:center; position:relative;
    padding-bottom:clamp(18px,3.4vh,40px)}
  .track{
    display:flex; align-items:center; gap:var(--gap);
    overflow-x:auto; overflow-y:hidden; width:100%;
    padding-inline:calc(50% - var(--cw)/2);
    scroll-snap-type:x mandatory; perspective:1800px; perspective-origin:50% 50%;
    scrollbar-width:none; -ms-overflow-style:none; cursor:default; position:relative;
    padding-block:clamp(18px,4vh,52px);
  }
  .track::-webkit-scrollbar{display:none}
  .track.dragging{cursor:grabbing; scroll-snap-type:none}
  .card{
    flex:0 0 var(--cw); aspect-ratio:16/9; scroll-snap-align:center; contain:layout paint;
    position:relative; border-radius:var(--r-lg); overflow:hidden;
    background:rgba(255,255,255,.34);      /* 图片未加载时的占位，加载后被盖住 */
    transform-style:preserve-3d; will-change:transform,opacity;
    /* 卡片进出中心时不要"弹"得太急：给位移与缩放一点跟手的阻尼 */
    transition:transform .55s cubic-bezier(.32,.72,.24,1), opacity .45s ease;
    box-shadow:0 34px 70px -30px rgba(28,32,44,.55), 0 2px 10px rgba(28,32,44,.12);
  }
  .card img{width:100%; height:100%; object-fit:cover}
  .card.noimg::before{content:attr(data-id); position:absolute; inset:0; display:flex;
    align-items:center; justify-content:center; font-size:12px; letter-spacing:.2em;
    color:var(--dim2); background:rgba(255,255,255,.5)}
  .card .hint{position:absolute; left:50%; bottom:clamp(14px,2vw,24px); transform:translateX(-50%);
    font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--accent);
    padding:8px 16px; border-radius:var(--r-pill); white-space:nowrap; z-index:2;
    background:var(--glass); border:1px solid var(--glass-line);
    -webkit-backdrop-filter:blur(20px) saturate(180%); backdrop-filter:blur(20px) saturate(180%);
    box-shadow:var(--glass-hi);
    opacity:0; transition:opacity .3s, transform .3s}
  .card.on:hover .hint{opacity:1; transform:translateX(-50%) translateY(-2px)}
  .card{cursor:default}
  .track{cursor:default}
  .track.dragging{cursor:grabbing; scroll-snap-type:none}

  /* 左右切换按钮 */
  .nav{
    position:absolute; top:50%; transform:translateY(-50%); z-index:6;
    width:clamp(46px,4.4vw,58px); height:clamp(46px,4.4vw,58px); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(17px,1.7vw,21px); line-height:1; color:var(--ink); cursor:pointer;
    border:1px solid var(--glass-line);
    background:var(--glass);
    -webkit-backdrop-filter:blur(26px) saturate(180%); backdrop-filter:blur(26px) saturate(180%);
    box-shadow:0 16px 40px -18px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.16);
    transition:transform .2s, border-color .2s, color .2s, opacity .2s;
    user-select:none; -webkit-user-select:none;
  }
  .nav:hover{border-color:rgba(77,107,254,.55); color:var(--accent); transform:translateY(-50%) scale(var(--hover))}
  .nav:active{transform:translateY(-50%) scale(.96)}
  .nav.prev{left:clamp(10px,2.2vw,34px)}
  .nav.next{right:clamp(10px,2.2vw,34px)}
  .nav[disabled]{opacity:.28; pointer-events:none}

  /* 地面倒影 */

  /* ---------- 底部 ---------- */
  /* 音效开关：与翻页按钮同一套玻璃样式，圆形、只留小图标 */
  .snd{
    width:44px; height:44px; border-radius:50%; padding:0; flex:none;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink); cursor:pointer;
    border:1px solid var(--glass-line);
    background:var(--glass);
    -webkit-backdrop-filter:blur(26px) saturate(180%); backdrop-filter:blur(26px) saturate(180%);
    box-shadow:0 16px 40px -18px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.16);
    transition:transform .2s, border-color .2s, color .2s, opacity .2s;
    -webkit-user-select:none; user-select:none;
  }
  .snd:hover{border-color:rgba(77,107,254,.55); color:var(--accent); transform:scale(var(--hover))}
  .snd:active{transform:scale(.96)}
  .snd .ico{font-size:15px; line-height:1; opacity:.9}
  .snd.on{color:var(--accent); border-color:rgba(77,107,254,.55)}
  .snd.on .ico{opacity:1}

  /* 进度条：贴在页面最下沿，左右通栏 */
  .bar{position:fixed; left:0; right:0; bottom:0; z-index:8;
    width:100%; height:3px; border-radius:0;
    background:rgba(28,28,26,.13);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
  .bar i{display:block; position:relative; height:100%; width:0; border-radius:0;
    background:var(--accent);
    box-shadow:none;
    transition:width .22s ease}
  /* 进度头部的蓝鲸，跟着走，与进度条留一段空隙 */
  .bar i::after{
    content:""; position:absolute; left:100%; bottom:9px;
    width:26px; height:17px; margin-left:-12px;
    transition:transform .25s ease;
    background:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2044%2024'%3E%3Cpath%20d%3D'M2.5%2013.6c0-4.7%204.6-8.4%2010.6-8.4%205%200%208.3%202.3%2010.2%205.6l5.4-4.4-1.3%205.6%204.6%203.6-6.6.9c-1.7%203.2-5.1%205.3-9.9%205.3-6.2%200-11-3.5-11-8.2Z'%20fill%3D'%234d6bfe'%2F%3E%3Ccircle%20cx%3D'10.4'%20cy%3D'11.8'%20r%3D'1.5'%20fill%3D'%23fff'%2F%3E%3C%2Fsvg%3E") center/contain no-repeat;
    pointer-events:none;
  }
  /* 鲸鱼原生朝左，向右游时要镜像 */
  .bar.fwd i::after{transform:scaleX(-1)}


  /* ---------- 总览按钮 ---------- */
  /* 作者标识：左上角，小云 + 名字 + 邮箱 */
  .credit{
    position:fixed; top:clamp(14px,2.4vh,26px); left:clamp(14px,2.4vw,30px); z-index:20;
    width:var(--btn-h); height:var(--btn-h); border-radius:50%; padding:0; box-sizing:border-box;
    display:flex; align-items:center; justify-content:center; color:var(--ink); cursor:pointer;
    background:var(--glass); border:1px solid var(--glass-line);
    -webkit-backdrop-filter:blur(26px) saturate(180%); backdrop-filter:blur(26px) saturate(180%);
    box-shadow:0 10px 26px -14px rgba(50,48,42,.5), var(--glass-hi);
    transition:color .25s ease, background-color .5s ease, border-color .5s ease, box-shadow .5s ease, transform .25s;
  }
  .credit:hover{color:var(--accent); border-color:rgba(77,107,254,.45); transform:scale(var(--hover))}
  .credit svg{display:block; opacity:.9}

  /* 名片：以云朵为圆心展开的半透明遮罩 */
  .cardveil{
    position:fixed; inset:0; z-index:60; display:none; overflow:hidden;
    background:transparent;
  }
  .cardveil.on{display:block}
  /* 圆形擦除：只有一个纯色圆在缩放，走合成器，不逐帧重算滤镜 */
  .cardwipe{
    position:absolute; width:120px; height:120px; border-radius:50%;
    left:var(--cx,40px); top:var(--cy,40px);
    background:rgba(10,12,18,.93);
    transform:translate(-50%,-50%) scale(.001);
    transition:transform .58s cubic-bezier(.22,.68,.22,1);
    will-change:transform;
  }
  .cardveil.open .cardwipe{transform:translate(-50%,-50%) scale(var(--s,30))}
  .cardveil{cursor:pointer}
  .cardbox{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:min(90vw,420px); text-align:center; color:#f2f3f6;
    display:flex; flex-direction:column; align-items:center; gap:14px;
    opacity:0; transition:opacity .3s ease .26s;
  }
  .cardveil.open .cardbox{opacity:1}
  .cardbox .bigcloud{opacity:.9}
  .cname{font-size:clamp(24px,3vw,32px); font-weight:500; letter-spacing:-.01em}
  .crole{font-size:12.5px; letter-spacing:.06em; color:rgba(242,243,246,.55); margin-top:-6px}
  .crow{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:12px 16px; border-radius:12px; font-size:12.5px;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.13);
    color:#e9ecf3; transition:background .2s, border-color .2s;
  }
  .crow:hover{background:rgba(255,255,255,.12); border-color:rgba(120,150,255,.5)}
  .crow .ck{letter-spacing:.16em; text-transform:uppercase; font-size:10.5px; color:rgba(242,243,246,.5)}
  .crow .cv{font-variant-numeric:tabular-nums}
  .cclose{
    margin-top:6px; font:inherit; font-size:11.5px; letter-spacing:.12em; text-transform:uppercase;
    color:rgba(242,243,246,.6); background:none; border:1px solid rgba(255,255,255,.16);
    padding:8px 18px; border-radius:999px; cursor:pointer; transition:.2s;
  }
  .cclose:hover{color:#fff; border-color:rgba(255,255,255,.4)}

  .topbar{
    position:fixed; top:clamp(14px,2.4vh,26px); right:clamp(14px,2.4vw,30px); z-index:20;
    display:flex; align-items:center; gap:10px;
  }
  /* 主题切换：与总览按钮同款圆形玻璃 */
  .themebtn{
    width:var(--btn-h); height:var(--btn-h); border-radius:50%; padding:0; box-sizing:border-box;
    display:flex; align-items:center; justify-content:center;
    line-height:1; color:var(--ink); cursor:pointer;
    border:1px solid var(--glass-line);
    border:1px solid var(--glass-line);
    background:var(--glass);
    -webkit-backdrop-filter:blur(26px) saturate(180%); backdrop-filter:blur(26px) saturate(180%);
    box-shadow:0 10px 26px -14px rgba(50,48,42,.5), var(--glass-hi);
    transition:transform .2s, border-color .2s, color .2s;
  }
  .themebtn:hover{color:var(--accent); border-color:rgba(77,107,254,.45); transform:scale(var(--hover))}
  .themebtn svg{display:block; opacity:.9}

  .ovbtn{
    display:inline-flex; align-items:center; gap:8px; height:var(--btn-h); box-sizing:border-box;
    font:inherit; font-size:12px; letter-spacing:.06em; color:var(--ink); cursor:pointer;
    padding:0 16px 0 13px; border-radius:var(--r-pill);
    overflow:hidden; white-space:nowrap;
    background:var(--glass); border:1px solid var(--glass-line);
    -webkit-backdrop-filter:blur(26px) saturate(180%); backdrop-filter:blur(26px) saturate(180%);
    box-shadow:0 10px 26px -14px rgba(50,48,42,.5), var(--glass-hi);
    transition:transform var(--hover-t), color .2s, border-color .2s, width .3s cubic-bezier(.2,.7,.3,1);
  }
  #ovLabel{display:inline-block; transition:opacity .16s ease}
  .ovbtn:hover{color:var(--accent); border-color:rgba(77,107,254,.45); transform:scale(var(--hover))}
  .ovbtn{position:relative; top:auto; right:auto}
  .ovbtn svg{width:13px; height:13px; opacity:.8}

  /* ---------- 总览（网格）模式 ---------- */
  body.mode-grid .head{display:none}
  /* 总览：鼠标停留放大，与顶栏按钮同一套手感 */
  body.mode-grid .card{
    transition:transform var(--hover-t), box-shadow var(--hover-t);
    will-change:transform;
  }
  body.mode-grid .card:hover{
    transform:scale(var(--hover));
    box-shadow:0 26px 50px -22px rgba(0,0,0,.55);
    z-index:3;
  }

  body.mode-grid .nav,

    max-height:100%; overflow-y:auto; overflow-x:hidden;

    top:clamp(16px,3vw,46px); bottom:clamp(16px,3vw,46px);
    width:6px; border-radius:999px; z-index:9; display:none;
    opacity:0; transition:opacity .34s ease; pointer-events:none}
  body.mode-grid .scr{display:block}
  .scr.on{opacity:1}
  .scr.on{pointer-events:auto}
  .scr i{position:absolute; left:0; width:100%; border-radius:999px; cursor:grab; pointer-events:auto;
    background:rgba(255,255,255,.42);
    border:1px solid rgba(255,255,255,.55);
    -webkit-backdrop-filter:blur(14px) saturate(150%); backdrop-filter:blur(14px) saturate(150%);

  /* 总览的移轴感：三层叠加做出"模糊半径渐变"。
     单层 backdrop-filter 只有恒定强度，靠遮罩淡出的只是可见度；
     叠三层不同半径、不同高度，边缘处累积成强模糊，向内逐级变弱。 */
  body.mode-grid{--tilt-h:clamp(200px,29.7vh,335px); --tilt-pad:calc(var(--tilt-h) * .86)}
  .tilt{--h:var(--tilt-h); position:absolute; inset:0; z-index:8; pointer-events:none; display:none}

  .tilt .t{top:0}
  .tilt .b{bottom:0}

  .tilt .t3{height:calc(var(--h) * .45); -webkit-backdrop-filter:blur(11.9px) saturate(88%) brightness(.94); backdrop-filter:blur(11.9px) saturate(88%) brightness(.94);
    -webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 35%,transparent 100%);
            mask-image:linear-gradient(to bottom,#000 0%,#000 35%,transparent 100%)}
  .tilt .b3{height:calc(var(--h) * .45); -webkit-backdrop-filter:blur(11.9px) saturate(88%) brightness(.94); backdrop-filter:blur(11.9px) saturate(88%) brightness(.94);
    -webkit-mask-image:linear-gradient(to top,#000 0%,#000 35%,transparent 100%);
            mask-image:linear-gradient(to top,#000 0%,#000 35%,transparent 100%)}
  .tilt .t2{height:calc(var(--h) * .72); -webkit-backdrop-filter:blur(6.8px) saturate(88%) brightness(.94); backdrop-filter:blur(6.8px) saturate(88%) brightness(.94);
    -webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 42%,transparent 100%);
            mask-image:linear-gradient(to bottom,#000 0%,#000 42%,transparent 100%)}
  .tilt .b2{height:calc(var(--h) * .72); -webkit-backdrop-filter:blur(6.8px) saturate(88%) brightness(.94); backdrop-filter:blur(6.8px) saturate(88%) brightness(.94);
    -webkit-mask-image:linear-gradient(to top,#000 0%,#000 42%,transparent 100%);
            mask-image:linear-gradient(to top,#000 0%,#000 42%,transparent 100%)}
  .tilt .t1{-webkit-backdrop-filter:blur(2.55px) saturate(88%) brightness(.94); backdrop-filter:blur(2.55px) saturate(88%) brightness(.94);

            mask-image:linear-gradient(to top,#000 0%,#000 38%,transparent 100%)}

  .veil.off{opacity:0; pointer-events:none}
  .vname{font-size:10.5px; letter-spacing:.34em; text-transform:uppercase;
    color:currentColor; opacity:.62; text-align:center; padding:0 24px;
    max-width:min(92vw,560px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .dot{width:6px; height:6px; border-radius:50%; background:var(--accent); opacity:.35; animation:pulse 1.25s ease-in-out infinite}

    padding:clamp(13px,2vw,22px) clamp(15px,2.4vw,30px); z-index:4; pointer-events:none}

    .head{ display:block; position:absolute; inset:0 0 auto 0; z-index:5; padding:0; pointer-events:none }

      position:absolute; left:50%; top:calc(env(safe-area-inset-top) + 32px);

    .caption{

    .ovbtn{ width:var(--btn-h); padding:0; justify-content:center; border-radius:50% }
    .ovbtn #ovLabel{ display:none }

    body.portrait:not(.mode-grid) .track{
      flex-direction:column;
      gap:0;                                  /* 上下贴紧，靠负边距让相邻卡片叠到后面 */
      height:100%; min-height:0;            /* 不固定高度的话它会撑到内容高度，就没有滚动 */
      overflow-x:hidden; overflow-y:auto;   /* 基础样式只开了横向滚动 */

    body.portrait:not(.mode-grid) .wrap{ overflow:hidden }

    /* 竖屏时标题叠在卡片中央，不再需要底部垫底 */
    body.portrait .caption{ position:absolute; background:none }

    /* 总览：2 列，格子更大更好点 */
    body.mode-grid .track{

    var sEl = els[lastFocus];
    /* ?noscroll=1 可以关掉"滚到选中项"，用来排查进场动画被拽一下的问题 */
    var noScroll = /[?&]noscroll=1/.test(location.search);
    if (!noScroll && sEl) {
      /* 刚切成网格时 scrollHeight 可能还没算好，滚一次会被夹回 0。
         先算一版，下一帧再用最终的 scrollHeight 校正一次。 */
      wantTop = function () {
        var maxTop = Math.max(0, track.scrollHeight - track.clientHeight);
        var want = sEl.offsetTop - (track.clientHeight - sEl.offsetHeight) / 2;
        return Math.max(0, Math.min(want, maxTop));
      };
      track.scrollTop = wantTop();
    }
    void track.offsetWidth;
  }

  if (!toGrid) {
    jumpTo(focusIndex);
    void track.offsetWidth;
    transitioning = false;
    current = -1;
    layout();
    transitioning = true;
  }

  /* 3. 记录终点：布局矩形 + 目标变换 */
  var g1 = els.map(function (el) {
    return { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight };
  });
  var scroll1 = track.scrollLeft;
  var top1 = track.scrollTop;
  var box1 = track.getBoundingClientRect();
  var t1 = els.map(function (el) { return el.style.transform || 'none'; });
  var op1 = els.map(function (el) { return el.style.opacity ? parseFloat(el.style.opacity) : 1; });

  function compose(dx, dy, sx, sy, base) {
    var head = 'translate(' + dx.toFixed(2) + 'px,' + dy.toFixed(2) + 'px) scale(' + sx.toFixed(4) + ',' + sy.toFixed(4) + ')';
    return (base && base !== 'none') ? head + ' ' + base : head;
  }

  /* 4. 动画 */
  var rv0 = 18, rv1 = 18;   // 横向与总览同一圆角，转场不再变形
  anims = [];
  var vw = window.innerWidth, vh = window.innerHeight;
  var sel = toGrid ? lastFocus : focusIndex;      // 当前选中的那一张

  /* 四套飞入策略，每次进入总览随机选一套。
     用同一套能让整场转场保持统一的'镜头语言'，换套则每次开箱不一样。 */
  var ENTRIES = ['side', 'vertical', 'diagonal', 'bloom'];
  var entry = ENTRIES[Math.floor(Math.random() * ENTRIES.length)];

  els.forEach(function (el, i) {
    var dx, dy, sx, sy, base = t0[i], op = op0[i], delay = 0, culled = false;

    if (toGrid && i !== sel) {
      /* 其余卡片：按本次抽到的策略从画外飞入 */
      var sgn = Math.random() < 0.5 ? -1 : 1;
      if (entry === 'vertical') {                 // 上下
        dy = sgn * (vh * 0.5 + Math.random() * vh * 0.4);
        dx = (Math.random() - 0.5) * 160;
        sx = 0.9;
      } else if (entry === 'diagonal') {          // 斜角
        dx = sgn * (vw * 0.4 + Math.random() * vw * 0.3);
        dy = (Math.random() < 0.5 ? -1 : 1) * (vh * 0.34 + Math.random() * vh * 0.28);
        sx = 0.86;
      } else if (entry === 'bloom') {             // 原地放大淡入
        dx = 0; dy = 0;
        sx = 0.55 + Math.random() * 0.12;
      } else {                                    // 左右（默认）
        dx = sgn * (vw * 0.42 + Math.random() * vw * 0.38);
        dy = (Math.random() - 0.5) * 150;
        sx = 0.9;
      }
      sy = sx;
      base = 'none';
      op = 0;
      delay = Math.random() * (entry === 'bloom' ? 220 : 120);
    } else if (!toGrid && i !== sel && Math.abs(g1[i].x + g1[i].w / 2 - scroll1 + box1.left - vw / 2) > vw * 0.7) {
      /* 返回时，终点在画面外的卡片不横穿屏幕——原地缩小淡出即可，
         否则十几张同时掠过，选中那张的"一镜"就被淹没了 */
      dx = 0; dy = 0; sx = 1; sy = 1;
      base = 'none';
      culled = true;
    } else {
      /* 选中的那张：直接归位。
         用"中心点"算位移（宽度变了，左右边缘差和中心差不是一回事），
         并扣掉两端的滚动量（offsetLeft 含滚动偏移，纵向没有滚动）。 */
      dx = (g0[i].x + g0[i].w / 2 - scroll0 + box0.left) - (g1[i].x + g1[i].w / 2 - scroll1 + box1.left);
      dy = (g0[i].y + g0[i].h / 2 - top0 + box0.top) - (g1[i].y + g1[i].h / 2 - top1 + box1.top);
      if (toGrid) base = 'none';   // 进总览时两端都保持纯 translate+scale，避免矩阵插值走弯路
      sx = g0[i].w / Math.max(g1[i].w, 1);
      sy = sx;      // 统一缩放比 —— 横向 16:9 与网格 16:9 仍会有零点几个百分点误差,
                    // 分别取 sx/sy 会让卡片在动画中轻微变形（"抽一下"）
    }

    el.style.zIndex = (i === sel) ? 6 : 2;

    var moving = Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5 ||
                 Math.abs(sx - 1) > 0.004 || Math.abs(sy - 1) > 0.004;
    var turn = base !== t1[i];
    var faded = Math.abs(op - op1[i]) > 0.01;
    if (!moving && !turn && !faded) return;

    var isSel = (i === sel);
    var endOp = culled ? 0 : op1[i];
    var dur = culled ? 320 : (isSel ? 640 : 560);
    /* 选中的那张起手就快速收缩：它被放大到 3.4 倍时是一块深色大矩形，
       若慢起手会在第一行上方停留很久，把那排全遮住 */
    var ease = culled ? 'ease-out' : (isSel ? 'cubic-bezier(.14,.92,.22,1)' : 'cubic-bezier(.22,.8,.24,1)');
    /* 圆角会随 scale 一起缩放：元素放大 3.36 倍时，46px 在屏幕上是 154px。
       起始帧按缩放倍数反向补偿，视觉圆角才稳定。 */
    var sc0 = Math.max(Math.abs(sx), Math.abs(sy), 0.02);
    var cssR0 = Math.max(2, rv0 / sc0);
    var frames;
    if (toGrid && i !== sel) {
      /* 飞入的卡片：前半程保持全透明，接近落位才显现。
         否则 20 张半透明的卡同时在浅色背景上滑过，
         会形成一片片"把画面割开"的淡色矩形。 */
      var midS = sx + (1 - sx) * 0.7;
      var midTf = compose(dx * 0.3, dy * 0.3, midS, midS, base);
      /* 中段圆角必须跟着当时的缩放一起补偿。此前沿用起始帧的值，
         bloom（0.55 倍起）现身时缩放已到 0.93，视觉圆角会先大一圈再突然收小。 */
      var midRv = rv0 + (rv1 - rv0) * 0.7;
      var midR = Math.max(2, midRv / Math.max(midS, 0.02));
      frames = [
        { transform: compose(dx, dy, sx, sy, base), opacity: 0, borderRadius: cssR0.toFixed(2) + 'px', offset: 0 },
        { transform: midTf, opacity: 0, borderRadius: midR.toFixed(2) + 'px', offset: 0.68 },
        /* 终点写成与起点同构的 translate+scale（不是 none），
           保证逐函数插值——否则浏览器会退回矩阵插值，路径会拐弯 */
        { transform: 'translate(0px,0px) scale(1,1)', opacity: 1, borderRadius: rv1 + 'px', offset: 1 }
      ];
    } else {
      frames = [
        { transform: compose(dx, dy, sx, sy, base), opacity: op, borderRadius: cssR0.toFixed(2) + 'px', offset: 0 },
        { transform: culled ? 'scale(0.88)'
                           : (t1[i] === 'none'
                                ? (toGrid ? 'translate(0px,0px) scale(1,1)' : 'none')
                                : t1[i]),
          opacity: endOp, borderRadius: rv1 + 'px', offset: 1 }
      ];
    }
    el.style.transform = frames[0].transform;          // 先把起点落到内联，避免中间帧闪一下
    if (frames[0].opacity !== undefined) el.style.opacity = String(frames[0].opacity);
    anims.push(el.animate(frames, { duration: dur, delay: delay, easing: ease, fill: 'both' }));
  });

  Promise.all(anims.map(function (a) { return a.finished.catch(function () {}); })).then(function () {
    anims.forEach(function (a) { a.cancel(); });
    anims = [];
    els.forEach(function (el) {
      el.style.transform = '';        // 清掉为防闪而写的起点
      el.style.opacity = '';
      el.style.willChange = '';
      el.style.zIndex = '';
    });
    transitioning = false;                       // 必须先解锁，否则下面的 layout() 会被拦掉

    /* 等换字动画（.swap，140ms）在隐形状态下走完再淡入，
       否则头部的淡入和标题的闪换叠在一起，看起来就是"闪一下" */
    settleAt = performance.now() + 300;   // 冷却期
    setTimeout(function () { document.body.classList.remove('is-moving'); }, 170);
  });
}

  /* 圆足够大，最远那个角也要盖住（120px 的圆 * scale） */

/* ---------- 场景截图 ---------- */
document.getElementById('shotBtn').addEventListener('click', function () {
  var w = frame && frame.contentWindow;
  if (!w) return;
  var cv = w.document.querySelector('canvas');
  if (!cv) return;

  var out = document.createElement('canvas');
  out.width = cv.width; out.height = cv.height;
  var ctx2 = out.getContext('2d');

  /* 必须在场景渲染完的那一帧立刻拷贝：
     WebGL 的绘制缓冲在合成后就清掉了，晚一步就是空白 */
  w.requestAnimationFrame(function () {
    try { ctx2.drawImage(cv, 0, 0); } catch (e) { return; }
    out.toBlob(function (blob) {
      if (!blob) return;
      var name = ((cards[vIndex] && cards[vIndex].w.en) || 'scene')
        .replace(/[^\w]+/g, '-').replace(/^-|-$/g, '').toLowerCase();
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'deepseek-gallery-' + name + '.png';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    }, 'image/png');
  });
});

/* 以主题按钮为圆心做圆形擦除，切完再把遮罩淡出 */
var themewipe = document.getElementById('themewipe');

var BG_DARK  = 'radial-gradient(130% 86% at 50% -14%, #262a34 0%, #1d2029 34%, #171a21 62%, #121419 84%, #0d0e12 100%)';

themeBtn.addEventListener('click', function () {
  if (wipeBusy) return;

  /* 圆形擦除目前只给桌面端；移动端先走原来的整体交叉淡入 */
  if (!window.matchMedia('(min-width: 721px)').matches) {
    darkOn = !darkOn;
    localStorage.setItem('gallery-theme', darkOn ? 'dark' : 'light');
    paintTheme();

  }

  wipeBusy = true;

  var r = themeBtn.getBoundingClientRect();
  var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  var far = Math.hypot(Math.max(cx, innerWidth - cx), Math.max(cy, innerHeight - cy));
  themewipe.style.setProperty('--cx', Math.round(cx) + 'px');
  themewipe.style.setProperty('--cy', Math.round(cy) + 'px');
  themewipe.style.setProperty('--r', Math.ceil(far + 20) + 'px');
  themewipe.style.background = darkOn ? BG_LIGHT : BG_DARK;  // 擦进来的是"目标主题"，整屏原尺寸

  /* 把背景层锁在当前状态：擦除过程中它不能自己渐变，
     否则遮罩撤掉的那一刻背景还没到终值，就会闪一下。 */
  var themefade = document.getElementById('themefade');
  themefade.style.transition = 'none';
  themefade.style.opacity = darkOn ? '1' : '0';
  themewipe.style.opacity = '1';

  document.body.classList.add('wipe-running');
  themewipe.classList.add('on');
  void themewipe.offsetWidth;
  themewipe.classList.add('grow');

  /* 在圆扫到一半时就切换并恢复过渡：
     文字/按钮的颜色变化发生在擦除过程中，而不是等圆铺满才"啪"地一起变。 */
  setTimeout(function () {
    /* 先摘掉"禁用过渡"的类并强制一次样式重算，
       否则切换和摘类在同一帧结算，颜色会直接跳过去，没有渐变。 */
    document.body.classList.remove('wipe-running');
    void document.body.offsetWidth;
    darkOn = !darkOn;
    localStorage.setItem('gallery-theme', darkOn ? 'dark' : 'light');
    paintTheme();
  }, 320);

  /* 圆铺满的同一帧：背景瞬切到新值 + 撤掉遮罩。
     两者像素一致，所以看不出任何变化。 */
  setTimeout(function () {
    themefade.style.opacity = darkOn ? '1' : '0';
    themewipe.classList.remove('grow', 'on');
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        themefade.style.transition = '';
        themefade.style.opacity = '';
        wipeBusy = false;
      });
    });
  }, 700);
});

      var start = 'translate(' + dx + 'px,' + dy + 'px)' + (base !== 'none' ? ' ' + base : '');
      var a = c.el.animate([
        { transform: start, opacity: 0 },
        { transform: base, opacity: endOp }
      ], {
        duration: 760,
        delay: Math.min(Math.abs(d) * 45, 380),
        easing: 'cubic-bezier(.22,.8,.24,1)',

      introAnims.push(a);

    });

    var head = document.querySelector('.head');

      { duration: 720, delay: 260, easing: 'ease-out', fill: 'both' });
    introAnims.push(h); h.onfinish = function () { h.cancel(); };

    var bar = document.querySelector('.bar');

      { duration: 620, delay: 640, easing: 'ease-out', fill: 'both' });

}

/* 启动自检：新增作品时漏掉任何一处，控制台会直接指出 */
function selfCheck() {

    seen[w.id] = 1;
    if (!SRC[w.id]) problems.push(w.id + ' 缺少 SRC 条目');
    if (!/^A\d\d$/.test(w.id)) problems.push(w.id + ' 命名不规范（应为 A00 形式）');
  });
  Object.keys(SRC).forEach(function (k) {
    if (!WORKS.some(function (w) { return w.id === k; })) problems.push(k + ' 在 SRC 里但没有对应作品');
  });
  if (problems.length) console.warn('[diorama] 数据自检发现 ' + problems.length + ' 个问题：\n' + problems.join('\n'));
  return problems;
}

function boot() {
  var id = location.hash.replace('#', '');
  selfCheck();

  if (id && SRC[id]) {
    layout();
    document.body.classList.remove('booting');
    open(id);
    return;
  }

  /* 每次打开随机落在某一件上，而不是永远从第一张开始 */
  jumpTo(Math.floor(Math.random() * cards.length));
  void track.offsetWidth;
  track.style.scrollSnapType = '';
  current = -1;
  layout();

  /* 弱网时图片可能还没到。等当前这张和左右邻居就位（最多 1.6s）再放出， */
  /* 否则用户看到的是几张空框加上一段没有内容的进场动画。 */
  var sel = nearestIndex();
  var wait = cards.slice(Math.max(0, sel - 1), Math.min(cards.length, sel + 2))
                  .map(function (c) { return c.el.querySelector('img'); })
                  .filter(Boolean);
  var left = wait.length, settled = false;

  function reveal() {
    if (settled) return;
    settled = true;
    document.body.classList.remove('booting');
    playIntro();
  }
  var guard = setTimeout(reveal, 1600);
  if (!wait.length) { clearTimeout(guard); reveal(); return; }
  wait.forEach(function (im) {
    if (im.complete) { if (--left === 0) { clearTimeout(guard); reveal(); } return; }
    var tick = function () { if (--left === 0) { clearTimeout(guard); reveal(); } };
    im.addEventListener('load', tick, { once: true });
    im.addEventListener('error', tick, { once: true });
  });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
requestAnimationFrame(function () { layout(); });
setTimeout(layout, 240);
</script>
