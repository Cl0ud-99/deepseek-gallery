           非主卡加一点 rotateX + perspective，上宽下窄，做出立体层叠感。 */
        var pull = -Math.max(-1, Math.min(1, d)) * box.offsetHeight * 0.55;
        /* 面积 +10% 的加成按距离平滑过渡，避免卡片刚成为主卡时突然缩一下 */
        var boost = 1 + (Math.sqrt(1.10) - 1) * smoothstep(0.03, 0.22, ad);
        var vsc = (1 - ad * 0.34) * boost;
        /* 主卡上方：上宽下窄（负角）；主卡下方：上窄下宽（正角），形成环绕的立体层叠 */
        var tiltAmt = (10 + ad * 12) * smoothstep(0.03, 0.20, ad);
        var tilt = d < 0 ? -tiltAmt : tiltAmt;
        box.style.transform = 'perspective(900px) translateY(' + pull.toFixed(1) + 'px) rotateX(' + tilt.toFixed(2) + 'deg) scale(' + vsc.toFixed(3) + ')';
        box.style.zIndex = String(10 - Math.round(ad * 5));
      } else {
        // d 可以到 ±10（列表总宽 19000px），必须钳制：
        // 之前没钳制会算出 rotateY(±200°)，到 90° 时卡片被压成一条线
        var rot = -Math.max(-1, Math.min(1, d)) * 20;
        var sc = 1 - ad * 0.13;
        var ty = ad * 10;
        box.style.transform = 'rotateY(' + rot.toFixed(2) + 'deg) scale(' + sc.toFixed(3) + ') translateY(' + ty.toFixed(1) + 'px)';
        box.style.zIndex = '';
      }
    }
    box.style.opacity = VERT
      ? String(Math.max(0.46, 1 - ad * 0.52))
      : String(Math.max(0.34, 1 - ad * 0.58));
  }
  for (var q = 0; q < cards.length; q++) cards[q].el.classList.toggle('on', q === best);
  navPrev.disabled = best <= 0;
  navNext.disabled = best >= cards.length - 1;
  if (best !== current) setCurrent(best);
  var p = cards.length > 1 ? best / (cards.length - 1) : 0;
  document.getElementById('bar').style.width = (p * 100).toFixed(2) + '%';

  /* 小鲸朝向跟着「前进 / 后退」翻转 */
  if (barPos >= 0 && best !== barPos) {
    document.querySelector('.bar').classList.toggle('fwd', best > barPos);
  }
  barPos = best;
}

function setCurrent(i) {
  current = i;
  var t = document.getElementById('title');
  t.classList.add('swap');
  setTimeout(function () {
    document.getElementById('tEn').textContent = cards[i].w.en;
    document.getElementById('tCn').textContent = cards[i].w.cn;
    t.classList.remove('swap');
  }, 140);
}

function nearestIndex() {
  var mid = (VERT ? track.scrollTop : track.scrollLeft) +
            (VERT ? track.clientHeight : track.clientWidth) / 2;
  var best = 0, bd = 1e9;
  for (var k = 0; k < cards.length; k++) {
    var el = cards[k].el;
    var p = VERT ? el.offsetTop + el.offsetHeight / 2
                 : el.offsetLeft + el.offsetWidth / 2;
    var d = Math.abs(p - mid);
    if (d < bd) { bd = d; best = k; }
  }
  return best;
}

/* 程序化滚动必须临时关掉 snap：mandatory 吸附会打断 scrollTo，每步少走约 40px。
   滚到位后立刻恢复，此时位置本身就是吸附点，不会跳动。 */
var snapTimer = 0;
function center(i) {
  var c = cards[i];
  var target = VERT
    ? c.el.offsetTop + c.el.offsetHeight / 2 - track.clientHeight / 2
    : c.el.offsetLeft + c.el.offsetWidth / 2 - track.clientWidth / 2;
  track.style.scrollSnapType = 'none';
  clearTimeout(snapTimer);
  track.scrollTo(VERT
    ? { top: target, behavior: reduce ? 'auto' : 'smooth' }
    : { left: target, behavior: reduce ? 'auto' : 'smooth' });
  /* 清空 inline 值，恢复 CSS 里按轴定义的吸附方向 */
  snapTimer = setTimeout(function () { track.style.scrollSnapType = ''; }, reduce ? 40 : 640);
}

/* ---------- 总览的自定义滚动条 ---------- */
var scr = document.getElementById('scr');
var scrThumb = document.getElementById('scrThumb');
var scrIdle = 0, scrDragging = false;

function scrSync() {
  var max = track.scrollHeight - track.clientHeight;
  var h = scr.clientHeight;
  if (h <= 0) return;
  var ratio = Math.min(1, track.clientHeight / Math.max(track.scrollHeight, 1));
  var thumbH = Math.max(44, Math.round(h * ratio));
  var top = max > 0 ? (track.scrollTop / max) * (h - thumbH) : 0;
  scrThumb.style.height = thumbH + 'px';
  scrThumb.style.transform = 'translate3d(0,' + top.toFixed(1) + 'px,0)';
}

function scrShow() {
  if (!overview) return;
  scrSync();
  scr.classList.add('on');
  clearTimeout(scrIdle);
  scrIdle = setTimeout(function () {
    if (!scrDragging) scr.classList.remove('on');
  }, 1000);
}

track.addEventListener('scroll', scrShow, { passive: true });
window.addEventListener('resize', scrSync);

/* 拖动：拉到顶/底时不再触发回弹，让用户看到上下内容 */
scr.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  /* 点在轨道空白处：先跳到对应位置（等于一次"翻页"），再继续跟手拖动 */
  if (e.target !== scrThumb) {
    var rect = scr.getBoundingClientRect();
    var ratio = (e.clientY - rect.top - scrThumb.offsetHeight / 2) /
                Math.max(1, rect.height - scrThumb.offsetHeight);
    var max0 = track.scrollHeight - track.clientHeight;
    track.scrollTop = Math.max(0, Math.min(max0, ratio * max0));
  }
  scrDragging = true;
  scr.classList.add('on');
  scrThumb.classList.add('drag');
  clearTimeout(scrIdle);
  var startY = e.clientY;
  var startTop = track.scrollTop;

  function onMove(ev) {
    var max = track.scrollHeight - track.clientHeight;
    var span = scr.clientHeight - scrThumb.offsetHeight;
    if (span <= 0) return;
    var raw = startTop + (ev.clientY - startY) / span * max;

    /* 拉过界：scrollTop 夹在两端，超出量转成回弹位移 —— 这样能拉到回弹区的极限 */
    var over = raw < 0 ? raw : (raw > max ? raw - max : 0);
    track.scrollTop = Math.max(0, Math.min(max, raw));
    bounceY = Math.max(-bouncMax, Math.min(bouncMax, -over * 0.9));

    if (bounceY !== 0) { beginBounce(); } 
    if (!bounceRaf) bounceRaf = requestAnimationFrame(paintBounce);
  }
  function onUp() {
    scrDragging = false;
    scrThumb.classList.remove('drag');
    if (bounceY !== 0) { clearTimeout(bounceTimer); endBounce(); }
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    scrIdle = setTimeout(function () { scr.classList.remove('on'); }, 1000);
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
});

/* ---------- 总览的弹性过冲（模拟 iOS 橡皮筋）---------- */
var bounceY = 0, bounceTimer = 0, bounceRaf = 0, bouncMax = 200, bouncing = false;

function paintBounce() {
  bounceRaf = 0;
  track.style.transform = 'translate3d(0,' + bounceY.toFixed(1) + 'px,0)';
}
function beginBounce() {
  if (bouncing) return;
  bouncing = true;
  track.style.willChange = 'transform';   // 提升到合成层，位移只走合成不重绘
  track.style.transition = 'none';
  track.style.contain = 'paint';
}
function endBounce() {
  track.style.transition = 'transform .5s cubic-bezier(.16,.84,.32,1)';
  track.style.transform = 'translate3d(0,0,0)';
  bounceY = 0;
  setTimeout(function () {
    track.style.transition = '';
    track.style.transform = '';
    track.style.willChange = '';
    track.style.contain = '';
    bouncing = false;
  }, 520);
}

track.addEventListener('wheel', function (e) {
  if (!overview || scrDragging) return;
  var atTop = track.scrollTop <= 0;
  var atBottom = track.scrollTop >= track.scrollHeight - track.clientHeight - 1;
  var pushingUp = e.deltaY < 0, pushingDown = e.deltaY > 0;
  if (!((atTop && pushingUp) || (atBottom && pushingDown))) return;

  e.preventDefault();
  beginBounce();

  var damp = 1 - Math.min(Math.abs(bounceY) / bouncMax, 1) * 0.72;
  bounceY -= e.deltaY * 0.42 * damp;
  bounceY = Math.max(-bouncMax, Math.min(bouncMax, bounceY));

  if (!bounceRaf) bounceRaf = requestAnimationFrame(paintBounce);   // 每帧只写一次

  clearTimeout(bounceTimer);
  bounceTimer = setTimeout(endBounce, 90);
}, { passive: false });

/* ---------- 滚轮 → 翻页（一格一张，带吸附） ---------- */
var wheelAt = 0;
track.addEventListener('wheel', function (e) {
  if (overview) return;
  if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
  e.preventDefault();

  var now = performance.now();
  if (now - wheelAt < 320) return;      // 触控板一次滑动会产生大量事件，节流成一次翻页
  wheelAt = now;

  var i = nearestIndex() + (e.deltaY > 0 ? 1 : -1);
  center(Math.max(0, Math.min(cards.length - 1, i)));
}, { passive: false });

/* ---------- 鼠标拖动（触摸交给原生滚动） ---------- */
var down = false, startX = 0, startL = 0, moved = 0;
track.addEventListener('pointerdown', function (e) {
  if (e.button !== 0) return;
  if (e.pointerType && e.pointerType !== 'mouse') return;   // 触摸/手写笔不参与
  if (VERT) return;                                        // 竖屏交给原生纵向滚动
  down = true; moved = 0; startX = e.clientX; startL = track.scrollLeft;
  track.classList.add('dragging');
});
function endDrag() {
  if (!down) return;
  down = false;
  track.classList.remove('dragging');
}
window.addEventListener('pointermove', function (e) {
  if (!down) return;
  var dx = e.clientX - startX;
  moved = Math.max(moved, Math.abs(dx));
  track.scrollLeft = startL - dx;
});
window.addEventListener('pointerup', function () {
  if (!down) return;
  endDrag();
  if (moved < 6) return;
  center(nearestIndex());
});
/* 触摸滚动被浏览器接管时只会发 pointercancel，必须在这里复位，
   否则 .dragging 与 scroll-snap-type:none 会一直留在轨道上 */
window.addEventListener('pointercancel', endDrag);

var raf = 0;
track.addEventListener('scroll', function () {
  if (raf) return;
  raf = requestAnimationFrame(function () { raf = 0; layout(); });
}, { passive: true });

/* 竖屏不用原生 snap（它按缩放/旋转后的盒子吸附，会把主卡卡在半倾斜状态），
   松手后再平滑吸到最近一张的布局中心，主卡保持正面、侧卡保持斜度 */
var vertSnapTimer = 0, vertSnapAt = 0;
track.addEventListener('scroll', function () {
  if (!VERT || overview) return;
  clearTimeout(vertSnapTimer);
  vertSnapTimer = setTimeout(function () {
    if (!VERT || overview || performance.now() < vertSnapAt) return;
    var i = nearestIndex();
    var c = cards[i] && cards[i].el;
    if (!c) return;
    var target = c.offsetTop + c.offsetHeight / 2 - track.clientHeight / 2;
    if (Math.abs(track.scrollTop - target) > 4.4) {
      vertSnapAt = performance.now() + 500;
      center(i);
    }
  }, 300);
}, { passive: true });

/* 滑动惯性还在时，第一次点击只负责停下来，不触发卡片/按钮 */
var lastScrollAt = 0, settleUntil = 0, stopTapUntil = 0;
track.addEventListener('scroll', function () {
  if (!isTouch) return;
  if (performance.now() < settleUntil) return;
  lastScrollAt = performance.now();
}, { passive: true });

document.addEventListener('pointerdown', function (e) {
  if (!isTouch) return;
  if (e.pointerType && e.pointerType !== 'touch') return;
  var now = performance.now();
  if (now - lastScrollAt > 220) return;
  settleUntil = now + 300;
  lastScrollAt = 0;
  var y = track.scrollTop, x = track.scrollLeft;
  track.style.scrollBehavior = 'auto';
  try { track.scrollTo({ top: y, left: x, behavior: 'auto' }); }
  catch (err) { track.scrollTop = y; track.scrollLeft = x; }

  /* 按钮/链接属于明确操作：滑动惯性中第一次点也必须生效，只顺手停住滚动 */
  var ui = e.target && e.target.closest &&
           e.target.closest('button,a,.credit,.ovbtn,.themebtn,.snd,.varrow,.vclose,.vctl,.dock,.head,.bar,.cardbox,.crow,.cclose,.ghost,.upload,.nav');
  if (ui) { stopTapUntil = 0; return; }
  stopTapUntil = now + 420;
}, true);

document.addEventListener('click', function (e) {
  if (!stopTapUntil) return;
  if (performance.now() > stopTapUntil) { stopTapUntil = 0; return; }
  if (e.target && /input|textarea/i.test(e.target.tagName)) return;
  e.preventDefault();
  e.stopPropagation();
  stopTapUntil = 0;
}, true);

window.addEventListener('resize', function () { syncViewportVars(); syncAxis(); layout(); syncVerticalPad(); syncSceneCover(); });
window.addEventListener('orientationchange', function () {
  setTimeout(function () { syncViewportVars(); syncAxis(); layout(); syncVerticalPad(); syncSceneCover(); }, 160);
});
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', function () { syncViewportVars(); layout(); syncVerticalPad(); syncSceneCover(); });
  window.visualViewport.addEventListener('scroll', function () { syncViewportVars(); layout(); syncSceneCover(); });
}

var navPrev = document.getElementById('navPrev');
var navNext = document.getElementById('navNext');
navPrev.addEventListener('click', function () { center(Math.max(nearestIndex() - 1, 0)); });
navNext.addEventListener('click', function () { center(Math.min(nearestIndex() + 1, cards.length - 1)); });

function syncNav() {
  var i = nearestIndex();
  navPrev.disabled = i <= 0;
  navNext.disabled = i >= cards.length - 1;
}

document.addEventListener('keydown', function (e) {
  if (document.getElementById('viewer').classList.contains('on')) {
    if (e.key === 'Escape') closeViewer();
    else if (e.key === 'ArrowLeft') stepViewer(-1);
    else if (e.key === 'ArrowRight') stepViewer(1);
    return;
  }
  if (overview) { if (e.key === 'Escape') setMode(false); return; }
  var nextKey = VERT ? 'ArrowDown' : 'ArrowRight';
  var prevKey = VERT ? 'ArrowUp' : 'ArrowLeft';
  if (e.key === nextKey) { e.preventDefault(); center(Math.min(nearestIndex() + 1, cards.length - 1)); }
  if (e.key === prevKey) { e.preventDefault(); center(Math.max(nearestIndex() - 1, 0)); }
});

/* ---------- 进入 / 退出 ---------- */
var viewer = document.getElementById('viewer');
var frame = document.getElementById('frame');
var veil = document.getElementById('veil');
var vIndex = 0;
var openedFromGrid = false;   // 是从总览点开的吗

function open(id) {
  var i = WORKS.findIndex(function (x) { return x.id === id; });
  if (i < 0) return;
  if (!SRC[id]) {                       // 数据不完整时不要打开空白页
    console.warn('[diorama] 缺少源码路径：', id);
    return;
  }
  var wasOpen = viewer.classList.contains('on');
  vIndex = i;
  openedFromGrid = overview;
  /* 竖屏手机保留 iOS 式卡片放大；横屏与桌面一致，直接淡入查看器。
     横屏的 iframe 是 cover 裁切尺寸，再叠克隆放大容易产生一帧抽搐。 */
  var launchDone = (!wasOpen && isTouch && VERT && !reduce) ? launchFromCard(cards[i].el) : null;
  paintViewer();
  veil.style.transition = '';
  veil.classList.remove('off');
  viewer.classList.add('on');
  requestAnimationFrame(function () { viewer.classList.add('shown'); });
  frame.src = SRC[id];
  frame.onload = function () {
    setTimeout(function () {
      if (launchDone) {
        /* 场景已就绪，加载页直接撤掉（不要和克隆层交叉淡出，否则会透出底色） */
        veil.style.transition = 'none';
        veil.classList.add('off');
        setTimeout(launchDone, 80);
      } else {
        veil.classList.add('off');
      }
    }, 240);
    if (soundOn) setTimeout(applySoundToScene, 600);   // 场景就绪后再尝试起声
  };
  if (launchDone) setTimeout(launchDone, 4200);   // 兜底：场景迟迟不全也不一直挡着
  if (history.replaceState) history.replaceState(null, '', '#' + id);
}

/* 类似 iOS 打开 App：卡片图从原位置放大到全屏，再交给场景 */
function launchFromCard(cardEl) {
  if (!cardEl) return null;
  var img = cardEl.querySelector('img');
  if (!img || !img.complete || !img.naturalWidth) return null;
  var r = cardEl.getBoundingClientRect();
  if (r.width < 40 || r.height < 20) return null;
  var vv0 = window.visualViewport;
  var vw0 = vv0 ? vv0.width : innerWidth, vh0 = vv0 ? vv0.height : innerHeight;
  var vt0 = vv0 ? vv0.offsetTop : 0, vl0 = vv0 ? vv0.offsetLeft : 0;
  if (r.bottom < vt0 || r.top > vt0 + vh0 || r.right < vl0 || r.left > vl0 + vw0) return null;

  var cs = getComputedStyle(cardEl);
  var clone = document.createElement('div');
  clone.className = 'launch';
  clone.style.left = r.left + 'px';
  clone.style.top = r.top + 'px';
  clone.style.width = r.width + 'px';
  clone.style.height = r.height + 'px';
  clone.style.borderRadius = cs.borderRadius;

  /* 打开动画用作品名 + 卡片主色打底，不放大图片 */
  var titleEl = cardEl.querySelector('.card-title');
  var titleText = titleEl ? titleEl.textContent : (cardEl.dataset.id || '');
  function lumOf(im) {
    try {
      var c = document.createElement('canvas'); c.width = c.height = 16;
      var x = c.getContext('2d'); x.drawImage(im, 0, 0, 16, 16);
      var d = x.getImageData(0, 0, 16, 16).data, sum = 0;
      for (var i = 0; i < d.length; i += 4) {
        sum += 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
      }
      return sum / (d.length / 4) / 255;
    } catch (e) { return 0.42; }
  }
  var light = lumOf(img) > 0.55;
  clone.style.background = light ? '#eef0f4' : '#0b0e14';
  clone.style.color = light ? '#171a21' : '#f5f6f8';
  if (light) clone.classList.add('light');
  var launchTitle = document.createElement('div');
  launchTitle.className = 'launch-title';
  launchTitle.textContent = titleText;
  clone.appendChild(launchTitle);

  var dim = document.createElement('div');
  dim.className = 'launch-dim';
  document.body.appendChild(dim);
  document.body.appendChild(clone);
  document.body.classList.add('launching');
  requestAnimationFrame(function () { dim.classList.add('on'); });

  var scale = Math.max(vw0 / r.width, vh0 / r.height);
  var dx = vl0 + vw0 / 2 - (r.left + r.width / 2);
  var dy = vt0 + vh0 / 2 - (r.top + r.height / 2);
  /* 克隆层整体会被放大到全屏，标题必须反向缩放，否则气泡会跟着放大好几倍 */
  launchTitle.style.transform = 'translate(-50%,-50%) scale(' + (1 / scale) + ')';
  var anim = null;
  try {
    anim = clone.animate([
      { transform: 'translate(0px,0px) scale(1)', borderRadius: cs.borderRadius, offset: 0 },
      { transform: 'translate(' + (dx * 0.82) + 'px,' + (dy * 0.82) + 'px) scale(' + (scale * 1.012) + ')',
        borderRadius: '14px', offset: 0.72 },
      { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + scale + ')', borderRadius: '0px', offset: 1 }
    ], { duration: 620, easing: 'cubic-bezier(.2,.88,.2,1)', fill: 'forwards' });
  } catch (e) {}

  var finished = false, animDone = !anim, asked = false;
  function fadeNow() {
    if (finished) return;
    finished = true;
    clone.style.transition = 'opacity .26s ease';
    dim.style.transition = 'opacity .26s ease';
    clone.style.opacity = '0';
    dim.style.opacity = '0';
    document.body.classList.remove('launching');
    setTimeout(function () { clone.remove(); dim.remove(); }, 300);
  }
  function maybe() { if (asked && animDone) fadeNow(); }
  if (anim) anim.onfinish = function () { animDone = true; maybe(); };
  setTimeout(function () { animDone = true; maybe(); }, 900);

  /* 返回一个「可以交棒了」的闭包：等 iframe 出画后再淡出，
     这样放大过程中不会露出后面的白色加载页 */
  return function () {
    if (!clone.isConnected) { finished = true; return; }
    asked = true;
    maybe();
  };
}

function paintViewer() {
  var w = WORKS[vIndex];
  document.getElementById('vEn').textContent = w.en;
  document.getElementById('vname').textContent = w.en;
  document.getElementById('vCn').textContent = w.cn;
  syncSceneCover();
}

function syncSceneCover() {
  if (!viewer) return;
  var vw = viewer.clientWidth || innerWidth;
  var vh = viewer.clientHeight || innerHeight;
  var s = Math.max(vw / 1280, vh / 720);
  viewer.style.setProperty('--scene-cover', s.toFixed(4));
}

function stepViewer(d) {
  vIndex = (vIndex + d + WORKS.length) % WORKS.length;
  frame.src = SRC[WORKS[vIndex].id];
  paintViewer();
  if (history.replaceState) history.replaceState(null, '', '#' + WORKS[vIndex].id);
}

function closeViewer() {
  /* 进场动画还没跑完就返回时，先把克隆层清掉 */
  document.querySelectorAll('.launch,.launch-dim').forEach(function (el) { el.remove(); });
  document.body.classList.remove('launching');
  /* 场景里翻过页的话，回到展厅要停在最后看的那一件上 */
  var backTo = vIndex;
  viewer.classList.remove('shown');
  if (history.replaceState) history.replaceState(null, '', location.pathname);
  setTimeout(function () {
    viewer.classList.remove('on');
    frame.src = 'about:blank';
    veil.classList.remove('off');
    lastFocus = backTo;
    if (openedFromGrid) {
      /* 从总览点开的：回到总览，并滚到刚才那一件 */
      overview = false;            // 让 setMode 认为是"进入"
      setMode(true);
    } else {
      jumpTo(backTo);
      track.style.scrollSnapType = '';
      current = -1;
      layout();
    }
    openedFromGrid = false;
  }, 400);
}

document.getElementById('vClose').addEventListener('click', closeViewer);
document.getElementById('vPrev').addEventListener('click', function () { stepViewer(-1); });
document.getElementById('vNext').addEventListener('click', function () { stepViewer(1); });

/* ---------- 总览：一次连续的位移+缩放，不切镜头 ---------- */
var transitioning = false;

function jumpTo(i) {
  track.style.scrollSnapType = 'none';
  if (VERT) {
    track.scrollLeft = 0;
    track.scrollTop = cards[i].el.offsetTop + cards[i].el.offsetHeight / 2 - track.clientHeight / 2;
  } else {
    track.scrollTop = 0;
    track.scrollLeft = cards[i].el.offsetLeft + cards[i].el.offsetWidth / 2 - track.clientWidth / 2;
  }
}

/* ---------- 竖屏的上下留白：让首尾卡片也能停在正中 ---------- */
function syncVerticalPad() {
  if (!VERT || overview) return;
  var h = cards[0] ? cards[0].el.offsetHeight : 0;
  var pad = Math.max(10, Math.round((track.clientHeight - h) / 2));
  track.style.paddingTop = pad + 'px';
  track.style.paddingBottom = pad + 'px';
}

/* 现在手机卡片也放大到 92vw，统一用 1200 宽的墙图保证清晰度；
   旧的 thumbs 逻辑保留为空函数，后续要省流量时可以在这里切回来 */
function syncImgTier() { return; }

/* ---------- 轴向切换（旋转屏幕 / 改变窗口宽度） ---------- */
var axisRaf = 0;
function syncAxis(force) {
  var v = mqVert.matches;
  isTouch = mqTouch.matches;
  if (!force && v === VERT) {
    syncImgTier();
    if (!overview) syncVerticalPad();
    return;
  }
  var idx = current >= 0 ? current : nearestIndex();
  VERT = v;
  document.body.classList.toggle('mode-vertical', v);
  cards.forEach(function (c) {
    c.el.style.transform = '';
    c.el.style.opacity = '';
    c.el.style.zIndex = '';
  });
  if (!v) {
    track.style.paddingTop = '';
    track.style.paddingBottom = '';
  }
  if (overview) {
    syncImgTier();
    if (v) syncVerticalPad();
    return;
  }
  cancelAnimationFrame(axisRaf);
  axisRaf = requestAnimationFrame(function () {
    syncImgTier();
    if (VERT) syncVerticalPad();
    jumpTo(Math.max(0, Math.min(cards.length - 1, idx)));
    current = -1;
    layout();
    syncVerticalPad();
    setTimeout(function () { track.style.scrollSnapType = ''; }, 80);
  });
}

function setMode(toGrid, focusIndex) {
  /* 动画进行中 + 结束后 300ms 的冷却期，都忽略点击 */
  if (transitioning || performance.now() < settleAt) return;
  transitioning = true;

  /* 若进场动画还在跑（刚打开页面就点总览），先取消——
     它带着 fill:'both' 会一直覆盖卡片的 transform，和 FLIP 打架，
     表现出来就是卡片被拽着走。 */
  if (introAnims.length) {
    introAnims.forEach(function (a) { try { a.cancel(); } catch (e) {} });
    introAnims = [];
  }

  var els = cards.map(function (c) { return c.el; });

  /* 0. 先停住滚动。若上一次翻页的平滑滚动还没走完就点了总览，
        起点会量在半路上，动画就会先走错方向再被拽回来。 */
  track.scrollTo({ left: track.scrollLeft, top: track.scrollTop, behavior: 'instant' });
  void track.offsetWidth;

  /* 1. 记录起点：用 offsetLeft/Width —— 布局坐标，不含 3D 变换。
      getBoundingClientRect() 拿到的是旋转+缩放后的外接矩形，宽高比已经变形，
      sx≠sy 会把卡片压扁并飞到错误位置。 */
  var g0 = els.map(function (el) {
    return { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight };
  });
  var t0 = els.map(function (el) { return el.style.transform || 'none'; });
  var op0 = els.map(function (el) { return parseFloat(getComputedStyle(el).opacity) || 0; });
  var scroll0 = track.scrollLeft;   // offsetLeft 是相对内容原点，必须扣掉滚动量
  var box0 = track.getBoundingClientRect();   // 切换前后 track 自身也会移动（头部高度变了）
  var top0 = track.scrollTop;

  document.body.classList.add('is-moving');
  els.forEach(function (el) { el.style.willChange = 'transform, opacity'; });

  /* 预选择优先：进入总览时直接取此刻真正居中的那张，
     不依赖 current（它在转场期间可能被置为 -1） */
  if (toGrid) lastFocus = nearestIndex();
  else if (typeof focusIndex !== 'number') focusIndex = overview ? gridFocusIndex() : lastFocus;

  /* 2. 切布局 */
  overview = toGrid;
  document.body.classList.toggle('mode-grid', toGrid);
  morphOvBtn(toGrid);
  els.forEach(function (el) { el.style.transform = ''; el.style.opacity = ''; });
  /* 网格用 CSS 自己的 padding；竖屏的上下留白是 inline 的，切走时要清掉 */
  if (toGrid) { track.style.paddingTop = ''; track.style.paddingBottom = ''; }

  void track.offsetWidth;

  /* 退出总览时以"视野中心那一块"为准，而不是进入时的位置 */
  function gridFocusIndex() {
    var tr = track.getBoundingClientRect();
    var mid = tr.top + tr.height / 2;
    var best = 0, bd = Infinity;
    cards.forEach(function (c, i) {
      var r = c.el.getBoundingClientRect();
      var d = Math.abs((r.top + r.height / 2) - mid);
      if (d < bd) { bd = d; best = i; }
    });
    return best;
  }

  var wantTop = null;

  if (toGrid) {
    /* 图片多了以后网格会超出一屏：进总览时直接停在预选择那张附近，
       不要每次都回到最上面 */
    var sEl = els[lastFocus];
    /* ?noscroll=1 可以关掉"滚到选中项"，用来排查进场动画被拽一下的问题 */
    var noScroll = /[?&]noscroll=1/.test(location.search);
    if (!noScroll && sEl) {
      /* 刚切成网格时 scrollHeight 可能还没算好，滚一次会被夹回 0。
         先算一版，下一帧再用最终的 scrollHeight 校正一次。 */
      wantTop = function () {
        var maxTop = Math.max(0, track.scrollHeight - track.clientHeight);
        var want = sEl.offsetTop - (track.clientHeight - sEl.offsetHeight) / 2;
        return Math.max(0, Math.min(want, maxTop));
      };
      track.scrollTop = wantTop();
    }
    void track.offsetWidth;
  }

  if (!toGrid) {
    if (VERT) syncVerticalPad();
    jumpTo(focusIndex);
    void track.offsetWidth;
    transitioning = false;
    current = -1;
    layout();
    transitioning = true;
  }

  /* 3. 记录终点：布局矩形 + 目标变换 */
  var g1 = els.map(function (el) {
    return { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight };
  });
  var scroll1 = track.scrollLeft;
  var top1 = track.scrollTop;
  var box1 = track.getBoundingClientRect();
  var t1 = els.map(function (el) { return el.style.transform || 'none'; });
  var op1 = els.map(function (el) { return el.style.opacity ? parseFloat(el.style.opacity) : 1; });

  function compose(dx, dy, sx, sy, base) {
    var head = 'translate(' + dx.toFixed(2) + 'px,' + dy.toFixed(2) + 'px) scale(' + sx.toFixed(4) + ',' + sy.toFixed(4) + ')';
    return (base && base !== 'none') ? head + ' ' + base : head;
  }

  /* 4. 动画 */
  var rv0 = 18, rv1 = 18;   // 横向与总览同一圆角，转场不再变形
  anims = [];
  var vw = window.innerWidth, vh = window.innerHeight;
  var sel = toGrid ? lastFocus : focusIndex;      // 当前选中的那一张

  /* 四套飞入策略，每次进入总览随机选一套。
     用同一套能让整场转场保持统一的'镜头语言'，换套则每次开箱不一样。 */
  var ENTRIES = ['side', 'vertical', 'diagonal', 'bloom'];
  var entry = ENTRIES[Math.floor(Math.random() * ENTRIES.length)];

  /* 返回预选有三套：0 原版 FLIP、1 中心放大泛光、2 上方落入。每次返回随机抽一套 */
  var retVar = toGrid ? 0 : Math.floor(Math.random() * 3);

  els.forEach(function (el, i) {
    var dx, dy, sx, sy, base = t0[i], op = op0[i], delay = 0, culled = false;

    if (toGrid && i !== sel) {
      /* 其余卡片：按本次抽到的策略从画外飞入 */
      var sgn = Math.random() < 0.5 ? -1 : 1;
      if (entry === 'vertical') {                 // 上下
        dy = sgn * (vh * 0.5 + Math.random() * vh * 0.4);
        dx = (Math.random() - 0.5) * 160;
        sx = 0.9;
      } else if (entry === 'diagonal') {          // 斜角
        dx = sgn * (vw * 0.4 + Math.random() * vw * 0.3);
        dy = (Math.random() < 0.5 ? -1 : 1) * (vh * 0.34 + Math.random() * vh * 0.28);
        sx = 0.86;
      } else if (entry === 'bloom') {             // 原地放大淡入
        dx = 0; dy = 0;
        sx = 0.55 + Math.random() * 0.12;
      } else {                                    // 左右（默认）
        dx = sgn * (vw * 0.42 + Math.random() * vw * 0.38);
        dy = (Math.random() - 0.5) * 150;
        sx = 0.9;
      }
      sy = sx;
      base = 'none';
      op = 0;
      delay = Math.random() * (entry === 'bloom' ? 220 : 120);
    } else if (!toGrid && i !== sel && Math.abs(g1[i].x + g1[i].w / 2 - scroll1 + box1.left - vw / 2) > vw * 0.7) {
      /* 返回时，终点在画面外的卡片不横穿屏幕——原地缩小淡出即可，
         否则十几张同时掠过，选中那张的"一镜"就被淹没了 */
      dx = 0; dy = 0; sx = 1; sy = 1;
      base = 'none';
      culled = true;
    } else {
      /* 选中的那张：直接归位。
         用"中心点"算位移（宽度变了，左右边缘差和中心差不是一回事），
         并扣掉两端的滚动量（offsetLeft 含滚动偏移，纵向没有滚动）。 */
      dx = (g0[i].x + g0[i].w / 2 - scroll0 + box0.left) - (g1[i].x + g1[i].w / 2 - scroll1 + box1.left);
      dy = (g0[i].y + g0[i].h / 2 - top0 + box0.top) - (g1[i].y + g1[i].h / 2 - top1 + box1.top);
      if (toGrid) base = 'none';   // 进总览时两端都保持纯 translate+scale，避免矩阵插值走弯路
      sx = g0[i].w / Math.max(g1[i].w, 1);
      sy = sx;      // 统一缩放比 —— 横向 16:9 与网格 16:9 仍会有零点几个百分点误差,
                    // 分别取 sx/sy 会让卡片在动画中轻微变形（"抽一下"）
    }

    el.style.zIndex = (i === sel) ? 6 : 2;

    var moving = Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5 ||
                 Math.abs(sx - 1) > 0.004 || Math.abs(sy - 1) > 0.004;
    var turn = base !== t1[i];
    var faded = Math.abs(op - op1[i]) > 0.01;
    if (!moving && !turn && !faded) return;

    var isSel = (i === sel);
    var endOp = culled ? 0 : op1[i];
    /* 返回时按离选中卡片的距离分组，选中的先走，其余分波次跟上 */
    if (!toGrid) delay = isSel ? 0 : Math.min(260, 35 + Math.abs(i - sel) * 28);
    var dur = culled ? 420 : (isSel ? 900 : 820);
    /* 选中的那张起手就快速收缩：它被放大到 3.4 倍时是一块深色大矩形，
       若慢起手会在第一行上方停留很久，把那排全遮住 */
    var ease = culled ? 'ease-out' : (isSel ? 'cubic-bezier(.14,.92,.22,1)' : 'cubic-bezier(.22,.8,.24,1)');
    /* 圆角会随 scale 一起缩放：元素放大 3.36 倍时，46px 在屏幕上是 154px。
       起始帧按缩放倍数反向补偿，视觉圆角才稳定。 */
    var sc0 = Math.max(Math.abs(sx), Math.abs(sy), 0.02);
    var cssR0 = Math.max(2, rv0 / sc0);
    var frames;
    if (toGrid && i !== sel) {
      /* 飞入的卡片：前半程保持全透明，接近落位才显现。
         否则 20 张半透明的卡同时在浅色背景上滑过，
         会形成一片片"把画面割开"的淡色矩形。 */
      var midS = sx + (1 - sx) * 0.7;
      var midTf = compose(dx * 0.3, dy * 0.3, midS, midS, base);
      /* 中段圆角必须跟着当时的缩放一起补偿。此前沿用起始帧的值，
         bloom（0.55 倍起）现身时缩放已到 0.93，视觉圆角会先大一圈再突然收小。 */
      var midRv = rv0 + (rv1 - rv0) * 0.7;
      var midR = Math.max(2, midRv / Math.max(midS, 0.02));
      frames = [
        { transform: compose(dx, dy, sx, sy, base), opacity: 0, offset: 0 },
        { transform: midTf, opacity: 0, offset: 0.68 },
        /* 终点写成与起点同构的 translate+scale（不是 none），
           保证逐函数插值——否则浏览器会退回矩阵插值，路径会拐弯 */
        { transform: 'translate(0px,0px) scale(1,1)', opacity: 1, offset: 1 }
      ];
    } else {
      frames = [
        { transform: compose(dx, dy, sx, sy, base), opacity: op, offset: 0 },
        { transform: culled ? 'scale(0.88)'
                           : (t1[i] === 'none'
                                ? (toGrid ? 'translate(0px,0px) scale(1,1)' : 'none')
                                : t1[i]),
          opacity: endOp, offset: 1 }
      ];

      /* 返回时只让选中的那张完整落位；其余卡片原地快速淡出，
         不再跟着做全尺寸 FLIP，减少合成层和卡顿 */
      if (!toGrid && !isSel) {
        /* 其余卡片从左右两侧飞入轮播位置：只做横向偏移+淡入，
           不参与选中卡片的完整 FLIP，避免中途换位错乱 */
        var otherEnd = t1[i] === 'none' ? 'translateX(0px)' : t1[i];
        var dir = i < sel ? -1 : 1;
        var otherStart = 'translateX(' + (dir * 260) + 'px) ' +
                         (t1[i] === 'none' ? '' : t1[i]);
        frames = [
          { transform: otherStart, opacity: 0, offset: 0 },
          { transform: otherEnd, opacity: op1[i], offset: 1 }
        ];
        dur = 650;
        delay = Math.min(140, Math.abs(i - sel) * 16);
        ease = 'cubic-bezier(.22,.8,.24,1)';
        el.style.transform = otherStart;
        el.style.opacity = '0';
        el.style.zIndex = '';
      }
      /* 返回时只给选中的那一张换入场轨迹，其余卡片仍按原版归位 */
      if (!toGrid && isSel && !culled) {
        var endTf = frames[1].transform;
        if (retVar === 1) {
          /* 从网格中心先微微收一下，再放大泛光落位 */
          frames = [
            { transform: compose(dx, dy, sx * 0.55, sy * 0.55, base), opacity: 0.1, offset: 0 },
            { transform: compose(dx * 0.45, dy * 0.45, sx * 1.16, sy * 1.16, base), opacity: 1, offset: 0.62 },
            { transform: endTf, opacity: 1, offset: 1 }
          ];
          ease = 'cubic-bezier(.22,1,.3,1)';
        } else if (retVar === 2) {
          /* 从上方 120px 落入主卡位置 */
          frames = [
            { transform: compose(dx, dy - 220, sx * 0.8, sy * 0.8, base), opacity: 0.2, offset: 0 },
            { transform: endTf, opacity: 1, offset: 1 }
          ];
          ease = 'cubic-bezier(.16,.84,.24,1)';
        }
      }
    }
    el.style.transform = frames[0].transform;          // 先把起点落到内联，避免中间帧闪一下
    if (frames[0].opacity !== undefined) el.style.opacity = String(frames[0].opacity);
    anims.push(el.animate(frames, { duration: dur, delay: delay, easing: ease, fill: 'both' }));
  });

  Promise.all(anims.map(function (a) { return a.finished.catch(function () {}); })).then(function () {
    anims.forEach(function (a) { a.cancel(); });
    anims = [];
    els.forEach(function (el) {
      el.style.transform = '';        // 清掉为防闪而写的起点
      el.style.opacity = '';
      el.style.willChange = '';
      el.style.zIndex = '';
    });
    transitioning = false;                       // 必须先解锁，否则下面的 layout() 会被拦掉
    if (!toGrid) { track.style.scrollSnapType = ''; current = -1; layout(); }
    /* 等换字动画（.swap，140ms）在隐形状态下走完再淡入，
       否则头部的淡入和标题的闪换叠在一起，看起来就是"闪一下" */
    settleAt = performance.now() + 300;   // 冷却期
    setTimeout(function () { document.body.classList.remove('is-moving'); }, 170);
  });
}

document.getElementById('ovBtn').addEventListener('click', function () { setMode(!overview); });

/* ---------- 总览按钮：宽高随文案平滑变形 ---------- */
var ovBtnEl = document.getElementById('ovBtn');
var ovLabelEl = document.getElementById('ovLabel');

function morphOvBtn(toGrid) {
  /* 总览里只要图案：隐藏文字，按钮变成 44px 圆形；
     卡片模式恢复 All Works 文字，宽度交给内容自适应 */
  ovLabelEl.textContent = toGrid ? 'Back' : 'All Works';
  ovLabelEl.style.opacity = '1';
  ovBtnEl.style.width = '';
  ovBtnEl.setAttribute('aria-label', toGrid ? 'Back to gallery' : 'Show all works');
}

/* ---------- 音效总开关（横向页面底部正中） ---------- */
var sndBtn = document.getElementById('sndBtn');
var sndIco = document.getElementById('sndIco');

var soundOn = localStorage.getItem('gallery-sound') === '1';

function paintSound() {
  sndBtn.classList.toggle('on', soundOn);
  sndBtn.title = soundOn ? 'Ambience on — click to mute' : 'Click to enable ambience';
}

/* 向当前场景注入意图；场景是 same-origin，可直接调它的 Ambience */
function applySoundToScene() {
  /* 优先用画廊自己窗口里的完整环境声库：
     真实用户手势发生在 parent，iframe 里的 AudioContext 在 iOS 上可能永远解不开。 */
  var host = window.Ambience;
  var work = WORKS[vIndex];
  if (host && host.play && work) {
    try {
      if (soundOn) {
        if (window.__hostAudio) { try { window.__hostAudio.stop(); } catch (e) {} }
        window.__hostAudio = host.play(work.id);
      } else if (window.__hostAudio) {
        try { window.__hostAudio.stop(); } catch (e) {}
        window.__hostAudio = null;
      }
      return true;
    } catch (e) {}
  }
  var w = frame && frame.contentWindow;
  if (!w || !w.Ambience) return false;
  try {
    var A = w.Ambience;
    if (soundOn) {
      var st = (A.state && A.state()) || {};
      if (A.play && st.preset) {
        if (w.__galleryAudio) { try { w.__galleryAudio.stop(); } catch (e) {} }
        w.__galleryAudio = A.play(st.preset);
        return true;
      }
      if (A.on) A.on(); else if (A.start) A.start();
    } else {
      if (w.__galleryAudio) { try { w.__galleryAudio.stop(); } catch (e) {} w.__galleryAudio = null; }
      if (A.off) A.off();
      if (A.stopAll) A.stopAll();
    }
    return true;
  } catch (e) { return false; }
}

function audioBeep() {
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    var c = new AC();
    if (c.state === 'suspended') c.resume();
    var o = c.createOscillator(), g = c.createGain();
    o.frequency.value = 523.25;
    g.gain.value = 0.05;
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + 0.15);
  } catch (e) {}
}

sndBtn.addEventListener('click', function () {
  soundOn = !soundOn;
  localStorage.setItem('gallery-sound', soundOn ? '1' : '0');
  paintSound();
  applySoundToScene();
  if (soundOn && /(?:^|[?&])audiotest=1/.test(location.search)) audioBeep();
});

/* ---------- 截屏：优先抓当前场景 canvas，抓不到就退回该作品的墙图 ---------- */
var toastEl = document.getElementById('toast');
var toastTimer = 0;
function galleryToast(msg) {
  if (!toastEl) return;
  toastEl.textContent = msg;
  toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.classList.remove('on'); }, 1600);
}

function captureSceneShot() {
  var w = WORKS[vIndex];
  if (!w) return;
  var live = null;
  try {
    var doc = frame.contentDocument;
    if (doc) {
      var list = Array.prototype.slice.call(doc.querySelectorAll('canvas'));
      list.sort(function (a, b) { return b.width * b.height - a.width * a.height; });
      for (var i = 0; i < list.length; i++) {
        try {
          var u = list[i].toDataURL('image/png');
          if (u && u.length > 8000) { live = u; break; }
        } catch (e) {}
      }
    }
  } catch (e) {}

  var fallback = 'previews/wall/' + w.id + '.jpg';
  function compose(src) {
  var img = new Image();
  img.onload = function () {
    var W = 1600, H = 900;
    var c = document.createElement('canvas');
    c.width = W; c.height = H;
    var x = c.getContext('2d');
    x.fillStyle = '#05060a'; x.fillRect(0, 0, W, H);
    var s = Math.max(W / img.width, H / img.height);
    var dw = img.width * s, dh = img.height * s;
    x.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);

    var g = x.createLinearGradient(0, H - 190, 0, H);
    g.addColorStop(0, 'rgba(3,4,7,0)');
    g.addColorStop(1, 'rgba(3,4,7,.78)');
    x.fillStyle = g; x.fillRect(0, H - 190, W, 190);

    x.textAlign = 'center';
    x.fillStyle = 'rgba(255,255,255,.94)';
    x.font = '500 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';
    x.fillText(w.en, W / 2, H - 62);
    x.fillStyle = 'rgba(255,255,255,.55)';
    x.font = '500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';
    x.fillText('DEEPSEEK GALLERY', W / 2, H - 28);

    c.toBlob(function (blob) {
      if (!blob) { galleryToast('Save failed'); return; }
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'deepseek-gallery-' + w.id + '.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
      galleryToast('Saved');
    }, 'image/png');
  };
  img.onerror = function () { galleryToast('Save failed'); };
  img.src = src;
  }

  /* WebGL canvas 在多数场景下 toDataURL 是黑的；先抽样判断，黑图就退回干净的墙图 */
  function useLive(url) {
    if (!url) { compose(fallback); return; }
    var probe = new Image();
    probe.onload = function () {
      try {
        var c = document.createElement('canvas'); c.width = 24; c.height = 14;
        var x = c.getContext('2d'); x.drawImage(probe, 0, 0, 24, 14);
        var d = x.getImageData(0, 0, 24, 14).data, sum = 0, n = 0;
        for (var i = 0; i < d.length; i += 4) { sum += d[i] + d[i + 1] + d[i + 2]; n++; }
        compose((n && sum / n > 22) ? url : fallback);
      } catch (e) { compose(fallback); }
    };
    probe.onerror = function () { compose(fallback); };
    probe.src = url;
  }
  useLive(live);
}

document.getElementById('shotBtn').addEventListener('click', captureSceneShot);

paintSound();

/* ---------- 名片：点击云朵，以它为圆心展开 ---------- */
var cardveil = document.getElementById('cardveil');

function openCard() {
  var btn = document.getElementById('creditBtn');
  var r = btn.getBoundingClientRect();
  var vr = cardveil.getBoundingClientRect();
  var cx = r.left + r.width / 2 - vr.left, cy = r.top + r.height / 2 - vr.top;
  cardveil.style.setProperty('--cx', Math.round(cx) + 'px');
  cardveil.style.setProperty('--cy', Math.round(cy) + 'px');
  /* 圆足够大，最远那个角也要盖住（120px 的圆 * scale） */
  var vv1 = window.visualViewport;
  var vw1 = vv1 ? vv1.width : innerWidth, vh1 = vv1 ? vv1.height : innerHeight;
  var far = Math.hypot(Math.max(cx, vw1 - cx), Math.max(cy, vh1 - cy));
  cardveil.style.setProperty('--s', (far * 2 / 120 + 1).toFixed(2));
  cardveil.classList.remove('closing');
  cardveil.classList.add('on');
  void cardveil.offsetWidth;          // 强制一次布局，避免首帧直接画到终态（闪烁）
  cardveil.classList.add('open');
}

function closeCard() {
  cardveil.classList.add('closing');
  cardveil.classList.remove('open');
  setTimeout(function () {
    if (!cardveil.classList.contains('closing')) return;   // 期间又打开了，别把新名片关掉
    cardveil.classList.remove('on');
    cardveil.classList.remove('closing');
  }, 620);
}

document.getElementById('creditBtn').addEventListener('click', openCard);
document.getElementById('cclose').addEventListener('click', closeCard);
/* 点哪儿都收起；点在链接上时链接照常打开（不 preventDefault） */
cardveil.addEventListener('click', function () { closeCard(); });
/* 横屏名片内部需要滚动/点链接，点名片本体不要顺手关掉 */
document.querySelector('.cardbox').addEventListener('click', function (e) { e.stopPropagation(); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && cardveil.classList.contains('on')) closeCard();
});

/* ---------- 主题 ---------- */
var themeBtn = document.getElementById('themeBtn');
var darkOn = localStorage.getItem('gallery-theme') === 'dark';
var ICON_MOON = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.2 14.6A8.6 8.6 0 1 1 9.4 3.8a7 7 0 0 0 10.8 10.8z"/></svg>';
var ICON_SUN  = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.8v2.3M12 18.9v2.3M2.8 12h2.3M18.9 12h2.3M5.5 5.5l1.6 1.6M16.9 16.9l1.6 1.6M18.5 5.5l-1.6 1.6M7.1 16.9l-1.6 1.6"/></svg>';

function paintTheme() {
  document.body.classList.toggle('dark', darkOn);
  themeBtn.innerHTML = darkOn ? ICON_SUN : ICON_MOON;   /* 暗色时显示太阳（可切回） */
  themeBtn.title = darkOn ? 'Switch to light' : 'Switch to dark';
  var tc = document.getElementById('themeColor');
  if (tc) tc.setAttribute('content', darkOn ? '#05060a' : '#ffffff');
  /* 连同 html 一起换底，Chrome iOS 横屏两侧的留白也跟随主题，不会闪白 */
  document.documentElement.style.background = darkOn ? '#05060a' : '#ffffff';
}
themeBtn.addEventListener('click', function () {
  darkOn = !darkOn;
  localStorage.setItem('gallery-theme', darkOn ? 'dark' : 'light');
  paintTheme();
});
paintTheme();

/* ---------- 禁止复制与拖拽 ---------- */
document.addEventListener('dragstart', function (e) { e.preventDefault(); }, true);
document.addEventListener('copy', function (e) { e.preventDefault(); });
document.addEventListener('cut', function (e) { e.preventDefault(); });
document.addEventListener('selectstart', function (e) {
  /* 输入框之类仍然允许选中 */
  if (e.target && /input|textarea/i.test(e.target.tagName)) return;
  e.preventDefault();
}, true);
/* 双指缩放、长按菜单、双击缩放也关掉；viewer 里的场景在 iframe 内不受影响 */
['gesturestart', 'gesturechange', 'gestureend'].forEach(function (n) {
  document.addEventListener(n, function (e) { e.preventDefault(); }, { passive: false });
});
document.addEventListener('contextmenu', function (e) {
  if (e.target && /input|textarea/i.test(e.target.tagName)) return;
  e.preventDefault();
}, { passive: false });
document.addEventListener('dblclick', function (e) {
  if (e.target && /input|textarea/i.test(e.target.tagName)) return;
  e.preventDefault();
}, { passive: false });

/* ---------- 启动 ---------- */
/* 进场：整个展廊淡入放大，卡片按离中心的距离依次浮现 */
function playIntro() {
  var sel = nearestIndex();
  try {
    /* 选中那张从下方升起；它左边的从左侧飞入、右边的从右侧飞入；
       标题单独渐显。终点一律取内联样式，收尾不跳。 */
    cards.forEach(function (c, i) {
      var d = i - sel;
      var base = c.el.style.transform || 'none';
      var endOp = c.el.style.opacity ? parseFloat(c.el.style.opacity) : 1;
      var dx = 0, dy = 0, introScale = 1;

      if (VERT) {
        /* 竖屏入场：主卡从下方升起，上下两张从外侧向中间挤进来 */
        if (d === 0) {
          dy = Math.min(window.innerHeight * 0.12, 100);
          introScale = 0.97;
        } else {
          var ad = Math.min(Math.abs(d), 4);
          dy = (d < 0 ? -1 : 1) * (55 + ad * 26);
          introScale = 0.87;
        }
      } else if (d === 0) {
        dy = Math.min(window.innerHeight * 0.22, 200);        // 从下往上
      } else {
        dx = (d < 0 ? -1 : 1) * (130 + Math.min(Math.abs(d), 7) * 92);   // 左右分侧
        dy = 46;
      }

      var start = 'translate(' + dx + 'px,' + dy + 'px)' +
                  (introScale !== 1 ? ' scale(' + introScale + ')' : '') +
                  (base !== 'none' ? ' ' + base : '');
      var a = c.el.animate([
        { transform: start, opacity: 0 },
        { transform: base, opacity: endOp }
      ], {
        duration: 720,
        delay: Math.min(Math.abs(d) * 38, 260),
        easing: 'cubic-bezier(.22,.8,.24,1)',
        fill: 'both'
      });
      introAnims.push(a);
      a.onfinish = function () { a.cancel(); };
    });

    var head = document.querySelector('.head');
    var h = head.animate([{ opacity: 0 }, { opacity: 1 }],
      { duration: 720, delay: 260, easing: 'ease-out', fill: 'both' });
    introAnims.push(h); h.onfinish = function () { h.cancel(); };

    var bar = document.querySelector('.bar');
    var b2 = bar.animate([{ opacity: 0 }, { opacity: 1 }],
      { duration: 620, delay: 640, easing: 'ease-out', fill: 'both' });
    introAnims.push(b2); b2.onfinish = function () { b2.cancel(); };
  } catch (e) {}
}

/* 启动自检：新增作品时漏掉任何一处，控制台会直接指出 */
function selfCheck() {
  var problems = [];
  var seen = {};
  WORKS.forEach(function (w) {
    if (seen[w.id]) problems.push('重复 id：' + w.id);
    seen[w.id] = 1;
    if (!SRC[w.id]) problems.push(w.id + ' 缺少 SRC 条目');
    if (!/^A\d\d$/.test(w.id)) problems.push(w.id + ' 命名不规范（应为 A00 形式）');
  });
  Object.keys(SRC).forEach(function (k) {
    if (!WORKS.some(function (w) { return w.id === k; })) problems.push(k + ' 在 SRC 里但没有对应作品');
  });
  if (problems.length) console.warn('[diorama] 数据自检发现 ' + problems.length + ' 个问题：\n' + problems.join('\n'));
  return problems;
}

function boot() {
  var id = location.hash.replace('#', '');
  selfCheck();

  if (id && SRC[id]) {
    syncVerticalPad();
    layout();
    document.body.classList.remove('booting');
    open(id);
    return;
  }

  /* 每次打开随机落在某一件上，而不是永远从第一张开始 */
  syncVerticalPad();
  jumpTo(Math.floor(Math.random() * cards.length));
  void track.offsetWidth;
  track.style.scrollSnapType = '';
  current = -1;
  layout();
  syncVerticalPad();

  /* 弱网时图片可能还没到。等当前这张和左右邻居就位（最多 1.6s）再放出， */
  /* 否则用户看到的是几张空框加上一段没有内容的进场动画。 */
  var sel = nearestIndex();
  var wait = cards.slice(Math.max(0, sel - 1), Math.min(cards.length, sel + 2))
                  .map(function (c) { return c.el.querySelector('img'); })
                  .filter(Boolean);
  var left = wait.length, settled = false;

  function reveal() {
    if (settled) return;
    settled = true;
    /* 图片加载/字体就位后滚动余量可能变化；入场前把当前卡精确对中，
       主卡才会以正面进入，侧卡从外侧往中间挤 */
    /* 横竖屏都在入场前精确对中，否则横屏的原生 snap 会把卡片再拽到别处 */
    var idx = nearestIndex();
    syncVerticalPad();
    jumpTo(idx);
    void track.offsetWidth;
    track.style.scrollSnapType = '';
    layout();
    syncVerticalPad();
    document.body.classList.remove('booting');
    playIntro();
  }
  var guard = setTimeout(reveal, 1600);
  if (!wait.length) { clearTimeout(guard); reveal(); return; }
  wait.forEach(function (im) {
    if (im.complete) { if (--left === 0) { clearTimeout(guard); reveal(); } return; }
    var tick = function () { if (--left === 0) { clearTimeout(guard); reveal(); } };
    im.addEventListener('load', tick, { once: true });
    im.addEventListener('error', tick, { once: true });
  });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
requestAnimationFrame(function () { syncVerticalPad(); layout(); });
setTimeout(function () { syncVerticalPad(); layout(); }, 240);

if (mqVert.addEventListener) mqVert.addEventListener('change', function () { syncAxis(); layout(); syncVerticalPad(); });
if (mqNarrow.addEventListener) mqNarrow.addEventListener('change', syncImgTier);
</script>
