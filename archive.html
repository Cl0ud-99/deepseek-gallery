const THEMES = ["全部","影视同人","影视风格","原创奇幻","科幻","现实复古","现实田园"];
const SORTS = [
  {k:"default", t:"默认顺序"},
  {k:"cost",    t:"开销 ↓"},
  {k:"costup",  t:"开销 ↑"}
];
const EDITS = [
  {k:"all",   t:"全部形态"},
  {k:"module",t:"模块化可改"},
  {k:"readable",t:"单文件可读"},
  {k:"locked",t:"成品锁死"}
];
const OPEN_LABEL = {direct:"双击即看", server:"需本地服务", net:"需联网"};
const LIVE_BASE = "https://cl0ud-99.github.io/deepseek-gallery/_extracted/";
const LIVE_PATH = {
  A01:"a01-twin-peaks-lodge/TwinPeaks-BlackLodge/TwinPeaks-BlackLodge.html",
  A02:"a02-ashtray-maze/ashtray-maze/standalone/ashtray-maze.html",
  A03:"a03-aurora-hourglass/aurora-hourglass/index.html",
  A04:"a04-autumn-farm/index.html",

  A16:"a16-route66-diner/route66-diner/index.html",

};
const liveUrl = d => LIVE_BASE + LIVE_PATH[d.code].split("/").map(encodeURIComponent).join("/");
const EDIT_LABEL = {module:"模块化源码", readable:"单文件可读", locked:"已压缩·不可改"};

let state = {q:"", theme:"全部", edit:"all", sort:"default"};

function buildChips(){
  const ft = document.getElementById("fTheme");
  /* 每次重建前必须清空，否则点一次筛选项就复制一整排 chip（原版遗留 bug） */
  ft.innerHTML=""; document.getElementById("fEdit").innerHTML=""; document.getElementById("fSort").innerHTML="";
  THEMES.forEach(t=>{
    const b=document.createElement("button");
    b.className="chip"+(t===state.theme?" on":"");
    b.textContent=t; b.dataset.v=t;
    b.onclick=()=>{state.theme=t; buildChips(); render();};
    ft.appendChild(b);
  });
  const fe = document.getElementById("fEdit");
  EDITS.forEach(e=>{
    /* 没有任何作品命中的筛选项就不画，免得点开是一片空 */
    if(e.k!=="all" && !DATA.some(d=>d.edit===e.k)) return;
    const b=document.createElement("button");
    b.className="chip"+(e.k===state.edit?" on":"");
    b.textContent=e.t; b.dataset.v=e.k;
    b.onclick=()=>{state.edit=e.k; buildChips(); render();};
    fe.appendChild(b);
  });
  const fs = document.getElementById("fSort");
  SORTS.forEach(s=>{
    const b=document.createElement("button");
    b.className="chip"+(s.k===state.sort?" on":"");
    b.textContent=s.t; b.dataset.v=s.k;
    b.onclick=()=>{state.sort=s.k; buildChips(); render();};
    fs.appendChild(b);
  });
}

/* 卡片上的开销读数：>2500 标红，>1800 标黄 */
function costHtml(d){
  const n = d.calls || 0;
  const cls = n >= 2500 ? " hot" : n >= 1800 ? " mid" : "";
  return '<span class="cost' + cls + '"><i>' + n.toLocaleString() + '</i> calls</span>';
}

function matches(d){
  if(state.edit!=="all" && !DATA.some(x=>x.edit===state.edit)) state.edit="all";
  if(state.theme!=="全部" && d.theme!==state.theme) return false;
  if(state.edit!=="all" && d.edit!==state.edit) return false;
  if(!state.q) return true;
  const q=state.q.toLowerCase();
  return (d.code+" "+slugOf(d)+" "+d.name+" "+d.cn+" "+d.theme+" "+d.tags.join(" ")
    +" "+d.lede+" "+d.note).toLowerCase().includes(q);
}

function slugOf(d){ return d.zip.replace(/\.zip$/,""); }

function phStyle(d){
  return `background:linear-gradient(150deg,${d.pal[0]} 0%,${d.pal[1]} 78%)`;
}

function render(){
  const grid=document.getElementById("grid");
  const list=DATA.filter(matches);
  if(state.sort==="cost")   list.sort((a,b)=>(b.calls||0)-(a.calls||0));
  if(state.sort==="costup") list.sort((a,b)=>(a.calls||0)-(b.calls||0));
  grid.innerHTML = list.map(d=>{
    const thumb = d.preview
      ? `<img src="${d.preview}" alt="${d.cn}" loading="lazy">`
      : `<div class="ph" style="${phStyle(d)}"><div class="code">${d.code}</div><div class="nopic">包内无截图</div></div>`;
    const editTag = d.edit==="locked"
      ? `<span class="tag warn">成品锁死</span>`
      : d.edit==="module"
        ? `<span class="tag good">模块化源码</span>`
        : `<span class="tag">单文件可读</span>`;
    return `<article class="card" data-code="${d.code}">
      <div class="thumb">${thumb}
        <div class="badge">${d.code}</div>
        <div class="flag ${d.open}">${OPEN_LABEL[d.open]}</div>
      </div>
      <div class="body">
        <div class="name">${d.name}</div>
        <div class="sub">${d.cn} · ${d.theme}</div>
        <div class="meta"><span>${d.size}</span><span>·</span>${costHtml(d)}<span>·</span><span>${d.three}</span></div>
        <div class="tags">${editTag}${d.tags.slice(0,2).map(t=>`<span class="tag">${t}</span>`).join("")}</div>
        <div class="path"><span>${slugOf(d)}</span><a class="golive" href="${liveUrl(d)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">在线预览 ↗</a></div>
      </div>
    </article>`;
  }).join("") || `<div class="empty">没有匹配的作品</div>`;

  document.getElementById("count").textContent = `${list.length} / ${DATA.length} 件`;
  grid.querySelectorAll(".card").forEach(c=>{
    c.onclick=()=>openModal(c.dataset.code);
  });
}

function openModal(code){
  const d=DATA.find(x=>x.code===code);
  const ov=document.getElementById("overlay");
  const m=document.getElementById("modal");
  const head = d.preview
    ? `<div class="mhead"><img src="${d.preview}" alt=""><button class="mclose" aria-label="关闭">✕</button></div>`
    : `<div class="mhead" style="${phStyle(d)};display:flex;align-items:center;justify-content:center">
         <div style="text-align:center"><div style="font-size:46px;font-weight:700;opacity:.85">${d.code}</div>
         <div style="font-size:10.5px;letter-spacing:.14em;opacity:.5;margin-top:6px">包内无截图</div></div>
         <button class="mclose" aria-label="关闭">✕</button></div>`;
  m.innerHTML = head + `<div class="mbody">
    <h2>${d.name}</h2>
    <div class="msub">${d.cn} · ${d.theme} · three.js ${d.three}</div>
    <p class="mlede">${d.lede}</p>
    <dl class="kv">
      <dt>原始包</dt><dd><code>${d.zip}</code> · ${d.size}<span style="color:var(--dim2)">（未随仓库提供）</span></dd>
      <dt>源码</dt><dd><code>_extracted/${slugOf(d)}/</code></dd>
      <dt>入口</dt><dd><code>${d.entry}</code></dd>
      <dt>构建</dt><dd>${d.build==="—" ? "无构建链，直接改 HTML" : `<code>${d.build}</code>`}</dd>
      <dt>形态</dt><dd>${EDIT_LABEL[d.edit]} · ${OPEN_LABEL[d.open]} · 源码 ${d.loc.toLocaleString()} 行</dd>
      <dt>实测开销</dt><dd><code>${(d.calls||0).toLocaleString()} calls</code> / 帧 · ${((d.tris||0)/1000).toFixed(1)}k 三角面 <span style="color:var(--dim2)">（1280×800 软渲染，含阴影与后处理）</span></dd>
    </dl>
    <div class="sec"><h4>在线预览</h4>
      <div class="pv" data-url="${liveUrl(d)}"></div>
    </div>
    <div class="sec"><h4>打开方式</h4><p>${d.entryNote}</p></div>
    <div class="sec"><h4>技术实现</h4><p>${d.tech}</p></div>
    <div class="sec"><h4>优化切入点</h4><p>${d.points}</p></div>
    <div class="sec"><h4>备注</h4><p>${d.note}</p></div>
  </div>`;
  ov.classList.add("on");
  m.querySelector(".mclose").onclick=closeModal;
  const pv=m.querySelector(".pv");
  if(pv) mountPreview(pv);
  m.scrollTop=0;
}

/* 在线预览：默认不加载 iframe，点一下才挂上去，避免 19 个 WebGL 上下文同时在跑 */
function mountPreview(pv){
  const url=pv.dataset.url;
  pv.innerHTML = `<div class="pvstart">
      <button class="pvbtn" type="button">▶ 在页面内运行</button>
      <a class="pvlink" href="${url}" target="_blank" rel="noopener">在新标签打开 ↗</a>
    </div>
    <p class="pvhint">直接加载线上版本，首次约 1–3 秒；需要 WebGL2 与网络。关闭弹窗即释放。</p>`;
  pv.querySelector(".pvbtn").onclick=()=>{
    pv.innerHTML = `<iframe class="pvframe" src="${url}" loading="lazy" allow="fullscreen; xr-spatial-tracking"></iframe>
      <div class="pvbar">
        <a class="pvlink" href="${url}" target="_blank" rel="noopener">在新标签打开 ↗</a>
        <button class="pvbtn pvclose" type="button">关闭预览</button>
      </div>`;
    pv.querySelector(".pvclose").onclick=()=>mountPreview(pv);
  };
}

function closeModal(){
  document.getElementById("overlay").classList.remove("on");
  document.getElementById("modal").innerHTML="";   /* 卸载 iframe，停掉渲染循环 */
}

document.getElementById("q").addEventListener("input", e=>{
  state.q=e.target.value.trim(); render();
});
document.getElementById("overlay").addEventListener("click", e=>{
  if(e.target.id==="overlay") closeModal();
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

buildChips();
render();
</script>
