:root { color-scheme: dark; }
* { box-sizing: border-box; }

  background: #050505;
}
body {
  position: fixed; inset: 0;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}
.stage-wrap { position: absolute; inset: 0; }
canvas#stage {
  position: absolute; inset: 0;
  display: block; width: 100%; height: 100%;
  opacity: 0;
  transform: scale(1.015);
  transition: opacity 2.2s ease, transform 4.5s cubic-bezier(.16,.8,.25,1);
  cursor: grab;
  outline: none;
  touch-action: none;
}
canvas#stage.grabbing { cursor: grabbing; }
body.ready canvas#stage { opacity: 1; transform: scale(1); }
.vignette {
  position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse at 50% 47%, transparent 54%, rgba(0,0,0,.30) 88%, rgba(0,0,0,.62) 120%),
    linear-gradient(180deg, rgba(8,3,3,.14), transparent 28%, transparent 74%, rgba(0,0,0,.28));
}
.nojs {
  position: absolute; inset: 0; display: grid; place-items: center;
  color: #9b9d98; font: 14px/1.5 ui-monospace, "Cascadia Mono", monospace;
  letter-spacing: .12em; text-transform: uppercase;
}
@media (prefers-reduced-motion: reduce) {
  canvas#stage { transition: opacity .4s ease; transform: none; }
}
