<!DOCTYPE html>

    background:#04100f;color:#86d9c2;font:300 12px/1.8 "Hiragino Sans","Yu Gothic","Microsoft YaHei",sans-serif;

<div id="vig"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }

</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* =========================================================
   0. 基础环境
   ========================================================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a2224, 0.018);

const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(9.0, 7.7, 12.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.1, 1.45, 0.05);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.rotateSpeed = 0.72;
controls.zoomSpeed = 0.85;
controls.panSpeed = 0.6;
controls.minDistance = 6.2;
controls.maxDistance = 26;
controls.minPolarAngle = 0.16;
controls.maxPolarAngle = Math.PI * 0.492;
controls.update();
{
  const qp = new URLSearchParams(location.search);
  if (qp.get('cam')) {
    const v = qp.get('cam').split(',').map(Number);
    camera.position.set(v[0], v[1], v[2]);
    if (v.length >= 6) controls.target.set(v[3], v[4], v[5]);
    controls.update();
  }
}

/* 背景：深夜森林的冷色渐层 */
{
  const g = new THREE.SphereGeometry(70, 24, 16);
  const m = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      cTop: { value: new THREE.Color(0x134a4c) },
      cMid: { value: new THREE.Color(0x0e3335) },
      cBot: { value: new THREE.Color(0x082022) }
    },
    vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `
      uniform vec3 cTop,cMid,cBot; varying vec3 vP;
      void main(){
        float h = normalize(vP).y*0.5+0.5;
        vec3 c = mix(cBot, cMid, smoothstep(0.18,0.52,h));
        c = mix(c, cTop, smoothstep(0.52,0.95,h));
        gl_FragColor = vec4(c,1.0);
      }`
  });
  scene.add(new THREE.Mesh(g, m));
}

/* 灯光 */
const hemi = new THREE.HemisphereLight(0xb4e4dc, 0x3a4a35, 2.0);
scene.add(hemi);

const moon = new THREE.DirectionalLight(0xc6e8ff, 2.2);
moon.position.set(7.5, 11, 6.5);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
moon.shadow.camera.left = -8; moon.shadow.camera.right = 8;
moon.shadow.camera.top = 8; moon.shadow.camera.bottom = -8;
moon.shadow.camera.near = 1; moon.shadow.camera.far = 30;
moon.shadow.bias = -0.0009;
moon.shadow.normalBias = 0.02;
scene.add(moon);

const rim = new THREE.DirectionalLight(0x5fe0cf, 0.55);
rim.position.set(-8, 4.5, -7);
scene.add(rim);

const fill = new THREE.DirectionalLight(0x9fd4de, 0.9);
scene.add(new THREE.AmbientLight(0x86c2ba, 0.62));
fill.position.set(-4, 5, 9);
scene.add(fill);

/* =========================================================
   1. 工具 / 材质 / 程序化贴图
   ========================================================= */
const PAL = {
  wood: 0xa9713f, woodLight: 0xc9975e, woodDark: 0x6d4526, woodDeep: 0x48301d,
  moss: 0x4e6b38, mossLight: 0x6d8b48, mossDeep: 0x32482a,
  leaf: 0x3f6b45, leafLight: 0x5d8a54, leafDeep: 0x2a4c34,
  stone: 0x6c7570, stoneDark: 0x4b5551,
  warm: 0xffb469, amber: 0xffd39a, cream: 0xf2e3c8,
  teal: 0x2b7d72, glow: 0x7effc4, blue: 0x9fd8e6
};

/* 三渲二 阶梯渐变 */
const GRADIENT = (() => {
  const d = new Uint8Array([104, 156, 204, 238, 255]);
  const t = new THREE.DataTexture(d, 5, 1, THREE.RedFormat);
  t.needsUpdate = true;
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  return t;
})();

function toon(color, opts = {}) {
  return new THREE.MeshToonMaterial(Object.assign({ color, gradientMap: GRADIENT }, opts));
}


/* 反向壳描边 */
const OUTLINE_COLOR = 0x0a1714;
function addOutline(mesh, thickness = 0.018, color = OUTLINE_COLOR) {
  if (!mesh.geometry || !mesh.geometry.attributes.normal) return;
  const mat = new THREE.ShaderMaterial({
    uniforms: { uT: { value: thickness }, uC: { value: new THREE.Color(color) } },
    vertexShader: `
      uniform float uT;
      void main(){
        vec3 p = position + normalize(normal) * uT;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
      }`,
    fragmentShader: `uniform vec3 uC; void main(){ gl_FragColor = vec4(uC, 1.0); }`,
    side: THREE.BackSide
  });
  const o = new THREE.Mesh(mesh.geometry, mat);
  o.castShadow = false; o.receiveShadow = false; o.name = 'outline';
  mesh.add(o);
  return o;
}

function mesh(geo, mat, x = 0, y = 0, z = 0, o = {}) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = o.cast !== false;
  m.receiveShadow = o.receive !== false;
  if (o.rx) m.rotation.x = o.rx;
  if (o.ry) m.rotation.y = o.ry;
  if (o.rz) m.rotation.z = o.rz;
  if (o.outline) addOutline(m, o.outline);
  (o.parent || scene).add(m);
  return m;
}
const rbox = (w, h, d, r, mat, x, y, z, o = {}) =>
  mesh(new RoundedBoxGeometry(w, h, d, 3, r), mat, x, y, z, o);

function cv(w, h, fn) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  fn(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

/* 年轮底座贴图 */
const texRings = cv(1024, 1024, (g, S) => {
  g.fillStyle = '#544734'; g.fillRect(0, 0, S, S);
  const cx = S * 0.47, cy = S * 0.50;
  const rg = g.createRadialGradient(cx, cy, 10, cx, cy, S * 0.66);
  rg.addColorStop(0, '#c9a670');
  rg.addColorStop(0.45, '#b08d5c');
  rg.addColorStop(0.78, '#8a6c45');
  rg.addColorStop(1, '#5c472e');
  g.fillStyle = rg; g.fillRect(0, 0, S, S);

  // 年轮
  let r = S * 0.655, i = 0;
  while (r > 5) {
    const wob = 4 + 11 * (r / (S * 0.655));
    g.beginPath();
    for (let a = 0; a <= Math.PI * 2 + 0.001; a += 0.04) {
      const rr = r + Math.sin(a * 3 + i * 0.55) * wob + Math.sin(a * 7 - i * 0.3) * wob * 0.38;
      const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
      if (a === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.closePath();
    const dark = i % 2 === 0;
    g.strokeStyle = dark ? 'rgba(74,52,30,0.5)' : 'rgba(226,198,152,0.3)';
    g.lineWidth = dark ? 3.4 : 1.5;
    g.stroke();
    r -= 6 + (i % 3) * 2.2 + Math.random() * 3;
    i++;
  }
  // 放射裂纹
  for (let k = 0; k < 9; k++) {
    const a = Math.random() * Math.PI * 2;
    g.beginPath(); g.moveTo(cx + Math.cos(a) * 30, cy + Math.sin(a) * 30);
    for (let t = 0; t < 1; t += 0.08) {
      const rr = 30 + t * S * 0.62;
      const aa = a + Math.sin(t * 8 + k) * 0.05;
      g.lineTo(cx + Math.cos(aa) * rr, cy + Math.sin(aa) * rr);
    }
    g.strokeStyle = 'rgba(28,20,12,0.35)'; g.lineWidth = 1.6; g.stroke();
  }
  // 苔藓斑块
  for (let k = 0; k < 320; k++) {
    const a = Math.random() * Math.PI * 2;
    const rr = Math.pow(Math.random(), 0.55) * S * 0.70;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    const rad = 8 + Math.random() * 46;
    const grd = g.createRadialGradient(x, y, 0, x, y, rad);
    const dense = rr / (S * 0.7);
    grd.addColorStop(0, `rgba(${56 + Math.random() * 30},${88 + Math.random() * 34},${44 + Math.random() * 20},${0.16 + dense * 0.42})`);
    grd.addColorStop(1, 'rgba(50,80,40,0)');
    g.fillStyle = grd;
    g.beginPath(); g.arc(x, y, rad, 0, 7); g.fill();
  }
  // 细碎砂砾
  for (let k = 0; k < 4200; k++) {
    g.fillStyle = `rgba(${Math.random() > 0.5 ? '210,190,150' : '20,26,16'},${Math.random() * 0.16})`;
    g.fillRect(Math.random() * S, Math.random() * S, 1.6, 1.6);
  }
  // 边缘压暗
  const vg = g.createRadialGradient(cx, cy, S * 0.24, cx, cy, S * 0.74);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(10,14,10,0.34)');
  g.fillStyle = vg; g.fillRect(0, 0, S, S);
});

/* 泥土 / 树皮 / 木纹 / 石 / 玻璃 */
const texSoil = cv(512, 512, (g, S) => {
  g.fillStyle = '#5a4e3a'; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 900; i++) {
    g.fillStyle = `rgba(${40 + Math.random() * 60},${34 + Math.random() * 46},${24 + Math.random() * 30},${0.3 + Math.random() * 0.5})`;
    const r = 2 + Math.random() * 16;
    g.beginPath(); g.arc(Math.random() * S, Math.random() * S, r, 0, 7); g.fill();
  }
  for (let i = 0; i < 60; i++) {
    g.strokeStyle = `rgba(80,105,55,${0.12 + Math.random() * 0.2})`;
    g.lineWidth = 1 + Math.random() * 3;
    const x = Math.random() * S;
    g.beginPath(); g.moveTo(x, 0);
    for (let y = 0; y < S; y += 20) g.lineTo(x + Math.sin(y * 0.03 + i) * 8, y);
    g.stroke();
  }
});

const texBark = cv(512, 1024, (g, S, H) => {
  g.fillStyle = '#6b5038'; g.fillRect(0, 0, S, H);
  for (let i = 0; i < 200; i++) {
    const x = Math.random() * S;
    g.strokeStyle = `rgba(${24 + Math.random() * 40},${18 + Math.random() * 30},${12 + Math.random() * 20},${0.25 + Math.random() * 0.5})`;
    g.lineWidth = 1 + Math.random() * 8;
    g.beginPath(); g.moveTo(x, -20);
    for (let y = 0; y < H + 20; y += 30) g.lineTo(x + Math.sin(y * 0.012 + i) * 12 + Math.random() * 4, y);
    g.stroke();
  }
  for (let i = 0; i < 140; i++) {
    g.fillStyle = `rgba(${70 + Math.random() * 60},${55 + Math.random() * 40},${35 + Math.random() * 30},${0.1 + Math.random() * 0.25})`;
    g.fillRect(Math.random() * S, Math.random() * H, 2 + Math.random() * 8, 20 + Math.random() * 80);
  }
  // 苔藓沿树皮
  for (let i = 0; i < 260; i++) {
    const x = Math.random() * S, y = Math.random() * H;
    const r = 4 + Math.random() * 26;
    const grd = g.createRadialGradient(x, y, 0, x, y, r);
    grd.addColorStop(0, `rgba(74,104,54,${0.10 + Math.random() * 0.32})`);
    grd.addColorStop(1, 'rgba(60,90,44,0)');
    g.fillStyle = grd; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
});
texBark.wrapS = texBark.wrapT = THREE.RepeatWrapping;
texBark.repeat.set(2, 1);

const texPlank = cv(512, 512, (g, S) => {
  g.fillStyle = '#b07a45'; g.fillRect(0, 0, S, S);
  const n = 7, w = S / n;
  for (let i = 0; i < n; i++) {
    const x = i * w;
    const l = 0.86 + Math.random() * 0.28;
    g.fillStyle = `rgba(${Math.round(176 * l)},${Math.round(122 * l)},${Math.round(70 * l)},1)`;
    g.fillRect(x, 0, w - 1, S);
    g.strokeStyle = 'rgba(60,38,20,0.55)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(x + w - 1, 0); g.lineTo(x + w - 1, S); g.stroke();
    for (let k = 0; k < 18; k++) {
      g.strokeStyle = `rgba(${90 + Math.random() * 40},${60 + Math.random() * 30},${34 + Math.random() * 20},${0.10 + Math.random() * 0.22})`;
      g.lineWidth = 0.8 + Math.random() * 1.6;
      const yy = Math.random() * S;
      g.beginPath(); g.moveTo(x + 2, yy);
      g.bezierCurveTo(x + w * 0.3, yy + 6, x + w * 0.6, yy - 6, x + w - 3, yy + 2);
      g.stroke();
    }
  }
  for (let k = 0; k < 5; k++) {
    g.fillStyle = 'rgba(40,26,14,0.55)';
    g.beginPath(); g.ellipse(Math.random() * S, Math.random() * S, 4, 7, 0, 0, 7); g.fill();
  }
});
texPlank.wrapS = texPlank.wrapT = THREE.RepeatWrapping;

const texStone = cv(512, 512, (g, S) => {
  g.fillStyle = '#5d6662'; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 700; i++) {
    g.fillStyle = `rgba(${60 + Math.random() * 70},${66 + Math.random() * 70},${64 + Math.random() * 66},${0.25 + Math.random() * 0.4})`;
    g.beginPath(); g.arc(Math.random() * S, Math.random() * S, 3 + Math.random() * 14, 0, 7); g.fill();
  }
  for (let i = 0; i < 260; i++) {
    g.fillStyle = `rgba(40,60,42,${0.05 + Math.random() * 0.18})`;
    g.beginPath(); g.arc(Math.random() * S, Math.random() * S, 4 + Math.random() * 18, 0, 7); g.fill();
  }
});
texStone.wrapS = texStone.wrapT = THREE.RepeatWrapping;

const texGlass = cv(512, 1024, (g, S, H) => {
  g.clearRect(0, 0, S, H);
  for (let i = 0; i < 26; i++) {
    const x = Math.random() * S;
    g.strokeStyle = `rgba(190,235,240,${0.05 + Math.random() * 0.13})`;
    g.lineWidth = 1 + Math.random() * 2.4;
    g.beginPath(); g.moveTo(x, 0);
    for (let y = 0; y < H; y += 26) g.lineTo(x + Math.sin(y * 0.01 + i) * 5, y);
    g.stroke();
  }
  for (let i = 0; i < 150; i++) {
    const x = Math.random() * S, y = Math.random() * H, r = 1 + Math.random() * 5;
    const grd = g.createRadialGradient(x, y, 0, x, y, r);
    grd.addColorStop(0, `rgba(220,250,255,${0.18 + Math.random() * 0.35})`);
    grd.addColorStop(1, 'rgba(200,240,255,0)');
    g.fillStyle = grd; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
});
texGlass.wrapS = texGlass.wrapT = THREE.RepeatWrapping;


/* 鹅卵石铺装贴图 */
const texCobble = cv(512, 512, (g, S) => {
  g.fillStyle = '#2f3833'; g.fillRect(0, 0, S, S);
  const rows = 9, cols = 9;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cx = (c + 0.5) * S / cols + (Math.random() - 0.5) * 12 + (r % 2 ? 8 : 0);
      const cy = (r + 0.5) * S / rows + (Math.random() - 0.5) * 12;
      const w = S / cols * (0.4 + Math.random() * 0.09);
      const h = S / rows * (0.4 + Math.random() * 0.09);
      const n = 7, pts = [];
      for (let i = 0; i < n; i++) {
        const a = i / n * Math.PI * 2;
        const k = 0.82 + Math.random() * 0.28;
        pts.push([cx + Math.cos(a) * w * k, cy + Math.sin(a) * h * k]);
      }
      g.beginPath();
      pts.forEach((pt, i) => i ? g.lineTo(pt[0], pt[1]) : g.moveTo(pt[0], pt[1]));
      g.closePath();
      const grd = g.createRadialGradient(cx - w * 0.35, cy - h * 0.4, 2, cx, cy, w * 1.5);
      const l = 0.55 + Math.random() * 0.35;
      grd.addColorStop(0, `rgba(${Math.round(150 * l)},${Math.round(160 * l)},${Math.round(146 * l)},1)`);
      grd.addColorStop(1, `rgba(${Math.round(86 * l)},${Math.round(96 * l)},${Math.round(88 * l)},1)`);
      g.fillStyle = grd; g.fill();
      g.strokeStyle = 'rgba(28,34,30,0.55)'; g.lineWidth = 2; g.stroke();
      // 高光
      g.fillStyle = `rgba(210,235,225,${0.05 + Math.random() * 0.08})`;
      g.beginPath(); g.ellipse(cx - w * 0.2, cy - h * 0.3, w * 0.45, h * 0.25, -0.4, 0, 7); g.fill();
    }
  }
});
texCobble.wrapS = texCobble.wrapT = THREE.RepeatWrapping;
texCobble.repeat.set(3.2, 1.6);

/* 发光贴图 */
const texGlow = cv(256, 256, (g, S) => {
  const grd = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.18, 'rgba(255,255,255,0.55)');
  grd.addColorStop(0.45, 'rgba(255,255,255,0.16)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, S, S);
});

function glowSprite(x, y, z, size, color, opacity = 0.55, parent = scene) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: texGlow, color, transparent: true, opacity,
    blending: THREE.AdditiveBlending, depthWrite: false, fog: false
  }));
  s.position.set(x, y, z);
  s.scale.set(size, size, 1);
  parent.add(s);
  return s;
}

const updaters = [];

/* 舞台背景辉光 */
{
  const g1 = glowSprite(0, 3.4, -10.5, 30, 0x2f9a8a, 0.10);
  g1.material.fog = false;
  const g2 = glowSprite(-1.2, 3.0, -9.0, 16, 0xff9d5a, 0.06);
  g2.material.fog = false;
  const g3 = glowSprite(-7.5, 9.5, -13, 24, 0x8fe6dc, 0.14);
  g3.material.fog = false;
}

/* =========================================================
   2. 微缩底座：正方形年轮 + 苔藓 + 鹅卵石
   ========================================================= */
const BASE = 10.4;
const HALF = BASE / 2;

const matRings = toon(0xffffff, { map: texRings });
const matSoil = toon(0xcbbfa4, { map: texSoil });
const base = new THREE.Mesh(
  new THREE.BoxGeometry(BASE, 0.56, BASE),
  [matSoil, matSoil, matRings, matSoil, matSoil, matSoil]
);
base.position.y = -0.28;
base.receiveShadow = true;
base.castShadow = true;
scene.add(base);

// 模型底座：深色木质托板 + 细铜边
const plinthMat = toon(0x2b2118);

const waterUniforms = { uTime: { value: 0 }, uWarm: { value: new THREE.Color(0xffa457) } };
const puddleMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: THREE.UniformsUtils.clone(waterUniforms),
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    uniform float uTime; uniform vec3 uWarm; varying vec2 vUv;
    void main(){
      vec2 p = vUv*2.0-1.0;
      float r = length(p);
      if(r>1.0) discard;
      float edge = smoothstep(1.0, 0.80, r);
      vec3 col = mix(vec3(0.016,0.055,0.062), vec3(0.03,0.10,0.105), smoothstep(-1.0,1.0,p.y));
      float band = smoothstep(0.62,0.0,abs(p.x-0.12)) * smoothstep(0.05,0.95,p.y);
      col += uWarm * band * 0.55;
      float rip = 0.0;
      for(int i=0;i<3;i++){
        float t = fract(uTime*0.16 + float(i)*0.34);
        float rr = t*0.92;
        float ring = smoothstep(0.055,0.0,abs(r-rr));
        rip += ring * (1.0-t) * 0.85;
      }
      float dots = sin(p.x*44.0+uTime*0.8)*sin(p.y*39.0-uTime*1.1);
      rip += smoothstep(0.985,1.0,dots)*0.10;
      col += vec3(0.55,0.85,0.82)*rip*0.55;
      col += vec3(0.10,0.20,0.20) * smoothstep(0.75,0.98,r) * 0.5;
      gl_FragColor = vec4(col, edge*0.94);
    }`
});
function puddle(x, z, sx, sz, rot = 0) {
  const m = new THREE.Mesh(new THREE.CircleGeometry(1, 40), puddleMat);

  m.scale.set(sx, sz, 1);

}

    pos.setXYZ(i, v.x, v.y, v.z);

function branch(from, to, r1, r2, mat) {
  const mid = from.clone().lerp(to, 0.5).add(new THREE.Vector3(0, 0.35, 0));
  const curve = new THREE.CatmullRomCurve3([from, mid, to]);
  const geo = new THREE.TubeGeometry(curve, 18, r1, 7, false);
  // 简易锥化
  const pos = geo.attributes.position;
  const p = new THREE.Vector3(), c = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    p.fromBufferAttribute(pos, i);
    const seg = Math.floor(i / (7 + 1)) / 18;
    const k = 1 - (1 - r2 / r1) * seg;
    c.copy(curve.getPoint(Math.min(seg, 1)));
    p.sub(c).multiplyScalar(k).add(c);
    pos.setXYZ(i, p.x, p.y, p.z);
  }
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true; m.receiveShadow = true;
  treeGroup.add(m);
  addOutline(m, 0.02);
  return m;
}

});

{
  const N = 1700;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(N * 6);
  const tail = new Float32Array(N * 2);
  for (let i = 0; i < N; i++) {
    const x = (Math.random() - 0.5) * 18;
    const z = (Math.random() - 0.5) * 18;
    const y = Math.random() * 10;
    pos[i * 6] = x; pos[i * 6 + 1] = y; pos[i * 6 + 2] = z;
    pos[i * 6 + 3] = x; pos[i * 6 + 4] = y; pos[i * 6 + 5] = z;
    tail[i * 2] = 0; tail[i * 2 + 1] = 1;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aTail', new THREE.BufferAttribute(tail, 1));
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uTime: { value: 0 } },
    vertexShader: `
      uniform float uTime; attribute float aTail; varying float vA;
      void main(){
        vec3 p = position;
        p.y = mod(p.y - uTime * 7.0, 10.0) + 0.1;
        p.x += aTail * 0.13 + (10.0 - p.y) * 0.015;
        p.y -= aTail * 0.34;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        vA = smoothstep(0.0, 0.5, p.y) * (1.0 - smoothstep(9.0, 17.0, -mv.z));
        if (p.x > -1.95 && p.x < 2.45 && p.z > -1.65 && p.z < 0.95) vA = 0.0;
        if (aTail > 0.5) vA *= 0.55;
      }`,
    fragmentShader: `varying float vA; void main(){ gl_FragColor = vec4(0.62, 0.86, 0.92, vA * 0.5); }`
  });
  const rain = new THREE.LineSegments(geo, mat);
  rain.frustumCulled = false;
  scene.add(rain);
  updaters.push((t) => { mat.uniforms.uTime.value = t; });

    const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
      color: 0xbfeae4, transparent: true, opacity: 0, blending: THREE.AdditiveBlending,
      depthWrite: false, fog: false, side: THREE.DoubleSide
    }));
    m.rotation.x = -Math.PI / 2;
    m.position.y = 0.1;
    scene.add(m);
    pool.push({ m, t: Math.random() * 1.2, dur: 0.8 + Math.random() * 0.7 });
    resetSplash(pool[i], true);
  }
  function resetSplash(p, initial) {
    let x, z, guard = 0;
    do {
      x = (Math.random() - 0.5) * 9.2;
      z = (Math.random() - 0.5) * 9.2;
      guard++;
    } while (!onStreet(x, z) && guard < 40);
    p.m.position.x = x; p.m.position.z = z;
    p.m.scale.setScalar(0.02);
    p.m.material.opacity = 0;
    p.t = initial ? Math.random() * 1.5 : 0;
  }
  updaters.push((t, dt) => {
    for (const p of pool) {
      p.t += dt;
      const k = p.t / p.dur;
      if (k >= 1) { resetSplash(p); continue; }
      const s = 0.03 + k * 0.26;
      p.m.scale.setScalar(s);
      p.m.material.opacity = (1 - k) * 0.5;
    }
  });
}

/* 金色孢子 */
{
  const N = 110;
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(N * 3);
  const info = [];
  for (let i = 0; i < N; i++) {
    const x = (Math.random() - 0.5) * 10;
    const y = 0.3 + Math.random() * 4.2;
    const z = (Math.random() - 0.5) * 10;
    pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z;
    info.push({ x, y, z, p: Math.random() * 6.28, s: 0.3 + Math.random() * 0.6, a: 0.1 + Math.random() * 0.25 });
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    size: 0.075, map: texGlow, color: 0xffd68a, transparent: true, opacity: 0.85,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true, fog: false
  });
  const pts = new THREE.Points(g, mat);
  scene.add(pts);
  updaters.push((t) => {
    const arr = g.attributes.position.array;
    for (let i = 0; i < N; i++) {
      const o = info[i];
      arr[i * 3] = o.x + Math.sin(t * 0.35 * o.s + o.p) * 0.5;
      arr[i * 3 + 1] = o.y + Math.sin(t * 0.22 * o.s + o.p * 1.7) * 0.35 + ((t * 0.04 * o.s) % 1.2);
      arr[i * 3 + 2] = o.z + Math.cos(t * 0.3 * o.s + o.p) * 0.5;
    }
    g.attributes.position.needsUpdate = true;
  });
}

/* 萤火虫 */
{
  const flies = [];
  for (let i = 0; i < 22; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: texGlow, color: i % 3 === 0 ? 0xa8ffd0 : 0xffe08a, transparent: true, opacity: 0.7,
      blending: THREE.AdditiveBlending, depthWrite: false, fog: false
    }));
    const r = 1.5 + Math.random() * 3.2;
    s.position.set((Math.random() - 0.5) * 8, 0.6 + Math.random() * 3.4, (Math.random() - 0.5) * 8);
    s.scale.setScalar(0.18 + Math.random() * 0.16);
    scene.add(s);
    flies.push({ s, r, y: s.position.y, p: Math.random() * 6.28, sp: 0.25 + Math.random() * 0.5, cx: s.position.x, cz: s.position.z });
  }
  updaters.push((t) => {
    for (const f of flies) {
      f.s.position.x = f.cx + Math.sin(t * f.sp + f.p) * 0.8;
      f.s.position.z = f.cz + Math.cos(t * f.sp * 0.8 + f.p) * 0.8;
      f.s.position.y = f.y + Math.sin(t * f.sp * 1.3 + f.p) * 0.3;
      const flick = 0.35 + Math.abs(Math.sin(t * 1.6 + f.p)) * 0.65;
      f.s.material.opacity = flick * 0.85;
      f.s.scale.setScalar((0.16 + Math.sin(t * 2.2 + f.p) * 0.03) * (0.8 + flick * 0.4));
    }
  });
}

/* 铃兰灯摇曳与闪烁 */
updaters.push((t) => {
  for (const g of lampBells) {
    const ph = g.userData.phase;
    g.rotation.z = Math.sin(t * 0.9 + ph) * 0.09;
    g.rotation.x = Math.cos(t * 0.7 + ph) * 0.06;
    const fl = 0.55 + Math.sin(t * 3.1 + ph) * 0.12 + Math.sin(t * 7.7 + ph * 2) * 0.06;
    if (g.userData.glow) {
      g.userData.glow.material.opacity = 0.22 + fl * 0.18;
      g.userData.glow.scale.setScalar(0.85 + fl * 0.25);
    }
  }
});

/* =========================================================
   动画主循环
   ========================================================= */
let time = 0;
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  time += dt;
  waterUniforms.uTime.value = time;
  for (const u of updaters) u(time, dt);
  controls.update();
  renderer.render(scene, camera);
}
animate();

/* 淡出加载层 */
requestAnimationFrame(() => {
  setTimeout(() => {
    const el = document.getElementById('loading');
    if (!el) return;
    el.classList.add('hide');
    setTimeout(() => el.remove(), 1500);
  }, 120);
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
