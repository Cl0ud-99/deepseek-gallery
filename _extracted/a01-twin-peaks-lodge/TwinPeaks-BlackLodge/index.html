<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Black Lodge</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070a; }
  #scene { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none; }
  #scene:active { cursor: grabbing; }
  #fade { position: fixed; inset: 0; background: #05070a; pointer-events: none; transition: opacity 1.6s ease; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="fade"></div>
<script src="dist/app.js"></script>
</body>
</html>
