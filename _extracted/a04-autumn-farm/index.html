<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Autumn Farm</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#e7d3b6; }
  canvas { display:block; touch-action:none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =========================================================
   0. 渲染器 / 相机 / 控制器
   ========================================================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.4, 400);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.rotateSpeed = 0.72;
controls.zoomSpeed = 0.85;
controls.enablePan = false;
controls.minDistance = 13;
controls.maxDistance = 80;
controls.minPolarAngle = 0.16;
controls.maxPolarAngle = Math.PI * 0.474;
controls.target.set(0, 2.0, 0);

/* 暖色棚拍背景 */
const bgTex = (() => {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 1024;
  const g = c.getContext('2d');
  const lg = g.createLinearGradient(0, 0, 0, 1024);
  lg.addColorStop(0, '#cfe2e8');
  lg.addColorStop(0.34, '#eae0cd');
  lg.addColorStop(0.66, '#f3e4c8');
  lg.addColorStop(1, '#dcc0a0');
  g.fillStyle = lg; g.fillRect(0, 0, 1024, 1024);
  const rg = g.createRadialGradient(512, 380, 60, 512, 500, 740);
  rg.addColorStop(0, 'rgba(255,252,238,0.92)');
  rg.addColorStop(0.5, 'rgba(255,246,224,0.22)');
  rg.addColorStop(1, 'rgba(110,80,55,0.30)');
  g.fillStyle = rg; g.fillRect(0, 0, 1024, 1024);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();
scene.background = bgTex;

/* 灯光 */
const hemi = new THREE.HemisphereLight(0xfff0d2, 0x9a7048, 1.12);
scene.add(hemi);
const amb = new THREE.AmbientLight(0xffe9cf, 0.34);
scene.add(amb);

const sun = new THREE.DirectionalLight(0xffd39a, 2.35);
sun.position.set(-19, 20, 15);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -20;
sun.shadow.camera.right = 20;
sun.shadow.camera.top = 20;
sun.shadow.camera.bottom = -20;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 90;
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.035;
scene.add(sun);
scene.add(sun.target);
sun.target.position.set(0, 0, 0);

/* 补光：模拟天空漫反射偏冷一点 */
const fill = new THREE.DirectionalLight(0xc2dce8, 0.5);
fill.position.set(14, 9, -12);
scene.add(fill);

/* =========================================================
   1. 通用工具
   ========================================================= */
let _s = 987654321;
const rnd = () => { _s = (_s * 1664525 + 1013904223) % 4294967296; return _s / 4294967296; };
const R = (a, b) => a + rnd() * (b - a);
const RI = (a, b) => Math.floor(R(a, b + 1));
const pick = arr => arr[Math.floor(rnd() * arr.length)];

function tex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}

/* 卡通 4 阶渐变贴图（三渲二核心） */
const gradientMap = (() => {
  const data = new Uint8Array([96, 160, 214, 255]);
  const t = new THREE.DataTexture(data, 4, 1, THREE.RedFormat);
  t.minFilter = THREE.NearestFilter;
  t.magFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  t.needsUpdate = true;
  return t;
})();

function toon(color, opts = {}) {
  return new THREE.MeshToonMaterial(Object.assign({ color, gradientMap }, opts));
}

/* 描边：背面外扩 */
const _olCache = {};
function olMat(t) {
  const key = t.toFixed(4);
  if (_olCache[key]) return _olCache[key];
  const m = new THREE.MeshBasicMaterial({ color: 0x3b2a1e, side: THREE.BackSide });
  m.onBeforeCompile = (shader) => {
    shader.uniforms.oT = { value: t };
    shader.vertexShader = 'uniform float oT;\n' + shader.vertexShader.replace(
      '#include <begin_vertex>',
      '#include <begin_vertex>\n\ttransformed += normalize(normal) * oT;'
    );
  };
  _olCache[key] = m;
  return m;
}
function ol(mesh, t = 0.05) {
  const m = new THREE.Mesh(mesh.geometry, olMat(t));
  m.castShadow = false; m.receiveShadow = false;
  mesh.add(m);
  return mesh;
}

/* 快速建盒 */
function box(w, h, d, mat, x = 0, y = 0, z = 0, parent = scene) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}
/* 圆角盒（挤出） */
function rboxGeo(w, h, d, r = 0.08) {
  const s = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  const b = Math.min(r * 0.55, d * 0.3);
  const g = new THREE.ExtrudeGeometry(s, {
    depth: Math.max(d - 2 * b, 0.01), bevelEnabled: true,
    bevelSize: b, bevelThickness: b, bevelSegments: 1, curveSegments: 3
  });
  g.translate(0, 0, -(d / 2 - b));
  return g;
}
function rbox(w, h, d, r, mat, x = 0, y = 0, z = 0, parent = scene) {
  const m = new THREE.Mesh(rboxGeo(w, h, d, r), mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}
function cyl(rt, rb, h, seg, mat, x = 0, y = 0, z = 0, parent = scene) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}
function sph(r, mat, x = 0, y = 0, z = 0, parent = scene, seg = 12) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, seg, Math.max(6, seg * 0.7 | 0)), mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}

/* 带状面（溪流 / 土路） */
function ribbon(pts, width, y, segs, uvScaleV) {
  const curve = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(p[0], 0, p[1])), false, 'catmullrom', 0.5);
  const N = segs, W = 5;
  const pos = [], uv = [], idx = [];
  const len = curve.getLength();
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const p = curve.getPointAt(t);
    const tan = curve.getTangentAt(t);
    const nx = -tan.z, nz = tan.x;
    const l = Math.hypot(nx, nz) || 1;
    for (let j = 0; j <= W; j++) {
      const u = j / W - 0.5;
      pos.push(p.x + (nx / l) * width * u, y, p.z + (nz / l) * width * u);
      uv.push(j / W, t * len * (uvScaleV || 1));
    }
  }
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < W; j++) {
      const a = i * (W + 1) + j, b = a + 1, c = a + W + 1, d = c + 1;
      idx.push(a, b, c, b, d, c);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return { geo: g, curve };
}

/* =========================================================
   2. 纹理
   ========================================================= */
function plankTex(boards, seamA = 0.34, grainA = 0.07, base = 236) {
  return tex(256, 256, (g, w, h) => {
    const bw = w / boards;
    for (let i = 0; i < boards; i++) {
      const v = base - (i % 3) * 7;
      g.fillStyle = `rgb(${v},${v - 3},${v - 8})`;
      g.fillRect(i * bw, 0, bw + 1, h);
      for (let k = 0; k < 22; k++) {
        g.strokeStyle = `rgba(96,72,50,${grainA * (0.4 + rnd())})`;
        g.lineWidth = 0.6 + rnd();
        const x0 = i * bw + rnd() * bw;
        g.beginPath();
        g.moveTo(x0, 0);
        g.bezierCurveTo(x0 + R(-3, 3), h * 0.35, x0 + R(-3, 3), h * 0.7, x0 + R(-2, 2), h);
        g.stroke();
      }
      g.fillStyle = `rgba(56,38,26,${seamA})`;
      g.fillRect(i * bw, 0, 1.8, h);
      g.fillStyle = 'rgba(255,255,255,0.16)';
      g.fillRect(i * bw + 1.8, 0, 1.4, h);
    }
  });
}
function grainTex(base = 226) {
  return tex(256, 128, (g, w, h) => {
    g.fillStyle = `rgb(${base},${base},${base})`;
    g.fillRect(0, 0, w, h);
    for (let k = 0; k < 60; k++) {
      g.strokeStyle = `rgba(110,80,52,${0.04 + rnd() * 0.08})`;
      g.lineWidth = 0.6 + rnd() * 1.6;
      const y0 = rnd() * h;
      g.beginPath();
      g.moveTo(0, y0);
      g.bezierCurveTo(w * 0.33, y0 + R(-6, 6), w * 0.66, y0 + R(-6, 6), w, y0 + R(-4, 4));
      g.stroke();
    }
  });
}
const hayTex = tex(256, 256, (g, w, h) => {
  g.fillStyle = '#f0cf7d'; g.fillRect(0, 0, w, h);
  for (let k = 0; k < 900; k++) {
    const x = rnd() * w, y = rnd() * h, a = rnd() * Math.PI;
    g.strokeStyle = `rgba(${RI(180, 230)},${RI(140, 180)},${RI(60, 100)},${0.25 + rnd() * 0.5})`;
    g.lineWidth = 0.8 + rnd() * 1.4;
    g.beginPath();
    g.moveTo(x, y);
    g.lineTo(x + Math.cos(a) * R(4, 16), y + Math.sin(a) * R(4, 16));
    g.stroke();
  }
});
const grassTex = tex(256, 256, (g, w, h) => {
  g.fillStyle = '#a3c96a'; g.fillRect(0, 0, w, h);
  for (let k = 0; k < 2600; k++) {
    const x = rnd() * w, y = rnd() * h;
    g.fillStyle = `rgba(${RI(88, 150)},${RI(150, 200)},${RI(58, 96)},${0.3 + rnd() * 0.55})`;
    g.fillRect(x, y, R(1.5, 4), R(1.5, 4));
  }
  for (let k = 0; k < 260; k++) {
    g.strokeStyle = `rgba(${RI(70, 110)},${RI(130, 170)},${RI(50, 80)},0.5)`;
    g.lineWidth = 1.2;
    const x = rnd() * w, y = rnd() * h;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + R(-3, 3), y - R(4, 9)); g.stroke();
  }
});
const soilTex = tex(256, 256, (g, w, h) => {
  g.fillStyle = '#8a5c3a'; g.fillRect(0, 0, w, h);
  for (let k = 0; k < 1600; k++) {
    g.fillStyle = `rgba(${RI(70, 130)},${RI(46, 92)},${RI(28, 62)},${0.25 + rnd() * 0.6})`;
    g.fillRect(rnd() * w, rnd() * h, R(2, 7), R(2, 7));
  }
  for (let k = 0; k < 90; k++) {
    g.fillStyle = `rgba(${RI(150, 190)},${RI(140, 175)},${RI(120, 150)},0.6)`;
    g.beginPath(); g.arc(rnd() * w, rnd() * h, R(1.5, 3.5), 0, 7); g.fill();
  }
});
const dirtTex = tex(256, 256, (g, w, h) => {
  g.fillStyle = '#dcbd91'; g.fillRect(0, 0, w, h);
  for (let k = 0; k < 1500; k++) {
    g.fillStyle = `rgba(${RI(160, 210)},${RI(130, 180)},${RI(90, 140)},${0.18 + rnd() * 0.45})`;
    g.fillRect(rnd() * w, rnd() * h, R(2, 7), R(2, 7));
  }
  for (let k = 0; k < 120; k++) {
    g.fillStyle = `rgba(${RI(170, 205)},${RI(160, 195)},${RI(140, 172)},0.75)`;
    g.beginPath(); g.arc(rnd() * w, rnd() * h, R(1.2, 3), 0, 7); g.fill();
  }
});
const shingleTex = tex(256, 256, (g, w, h) => {
  g.fillStyle = '#a25c4b'; g.fillRect(0, 0, w, h);
  const rows = 8, rh = h / rows;
  for (let r = 0; r < rows; r++) {
    const off = (r % 2) * 16;
    for (let c = -1; c < 8; c++) {
      const x = c * 32 + off, y = r * rh;
      g.fillStyle = `rgba(${RI(150, 196)},${RI(88, 124)},${RI(70, 100)},1)`;
      g.fillRect(x + 1, y + 1, 30, rh - 2);
      g.fillStyle = 'rgba(60,30,24,0.32)';
      g.fillRect(x, y + rh - 3, 32, 3);
    }
  }
});
const waterTex = tex(256, 256, (g, w, h) => {
  const lg = g.createLinearGradient(0, 0, w, 0);
  lg.addColorStop(0, '#5a9aa8');
  lg.addColorStop(0.14, '#77b7c2');
  lg.addColorStop(0.42, '#9ed2d8');
  lg.addColorStop(0.5, '#b6e2e5');
  lg.addColorStop(0.58, '#9ed2d8');
  lg.addColorStop(0.86, '#77b7c2');
  lg.addColorStop(1, '#5a9aa8');
  g.fillStyle = lg; g.fillRect(0, 0, w, h);
  for (let k = 0; k < 90; k++) {
    g.strokeStyle = `rgba(240,253,255,${0.14 + rnd() * 0.4})`;
    g.lineWidth = 0.8 + rnd() * 2.2;
    const y = rnd() * h;
    g.beginPath();
    g.moveTo(0, y);
    for (let x = 0; x <= w; x += 12) g.lineTo(x, y + Math.sin(x * 0.07 + k) * 3.4);
    g.stroke();
  }
  for (let k = 0; k < 26; k++) {
    g.strokeStyle = `rgba(255,255,255,${0.18 + rnd() * 0.3})`;
    g.lineWidth = 1.6 + rnd() * 2;
    const x = rnd() * w, y = rnd() * h;
    g.beginPath();
    g.moveTo(x, y); g.quadraticCurveTo(x + 10, y - 5, x + 22, y + 1);
    g.stroke();
  }
});
const stoneTex = tex(256, 256, (g, w, h) => {
  g.fillStyle = '#9a938a'; g.fillRect(0, 0, w, h);
  for (let k = 0; k < 40; k++) {
    g.fillStyle = `rgba(${RI(120, 175)},${RI(115, 168)},${RI(108, 158)},1)`;
    const x = rnd() * w, y = rnd() * h, r = R(8, 22);
    g.beginPath();
    for (let a = 0; a < 7; a++) {
      const ang = (a / 7) * Math.PI * 2, rr = r * R(0.7, 1.15);
      const px = x + Math.cos(ang) * rr, py = y + Math.sin(ang) * rr;
      a === 0 ? g.moveTo(px, py) : g.lineTo(px, py);
    }
    g.closePath(); g.fill();
  }
});
const leafTex = tex(64, 64, (g, w, h) => {
  g.clearRect(0, 0, w, h);
  g.fillStyle = '#ffffff';
  g.beginPath();
  g.moveTo(w / 2, 3);
  g.bezierCurveTo(w - 5, h * 0.28, w - 7, h * 0.74, w / 2, h - 3);
  g.bezierCurveTo(7, h * 0.74, 5, h * 0.28, w / 2, 3);
  g.closePath();
  g.fill();
  g.strokeStyle = 'rgba(120,90,50,0.35)';
  g.lineWidth = 1.6;
  g.beginPath(); g.moveTo(w / 2, 8); g.lineTo(w / 2, h - 8); g.stroke();
});
const puffTex = tex(128, 128, (g, w, h) => {
  const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  gr.addColorStop(0, 'rgba(255,255,255,0.95)');
  gr.addColorStop(0.4, 'rgba(255,255,255,0.55)');
  gr.addColorStop(0.75, 'rgba(255,255,255,0.16)');
  gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
const labelTex = tex(128, 64, (g, w, h) => {
  g.fillStyle = '#fdf6e6'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#c9b795'; g.lineWidth = 2; g.strokeRect(1, 1, w - 2, h - 2);
  g.strokeStyle = '#6b4a33'; g.lineWidth = 2.4;
  g.beginPath();
  g.moveTo(14, 30);
  for (let x = 14; x < w - 12; x += 6) g.lineTo(x, 30 + Math.sin(x * 0.5) * 4 + R(-3, 3));
  g.stroke();
  g.lineWidth = 1.8;
  g.beginPath();
  g.moveTo(18, 44); g.lineTo(w - 22, 44);
  g.stroke();
});
const numberTex = tex(128, 128, (g, w, h) => {
  g.fillStyle = '#f6eedd'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#4a3526';
  g.font = 'bold 84px Georgia, serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('7', w / 2, h / 2 + 4);
});

/* =========================================================
   3. 材质库
   ========================================================= */
const M = {
  barnRed: toon(0xcf4b31, { map: Object.assign(plankTex(5, 0.3, 0.06), { repeat: new THREE.Vector2(4, 1) }) }),
  barnRedIn: toon(0xb23f2a, { map: Object.assign(plankTex(5, 0.3, 0.05), { repeat: new THREE.Vector2(4, 1) }) }),
  barnRedSide: toon(0xc9472e, { map: Object.assign(plankTex(5, 0.3, 0.06), { repeat: new THREE.Vector2(3, 1) }) }),
  white: toon(0xf7f0e0),
  whiteWood: toon(0xf3ebd8, { map: Object.assign(plankTex(3, 0.16, 0.04, 246), { repeat: new THREE.Vector2(1, 2) }) }),
  roof: toon(0xd9a99a, { map: Object.assign(shingleTex, { repeat: new THREE.Vector2(5, 3) }) }),
  roofDark: toon(0xa87263),
  woodLight: toon(0xd9a86a, { map: Object.assign(grainTex(232), { repeat: new THREE.Vector2(2, 1) }) }),
  woodMid: toon(0xb37c45, { map: Object.assign(grainTex(206), { repeat: new THREE.Vector2(2, 1) }) }),
  woodDark: toon(0x8a5a30, { map: Object.assign(grainTex(184), { repeat: new THREE.Vector2(2, 1) }) }),
  woodFloor: toon(0xc4924f, { map: Object.assign(grainTex(214), { repeat: new THREE.Vector2(4, 3) }) }),
  hay: toon(0xe9bf55, { map: Object.assign(hayTex, { repeat: new THREE.Vector2(1.4, 1.4) }) }),
  hayLight: toon(0xf3d072, { map: Object.assign(hayTex, { repeat: new THREE.Vector2(1, 1) }) }),
  grass: toon(0x9dc069, { map: Object.assign(grassTex, { repeat: new THREE.Vector2(0.42, 0.42) }) }),
  soil: toon(0x7d5334, { map: Object.assign(soilTex, { repeat: new THREE.Vector2(2, 1) }) }),
  soilTop: toon(0x7d5334, { map: Object.assign(soilTex, { repeat: new THREE.Vector2(1, 1) }) }),
  dirtRoad: toon(0xd9b98d, { map: Object.assign(dirtTex, { repeat: new THREE.Vector2(1.4, 1.4) }) }),
  stone: toon(0xc4bdb2, { map: Object.assign(stoneTex, { repeat: new THREE.Vector2(1, 1) }) }),
  brick: toon(0xb4624a),
  metal: new THREE.MeshPhongMaterial({ color: 0xc9d2d6, shininess: 90, specular: 0xffffff, flatShading: false }),
  metalDark: new THREE.MeshPhongMaterial({ color: 0x7b858c, shininess: 70, specular: 0xdfe6ea }),
  copper: new THREE.MeshPhongMaterial({ color: 0xc9743a, shininess: 100, specular: 0xffd9a0 }),
  copperDark: new THREE.MeshPhongMaterial({ color: 0x9d5628, shininess: 80, specular: 0xffc98a }),
  glass: new THREE.MeshPhongMaterial({
    color: 0xd6f0f4, transparent: true, opacity: 0.3, shininess: 110,
    specular: 0xffffff, side: THREE.DoubleSide, depthWrite: false
  }),
  glassJar: new THREE.MeshPhongMaterial({
    color: 0xe8f7f7, transparent: true, opacity: 0.34, shininess: 120,
    specular: 0xffffff, side: THREE.DoubleSide, depthWrite: false
  }),
  windowGlow: toon(0x4a3524, { emissive: 0xffab52, emissiveIntensity: 0.72 }),
  pumpkin: toon(0xe07a2c),
  pumpkinDark: toon(0xc25f21),
  apple: toon(0xd6392b),

/* =========================================================
   4. 底座 / 地形 / 溪流
   ========================================================= */
const HALF = 13;
const streamPts = [
  [8.1, -13.4], [8.9, -9.5], [9.1, -4.5], [9.1, 1.0], [9.1, 6.5], [8.6, 10.5], [8.1, 13.4]
];
const STREAM_W = 2.7;
let waterMesh, waterBaseY;

/* 底座：实心方台 + 表面溪流 */
(function buildBase() {
  const shape = new THREE.Shape();
  shape.moveTo(-HALF, -HALF);
  shape.lineTo(HALF, -HALF);
  shape.lineTo(HALF, HALF);
  shape.lineTo(-HALF, HALF);
  shape.closePath();

  const geo = new THREE.ExtrudeGeometry(shape, { depth: 1.25, bevelEnabled: false, curveSegments: 2 });
  geo.rotateX(Math.PI / 2);

  const slab = new THREE.Mesh(geo, [M.grass, M.soil]);
  slab.receiveShadow = true;
  slab.castShadow = false;
  scene.add(slab);

  /* 木制底座 */
  const p1 = box(27.2, 0.95, 27.2, M.woodDark, 0, -1.72, 0);
  p1.castShadow = true;
  const p2 = box(27.9, 0.36, 27.9, toon(0x6a4529), 0, -2.38, 0);
  p2.castShadow = true;
  const p3 = box(28.4, 0.16, 28.4, toon(0x543620), 0, -2.62, 0);

  const curve = new THREE.CatmullRomCurve3(streamPts.map(p => new THREE.Vector3(p[0], 0, p[1])), false, 'catmullrom', 0.5);

  /* 湿润泥岸 */
  const bankGeo = ribbon(streamPts, STREAM_W + 0.95, 0.004, 90, 1);
  const bank = new THREE.Mesh(bankGeo.geo, toon(0xb8935f, { map: Object.assign(dirtTex, { repeat: new THREE.Vector2(1.2, 4) }) }));
  bank.receiveShadow = true;
  scene.add(bank);

  /* 水面 */
  const wg = ribbon(streamPts, STREAM_W, 0.085, 140, 0.45);
  waterMesh = new THREE.Mesh(wg.geo, new THREE.MeshPhongMaterial({
    color: 0xffffff, map: Object.assign(waterTex, { repeat: new THREE.Vector2(1, 7) }),
    transparent: true, opacity: 0.92, shininess: 150, specular: 0xeaffff
  }));
  waterMesh.receiveShadow = true;
  scene.add(waterMesh);
  waterBaseY = Float32Array.from(wg.geo.attributes.position.array);

  /* 岸边卵石 */
  for (let i = 0; i < 70; i++) {
    const t = i / 70;
    const p = curve.getPointAt(t), tan = curve.getTangentAt(t);
    const nx = -tan.z, nz = tan.x, l = Math.hypot(nx, nz) || 1;
    const side = i % 2 === 0 ? 1 : -1;
    const off = STREAM_W / 2 + R(0.05, 0.55);
    const r = R(0.08, 0.2);
    const s = new THREE.Mesh(new THREE.DodecahedronGeometry(r, 0), rnd() > 0.5 ? M.stone : toon(0xa8a29a));
    s.position.set(p.x + (nx / l) * off * side, 0.02 + R(-0.01, 0.08), p.z + (nz / l) * off * side);
    s.rotation.set(R(0, 3), R(0, 3), R(0, 3));
    s.scale.y = 0.55;
    s.castShadow = true; s.receiveShadow = true;
    scene.add(s);
  }
  /* 水中小石头 */
  for (let i = 0; i < 18; i++) {
    const t = R(0.05, 0.95);
    const p = curve.getPointAt(t), tan = curve.getTangentAt(t);
    const nx = -tan.z, nz = tan.x, l = Math.hypot(nx, nz) || 1;
    const off = R(-0.7, 0.7);
    const r = R(0.06, 0.13);
    const s = new THREE.Mesh(new THREE.DodecahedronGeometry(r, 0), toon(0x8fa3a6));
    s.position.set(p.x + (nx / l) * off, 0.01, p.z + (nz / l) * off);
    s.scale.y = 0.5;
    s.castShadow = false;
    scene.add(s);
  }
})();

const roadPts = [[-5.4, 13.5], [-5.0, 10.5], [-4.3, 7.4], [-3.0, 5.0], [-1.2, 3.6], [0.4, 2.9]];
(function buildRoad() {

/* 草地散布 / 野花 */
(function scatter() {
  const blocked = (x, z) => {
    if (Math.abs(x - 9.1) < 2.3) return true;                                  // 溪流
    if (x > -9.4 && x < 3.4 && z > -6.6 && z < 2.6) return true;              // 谷仓
    if (x > 1.2 && x < 8.0 && z > -5.4 && z < 2.2) return true;               // 工坊
    if (x > -7.2 && x < 1.6 && z > 2.0 && z < 6.0) return true;               // 门前路
    if (x > -7.6 && x < -2.6 && z > 4.4 && z < 12.6) return true;             // 土路
    if (x > -12.8 && x < -6.0 && z > -2.6 && z < 3.4) return true;            // 菜畦
    if (x > -11.4 && x < -7.2 && z > -10.4 && z < -6.4) return true;          // 草垛
    return false;
  };
  const tuftGeo = new THREE.ConeGeometry(0.075, 0.34, 3);
  tuftGeo.translate(0, 0.17, 0);
  const tuftMat = toon(0x6ea845);
  const tufts = new THREE.InstancedMesh(tuftGeo, tuftMat, 420);
  tufts.castShadow = false; tufts.receiveShadow = true;
  const d = new THREE.Object3D();
  let n = 0, guard = 0;
  while (n < 420 && guard < 6000) {
    guard++;
    const x = R(-12.6, 12.6), z = R(-12.6, 12.6);
    if (blocked(x, z)) continue;
    d.position.set(x, 0, z);
    d.rotation.set(R(-0.15, 0.15), R(0, 6.28), R(-0.15, 0.15));
    d.scale.setScalar(R(0.7, 1.5));
    d.updateMatrix();
    tufts.setMatrixAt(n++, d.matrix);
  }
  tufts.count = n;
  scene.add(tufts);

  /* 野花 */
  const fGeo = new THREE.SphereGeometry(0.042, 6, 5);
  const fMat = toon(0xfdf3d8);
  const flowers = new THREE.InstancedMesh(fGeo, fMat, 110);
  const sGeo = new THREE.CylinderGeometry(0.014, 0.014, 0.22, 3);
  const sMat = toon(0x5f9440);
  const stems = new THREE.InstancedMesh(sGeo, sMat, 110);
  let m = 0; guard = 0;
  while (m < 110 && guard < 4000) {
    guard++;
    const x = R(-12.4, 12.4), z = R(-12.4, 12.4);
    if (blocked(x, z)) continue;
    d.position.set(x, R(0.16, 0.3), z);
    d.rotation.set(0, R(0, 6.28), 0);
    d.scale.setScalar(R(0.7, 1.2));
    d.updateMatrix(); flowers.setMatrixAt(m, d.matrix);
    d.position.set(x, 0.11, z);
    d.updateMatrix(); stems.setMatrixAt(m, d.matrix);
    m++;
  }
  flowers.count = m; stems.count = m;
  flowers.instanceColor = null;
  scene.add(flowers); scene.add(stems);
})();

(function buildBarn() {
  const W = BARN.W, D = BARN.D, H = BARN.H, T = 0.26;
  const doorW = 4.8, doorH = 3.9;

  /* 地面 */
  const fl = box(W - 0.4, 0.14, D - 0.4, M.woodFloor, 0, 0.07, 0, barn);

  /* 后墙 */
  box(W, H, T, M.barnRedIn, 0, H / 2, -D / 2 + T / 2, barn);
  /* 左右墙 */
  box(T, H, D, M.barnRedSide, -W / 2 + T / 2, H / 2, 0, barn);
  box(T, H, D, M.barnRedSide, W / 2 - T / 2, H / 2, 0, barn);
  /* 前墙：门洞两侧 + 上方 */
  box(2.3, H, T, M.barnRed, -3.55, H / 2, D / 2 - T / 2, barn);
  box(2.3, H, T, M.barnRed, 3.55, H / 2, D / 2 - T / 2, barn);
  box(doorW, H - doorH, T, M.barnRed, 0, doorH + (H - doorH) / 2, D / 2 - T / 2, barn);

  /* 山墙三角 */
  const triShape = new THREE.Shape();
  triShape.moveTo(-W / 2, 0);
  triShape.lineTo(W / 2, 0);
  triShape.lineTo(0, BARN.RISE);
  triShape.closePath();
  const triGeo = new THREE.ExtrudeGeometry(triShape, { depth: T, bevelEnabled: false });
  for (const zz of [D / 2 - T, -D / 2]) {
    const g = new THREE.Mesh(triGeo, M.barnRed);
    g.position.set(0, H, zz);
    g.castShadow = true; g.receiveShadow = true;
    barn.add(g);

  /* 屋顶 */
  const over = 0.5, half = W / 2 + over, rise = BARN.RISE;
  const slopeLen = Math.hypot(half, rise);

  for (const s of [-1, 1]) {
    const slab = new THREE.Mesh(new THREE.BoxGeometry(slopeLen, 0.28, D + 1.1), M.roof);
    slab.position.set(s * half / 2, H + rise / 2, 0);
    slab.rotation.z = -s * ang;

    barn.add(slab);
    ol(slab, 0.055);
    /* 白色檐口 */
    const fascia = new THREE.Mesh(new THREE.BoxGeometry(slopeLen, 0.16, 0.14), M.white);
    fascia.position.set(s * half / 2, H + rise / 2 + 0.16, D / 2 + 0.55);
    fascia.rotation.z = -s * ang;
    barn.add(fascia);
    const fascia2 = fascia.clone();
    fascia2.position.z = -D / 2 - 0.55;
    barn.add(fascia2);
  }
  /* 屋脊 */
  const ridge = box(0.42, 0.24, D + 1.15, M.roofDark, 0, H + rise + 0.04, 0, barn);

  /* 白色包角 */
  for (const sx of [-1, 1]) {
    for (const sz of [-1, 1]) {
      const c = box(0.2, H, 0.2, M.white, sx * (W / 2 - 0.02), H / 2, sz * (D / 2 - 0.02), barn);
    }
  }
  /* 前墙腰线 */
  box(W, 0.14, 0.06, M.white, 0, 0.55, D / 2 + 0.01, barn);

  /* 大门框 */
  box(0.2, doorH + 0.2, 0.24, M.white, -doorW / 2 - 0.06, doorH / 2, D / 2 + 0.03, barn);
  box(0.2, doorH + 0.2, 0.24, M.white, doorW / 2 + 0.06, doorH / 2, D / 2 + 0.03, barn);
  box(doorW + 0.5, 0.22, 0.26, M.white, 0, doorH + 0.08, D / 2 + 0.03, barn);

  /* 双开大门 */
  const doorMat = M.barnRed;
  for (const s of [-1, 1]) {
    const pivot = new THREE.Group();
    pivot.position.set(s * doorW / 2, 0, D / 2 - 0.06);
    pivot.rotation.y = s * 1.95;
    barn.add(pivot);
    const panel = new THREE.Mesh(rboxGeo(2.36, doorH - 0.08, 0.12, 0.04), doorMat);

(function buildWheel() {
  const cx = 9.1, cz = 3.6, cy = 1.9, rad = 1.9, wid = 1.05;
  /* 支架 */
  for (const s of [-1, 1]) {
    const bx = cx + s * 1.72;
    for (const sz of [-1, 1]) {
      const post = box(0.22, 2.0, 0.22, M.woodDark, bx, 1.0, cz + sz * 0.85);
      post.rotation.z = s * 0.05;
    }
    box(0.24, 0.24, 2.1, M.woodDark, bx, 1.92, cz);
    /* 斜撑 */
    const br = box(0.14, 1.3, 0.14, M.woodMid, bx - s * 0.5, 0.62, cz + 0.85);
    br.rotation.z = s * 0.6;
  }
  /* 轴 */
  const axle = cyl(0.12, 0.12, 4.0, 8, M.woodMid, cx, cy, cz);
  axle.rotation.z = Math.PI / 2;

  /* 轮子 */
  const wheel = new THREE.Group();
  wheel.position.set(cx, cy, cz);
  scene.add(wheel);
  window.__wheel = wheel;

  for (const s of [-1, 1]) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(rad, 0.1, 6, 30), M.woodMid);
    ring.position.x = s * wid / 2;
    ring.rotation.y = Math.PI / 2;
    ring.castShadow = true;
    wheel.add(ring);
    const ring2 = new THREE.Mesh(new THREE.TorusGeometry(rad * 0.5, 0.075, 6, 22), M.woodDark);
    ring2.position.x = s * wid / 2;
    ring2.rotation.y = Math.PI / 2;
    wheel.add(ring2);
  }
  /* 辐条 */
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * Math.PI * 2;
    for (const s of [-1, 1]) {
      const sp = box(0.08, rad * 1.02, 0.08, M.woodMid,
        s * wid / 2, Math.cos(a) * rad * 0.5, Math.sin(a) * rad * 0.5, wheel);
      sp.rotation.x = a;
    }
  }
  /* 叶片（径向木板） */
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2;
    const rr = rad + 0.06;
    const paddle = box(wid, 0.66, 0.1, M.woodLight,
      0, Math.cos(a) * rr, Math.sin(a) * rr, wheel);
    paddle.rotation.x = a;
    /* 叶片支撑 */
    const brace = box(wid * 0.92, 0.12, 0.12, M.woodDark,
      0, Math.cos(a) * (rad - 0.28), Math.sin(a) * (rad - 0.28), wheel);
    brace.rotation.x = a;
  }
  /* 中央轮毂 */
  const hub = cyl(0.24, 0.24, wid + 0.2, 10, M.woodDark, 0, 0, 0, wheel);
  hub.rotation.z = Math.PI / 2;
  /* 顶部横梁上的小招牌 */
  const sign = box(1.25, 0.4, 0.08, M.woodLight, cx, 2.15, cz + 0.98);
  sign.rotation.x = -0.1;
})();

(function fence() {
  const g = new THREE.Group();
  scene.add(g);
  const post = (x, z, ry = 0) => {

    p.rotation.y = ry;
    const cap = box(0.22, 0.1, 0.22, M.white, x, 1.08, z, g);
    cap.rotation.y = ry;
  };
  const rail = (x1, z1, x2, z2) => {
    const dx = x2 - x1, dz = z2 - z1;
    const len = Math.hypot(dx, dz);
    const ry = -Math.atan2(dz, dx);
    for (const yy of [0.42, 0.82]) {

  const lz = [-11.6, -9.3, -7.0, -4.7, -2.4, -0.1, 2.2, 4.5];
  for (const z of lz) post(-12.3, z);
  for (let i = 0; i < lz.length - 1; i++) rail(-12.3, lz[i], -12.3, lz[i + 1]);
  /* 前侧左段 */
  const fx1 = [-12.3, -10.0, -7.9];
  for (const x of fx1) post(x, 12.3);
  for (let i = 0; i < fx1.length - 1; i++) rail(fx1[i], 12.3, fx1[i + 1], 12.3);
  /* 前侧右段 */
  const fx2 = [-1.6, 1.2, 4.0, 6.8];
  for (const x of fx2) post(x, 12.3);
  for (let i = 0; i < fx2.length - 1; i++) rail(fx2[i], 12.3, fx2[i + 1], 12.3);
  /* 右侧一小段 */
  post(7.4, 12.3);
  rail(6.8, 12.3, 7.4, 12.3);
})();

    { x: 0, z: 0, r: 15 }
  ];
  const spawn = (o) => {
    const zn = rnd() < 0.72 ? pick(zones.slice(0, 4)) : zones[4];
    const a = R(0, Math.PI * 2), rr = Math.sqrt(rnd()) * zn.r;
    o.p.set(zn.x + Math.cos(a) * rr, R(2.5, 9.5), zn.z + Math.sin(a) * rr);
  };
  for (let i = 0; i < N; i++) {
    const o = {
      p: new THREE.Vector3(), v: R(0.22, 0.55), sw: R(0.3, 0.9), ph: R(0, 6.28),
      rx: R(-1.6, 1.6), ry: R(-1.6, 1.6), rz: R(-1.6, 1.6),
      s: R(0.7, 1.3)
    };
    spawn(o);
    o.p.y = R(0.5, 12);
    inst.push(o);
    mesh.setColorAt(i, new THREE.Color(pick(cols)));
  }
  mesh.instanceColor.needsUpdate = true;
  scene.add(mesh);
  const d = new THREE.Object3D();
  return {
    update(t, dt) {
      for (let i = 0; i < N; i++) {
        const o = inst[i];
        o.p.y -= o.v * dt;
        o.p.x += Math.sin(t * 0.9 + o.ph) * o.sw * dt;
        o.p.z += Math.cos(t * 0.7 + o.ph * 1.3) * o.sw * 0.6 * dt;
        if (o.p.y < 0.12) spawn(o);
        d.position.copy(o.p);
        d.rotation.set(o.rx * t + o.ph, o.ry * t, o.rz * t);
        d.scale.setScalar(o.s);
        d.updateMatrix();
        mesh.setMatrixAt(i, d.matrix);
      }
      mesh.instanceMatrix.needsUpdate = true;
    }
  };
})();

/* --- 粒子（炊烟 / 蒸汽 / 水花） --- */
class PuffSystem {
  constructor(origin, count, opts = {}) {
    this.o = origin.clone();
    this.items = [];
    this.count = count;
    this.opts = Object.assign({
      rise: 0.9, drift: 0.35, size: [0.2, 0.75], life: [2.4, 4.0],
      color: 0xffffff, opacity: 0.55, spread: 0.1
    }, opts);
    for (let i = 0; i < count; i++) {
      const mat = new THREE.SpriteMaterial({
        map: puffTex, color: this.opts.color, transparent: true,
        opacity: 0, depthWrite: false, blending: THREE.NormalBlending
      });
      const s = new THREE.Sprite(mat);
      s.scale.setScalar(0.2);
      scene.add(s);
      this.items.push({ s, t: R(0, 1), life: R(...this.opts.life), seed: R(0, 100) });
    }
  }
  update(dt) {
    for (const it of this.items) {
      it.t += dt / it.life;
      if (it.t > 1) it.t -= 1;
      const k = it.t;
      const p = it.s.position;
      p.x = this.o.x + Math.sin(k * 3.1 + it.seed) * this.opts.drift * k;

        break;
      case 'chirp':
        for (var c = 0; c < 2; c++) {
          var tt = t + c * 0.13;
          var oc = ctx.createOscillator(); oc.type = 'sine';
          oc.frequency.setValueAtTime(rnd(1800, 2600), tt);
          oc.frequency.exponentialRampToValueAtTime(rnd(2600, 3600), tt + 0.05);
          oc.frequency.exponentialRampToValueAtTime(rnd(1500, 2000), tt + 0.11);
          var gc = ctx.createGain();
          gc.gain.setValueAtTime(0.0001, tt);
          gc.gain.exponentialRampToValueAtTime(Math.max(gain, 0.0002), tt + 0.012);
          gc.gain.exponentialRampToValueAtTime(0.0001, tt + 0.12);
          oc.connect(gc); gc.connect(dest); oc.start(tt); oc.stop(tt + 0.14);
        }
        break;
      case 'gull':
        o = ctx.createOscillator(); o.type = 'sawtooth';
        o.frequency.setValueAtTime(rnd(700, 900), t);
        o.frequency.exponentialRampToValueAtTime(rnd(380, 520), t + 0.42);
        var gbp = ctx.createBiquadFilter(); gbp.type = 'bandpass'; gbp.frequency.value = 1200; gbp.Q.value = 2.2;
        o.connect(gbp); env(gbp, gain, 0.05, 0, 0.5); o.start(t); o.stop(t + 0.55);
        break;
      case 'steam':
        var s4 = ctx.createBufferSource(); s4.buffer = noiseBuf(ctx, 'white', 0.6); s4.loop = true;
        var hp4 = ctx.createBiquadFilter(); hp4.type = 'highpass'; hp4.frequency.value = 2600;
        s4.connect(hp4); env(hp4, gain * 0.9, 0.12, 0, 0.9); s4.start(t); s4.stop(t + 1.0);
        break;
      case 'buzz':
        o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 120;
        var lpz = ctx.createBiquadFilter(); lpz.type = 'lowpass'; lpz.frequency.value = 900;
        o.connect(lpz); env(lpz, gain * 0.8, 0.02, 0, 0.28); o.start(t); o.stop(t + 0.32);
        break;
      case 'tick':
        o = ctx.createOscillator(); o.type = 'square'; o.frequency.value = rnd(1400, 2000);
        env(o, gain, 0.002, 0, 0.035); o.start(t); o.stop(t + 0.05);
        break;
      case 'paper':
        var s5 = ctx.createBufferSource(); s5.buffer = noiseBuf(ctx, 'white', 0.3); s5.loop = true;
        var bp5 = ctx.createBiquadFilter(); bp5.type = 'bandpass'; bp5.frequency.value = rnd(3000, 6000); bp5.Q.value = 1.6;
        s5.connect(bp5); env(bp5, gain * 1.1, 0.05, 0, 0.38); s5.start(t); s5.stop(t + 0.42);
        break;
      case 'radio':
        o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = rnd(400, 1200);
        var trem = ctx.createGain(); trem.gain.value = 0.5;
        var lfo = ctx.createOscillator(); lfo.type = 'square'; lfo.frequency.value = rnd(3, 9);
        lfo.connect(trem.gain); o.connect(trem); env(trem, gain, 0.03, 0, 0.6);
        o.start(t); lfo.start(t); o.stop(t + 0.65); lfo.stop(t + 0.65);
        break;
      case 'glitch':
        o = ctx.createOscillator(); o.type = 'square'; o.frequency.value = rnd(200, 900);
        env(o, gain, 0.001, 0, 0.06); o.start(t); o.stop(t + 0.08);
        var o4 = ctx.createOscillator(); o4.type = 'square'; o4.frequency.value = rnd(200, 900);
        env(o4, gain * 0.7, 0.001, 0, 0.05); o4.start(t + 0.09); o4.stop(t + 0.16);
        break;
      case 'alarm':
        o = ctx.createOscillator(); o.type = 'sine';
        o.frequency.setValueAtTime(440, t); o.frequency.linearRampToValueAtTime(330, t + 0.9);
        env(o, gain * 0.8, 0.2, 0, 1.0); o.start(t); o.stop(t + 1.05);
        break;
      case 'ice':
        var s6 = ctx.createBufferSource(); s6.buffer = noiseBuf(ctx, 'white', 0.5); s6.loop = true;
        var bp6 = ctx.createBiquadFilter(); bp6.type = 'bandpass'; bp6.frequency.value = rnd(1800, 4200); bp6.Q.value = 3;
        s6.connect(bp6); env(bp6, gain * 1.8, 0.01, 0, 0.45); s6.start(t); s6.stop(t + 0.5);
        break;
      case 'tram':
        o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = rnd(660, 760);
        env(o, gain * 0.9, 0.01, 0, 0.7); o.start(t); o.stop(t + 0.75);
        var o5 = ctx.createOscillator(); o5.type = 'sine'; o5.frequency.value = 520;
        env(o5, gain * 0.5, 0.01, 0, 0.5); o5.start(t + 0.12); o5.stop(t + 0.65);
        break;
      case 'gramo':
        var s7 = ctx.createBufferSource(); s7.buffer = noiseBuf(ctx, 'white', 1.2); s7.loop = true;
        var bp7 = ctx.createBiquadFilter(); bp7.type = 'bandpass'; bp7.frequency.value = 1400; bp7.Q.value = 0.9;
        s7.connect(bp7); env(bp7, gain * 0.5, 0.4, 0, 1.6); s7.start(t); s7.stop(t + 1.7);
        var om = ctx.createOscillator(); om.type = 'triangle'; om.frequency.value = rnd(220, 330);
        var fm = ctx.createBiquadFilter(); fm.type = 'lowpass'; fm.frequency.value = 1400;
        om.connect(fm); env(fm, gain * 0.55, 0.15, 0, 1.4); om.start(t); om.stop(t + 1.5);
        break;
      case 'truck':
        var s8 = ctx.createBufferSource(); s8.buffer = noiseBuf(ctx, 'brown', 1.5); s8.loop = true;
        var lp8 = ctx.createBiquadFilter(); lp8.type = 'lowpass'; lp8.frequency.value = 340;
        s8.connect(lp8); env(lp8, gain * 1.4, 1.2, 0, 3.4); s8.start(t); s8.stop(t + 3.6);
        break;
      case 'frog':
        for (var q = 0; q < 2; q++) {
          var of = ctx.createOscillator(); of.type = 'square'; of.frequency.value = rnd(160, 260);
          var gf = ctx.createGain();
          var tq = t + q * 0.16;
          gf.gain.setValueAtTime(0.0001, tq);
          gf.gain.exponentialRampToValueAtTime(Math.max(gain * 0.5, 0.0002), tq + 0.01);
          gf.gain.exponentialRampToValueAtTime(0.0001, tq + 0.09);
          of.connect(gf); gf.connect(dest); of.start(tq); of.stop(tq + 0.11);
        }
        break;
    }
  }

  /* ---------- 构建整条链路 ---------- */
  function build(ctx, dest, p, offline) {
    var master = ctx.createGain(); master.gain.value = p.g;
    var comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.ratio.value = 3.5; comp.attack.value = 0.01; comp.release.value = 0.3;
    master.connect(comp); comp.connect(dest);

    /* 噪声床 */
    if (p.bed) {
      var b = p.bed;
      var src = ctx.createBufferSource();
      src.buffer = noiseBuf(ctx, b.n, 4); src.loop = true;
      var flt = ctx.createBiquadFilter(); flt.type = b.t; flt.frequency.value = b.f; flt.Q.value = b.q || 0.7;
      var bg = ctx.createGain(); bg.gain.value = b.v;
      src.connect(flt); flt.connect(bg); bg.connect(master);
      if (b.lfo) {
        var l = ctx.createOscillator(); l.type = 'sine'; l.frequency.value = b.lfo[0];
        var lg = ctx.createGain(); lg.gain.value = b.lfo[1] * b.v;
        l.connect(lg); lg.connect(bg.gain); l.start();
      }
      src.start();
    }

    /* 低频 drone */
    if (p.drone) {
      var d = p.drone;
      var dlp = ctx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = d.lp || 300;
      var dg = ctx.createGain(); dg.gain.value = d.v;
      dlp.connect(dg); dg.connect(master);
      for (var i = 0; i < d.f.length; i++) {
        var o = ctx.createOscillator();
        o.type = d.type; o.frequency.value = d.f[i];
        o.detune.value = (i - 1) * 7;
        o.connect(dlp); o.start();
      }
      if (d.lfo) {
        var l2 = ctx.createOscillator(); l2.type = 'sine'; l2.frequency.value = d.lfo[0];
        var lg2 = ctx.createGain(); lg2.gain.value = d.lfo[1] * d.v * 0.8;
        l2.connect(lg2); lg2.connect(dg.gain); l2.start();
      }
    }

    /* 事件调度 */
    var timers = [];
    (p.ev || []).forEach(function (e) {
      var kind = e[0], lo = e[1], hi = e[2], g = e[3];
      if (offline) {
        var t = 0;
        while (t < offline.duration) { t += rnd(lo, hi); if (t < offline.duration) fire(ctx, master, kind, t, g); }
      } else {
        (function loop() {
          var wait = rnd(lo, hi) * 1000;
          timers.push(setTimeout(function () {
            try { fire(ctx, master, kind, ctx.currentTime + 0.02, g); } catch (err) {}
            loop();
          }, wait));
        })();
      }
    });

    return { master: master, stop: function () {
      timers.forEach(clearTimeout);
      try { master.disconnect(); } catch (e) {}
    } };
  }

  /* ---------- 离线渲染（自检用） ---------- */
  function renderOffline(id, secs) {
    var p = PRESETS[id]; if (!p) return Promise.resolve(null);
    var SR = 44100;
    var ctx = new OfflineAudioContext(2, Math.floor(SR * secs), SR);
    build(ctx, ctx.destination, p, { duration: secs - 0.2 });
    return ctx.startRendering().then(function (buf) {
      var d = buf.getChannelData(0), sum = 0, peak = 0;
      for (var i = 0; i < d.length; i++) { sum += d[i] * d[i]; var a = Math.abs(d[i]); if (a > peak) peak = a; }
      return { rms: Math.sqrt(sum / d.length), peak: peak };
    });
  }

  /* ---------- 运行时挂载 ---------- */
  var ctx = null, graph = null, muted = false, btn = null;

  function ui() {
    var css = 'position:fixed;z-index:2147483000;font:12px/1.4 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;'
      + 'right:14px;bottom:14px;padding:7px 12px;border-radius:999px;cursor:pointer;user-select:none;'
      + 'background:rgba(10,12,17,.72);color:#e9ecf3;border:1px solid rgba(255,255,255,.16);'
      + 'backdrop-filter:blur(8px);opacity:.55;transition:opacity .2s';
    btn = document.createElement('div');
    btn.title = '程序化环境声（?nosound=1 可关闭）';
    btn.style.cssText = css;
    btn.textContent = '🔈 点击开启环境声';
    btn.onmouseenter = function () { btn.style.opacity = 1; };
    btn.onmouseleave = function () { if (ctx) btn.style.opacity = .55; };
    btn.onclick = start;
    document.body.appendChild(btn);
  }

  function start() {
    if (ctx) { muted = !muted; if (graph) graph.master.gain.value = muted ? 0 : PRESETS[presetId].g; btn.textContent = muted ? '🔇 环境声已静音' : '🔊 环境声'; return; }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { btn.textContent = '浏览器不支持 Web Audio'; return; }
    ctx = new AC();
    var p = PRESETS[presetId];
    if (!p) { btn.textContent = '（此场景暂无环境声）'; return; }
    graph = build(ctx, ctx.destination, p, false);
    btn.textContent = '🔊 环境声';
    btn.style.opacity = .55;
    if (ctx.state === 'suspended') ctx.resume();
  }

  var presetId = window.__AMB_PRESET__ || null;

  /* ---------- 试听用：多实例 ---------- */
  var sharedCtx = null, instances = [];

  function auditionCtx() {
    if (!sharedCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      sharedCtx = new AC();
    }
    if (sharedCtx.state === 'suspended') sharedCtx.resume();
    return sharedCtx;
  }

  var A = {
    presets: PRESETS,
    play: function (id) {
      var p = PRESETS[id];
      if (!p) return null;
      var c = auditionCtx();
      var g = c.createGain(); g.gain.value = 0.9;
      var comp = c.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.25;
      g.connect(comp); comp.connect(c.destination);
      var h = build(c, g, p, false);
      var inst = {
        id: id,
        volume: function (v) { g.gain.value = v; },
        stop: function () {
          h.stop();
          try { g.disconnect(); comp.disconnect(); } catch (e) {}
          instances = instances.filter(function (x) { return x !== inst; });
        }
      };
      instances.push(inst);
      return inst;
    },
    stopAll: function () { instances.slice().forEach(function (i) { i.stop(); }); },
    active: function () { return instances.map(function (i) { return i.id; }); },
    renderOffline: renderOffline,
    mount: function (id) { presetId = id; },
    start: start,
    state: function () {
      return { preset: presetId, started: !!ctx, ctxState: ctx ? ctx.state : null,
               muted: muted, presetCount: Object.keys(PRESETS).length };
    }
  };
  window.Ambience = A;

  if (!presetId) return;
  if (/(?:^|[?&])nosound=1/.test(location.search)) return;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ui);
  else ui();
})();
</script>
<!-- AMB:end -->
