<script type="importmap">
{
  "imports": {

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ============================================================
   0. 基础环境
   ============================================================ */
const R = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050a12, 0.0062);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.4, 500);
camera.position.set(15.2, 10.8, 19.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.85, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.rotateSpeed = 0.75;
controls.zoomSpeed = 0.85;
controls.minDistance = 11;
controls.maxDistance = 64;
controls.maxPolarAngle = Math.PI * 0.492;
controls.minPolarAngle = 0.12;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.2;

controls.update();

const pmrem = new THREE.PMREMGenerator(renderer);
const envRT = pmrem.fromScene(new RoomEnvironment(), 0.04);
scene.environment = envRT.texture;

/* ---------- 背景穹顶 ---------- */
const bgDome = new THREE.Mesh(
  new THREE.SphereGeometry(240, 32, 20),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      uTop: { value: new THREE.Color(0x0e1c2e) },
      uBot: { value: new THREE.Color(0x02040a) },
      uGlow: { value: new THREE.Color(0x14456e) }
    },
    vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `
      varying vec3 vP; uniform vec3 uTop; uniform vec3 uBot; uniform vec3 uGlow;
      void main(){
        vec3 d = normalize(vP);
        float h = d.y * 0.5 + 0.5;
        vec3 c = mix(uBot, uTop, pow(h, 1.35));
        float g = pow(max(0.0, 1.0 - length(d.xz) * 1.25), 2.5) * smoothstep(0.55, -0.25, d.y);
        c += uGlow * g * 0.75;
        gl_FragColor = vec4(c, 1.0);
      }`
  })
);
scene.add(bgDome);

/* ---------- 灯光 ---------- */
scene.add(new THREE.HemisphereLight(0xa8d4ff, 0x04090f, 0.1));

const keyLight = new THREE.DirectionalLight(0xffffff, 2.05);
keyLight.position.set(25, 13, 11);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -19;
keyLight.shadow.camera.right = 19;
keyLight.shadow.camera.top = 19;
keyLight.shadow.camera.bottom = -19;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 90;
keyLight.shadow.bias = -0.0006;
keyLight.shadow.normalBias = 0.028;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x63b4ff, 0.42);
fillLight.position.set(-22, 9, -14);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xff6a20, 0.6);
rimLight.position.set(2, 6, -24);
scene.add(rimLight);

const coolRim = new THREE.DirectionalLight(0x4fa8ff, 1.15);
coolRim.position.set(-16, 7, -20);
scene.add(coolRim);

const coreLight = new THREE.PointLight(0x3aa8ff, 14, 20, 2);
coreLight.position.set(0, 3.5, 0);
scene.add(coreLight);

const warnLight = new THREE.PointLight(0xff3020, 7, 24, 2);
warnLight.position.set(0, 6.5, 0);
scene.add(warnLight);

const labBlue1 = new THREE.PointLight(0x3fa8ff, 10, 15, 2);
labBlue1.position.set(-5.2, 3.4, -5.0);
scene.add(labBlue1);
const labBlue2 = new THREE.PointLight(0x2f8fe0, 9, 15, 2);
labBlue2.position.set(5.0, 3.2, 4.6);
scene.add(labBlue2);
const labWarm = new THREE.PointLight(0xff7a30, 6, 12, 2);
labWarm.position.set(0, 1.2, 6.4);
scene.add(labWarm);

[[-4.6, 1.6, -5.0], [-1.6, 1.6, -5.6], [2.0, 1.6, -5.4]].forEach(([x, y, z]) => {
  const l = new THREE.PointLight(0x6ec8ff, 5.5, 7.5, 2);
  l.position.set(x, y, z);
  scene.add(l);
});

/* ============================================================
   1. 程序化贴图
   ============================================================ */
function canvasTex(w, h, draw, rep) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  draw(ctx, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); }
  return t;
}

/* 底座顶面：无菌白瓷拼接板 */
const texBaseTop = canvasTex(1024, 1024, (ctx, w, h) => {
  ctx.fillStyle = '#eef3f8'; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 6000; i++) {
    ctx.fillStyle = `rgba(${180 + Math.random() * 40 | 0},${196 + Math.random() * 35 | 0},${212 + Math.random() * 30 | 0},0.22)`;
    ctx.fillRect(Math.random() * w, Math.random() * h, 3, 2);
  }
  ctx.strokeStyle = 'rgba(108,138,164,0.45)'; ctx.lineWidth = 3;
  for (let i = 0; i <= 8; i++) {
    const p = i * w / 8;
    ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(w, p); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(150,180,205,0.55)'; ctx.lineWidth = 1.2;
  for (let i = 0; i < 64; i++) {
    const x = Math.random() * w, y = Math.random() * h, l = R(20, 90);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + l, y); ctx.stroke();
  }
  // 中央圆形嵌线
  ctx.strokeStyle = 'rgba(96,132,160,0.35)'; ctx.lineWidth = 2;
  [0.30, 0.47].forEach(rr => { ctx.beginPath(); ctx.arc(w / 2, h / 2, w * rr, 0, TAU); ctx.stroke(); });
}, [1, 1]);

/* 实验室地面：洁净室地砖 */
const texFloor = canvasTex(1024, 1024, (ctx, w, h) => {
  ctx.fillStyle = '#f2f6fa'; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 8000; i++) {
    ctx.fillStyle = `rgba(${190 + Math.random() * 40 | 0},${204 + Math.random() * 32 | 0},${218 + Math.random() * 26 | 0},0.18)`;
    ctx.fillRect(Math.random() * w, Math.random() * h, 2, 2);
  }
  ctx.strokeStyle = 'rgba(112,144,170,0.5)'; ctx.lineWidth = 3.5;
  for (let i = 0; i <= 4; i++) {
    const p = i * w / 4;
    ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(w, p); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(140,170,196,0.35)'; ctx.lineWidth = 1;
  for (let i = 0; i <= 16; i++) {
    const p = i * w / 16;
    ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(w, p); ctx.stroke();
  }
  // 角落编号
  ctx.fillStyle = 'rgba(120,150,178,0.5)'; ctx.font = 'bold 18px Arial';
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) ctx.fillText(`C${i}${j}`, i * w / 4 + 14, j * h / 4 + 26);
}, [1, 1]);

/* 时空坍塌露出的幽蓝数据网格层 */
const texGrid = canvasTex(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#03101c'; ctx.fillRect(0, 0, w, h);
  const g = ctx.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, 'rgba(20,90,150,0.35)'); g.addColorStop(1, 'rgba(6,30,54,0.1)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(70,190,255,0.42)'; ctx.lineWidth = 1.4;
  for (let i = 0; i <= 16; i++) {
    const p = i * w / 16;
    ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(w, p); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(120,225,255,0.9)'; ctx.lineWidth = 2.6;
  for (let i = 0; i <= 4; i++) {
    const p = i * w / 4;
    ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(w, p); ctx.stroke();
  }
  for (let i = 0; i < 26; i++) {
    const x = Math.floor(R(0, 16)) * w / 16, y = Math.floor(R(0, 16)) * h / 16;
    const bw = Math.floor(R(1, 4)) * w / 16, bh = Math.floor(R(1, 3)) * h / 16;
    ctx.fillStyle = `rgba(${40 + Math.random() * 40 | 0},${150 + Math.random() * 90 | 0},255,${R(0.08, 0.3)})`;
    ctx.fillRect(x + 2, y + 2, bw - 4, bh - 4);
  }
  for (let i = 0; i < 40; i++) {
    ctx.fillStyle = `rgba(150,235,255,${R(0.3, 0.9)})`;
    ctx.fillRect(Math.floor(R(0, 32)) * w / 32, Math.floor(R(0, 32)) * h / 32, 4, 4);
  }
}, [1, 1]);

/* 电路板 */
const texCircuit = canvasTex(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#0a1622'; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 90; i++) {
    let x = R(0, w), y = R(0, h);
    ctx.strokeStyle = `rgba(${40 + Math.random() * 40 | 0},${140 + Math.random() * 80 | 0},${200 + Math.random() * 55 | 0},${R(0.25, 0.7)})`;
    ctx.lineWidth = R(1, 2.4);
    ctx.beginPath(); ctx.moveTo(x, y);
    for (let s = 0; s < 4; s++) {
      if (Math.random() > 0.5) x += R(-90, 90); else y += R(-90, 90);
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  for (let i = 0; i < 16; i++) {
    const x = R(30, w - 90), y = R(30, h - 70), bw = R(30, 80), bh = R(24, 54);
    ctx.fillStyle = '#0d2033'; ctx.fillRect(x, y, bw, bh);
    ctx.strokeStyle = 'rgba(90,200,255,0.6)'; ctx.lineWidth = 1.4; ctx.strokeRect(x, y, bw, bh);
    ctx.fillStyle = 'rgba(120,220,255,0.75)';
    for (let p = 0; p < 6; p++) ctx.fillRect(x + 4 + p * (bw - 8) / 6, y + bh - 5, 3, 3);
  }
  ctx.fillStyle = 'rgba(255,150,60,0.85)';
  for (let i = 0; i < 22; i++) ctx.fillRect(R(0, w), R(0, h), 4, 4);
}, [1, 1]);

/* 全息诊断界面 */
function holoTex(title, seed) {
  return canvasTex(512, 512, (ctx, w, h) => {
    ctx.fillStyle = '#000308'; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(96,214,255,0.85)'; ctx.lineWidth = 2.5;
    ctx.strokeRect(12, 12, w - 24, h - 24);
    ctx.fillStyle = 'rgba(30,140,200,0.35)'; ctx.fillRect(12, 12, w - 24, 46);
    ctx.fillStyle = '#8fe6ff'; ctx.font = 'bold 26px Arial';
    ctx.fillText(title, 26, 46);
    ctx.fillStyle = 'rgba(255,150,60,0.9)'; ctx.fillRect(w - 96, 24, 70, 22);
    ctx.fillStyle = '#04121e'; ctx.font = 'bold 15px Arial'; ctx.fillText('LIVE', w - 84, 40);

    // 波形
    ctx.strokeStyle = 'rgba(110,225,255,0.9)'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let x = 30; x < w - 30; x += 4) {
      const y = 210 + Math.sin(x * 0.06 + seed) * 26 * Math.sin(x * 0.013 + seed * 0.7) + Math.sin(x * 0.21) * 5;
      if (x === 30) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,140,60,0.65)'; ctx.lineWidth = 1.6;
    ctx.beginPath();
    for (let x = 30; x < w - 30; x += 5) {
      const y = 210 + Math.cos(x * 0.04 + seed * 1.7) * 34;
      if (x === 30) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // 数据条
    for (let i = 0; i < 7; i++) {
      const y = 90 + i * 22;
      ctx.fillStyle = 'rgba(90,190,240,0.5)'; ctx.fillRect(28, y, 90, 8);
      ctx.fillStyle = 'rgba(140,235,255,0.95)'; ctx.fillRect(28, y, 30 + Math.abs(Math.sin(seed + i)) * 60, 8);
    }
    // 柱状
    for (let i = 0; i < 12; i++) {
      const bh = 20 + Math.abs(Math.sin(seed * 1.3 + i * 0.8)) * 70;
      ctx.fillStyle = i % 4 === 0 ? 'rgba(255,150,60,0.75)' : 'rgba(80,200,255,0.55)';
      ctx.fillRect(300 + i * 15, 300 - bh, 9, bh);
    }
    // 表格
    ctx.strokeStyle = 'rgba(90,200,255,0.45)'; ctx.lineWidth = 1;
    for (let i = 0; i < 8; i++) {
      ctx.beginPath(); ctx.moveTo(28, 320 + i * 20); ctx.lineTo(280, 320 + i * 20); ctx.stroke();
    }
    for (let i = 0; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo(28 + i * 50, 320); ctx.lineTo(28 + i * 50, 460); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(140,230,255,0.8)';
    for (let i = 0; i < 30; i++) ctx.fillRect(34 + (i % 5) * 50, 330 + Math.floor(i / 5) * 20, R(16, 40), 7);
    ctx.fillStyle = 'rgba(255,150,60,0.9)';
    ctx.font = 'bold 20px Arial';
    ctx.fillText('STUTTER  0.00' + (seed * 7 % 9 | 0), 300, 420);
    ctx.fillStyle = 'rgba(120,225,255,0.75)';
    ctx.font = '15px Arial';
    for (let i = 0; i < 5; i++) ctx.fillText('SEQ ' + (100 + i * 7) + ' :: LOCKED', 300, 450 + i * 14);
  });
}

/* 科研档案纸 */
const texPaper = canvasTex(512, 680, (ctx, w, h) => {
  ctx.fillStyle = '#f6f7f4'; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(120,150,175,0.12)'; ctx.fillRect(0, 0, w, 46);
  ctx.fillStyle = '#2a3a4a'; ctx.font = 'bold 19px Arial';
  ctx.fillText('MONACH / STUTTER PROTOCOL', 28, 32);
  ctx.fillStyle = 'rgba(60,80,100,0.75)';
  for (let i = 0; i < 26; i++) {
    const y = 78 + i * 15;
    if (y > h - 90) break;
    let x = 28;
    while (x < w - 40) {
      const l = R(30, 120);
      ctx.fillRect(x, y, Math.min(l, w - 40 - x), 5);
      x += l + 10;
      if (Math.random() > 0.88) break;
    }
  }
  ctx.strokeStyle = 'rgba(70,90,110,0.45)'; ctx.lineWidth = 1.4;
  for (let i = 0; i < 8; i++) {
    ctx.beginPath(); ctx.moveTo(28, 430 + i * 22); ctx.lineTo(w - 28, 430 + i * 22); ctx.stroke();
  }
  for (let i = 0; i < 5; i++) {
    ctx.beginPath(); ctx.moveTo(28 + i * 110, 430); ctx.lineTo(28 + i * 110, 584); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(60,80,100,0.55)';
  for (let i = 0; i < 20; i++) ctx.fillRect(34 + (i % 4) * 110, 442 + Math.floor(i / 4) * 22, R(20, 70), 6);
  ctx.strokeStyle = 'rgba(190,50,40,0.55)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(w - 110, h - 100, 52, 0, TAU); ctx.stroke();
  ctx.fillStyle = 'rgba(190,50,40,0.55)'; ctx.font = 'bold 15px Arial';
  ctx.fillText('HALT', w - 137, h - 96);
  ctx.fillText('UNIT 07', w - 145, h - 76);
}, [1, 1]);

/* 底座刻字 */
const texLogo = canvasTex(1024, 256, (ctx, w, h) => {
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(26,48,68,0.62)';
  ctx.font = 'bold 128px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('M O N A C H', w / 2, 132);
  ctx.fillStyle = 'rgba(26,48,68,0.42)';
  ctx.font = 'bold 30px Arial';
  ctx.fillText('STUTTER  RESEARCH  DIVISION   /   UNIT  07', w / 2, 190);
  ctx.strokeStyle = 'rgba(26,48,68,0.3)';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(150, 214); ctx.lineTo(w - 150, 214); ctx.stroke();
  ctx.fillStyle = 'rgba(255,120,40,0.85)';
  ctx.fillRect(150, 208, 90, 10);
});

/* 铭牌 */
const texPlaque = canvasTex(512, 128, (ctx, w, h) => {
  ctx.fillStyle = '#dfe8f0'; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#12222f'; ctx.font = 'bold 54px Arial';
  ctx.fillText('MONACH', 26, 74);
  ctx.fillStyle = 'rgba(20,40,58,0.75)'; ctx.font = 'bold 22px Arial';
  ctx.fillText('STUTTER  CHAMBER  /  UNIT 07', 28, 106);
  ctx.fillStyle = 'rgba(255,120,40,0.95)'; ctx.fillRect(26, 16, 8, 78);
}, [1, 1]);

/* 径向辉光 */
const texGlow = canvasTex(256, 256, (ctx, w, h) => {
  const g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  g.addColorStop(0, 'rgba(255,255,255,0.95)');
  g.addColorStop(0.25, 'rgba(255,255,255,0.45)');
  g.addColorStop(0.6, 'rgba(255,255,255,0.12)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
});

/* 径向阴影 */
const texShadow = canvasTex(256, 256, (ctx, w, h) => {
  const g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  g.addColorStop(0, 'rgba(0,0,0,0.62)');
  g.addColorStop(0.45, 'rgba(0,0,0,0.30)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
});

/* ============================================================
   2. 材质库
   ============================================================ */
const MAT = {
  white: new THREE.MeshPhysicalMaterial({ color: 0xe8eef6, metalness: 0.3, roughness: 0.2, clearcoat: 0.55, clearcoatRoughness: 0.22, envMapIntensity: 0.32 }),
  machine: new THREE.MeshPhysicalMaterial({ color: 0xc4d1de, metalness: 0.35, roughness: 0.26, clearcoat: 0.4, clearcoatRoughness: 0.2, envMapIntensity: 0.35 }),
  whiteMatte: new THREE.MeshPhysicalMaterial({ color: 0xd7e0ea, metalness: 0.16, roughness: 0.44, clearcoat: 0.5, envMapIntensity: 0.26 }),
  whiteGloss: new THREE.MeshPhysicalMaterial({ color: 0xf2f7fd, metalness: 0.42, roughness: 0.16, clearcoat: 0.35, clearcoatRoughness: 0.25, envMapIntensity: 0.5 }),
  metal: new THREE.MeshStandardMaterial({ color: 0x9aacbd, metalness: 0.96, roughness: 0.26, envMapIntensity: 0.55 }),
  darkMetal: new THREE.MeshStandardMaterial({ color: 0x1c2836, metalness: 0.9, roughness: 0.36, envMapIntensity: 1.1 }),
  darkPanel: new THREE.MeshStandardMaterial({ color: 0x0f1a25, metalness: 0.55, roughness: 0.55 }),
  rubber: new THREE.MeshStandardMaterial({ color: 0x0a1219, metalness: 0.2, roughness: 0.85 }),
  glass: new THREE.MeshPhysicalMaterial({
    color: 0xc9e8ff, metalness: 0, roughness: 0.02, transparent: true, opacity: 0.06, specularIntensity: 0.28, clearcoat: 0,
    clearcoat: 1, clearcoatRoughness: 0.02, side: THREE.DoubleSide, depthWrite: false, envMapIntensity: 0.85
  }),
  glassChamber: new THREE.MeshPhysicalMaterial({
    color: 0x63bff5, metalness: 0, roughness: 0.09, transparent: true, opacity: 0.24, specularIntensity: 0.3, clearcoat: 0.25, clearcoatRoughness: 0.25,
    clearcoat: 1, clearcoatRoughness: 0.02, side: THREE.DoubleSide, depthWrite: false, envMapIntensity: 1.4
  }),
  blueGlow: new THREE.MeshStandardMaterial({ color: 0x0a1e2e, emissive: 0x3fb6ff, emissiveIntensity: 10.0, roughness: 0.35, metalness: 0.2 }),
  blueSoft: new THREE.MeshStandardMaterial({ color: 0x0d2233, emissive: 0x2f9ee0, emissiveIntensity: 6.0, roughness: 0.4, metalness: 0.2 }),

function addEdges(mesh, color = 0x142c3d, opacity = 0.55, threshold = 25) {
  const eg = new THREE.EdgesGeometry(mesh.geometry, threshold);
  const line = new THREE.LineSegments(eg, new THREE.LineBasicMaterial({ color, transparent: true, opacity }));
  line.raycast = () => {};
  mesh.add(line);
  return line;
}

function box(w, h, d, mat, x = 0, y = 0, z = 0, parent) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}

function cyl(rt, rb, h, seg, mat, x = 0, y = 0, z = 0, parent) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}

function contactShadow(x, z, r, opacity = 0.75, y = 0.028) {
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(r * 2, r * 2),
    new THREE.MeshBasicMaterial({ map: texShadow, transparent: true, opacity, depthWrite: false, color: 0x000000 })
  );
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, y, z);
  m.renderOrder = 1;
  return m;
}

function glowPool(x, z, r, color, opacity, y = 0.032) {
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(r * 2, r * 2),
    new THREE.MeshBasicMaterial({ map: texGlow, color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false })
  );
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, y, z);
  return m;
}

  // 通风栅

  // 边缘螺栓带
  for (let i = 0; i < 4; i++) {

  // 台面拼缝
  for (let i = 0; i < 4; i++) {
    const t = -half + 1.4 + i * 4.2;
    box(0.02, 0.006, B - 2.2, MAT.darkPanel, t, 0.011, 0, g);

  // 底座刻字
  const logo = new THREE.Mesh(

  logo.rotation.x = -Math.PI / 2;
  logo.position.set(0, 0.008, 8.45);

  logo2.position.set(-8.75, 0.008, 0);

  // 铭牌（正面）
  const plaque = new THREE.Mesh(new THREE.PlaneGeometry(1.7, 0.425), new THREE.MeshStandardMaterial({ map: texPlaque, roughness: 0.5, metalness: 0.2 }));

}

const WALL = 7.6;
const WALL_H = 7.5;

function buildShell() {
  const g = new THREE.Group();
  world.add(g);

  // 地面
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(15.1, 15.1),
    new THREE.MeshPhysicalMaterial({ map: texFloor, color: 0x7d93aa, metalness: 0.72, roughness: 0.075, clearcoat: 1, clearcoatRoughness: 0.04, envMapIntensity: 1.25 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = 0.02;
  floor.receiveShadow = true;
  g.add(floor);

  // 地沟 / 边条
  const gutter = box(15.6, 0.12, 15.6, MAT.darkMetal, 0, -0.08, 0, g);
  gutter.receiveShadow = true;

  // 室内踢脚灯带
  const skirtMat = new THREE.MeshStandardMaterial({ color: 0x0b1a28, emissive: 0x4fc4ff, emissiveIntensity: 1.5, roughness: 0.4 });
  [[0, -7.44, 14.6, 0.05], [0, 7.44, 14.6, 0.05], [-7.44, 0, 0.05, 14.6], [7.44, 0, 0.05, 14.6]].forEach(([x, z, w, d]) => {
    box(w || 0.05, 0.05, d || 0.05, skirtMat, x, 0.12, z, g);
  });
  // 地面嵌线
  const floorLine = new THREE.MeshStandardMaterial({ color: 0x101c28, emissive: 0x2f7fb8, emissiveIntensity: 0.7, roughness: 0.6 });
  [[0, 3.6, 13.4, 0.035], [0, -3.6, 13.4, 0.035], [3.6, 0, 0.035, 13.4], [-3.6, 0, 0.035, 13.4]].forEach(([x, z, w, d]) => {
    box(w || 0.035, 0.012, d || 0.035, floorLine, x, 0.028, z, g);
  });

  // 三面玻璃幕墙
  function wallPanels(axis, sign) {
    const len = 15.2, panels = 4, pw = len / panels;
    for (let i = 0; i < panels; i++) {
      const off = -len / 2 + pw * (i + 0.5);
      const geo = new THREE.BoxGeometry(pw - 0.16, WALL_H - 0.3, 0.07);
      const m = new THREE.Mesh(geo, MAT.glass);
      if (axis === 'z') { m.position.set(off, WALL_H / 2, sign * WALL); }
      else { m.position.set(sign * WALL, WALL_H / 2, off); m.rotation.y = Math.PI / 2; }
      g.add(m);
      const e = addEdges(m, 0x86d4ff, 0.35, 30);
      e.material.opacity = 0.3;
    }
    // 竖梃
    for (let i = 0; i <= panels; i++) {
      const off = -len / 2 + pw * i;
      const p = box(0.17, WALL_H, 0.17, MAT.whiteGloss, axis === 'z' ? off : sign * WALL, WALL_H / 2, axis === 'z' ? sign * WALL : off, g);
      addEdges(p, 0x2a4a63, 0.45);
    }
    // 横梃
    [4.35].forEach(y => {
      const b = box(axis === 'z' ? len : 0.13, 0.11, axis === 'z' ? 0.13 : len, MAT.white, axis === 'z' ? 0 : sign * WALL, y, axis === 'z' ? sign * WALL : 0, g);
    });
    // 底槛 / 顶梁
    box(axis === 'z' ? len + 0.4 : 0.34, 0.3, axis === 'z' ? 0.34 : len + 0.4, MAT.white, axis === 'z' ? 0 : sign * WALL, 0.15, axis === 'z' ? sign * WALL : 0, g);
    const cap = box(axis === 'z' ? len + 0.4 : 0.4, 0.34, axis === 'z' ? 0.4 : len + 0.4, MAT.whiteMatte, axis === 'z' ? 0 : sign * WALL, WALL_H - 0.05, axis === 'z' ? sign * WALL : 0, g);
    addEdges(cap, 0x2a4a63, 0.5);
  }
  wallPanels('z', -1);
  wallPanels('x', -1);
  wallPanels('x', 1);

  // 天花梁
  [-7.6, -2.5, 2.5].forEach(z => {
    const b = box(15.5, 0.32, 0.34, MAT.white, 0, WALL_H + 0.16, z, g);
    addEdges(b, 0x2a4a63, 0.5);
  });
  [-7.6, 7.6].forEach(x => {
    box(0.34, 0.3, 15.5, MAT.white, x, WALL_H + 0.16, 0, g);
  });
  // 顶部斜撑
  for (let i = 0; i < 3; i++) {
    const z = -7.6 + i * 5.05;
    box(15.4, 0.07, 0.07, MAT.metal, 0, WALL_H + 0.44, z, g);
  }

  // 顶灯带
  [-7.6, -2.5, 2.5].forEach((z, idx) => {
    const strip = box(12.4, 0.05, 0.16, new THREE.MeshStandardMaterial({ color: 0x0a1826, emissive: 0xd8f0ff, emissiveIntensity: 2.2 }), 0, WALL_H - 0.01, z, g);
  });

  // 应急警示灯
  const lampPositions = [
    [-5.4, WALL_H - 0.28, -2.5], [5.4, WALL_H - 0.28, -2.5],
    [-5.4, WALL_H - 0.28, 2.5], [5.4, WALL_H - 0.28, 2.5]
  ];
  const lamps = [];
  const lampGlows = [];
  lampPositions.forEach(([x, y, z]) => {
    const housing = cyl(0.26, 0.3, 0.2, 16, MAT.white, x, y, z, g);
    addEdges(housing, 0x2a4a63, 0.4);
    const mat = new THREE.MeshStandardMaterial({ color: 0x200a0a, emissive: 0xff2a1e, emissiveIntensity: 3, roughness: 0.25, metalness: 0.1 });
    const dome = new THREE.Mesh(new THREE.SphereGeometry(0.19, 20, 12, 0, TAU, 0, Math.PI / 2), mat);
    dome.rotation.x = Math.PI;
    dome.position.set(x, y - 0.1, z);
    g.add(dome);
    const rod = cyl(0.035, 0.035, 0.34, 8, MAT.metal, x, y + 0.24, z, g);
    const glowMat = new THREE.SpriteMaterial({ map: texGlow, color: 0xff2a1e, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.8 });
    const spr = new THREE.Sprite(glowMat);
    spr.scale.set(1.25, 1.25, 1);
    spr.position.set(x, y - 0.16, z);
    g.add(spr);
    lamps.push(mat);
    lampGlows.push(glowMat);
  });

  // 墙面设备
  const wallScreen = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 1.5), new THREE.MeshBasicMaterial({ map: holoTex('DIAG // WALL-02', 3.1), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.9 }));
  wallScreen.position.set(-3.4, 4.4, -7.48);
  g.add(wallScreen);
  const wallScreen2 = new THREE.Mesh(new THREE.PlaneGeometry(1.7, 1.1), new THREE.MeshBasicMaterial({ map: holoTex('STUTTER LOG', 7.4), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.85 }));
  wallScreen2.position.set(3.6, 4.2, -7.48);
  g.add(wallScreen2);

  // 墙面橙色标识带
  const signMat = new THREE.MeshStandardMaterial({ color: 0x2a1206, emissive: 0xff7a22, emissiveIntensity: 2.4, roughness: 0.5 });
  for (let i = 0; i < 3; i++) {
    box(1.5, 0.07, 0.03, signMat, -5.2 + i * 5.2, 5.6, -7.5, g);
    box(0.03, 0.07, 1.5, signMat, -7.5, 5.6, -3.2 + i * 3.4, g);
    box(0.03, 0.07, 1.5, signMat, 7.5, 5.6, -3.2 + i * 3.4, g);
  }

  // 墙面管线
  for (let i = 0; i < 4; i++) {
    const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 14.6, 10), MAT.metal);
    pipe.rotation.z = Math.PI / 2;
    pipe.position.set(0, 6.55 + (i % 2) * 0.22, -7.34 + i * 0.16);
    g.add(pipe);
  }
  for (let i = 0; i < 6; i++) {
    box(0.2, 0.5, 0.2, MAT.darkMetal, -6.8 + i * 2.6, 6.45, -7.42, g);
  }

  return { group: g, lamps, lampGlows };
}

  // 上部深色环带（打断白色体量）

  const upRing = new THREE.Mesh(new THREE.TorusGeometry(3.0, 0.028, 6, 72), new THREE.MeshStandardMaterial({ color: 0x1a1004, emissive: 0xff7a22, emissiveIntensity: 1.5, roughness: 0.5 }));
  upRing.rotation.x = Math.PI / 2; upRing.position.y = 6.11; g.add(upRing);
  for (let i = 0; i < 20; i++) {
    const a = i / 20 * TAU;
    const v = box(0.34, 0.5, 0.09, MAT.darkPanel, Math.cos(a) * 2.93, 5.72, Math.sin(a) * 2.93, g);
    v.rotation.y = -a + Math.PI / 2;
  }
  // 顶部橙环
  const ring3 = new THREE.Mesh(new THREE.RingGeometry(2.62, 2.7, 96), MAT.orangeGlow);
  ring3.rotation.x = -Math.PI / 2; ring3.position.y = 6.16; g.add(ring3);

  // 顶盖：机械冠
  const cap = cyl(2.7, 2.95, 0.5, 64, MAT.machine, 0, 6.4, 0, g);
  addEdges(cap, 0x142c3d, 0.6, 40);

  // 盖底：暗色结构盘 + 放射肋 + 环形灯
  const underCap = new THREE.Mesh(new THREE.RingGeometry(1.05, 2.78, 64), MAT.darkPanel);
  underCap.rotation.x = Math.PI / 2; underCap.position.y = 6.148; g.add(underCap);
  for (let i = 0; i < 14; i++) {
    const a2 = i / 14 * TAU;
    const rib = box(1.55, 0.16, 0.1, MAT.darkMetal, Math.cos(a2) * 1.95, 6.24, Math.sin(a2) * 1.95, g);
    rib.rotation.y = -a2;
  }
  const underRing = new THREE.Mesh(new THREE.RingGeometry(1.12, 1.24, 64), new THREE.MeshStandardMaterial({ color: 0x0a2033, emissive: 0x3fb6ff, emissiveIntensity: 1.7, roughness: 0.4 }));
  underRing.rotation.x = Math.PI / 2; underRing.position.y = 6.14; g.add(underRing);
  const underRing2 = new THREE.Mesh(new THREE.RingGeometry(2.6, 2.72, 64), new THREE.MeshStandardMaterial({ color: 0x1a1004, emissive: 0xff7a22, emissiveIntensity: 1.4, roughness: 0.5 }));
  underRing2.rotation.x = Math.PI / 2; underRing2.position.y = 6.14; g.add(underRing2);
  // 顶面螺栓环
  for (let i = 0; i < 28; i++) {
    const a2 = i / 28 * TAU;
    cyl(0.045, 0.045, 0.05, 6, MAT.metal, Math.cos(a2) * 2.78, 6.67, Math.sin(a2) * 2.78, g);
  }
  // 顶面散热槽
  for (let i = 0; i < 16; i++) {
    const a2 = i / 16 * TAU;
    const v = box(0.46, 0.04, 0.09, MAT.darkPanel, Math.cos(a2) * 2.4, 6.668, Math.sin(a2) * 2.4, g);
    v.rotation.y = -a2;
  }
  // 顶面深色环带
  const capBand2 = new THREE.Mesh(new THREE.RingGeometry(2.18, 2.62, 72), MAT.darkPanel);
  capBand2.rotation.x = -Math.PI / 2; capBand2.position.y = 6.662; g.add(capBand2);
  const capBand3 = new THREE.Mesh(new THREE.RingGeometry(1.98, 2.18, 72), MAT.darkMetal);
  capBand3.rotation.x = -Math.PI / 2; capBand3.position.y = 6.663; g.add(capBand3);
  // 凸起环
  const capRim = new THREE.Mesh(new THREE.TorusGeometry(1.95, 0.055, 8, 64), MAT.whiteGloss);
  capRim.rotation.x = Math.PI / 2; capRim.position.y = 6.69; g.add(capRim);
  // 橙色警示扇区
  for (let i = 0; i < 4; i++) {
    const a2 = i / 4 * TAU + 0.2;
    const w = box(0.62, 0.02, 0.16, MAT.orangeGlow, Math.cos(a2) * 2.5, 6.66, Math.sin(a2) * 2.5, g);
    w.rotation.y = -a2;
  }
  // 蓝环（嵌在顶面凹槽里）
  const capLight = new THREE.Mesh(new THREE.RingGeometry(2.06, 2.2, 72), new THREE.MeshStandardMaterial({ color: 0x0a1e2e, emissive: 0x3fb6ff, emissiveIntensity: 1.0, roughness: 0.5 }));
  capLight.rotation.x = -Math.PI / 2; capLight.position.y = 6.67; g.add(capLight);
  // 中央冠体（台阶式）
  const crown0 = cyl(1.78, 1.92, 0.2, 48, MAT.whiteMatte, 0, 6.76, 0, g);
  addEdges(crown0, 0x142c3d, 0.5, 40);
  const crown = cyl(1.42, 1.72, 0.52, 48, MAT.whiteMatte, 0, 7.09, 0, g);
  addEdges(crown, 0x142c3d, 0.5, 40);
  const crownTop = cyl(1.34, 1.4, 0.1, 48, MAT.darkMetal, 0, 7.37, 0, g);
  // 冠体侧面格栅
  for (let i = 0; i < 14; i++) {
    const a2 = i / 14 * TAU;
    const v = box(0.19, 0.3, 0.06, MAT.darkPanel, Math.cos(a2) * 1.62, 7.09, Math.sin(a2) * 1.62, g);
    v.rotation.y = -a2;
  }
  // 顶部警示灯
  const beaconMat = new THREE.MeshStandardMaterial({ color: 0x2a0a06, emissive: 0xff3a20, emissiveIntensity: 4, roughness: 0.3 });
  const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 12), beaconMat);
  beacon.position.set(0, 7.62, 0);
  g.add(beacon);
  cyl(0.045, 0.045, 0.2, 8, MAT.metal, 0, 7.47, 0, g);
  const beaconCage = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.018, 6, 20), MAT.metal);
  beaconCage.rotation.x = Math.PI / 2; beaconCage.position.y = 7.62; g.add(beaconCage);
  // 顶部线缆
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * TAU + 0.3;
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(Math.cos(a) * 2.3, 6.85, Math.sin(a) * 2.3),
      new THREE.Vector3(Math.cos(a) * 3.2, 7.5, Math.sin(a) * 3.2),
      new THREE.Vector3(Math.cos(a) * 4.6, 6.9, Math.sin(a) * 4.6)
    ]);
    const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 24, 0.032, 6, false), MAT.rubber);
    g.add(tube);
  }

  /* ---------- 内部量子核心 ---------- */
  const inner = new THREE.Group();
  g.add(inner);

  const pedestal = cyl(1.15, 1.35, 0.7, 32, MAT.darkMetal, 0, 1.98, 0, inner);
  addEdges(pedestal, 0x4a86ad, 0.5, 40);
  const pedRing = new THREE.Mesh(new THREE.RingGeometry(1.1, 1.2, 48), MAT.blueGlow);
  pedRing.rotation.x = -Math.PI / 2; pedRing.position.y = 2.35; inner.add(pedRing);

  // 核心柱
  coreMat = new THREE.MeshStandardMaterial({ color: 0x08243c, emissive: 0x2fb4ff, emissiveIntensity: 3.4, roughness: 0.25, metalness: 0.3 });
  const coreCol = cyl(0.82, 0.95, 2.5, 40, coreMat, 0, 3.6, 0, inner);
  // 核心外壳环
  for (let i = 0; i < 7; i++) {
    const r = new THREE.Mesh(new THREE.TorusGeometry(1.02, 0.05, 8, 48), MAT.metal);
    r.rotation.x = Math.PI / 2;
    r.position.y = 2.5 + i * 0.36;
    inner.add(r);
  }
  // 核心外发光环
  for (let i = 0; i < 3; i++) {
    const gr = new THREE.Mesh(new THREE.TorusGeometry(1.0 + i * 0.16, 0.028, 6, 56),
      new THREE.MeshStandardMaterial({ color: 0x0a2033, emissive: 0x5ccaff, emissiveIntensity: 2.6 + i * 0.6, roughness: 0.4 }));
    gr.rotation.x = Math.PI / 2;
    gr.position.y = 2.9 + i * 0.55;
    inner.add(gr);
  }
  // 舱内顶部冷光
  const chamberTopLight = new THREE.PointLight(0x5cc8ff, 4, 9, 2);
  chamberTopLight.position.set(0, 5.0, 0);
  inner.add(chamberTopLight);

  // 核心光晕球
  coreHalo = new THREE.Mesh(
    new THREE.SphereGeometry(1.0, 32, 24),
    new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.BackSide,
      uniforms: { uColor: { value: new THREE.Color(0x5fd0ff) }, uI: { value: 1 } },
      vertexShader: `varying vec3 vN; varying vec3 vV; void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); vN = normalize(normalMatrix*normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix*mv; }`,
      fragmentShader: `varying vec3 vN; varying vec3 vV; uniform vec3 uColor; uniform float uI;
        void main(){ float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 2.5); gl_FragColor = vec4(uColor, f*0.55*uI); }`
    })
  );
  coreHalo.position.y = 3.6;
  inner.add(coreHalo);

  // 核心辉光精灵
  coreSprMat = new THREE.SpriteMaterial({ map: texGlow, color: 0x7fd8ff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.55 });
  coreSpr = new THREE.Sprite(coreSprMat);
  coreSpr.scale.set(2.1, 2.1, 1);
  coreSpr.position.y = 3.6;
  inner.add(coreSpr);
  const coreSpr2 = new THREE.Sprite(new THREE.SpriteMaterial({ map: texGlow, color: 0x3f9fe0, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.16 }));
  coreSpr2.scale.set(3.9, 3.9, 1);
  coreSpr2.position.y = 3.6;
  inner.add(coreSpr2);

  // 陀螺环
  const gyroDefs = [
    { r: 1.35, t: 0.035, ax: 0, ay: 0, speed: 0.18 },
    { r: 1.55, t: 0.03, ax: 1.1, ay: 0.4, speed: -0.13 },
    { r: 1.75, t: 0.028, ax: -0.7, ay: 1.2, speed: 0.09 }
  ];
  gyroDefs.forEach((d, i) => {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(d.r, d.t, 8, 80), i === 1 ? MAT.white : MAT.metal);
    ring.rotation.set(d.ax, d.ay, 0);
    ring.position.y = 3.6;
    ring.userData.speed = d.speed;
    inner.add(ring);
    gyro.push(ring);
    // 环上节点
    for (let k = 0; k < 4; k++) {
      const a = k / 4 * TAU;
      const node = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.08, 0.08), MAT.blueGlow);
      node.position.set(Math.cos(a) * d.r, Math.sin(a) * d.r, 0);
      ring.add(node);
    }
  });

  // 内部碎片
  for (let i = 0; i < 22; i++) {
    const s = R(0.04, 0.12);
    const m = new THREE.Mesh(new THREE.TetrahedronGeometry(s), new THREE.MeshStandardMaterial({ color: 0xdff4ff, emissive: 0x2f9ed8, emissiveIntensity: 0.6, metalness: 0.4, roughness: 0.3, flatShading: true }));
    const a = R(0, TAU), r = R(0.85, 2.1);
    m.position.set(Math.cos(a) * r, R(2.3, 5.0), Math.sin(a) * r);
    m.rotation.set(R(0, 3), R(0, 3), R(0, 3));
    inner.add(m);
  }

  // 脉冲波纹环
  const pulseMatBase = () => new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    uniforms: { uOpacity: { value: 1 }, uColor: { value: new THREE.Color(0x8ce4ff) } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `
      varying vec2 vUv; uniform float uOpacity; uniform vec3 uColor;
      void main(){
        vec2 p = vUv - 0.5;
        float r = length(p) * 2.0;
        float band = smoothstep(0.90, 0.995, r) * (1.0 - smoothstep(0.995, 1.0, r));
        float inner = smoothstep(0.55, 0.98, r) * 0.18;
        float a = (band * 0.95 + inner) * uOpacity;
        gl_FragColor = vec4(uColor, a);
      }`
  });

  for (let i = 0; i < 4; i++) {
    const mat = pulseMatBase();
    const m = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat);
    m.rotation.x = -Math.PI / 2;
    m.position.y = 3.6;
    m.userData.phase = i * 0.25;
    inner.add(m);
    pulses.push(m);
  }
  // 垂直方向的一圈
  for (let i = 0; i < 2; i++) {
    const mat = pulseMatBase();
    const m = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat);
    m.position.y = 3.6;
    m.rotation.y = i * Math.PI / 2;
    m.userData.phase = 0.12 + i * 0.5;
    m.userData.vertical = true;
    inner.add(m);
    pulses.push(m);
  }

  return g;
}

}

function buildRack(x, z, ry) {
  const g = new THREE.Group();

  g.rotation.y = ry;
  world.add(g);

  const body = box(1.3, 2.4, 0.9, MAT.white, 0, 1.2, 0, g);

  box(1.3, 0.08, 0.94, MAT.darkPanel, 0, 0.06, 0, g);

      new THREE.Vector3(-0.45 + i * 0.9, 2.3, -0.3),
      new THREE.Vector3(-0.45 + i * 0.9, 2.9, -0.55),
      new THREE.Vector3(-0.45 + i * 0.9, 3.3, -1.2)
    ]);
    const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 16, 0.06, 8, false), MAT.metal);

  // 风扇
  [1.85, 0.95].forEach(y => {

    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.26, 0.03, 6, 24), MAT.darkMetal);
    fg.add(ring);
    const blades = new THREE.Group();
    for (let i = 0; i < 5; i++) {
      const b = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.09, 0.012), MAT.metal);
      b.position.set(0.13, 0, 0);
      b.rotation.z = i / 5 * TAU;
      b.rotation.x = 0.3;
      const holder = new THREE.Group();
      holder.rotation.z = i / 5 * TAU;

      blades.add(holder);

  return g;
}

let dropMat, shards, papers, paperData = [], shardData = [];

function buildStutterField() {
  /* ---- 水珠 ---- */
  const COUNT = 2400;
  const geo = new THREE.IcosahedronGeometry(1, 0);
  const offsets = new Float32Array(COUNT * 3);
  const seeds = new Float32Array(COUNT);
  const scales = new Float32Array(COUNT);

  for (let i = 0; i < COUNT; i++) {
    let x, y, z;
    const mode = Math.random();
    if (mode < 0.55) {
      // 实验舱周围的爆裂云团
      const a = R(0, TAU), r = R(3.0, 7.4), hh = R(0.5, 7.1);
      x = Math.cos(a) * r; z = Math.sin(a) * r; y = hh;
    } else if (mode < 0.93) {
      x = R(-7.1, 7.1); z = R(-7.1, 7.1); y = R(0.3, 7.1);
      if (Math.hypot(x, z) < 3.0) { x *= 1.7; z *= 1.7; }
    } else {
      x = R(-6.5, 6.5); z = R(7.0, 9.5); y = R(1.0, 6.5);
    }
    offsets[i * 3] = x; offsets[i * 3 + 1] = y; offsets[i * 3 + 2] = z;
    seeds[i] = Math.random();
    scales[i] = Math.random() < 0.09 ? R(0.09, 0.17) : R(0.02, 0.07);
  }
  geo.setAttribute('aOffset', new THREE.InstancedBufferAttribute(offsets, 3));
  geo.setAttribute('aSeed', new THREE.InstancedBufferAttribute(seeds, 1));
  geo.setAttribute('aScale', new THREE.InstancedBufferAttribute(scales, 1));

  dropMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.NormalBlending,
    uniforms: {
      uTime: { value: 0 },
      uColor: { value: new THREE.Color(0x1f7fc4) },
      uColor2: { value: new THREE.Color(0xa8e6ff) }
    },
    vertexShader: `
      attribute vec3 aOffset; attribute float aSeed; attribute float aScale;
      uniform float uTime;
      varying vec3 vN; varying vec3 vV; varying float vS;
      void main(){
        vS = aSeed;
        vec3 p = position * aScale;
        vec3 o = aOffset;
        float t = uTime;
        o.x += sin(t*0.24 + aSeed*6.2831) * 0.42;
        o.y += sin(t*0.19 + aSeed*4.13) * 0.30;
        o.z += cos(t*0.22 + aSeed*2.71) * 0.42;
        vec4 mv = modelViewMatrix * vec4(p + o, 1.0);
        vN = normalize(normalMatrix * normal);
        vV = normalize(-mv.xyz);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform vec3 uColor; uniform vec3 uColor2;
      varying vec3 vN; varying vec3 vV; varying float vS;
      void main(){
        float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 2.0);
        vec3 c = mix(uColor, uColor2, f * 0.85);
        float a = 0.22 + f * 0.62;
        gl_FragColor = vec4(c * (1.0 + f * 1.8), a);
      }`
  });

  const drops = new THREE.InstancedMesh(geo, dropMat, COUNT);
  drops.frustumCulled = false;
  drops.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  // 实例矩阵用单位矩阵（位置由 shader 计算）
  const m = new THREE.Matrix4();
  for (let i = 0; i < COUNT; i++) drops.setMatrixAt(i, m.identity());
  world.add(drops);

  /* ---- 碎玻璃 ---- */
  const SC = 250;
  const shardGeo = new THREE.TetrahedronGeometry(1, 0);
  const shardMat = new THREE.MeshPhysicalMaterial({
    color: 0xcfe8ff, metalness: 0, roughness: 0.05, transparent: true, opacity: 0.34,
    envMapIntensity: 3.2, flatShading: true, side: THREE.DoubleSide, depthWrite: false
  });
  shards = new THREE.InstancedMesh(shardGeo, shardMat, SC);
  shards.frustumCulled = false;
  for (let i = 0; i < SC; i++) {
    const a = R(0, TAU), r = R(2.75, 4.9);
    shardData.push({
      base: new THREE.Vector3(Math.cos(a) * r, R(2.2, 6.4), Math.sin(a) * r),
      rot: new THREE.Euler(R(0, TAU), R(0, TAU), R(0, TAU)),
      spin: new THREE.Vector3(R(-0.06, 0.06), R(-0.06, 0.06), R(-0.06, 0.06)),
      scale: new THREE.Vector3(R(0.04, 0.17), R(0.03, 0.12), R(0.04, 0.15)),
      ph: R(0, TAU)
    });
  }
  world.add(shards);

  /* ---- 悬浮档案纸 ---- */
  const PC = 74;
  const paperGeo = new THREE.PlaneGeometry(0.21, 0.28);
  papers = new THREE.InstancedMesh(paperGeo, MAT.paper, PC);
  papers.frustumCulled = false;
  for (let i = 0; i < PC; i++) {
    const a = R(0, TAU), r = R(2.9, 7.2);
    paperData.push({
      base: new THREE.Vector3(Math.cos(a) * r, R(0.9, 6.8), Math.sin(a) * r),
      rot: new THREE.Euler(R(-1, 1), R(0, TAU), R(-1, 1)),
      spin: new THREE.Vector3(R(-0.09, 0.09), R(-0.09, 0.09), R(-0.09, 0.09)),
      ph: R(0, TAU)
    });
  }
  world.add(papers);
}

      vec2 d = vUv - 0.5;
      float vig = smoothstep(0.92, 0.28, length(d) * 1.28);
      c.rgb *= mix(0.62, 1.0, vig);
      c.rgb = mix(c.rgb, c.rgb * c.rgb * (3.0 - 2.0 * c.rgb), 0.36);

      float g = fract(sin(dot(vUv * vec2(1271.3, 3417.9) + uTime * 0.7, vec2(12.9898, 78.233))) * 43758.5453);
      c.rgb += (g - 0.5) * 0.014;

/* ============================================================
   10. 动效
   ============================================================ */
const clock = new THREE.Clock();
const RED = new THREE.Color(0xff2a18);
const BLUE = new THREE.Color(0x2f9eff);
const tmpMat = new THREE.Matrix4();
const tmpQ = new THREE.Quaternion();
const tmpE = new THREE.Euler();
const tmpV = new THREE.Vector3();
const tmpS = new THREE.Vector3();

let prev = 0;

function animate() {
  const t = clock.getElapsedTime();
  const dt = Math.min(0.06, t - prev);
  prev = t;

  // 红蓝呼吸警示灯
  const w = Math.sin(t * 1.15);
  const k = w * 0.5 + 0.5;
  const amp = Math.abs(w);
  for (const m of shell.lamps) {
    m.emissive.copy(BLUE).lerp(RED, k);
    m.emissiveIntensity = 0.5 + 7.5 * Math.pow(amp, 1.4);
  }
  for (const gm of shell.lampGlows) {
    gm.color.copy(BLUE).lerp(RED, k);
    gm.opacity = 0.1 + 0.55 * Math.pow(amp, 1.3);
  }
  warnLight.color.copy(BLUE).lerp(RED, k);
  warnLight.intensity = 2 + 11 * Math.pow(amp, 1.4);

  // 量子核心脉冲
  const cp = 0.5 + 0.5 * Math.sin(t * 1.9);
  coreMat.emissiveIntensity = 2.6 + cp * 1.4;
  coreLight.intensity = 11 + cp * 6;
  coreHalo.scale.setScalar(1 + cp * 0.06);
  coreHalo.material.uniforms.uI.value = 0.45 + cp * 0.3;
  coreSpr.scale.setScalar(2.0 + cp * 0.35);
  coreSprMat.opacity = 0.3 + cp * 0.2;

  // 脉冲波纹环
  for (const p of pulses) {
    let ph = (t * 0.22 + p.userData.phase) % 1;
    const s = 0.55 + ph * 3.6;
    p.scale.set(s, s, s);
    p.material.uniforms.uOpacity.value = Math.pow(1 - ph, 1.8) * 0.26;
  }

  // 陀螺环
  gyro.forEach((g, i) => {
    g.rotation.z += g.userData.speed * dt;
    g.rotation.x += g.userData.speed * dt * 0.4;
  });

  // 风扇
  for (const f of fans) f.obj.rotation.z += f.speed * dt;

  // 全息界面微闪
  for (let i = 0; i < holoMats.length; i++) {
    holoMats[i].opacity = 0.78 + 0.18 * Math.sin(t * 1.6 + i * 1.7);
  }

  // 时空微幅漂移：水珠

      var src = ctx.createBufferSource();
      src.buffer = noiseBuf(ctx, b.n, 4); src.loop = true;
      var flt = ctx.createBiquadFilter(); flt.type = b.t; flt.frequency.value = b.f; flt.Q.value = b.q || 0.7;
      var bg = ctx.createGain(); bg.gain.value = b.v;
      src.connect(flt); flt.connect(bg); bg.connect(master);
      if (b.lfo) {
        var l = ctx.createOscillator(); l.type = 'sine'; l.frequency.value = b.lfo[0];
        var lg = ctx.createGain(); lg.gain.value = b.lfo[1] * b.v;
        l.connect(lg); lg.connect(bg.gain); l.start();
      }
      src.start();
    }

    /* 低频 drone */
    if (p.drone) {
      var d = p.drone;
      var dlp = ctx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = d.lp || 300;
      var dg = ctx.createGain(); dg.gain.value = d.v;
      dlp.connect(dg); dg.connect(master);
      for (var i = 0; i < d.f.length; i++) {
        var o = ctx.createOscillator();
        o.type = d.type; o.frequency.value = d.f[i];
        o.detune.value = (i - 1) * 7;
        o.connect(dlp); o.start();
      }
      if (d.lfo) {
        var l2 = ctx.createOscillator(); l2.type = 'sine'; l2.frequency.value = d.lfo[0];
        var lg2 = ctx.createGain(); lg2.gain.value = d.lfo[1] * d.v * 0.8;
        l2.connect(lg2); lg2.connect(dg.gain); l2.start();
      }
    }

    /* 事件调度 */
    var timers = [];
    (p.ev || []).forEach(function (e) {
      var kind = e[0], lo = e[1], hi = e[2], g = e[3];
      if (offline) {
        var t = 0;
        while (t < offline.duration) { t += rnd(lo, hi); if (t < offline.duration) fire(ctx, master, kind, t, g); }
      } else {
        (function loop() {
          var wait = rnd(lo, hi) * 1000;
          timers.push(setTimeout(function () {
            try { fire(ctx, master, kind, ctx.currentTime + 0.02, g); } catch (err) {}
            loop();
          }, wait));
        })();
      }
    });

    return { master: master, stop: function () {
      timers.forEach(clearTimeout);
      try { master.disconnect(); } catch (e) {}
    } };
  }

  /* ---------- 离线渲染（自检用） ---------- */
  function renderOffline(id, secs) {
    var p = PRESETS[id]; if (!p) return Promise.resolve(null);
    var SR = 44100;
    var ctx = new OfflineAudioContext(2, Math.floor(SR * secs), SR);
    build(ctx, ctx.destination, p, { duration: secs - 0.2 });
    return ctx.startRendering().then(function (buf) {
      var d = buf.getChannelData(0), sum = 0, peak = 0;
      for (var i = 0; i < d.length; i++) { sum += d[i] * d[i]; var a = Math.abs(d[i]); if (a > peak) peak = a; }
      return { rms: Math.sqrt(sum / d.length), peak: peak };
    });
  }

  /* ---------- 运行时挂载 ---------- */
  var ctx = null, graph = null, muted = false, btn = null;

  function ui() {
    var css = 'position:fixed;z-index:2147483000;font:12px/1.4 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;'
      + 'right:14px;bottom:14px;padding:7px 12px;border-radius:999px;cursor:pointer;user-select:none;'
      + 'background:rgba(10,12,17,.72);color:#e9ecf3;border:1px solid rgba(255,255,255,.16);'
      + 'backdrop-filter:blur(8px);opacity:.55;transition:opacity .2s';
    btn = document.createElement('div');
    btn.title = '程序化环境声（?nosound=1 可关闭）';
    btn.style.cssText = css;
    btn.textContent = '🔈 点击开启环境声';
    btn.onmouseenter = function () { btn.style.opacity = 1; };
    btn.onmouseleave = function () { if (ctx) btn.style.opacity = .55; };
    btn.onclick = start;
    document.body.appendChild(btn);
  }

  function start() {
    if (ctx) { muted = !muted; if (graph) graph.master.gain.value = muted ? 0 : PRESETS[presetId].g; btn.textContent = muted ? '🔇 环境声已静音' : '🔊 环境声'; return; }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { btn.textContent = '浏览器不支持 Web Audio'; return; }
    ctx = new AC();
    var p = PRESETS[presetId];
    if (!p) { btn.textContent = '（此场景暂无环境声）'; return; }
    graph = build(ctx, ctx.destination, p, false);
    btn.textContent = '🔊 环境声';
    btn.style.opacity = .55;
    if (ctx.state === 'suspended') ctx.resume();
  }

  var presetId = window.__AMB_PRESET__ || null;

  /* ---------- 试听用：多实例 ---------- */
  var sharedCtx = null, instances = [];

  function auditionCtx() {
    if (!sharedCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      sharedCtx = new AC();
    }
    if (sharedCtx.state === 'suspended') sharedCtx.resume();
    return sharedCtx;
  }

  var A = {
    presets: PRESETS,
    play: function (id) {
      var p = PRESETS[id];
      if (!p) return null;
      var c = auditionCtx();
      var g = c.createGain(); g.gain.value = 0.9;
      var comp = c.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.25;
      g.connect(comp); comp.connect(c.destination);
      var h = build(c, g, p, false);
      var inst = {
        id: id,
        volume: function (v) { g.gain.value = v; },
        stop: function () {
          h.stop();
          try { g.disconnect(); comp.disconnect(); } catch (e) {}
          instances = instances.filter(function (x) { return x !== inst; });
        }
      };
      instances.push(inst);
      return inst;
    },
    stopAll: function () { instances.slice().forEach(function (i) { i.stop(); }); },
    active: function () { return instances.map(function (i) { return i.id; }); },
    renderOffline: renderOffline,
    mount: function (id) { presetId = id; },
    start: start,
    state: function () {
      return { preset: presetId, started: !!ctx, ctxState: ctx ? ctx.state : null,
               muted: muted, presetCount: Object.keys(PRESETS).length };
    }
  };
  window.Ambience = A;

  if (!presetId) return;
  if (/(?:^|[?&])nosound=1/.test(location.search)) return;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ui);
  else ui();
})();
</script>
<!-- AMB:end -->
</body>
