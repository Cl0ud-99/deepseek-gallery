{
  const envScene = new THREE.Scene();
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: {
      cTop: { value: new THREE.Color(0xd6efff) },
      cMid: { value: new THREE.Color(0x2f7fa8) },
      cBot: { value: new THREE.Color(0x03101a) },
    },
    vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `
      varying vec3 vP; uniform vec3 cTop; uniform vec3 cMid; uniform vec3 cBot;
      void main(){
        float h = clamp(vP.y / 60.0 * 0.5 + 0.5, 0.0, 1.0);
        vec3 c = mix(cBot, cMid, smoothstep(0.0, 0.58, h));
        c = mix(c, cTop, smoothstep(0.58, 1.0, h));
        gl_FragColor = vec4(c, 1.0);
      }`,
  });
  envScene.add(new THREE.Mesh(new THREE.SphereGeometry(60, 32, 16), skyMat));

}

/* ============================================================
   2. 通用工具
   ============================================================ */
const TAU = Math.PI * 2;

let _seed = 20261029;
function rnd() { _seed = (_seed * 1664525 + 1013904223) % 4294967296; return _seed / 4294967296; }
function rr(a, b) { return a + rnd() * (b - a); }

const C = {
  iceWhite: 0xf3f9fd,
  icePale: 0xdcefff,
  ice: 0xb4e0f5,
  iceBlue: 0x62b8e0,
  iceDeep: 0x2b7ba6,
  seaDeep: 0x0a2f45,
  hullRed: 0xe8481d,
  hullRedDark: 0xc23a16,
  white: 0xf7fafc,
  deck: 0xd8e3ec,
  metal: 0x93a2b0,
  dark: 0x1b2a38,
  wood: 0xbe8a52,
  woodDark: 0x8f6236,
  cream: 0xf4e7cf,
  warm: 0xffcb84,
  yellow: 0xf7c419,
  orange: 0xef6a1e,
  glass: 0xbfe4f6,
};

const gradTex = (() => {
  const t = new THREE.DataTexture(new Uint8Array([86, 152, 212, 255]), 4, 1, THREE.RedFormat);
  t.minFilter = THREE.NearestFilter;
  t.magFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  t.needsUpdate = true;
  return t;
})();

function toon(color, opts) {
  return new THREE.MeshToonMaterial(Object.assign({ color, gradientMap: gradTex }, opts || {}));
}
function glass(color, opacity) {
  return new THREE.MeshPhysicalMaterial({
    color: color || C.glass,
    transparent: true,
    opacity: opacity === undefined ? 0.3 : opacity,
    roughness: 0.04,
    metalness: 0.0,
    transmission: 0,
    envMapIntensity: 0.85,
    side: THREE.DoubleSide,
    depthWrite: false,
  });
}

const OUTLINE_COLOR = new THREE.Color(0x07131f);
const outlineMats = new Map();
function outlineMat(s) {
  const key = s.toFixed(2);
  if (!outlineMats.has(key)) {
    outlineMats.set(key, new THREE.ShaderMaterial({
      uniforms: { uC: { value: OUTLINE_COLOR }, uS: { value: s } },
      vertexShader: `
        uniform float uS;
        void main(){
          vec4 mv = modelViewMatrix * vec4(position,1.0);
          vec3 n = normalize(normalMatrix * normal);
          mv.xyz += n * uS * 0.0013 * (-mv.z);
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: `uniform vec3 uC; void main(){ gl_FragColor = vec4(uC,1.0); }`,
      side: THREE.BackSide,
    }));
  }
  return outlineMats.get(key);
}
function outline(mesh, s) {
  const o = new THREE.Mesh(mesh.geometry, outlineMat(s === undefined ? 1 : s));
  o.castShadow = false;
  o.receiveShadow = false;
  o.renderOrder = -1;
  mesh.add(o);
  return o;
}

function box(w, h, d, mat, ol) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.castShadow = true;
  m.receiveShadow = true;
  if (ol) outline(m, ol);
  return m;
}
function cyl(rt, rb, h, seg, mat, ol) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.castShadow = true;
  m.receiveShadow = true;
  if (ol) outline(m, ol);
  return m;
}
function sph(r, mat, ol) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), mat);
  m.castShadow = true;
  m.receiveShadow = true;
  if (ol) outline(m, ol);
  return m;
}
function at(obj, x, y, z) { obj.position.set(x, y, z); return obj; }
function add(parent, obj) { parent.add(obj); return obj; }

/* ============================================================
   4. 浮冰、冰山、冰川根部
   ============================================================ */
function floeGeo(radius, seg, jitter, depth) {
  const pts = [];
  for (let i = 0; i < seg; i++) {
    const a = (i / seg) * TAU + rr(-0.14, 0.14);
    const rad = radius * (1 - jitter + rnd() * jitter * 2);
    pts.push(new THREE.Vector2(Math.cos(a) * rad, Math.sin(a) * rad));
  }
  const shape = new THREE.Shape(pts);
  const geo = new THREE.ExtrudeGeometry(shape, { depth: depth, bevelEnabled: false, curveSegments: 1 });
  geo.rotateX(-Math.PI / 2);
  return geo;
}

const bobbers = [];
const floeMat = toon(0xeaf7ff, { flatShading: true });
const floeMat2 = toon(0xcfe8f8, { flatShading: true });

function addFloe(x, z, r, rot, depth, yBase) {
  const geo = floeGeo(r, 5 + Math.floor(rnd() * 3), 0.3, depth);
  const m = new THREE.Mesh(geo, rnd() > 0.5 ? floeMat : floeMat2);
  m.castShadow = true;
  m.receiveShadow = true;
  m.position.set(x, yBase === undefined ? ICE_TOP - 0.04 : yBase, z);
  m.rotation.y = rot;
  outline(m, 0.95);
  world.add(m);
  bobbers.push({ obj: m, y: m.position.y, amp: rr(0.04, 0.11), spd: rr(0.45, 0.85), ph: rr(0, TAU) });
  return m;
}

// --- 蓝冰冰山 ---
function iceberg(x, z, h, r) {
  const g = new THREE.Group();
  const blocky = rnd() > 0.52;
  let geo;
  if (blocky) {
    geo = new THREE.IcosahedronGeometry(1, 0);
    geo.scale(r, h * 0.52, r * rr(0.68, 1.0));
    geo.translate(0, h * 0.44, 0);
  } else {
    geo = new THREE.ConeGeometry(r, h, 6, 2);
    geo.translate(0, h * 0.5, 0);
  }

  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    pos.setX(i, pos.getX(i) * rr(0.86, 1.14));
    pos.setZ(i, pos.getZ(i) * rr(0.86, 1.14));
    if (!blocky) pos.setY(i, pos.getY(i) + rr(-0.12, 0.12));
  }
  geo.computeVertexNormals();

  const m = new THREE.Mesh(geo, toon(0x76c4e8, { flatShading: true, transparent: true, opacity: 0.95, emissive: 0x0e4562, emissiveIntensity: 0.4 }));
  m.castShadow = true;
  m.receiveShadow = true;
  outline(m, 0.9);
  g.add(m);

  if (!blocky) {
    const cap = new THREE.Mesh(new THREE.ConeGeometry(r * 0.66, h * 0.2, 6, 1), toon(0xf6fcff, { flatShading: true }));
    cap.position.y = h * 0.9;
    cap.scale.set(1, 1, 0.9);
    g.add(cap);
  } else {
    const cap = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 0), toon(0xf6fcff, { flatShading: true }));
    cap.scale.set(r * 0.34, h * 0.1, r * 0.3);
    cap.position.y = h * 0.88;
    cap.rotation.y = rr(0, TAU);
    g.add(cap);
  }

  g.position.set(x, ICE_TOP - 0.2, z);
  g.rotation.y = rr(0, TAU);
  world.add(g);
  bobbers.push({ obj: g, y: g.position.y, amp: rr(0.03, 0.07), spd: rr(0.35, 0.6), ph: rr(0, TAU) });
  return g;
}

// 冰面裂纹细节
{
  const verts = [];
  for (let i = 0; i < 18; i++) {
    let x = rr(-58, 58), z = rr(-58, 58);
    if (Math.abs(z) < 24 && Math.abs(x) < 54) continue;
    let a = rr(0, TAU);
    for (let k = 0; k < 5; k++) {
      const nx = x + Math.cos(a) * rr(4, 10);
      const nz = z + Math.sin(a) * rr(4, 10);
      if (Math.abs(nx) > 62 || Math.abs(nz) > 62) break;
      verts.push(x, ICE_TOP + 0.05, z, nx, ICE_TOP + 0.05, nz);
      x = nx; z = nz; a += rr(-0.55, 0.55);
    }
  }
  const cg = new THREE.BufferGeometry();
  cg.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  world.add(new THREE.LineSegments(cg, new THREE.LineBasicMaterial({ color: 0x8fb8d2, transparent: true, opacity: 0.7 })));
}

// --- 水下冰川根部 ---
const rootMat = toon(0x69b9dd, { flatShading: true, transparent: true, opacity: 0.88 });
const rootMat2 = toon(0x3f92bd, { flatShading: true, transparent: true, opacity: 0.8 });
for (let i = 0; i < 24; i++) {
  const a = rr(0, TAU);
  const rad = rr(44, 62);
  const x = Math.cos(a) * rad;
  const z = Math.sin(a) * rad;
  if (Math.abs(z) < 26 && Math.abs(x) < 52) continue;
  const h = rr(4.5, 13);
  const r = rr(3.5, 8);
  const geo = new THREE.ConeGeometry(r, h, 4 + Math.floor(rnd() * 3), 1);
  geo.rotateX(Math.PI);
  const m = new THREE.Mesh(geo, rnd() > 0.5 ? rootMat : rootMat2);
  m.position.set(x, ICE_BOT - h / 2 + 0.4, z);
  m.rotation.y = rr(0, TAU);
  m.rotation.z = rr(-0.12, 0.12);
  outline(m, 0.7);
  world.add(m);
}

   5. 破冰船

const HULL_L = 58, HULL_B = 15, HULL_D = 10.2, HULL_SPLIT = -1.4;

function hullWidthAt(t) {
  let f;
  if (t < 0.34) f = 0.9 + 0.1 * Math.sin((t / 0.34) * Math.PI * 0.5);
  else if (t < 0.64) f = 1.0;
  else { const u = (t - 0.64) / 0.36; f = 1 - Math.pow(u, 1.45) * 0.935; }
  return 0.5 * HULL_B * f;
}
function hullDepthAt(t) {
  return HULL_D * (1 - 0.2 * Math.pow(Math.max(0, (t - 0.6) / 0.4), 1.6));
}
function ringPts(w, d) {
  return [
    [-0.62 * w, -d], [0.62 * w, -d], [0.9 * w, -0.62 * d], [1.0 * w, -0.22 * d],
    [1.0 * w, 0], [-1.0 * w, 0], [-1.0 * w, -0.22 * d], [-0.9 * w, -0.62 * d]
  ];
}

function buildHullPart(y0, y1) {
  const NS = 30;
  const positions = [];
  const indices = [];
  const vIdx = [];
  let vc = 0;

  for (let i = 0; i < NS; i++) {
    const t = i / (NS - 1);
    const w = hullWidthAt(t), d = hullDepthAt(t);
    const x = -HULL_L / 2 + t * HULL_L;
    const ring = ringPts(w, d);
    const row = [];
    for (let j = 0; j < ring.length; j++) {
      let y = ring[j][1];
      y = Math.min(Math.max(y, y0), y1);
      positions.push(x, y, ring[j][0]);
      row.push(vc++);
    }
    vIdx.push(row);
  }

  const R = 8;
  for (let i = 0; i < NS - 1; i++) {
    for (let j = 0; j < R; j++) {
      const j2 = (j + 1) % R;
      const a = vIdx[i][j], b = vIdx[i + 1][j], c = vIdx[i + 1][j2], d = vIdx[i][j2];
      indices.push(a, b, c, a, c, d);
    }
  }

  // 首尾封板
  for (const end of [0, NS - 1]) {
    const row = vIdx[end];
    let cx = 0, cy = 0, cz = 0;
    for (const vi of row) {
      cx += positions[vi * 3]; cy += positions[vi * 3 + 1]; cz += positions[vi * 3 + 2];
    }
    cx /= R; cy /= R; cz /= R;
    const ci = vc++;
    positions.push(cx, cy, cz);
    for (let j = 0; j < R; j++) {
      const a = row[j], b = row[(j + 1) % R];
      if (end === 0) indices.push(ci, b, a);
      else indices.push(ci, a, b);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

{
  const deckShape = new THREE.Shape();
  const N = 26;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const x = -HULL_L / 2 + t * HULL_L;
    const w = hullWidthAt(t) * 0.965;
    if (i === 0) deckShape.moveTo(x, w); else deckShape.lineTo(x, w);
  }
  for (let i = N; i >= 0; i--) {
    const t = i / N;
    const x = -HULL_L / 2 + t * HULL_L;
    const w = hullWidthAt(t) * 0.965;
    deckShape.lineTo(x, -w);
  }
  const dg = new THREE.ShapeGeometry(deckShape);
  dg.rotateX(-Math.PI / 2);
  const deck = new THREE.Mesh(dg, toon(C.deck, { side: THREE.DoubleSide }));
  deck.position.y = 0.02;

// 船舷栏杆
function railingOnShip() {
  const pts = [];
  const N = 24;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const x = -HULL_L / 2 + t * HULL_L;
    const w = hullWidthAt(t) * 0.97;
    pts.push(new THREE.Vector3(x, 0, w));
  }
  for (let i = N; i >= 0; i--) {
    const t = i / N;
    const x = -HULL_L / 2 + t * HULL_L;
    const w = hullWidthAt(t) * 0.97;
    pts.push(new THREE.Vector3(x, 0, -w));
  }
  const verts = [];
  const H = 1.15;
  for (let i = 0; i < pts.length - 1; i++) {
    verts.push(pts[i].x, H, pts[i].z, pts[i + 1].x, H, pts[i + 1].z);
    verts.push(pts[i].x, H * 0.55, pts[i].z, pts[i + 1].x, H * 0.55, pts[i + 1].z);
  }
  for (let i = 0; i < pts.length; i += 2) {
    verts.push(pts[i].x, 0, pts[i].z, pts[i].x, H, pts[i].z);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  ship.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0x10202c, transparent: true, opacity: 0.9 })));
}

function cabin(x0, x1, z0, z1, y0, y1, opts) {
  opts = opts || {};
  const g = new THREE.Group();
  const w = x1 - x0, d = z1 - z0, h = y1 - y0;
  const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;

  const floor = box(w, 0.22, d, toon(opts.floor || C.wood, { emissive: 0x3d2611, emissiveIntensity: 0.5 }), 0.7);
  floor.position.set(cx, y0 + 0.11, cz);
  g.add(floor);

  const ceil = box(w, 0.26, d, toon(opts.ceil || 0xf6ead2, { emissive: 0x6b4a22, emissiveIntensity: 0.62 }), 0.7);
  ceil.position.set(cx, y1 - 0.13, cz);
  g.add(ceil);

  // 顶部暖光灯板，让舱内在微缩尺度下也"亮"起来
  if (opts.strip !== false) {
    const strip = new THREE.Mesh(
      new THREE.PlaneGeometry(w * 0.6, d * 0.42),
      new THREE.MeshBasicMaterial({ color: opts.stripColor || 0xffd8a0, transparent: true, opacity: 0.8, side: THREE.DoubleSide })
    );
    strip.rotation.x = Math.PI / 2;
    strip.position.set(cx, y1 - 0.3, cz);
    g.add(strip);
  }

  const back = box(0.3, h, d, toon(opts.back || 0xf2e4ca, { emissive: 0x5a4222, emissiveIntensity: 0.45 }), 0.7);
  back.position.set(x0 + 0.15, (y0 + y1) / 2, cz);
  g.add(back);

  if (opts.glass !== false) {
    const gm = glass(0xc6e8fa, 0.14);
    gm.emissive = new THREE.Color(opts.glow || 0xff9d4a);
    gm.emissiveIntensity = opts.glowIntensity === undefined ? 0.2 : opts.glowIntensity;
    const gh = h - 1.3;
    const gy = (y0 + y1) / 2 + 0.34;
    // 两侧
    for (const zz of [z0 + 0.06, z1 - 0.06]) {
      const p = new THREE.Mesh(new THREE.PlaneGeometry(w - 0.3, gh), gm);
      p.position.set(cx, gy, zz);
      p.rotation.y = zz > cz ? Math.PI : 0;
      g.add(p);
    }
    // 前侧
    const pf = new THREE.Mesh(new THREE.PlaneGeometry(d - 0.3, gh), gm);
    pf.position.set(x1 - 0.06, gy, cz);
    pf.rotation.y = -Math.PI / 2;
    g.add(pf);
  }

  // 白色立柱与横梁
  const post = toon(C.white);
  const mull = [];
  const step = 3.6;
  for (let x = x0 + 0.5; x < x1 - 0.6; x += step) mull.push(x);
  mull.push(x1 - 0.55);
  for (const xx of mull) {
    for (const zz of [z0 + 0.12, z1 - 0.12]) {
      const p = box(0.44, h, 0.38, post, 0.6);
      p.position.set(xx, (y0 + y1) / 2, zz);
      g.add(p);
    }
  }
  // 下裙板 / 上横梁 / 舷侧窗楣
  for (const zz of [z0 + 0.12, z1 - 0.12]) {
    const sill = box(w, 0.72, 0.44, post, 0.7);
    sill.position.set(cx, y0 + 0.49, zz);
    g.add(sill);
    const head = box(w, 0.34, 0.4, post, 0.6);
    head.position.set(cx, y1 - 0.19, zz);
    g.add(head);
  }
  // 前壁裙板
  {
    const sill = box(0.44, 0.72, d, post, 0.7);
    sill.position.set(x1 - 0.22, y0 + 0.49, cz);
    g.add(sill);
    const head = box(0.42, 0.34, d, post, 0.6);
    head.position.set(x1 - 0.21, y1 - 0.19, cz);
    g.add(head);
  }
  ship.add(g);
  return g;
}

  }
}

/* ============================================================
   7. 水下生命
   ============================================================ */
const narwhal = new THREE.Group();
const narwhalTail = new THREE.Group();
{
  const bodyMat = toon(0x3f5f79);
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(1.15, 5.6, 6, 14), bodyMat);
  body.rotation.z = Math.PI / 2;
  body.castShadow = true;
  outline(body, 0.8);
  narwhal.add(body);

  const belly = new THREE.Mesh(new THREE.CapsuleGeometry(0.66, 4.4, 6, 12), toon(0xa9c6d6));
  belly.rotation.z = Math.PI / 2;
  belly.position.set(0.1, -0.62, 0);
  belly.scale.set(1, 0.6, 1);
  narwhal.add(belly);

  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.13, 8, 6), new THREE.MeshBasicMaterial({ color: 0x0d1b26 }));
  eye.position.set(3.9, 0.35, 0.78);
  narwhal.add(eye);
  const eye2 = eye.clone();
  eye2.position.z = -0.78;
  narwhal.add(eye2);

  const head = new THREE.Mesh(new THREE.SphereGeometry(1.1, 14, 10), bodyMat);
  head.position.set(3.4, 0.1, 0);
  head.scale.set(1.2, 0.95, 0.95);
  outline(head, 0.8);
  narwhal.add(head);

  const tusk = new THREE.Mesh(new THREE.ConeGeometry(0.16, 3.6, 8), toon(0xf0e6cf));
  tusk.rotation.z = -Math.PI / 2;
  tusk.position.set(6.0, 0.15, 0);
  outline(tusk, 0.6);
  narwhal.add(tusk);

  for (const dz of [-0.9, 0.9]) {
    const fin = box(1.5, 0.16, 0.9, bodyMat, 0.6);
    fin.position.set(1.4, -0.2, dz);
    fin.rotation.y = dz > 0 ? 0.4 : -0.4;
    narwhal.add(fin);
  }

  narwhalTail.position.set(-3.4, 0, 0);
  for (const dz of [-1, 1]) {
    const fl = box(2.2, 0.14, 1.2, bodyMat, 0.6);
    fl.position.set(-0.7, 0, dz * 0.9);
    fl.rotation.y = dz > 0 ? -0.45 : 0.45;
    narwhalTail.add(fl);
  }
  narwhal.add(narwhalTail);

  narwhal.position.set(0, -9, 0);
  narwhal.rotation.y = Math.PI;
  narwhal.scale.setScalar(1.6);
  world.add(narwhal);
}

// 发光磷虾群
const krillGroups = [];
function makeKrill(cx, cy, cz, count, spread, color) {
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.85 });
  const geo = new THREE.IcosahedronGeometry(0.17, 0);
  const inst = new THREE.InstancedMesh(geo, mat, count);
  const dummy = new THREE.Object3D();
  for (let i = 0; i < count; i++) {
    const a = rr(0, TAU), rad = rr(1.5, spread);
    dummy.position.set(Math.cos(a) * rad, rr(-3, 3), Math.sin(a) * rad);
    dummy.rotation.set(rr(0, 3), rr(0, 3), rr(0, 3));
    dummy.updateMatrix();
    inst.setMatrixAt(i, dummy.matrix);
  }
  inst.instanceMatrix.needsUpdate = true;
  const g = new THREE.Group();
  g.add(inst);
  g.position.set(cx, cy, cz);
  g.userData = { mat, baseY: cy, phase: rr(0, TAU) };
  world.add(g);
  krillGroups.push(g);
}
makeKrill(26, -13, -14, 150, 13, 0x8ff0ff);
makeKrill(-30, -17, 10, 90, 10, 0x7fe8ff);
makeKrill(6, -21, -22, 80, 9, 0x9ff5e8);

// 水下光斑
{
  for (let i = 0; i < 5; i++) {
    const p = new THREE.Mesh(
      new THREE.PlaneGeometry(rr(8, 18), rr(8, 18)),
      new THREE.MeshBasicMaterial({ color: 0x1f7ea8, transparent: true, opacity: 0.1, side: THREE.DoubleSide, depthWrite: false })
    );

/* ============================================================
   8. 雪花与烟雾
   ============================================================ */
let snow = null;
{
  const count = 1700;
  const pos = new Float32Array(count * 3);
  const spd = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    pos[i * 3] = rr(-78, 78);
    pos[i * 3 + 1] = rr(-2, 48);
    pos[i * 3 + 2] = rr(-78, 78);
    spd[i] = rr(0.8, 2.6);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

  const cv = document.createElement('canvas');
  cv.width = cv.height = 32;
  const ctx = cv.getContext('2d');
  const grd = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.45, 'rgba(225,245,255,0.75)');
  grd.addColorStop(1, 'rgba(200,235,255,0)');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, 32, 32);
  const tex = new THREE.CanvasTexture(cv);

  const mat = new THREE.PointsMaterial({
    size: 0.75,
    map: tex,
    transparent: true,
    opacity: 0.9,
    depthWrite: false,
    blending: THREE.NormalBlending,
    sizeAttenuation: true,
  });
  snow = new THREE.Points(geo, mat);
  snow.userData.spd = spd;
  world.add(snow);
}

const smokePuffs = [];
{
  const puffs = 16;
  for (let i = 0; i < puffs; i++) {
    const m = new THREE.Mesh(
      new THREE.SphereGeometry(1, 8, 6),
      new THREE.MeshBasicMaterial({ color: 0xeaf6fd, transparent: true, opacity: 0, depthWrite: false })
    );
    m.position.set(-8, 18.1, 0);
    m.userData.t = i / puffs;
    world.add(m);
    smokePuffs.push(m);
  }
}

/* ============================================================
   9. 动画
   ============================================================ */
const clock = new THREE.Clock();
const narwhalPath = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-34, -13, -12),
  new THREE.Vector3(-14, -12, -19),
  new THREE.Vector3(10, -14.5, -20),
  new THREE.Vector3(32, -12.5, -8),
  new THREE.Vector3(34, -15, 12),
  new THREE.Vector3(8, -13, 18),
  new THREE.Vector3(-16, -11.5, 16),
  new THREE.Vector3(-36, -14, 6),
], true, 'catmullrom', 0.5);

const tmpV = new THREE.Vector3();
const tmpV2 = new THREE.Vector3();

function animate() {
  const t = clock.getElapsedTime();
  const dt = Math.min(clock.getDelta(), 0.05);

  // 浮冰起伏
  for (const b of bobbers) {
    b.obj.position.y = b.y + Math.sin(t * b.spd + b.ph) * b.amp;
    b.obj.rotation.z = Math.sin(t * b.spd * 0.7 + b.ph) * 0.006;
  }

  // 水面波动
  if (waterSurface) {
    const arr = waterSurface.geometry.attributes.position.array;
    const base = waterSurface.userData.base;
    for (let i = 0; i < arr.length; i += 3) {
      const x = base[i], z = base[i + 2];
      arr[i + 1] = Math.sin(x * 0.14 + t * 1.1) * 0.09 + Math.sin(z * 0.2 - t * 0.85) * 0.07;
    }
    waterSurface.geometry.attributes.position.needsUpdate = true;
    waterSurface.geometry.computeVertexNormals();
  }

  // 直升机旋翼
  heliRotor.rotation.y += dt * 1.15;

  // 雷达球与风速计
  radarDome.rotation.y += dt * 0.55;
  anemometer.rotation.y += dt * 1.6;
  windVane.rotation.y = Math.sin(t * 0.35) * 0.7 + t * 0.08;

  // 钻头
  drillBit.rotation.y += dt * 1.4;

  // 独角鲸
  const u = (t * 0.035) % 1;
  narwhalPath.getPointAt(u, tmpV);
  narwhalPath.getTangentAt(u, tmpV2);
  narwhal.position.copy(tmpV);
  const look = tmpV.clone().add(tmpV2);
  narwhal.lookAt(look);
  narwhal.rotateY(Math.PI / 2);
  narwhal.rotation.z = Math.sin(t * 1.4) * 0.06;
  narwhalTail.rotation.y = Math.sin(t * 2.2) * 0.35;

  // 磷虾
  for (const kg of krillGroups) {
    kg.rotation.y += dt * 0.12;
    kg.position.y = kg.userData.baseY + Math.sin(t * 0.5 + kg.userData.phase) * 1.2;
    kg.userData.mat.opacity = 0.55 + Math.sin(t * 1.6 + kg.userData.phase) * 0.22;
  }

  // 雪
  if (snow) {
    const p = snow.geometry.attributes.position.array;
    const spd = snow.userData.spd;
    for (let i = 0; i < spd.length; i++) {
      p[i * 3 + 1] -= spd[i] * dt;
      p[i * 3] += Math.sin(t * 0.6 + i) * 0.012;
      if (p[i * 3 + 1] < -4) {
        p[i * 3 + 1] = 48;
        p[i * 3] = rr(-78, 78);
        p[i * 3 + 2] = rr(-78, 78);
      }
    }
    snow.geometry.attributes.position.needsUpdate = true;
  }

  // 烟
  for (const s of smokePuffs) {
    s.userData.t += dt * 0.12;
    if (s.userData.t > 1) s.userData.t -= 1;
    const k = s.userData.t;
    s.position.set(-8 + k * 5.5 + Math.sin(k * 8 + t * 0.8) * 0.45, 18.1 + k * 10.5, Math.cos(k * 6) * 0.7);
    const sc = 0.32 + k * 1.85;
    s.scale.setScalar(sc);
    s.material.opacity = Math.max(0, 0.3 * (1 - k) * Math.min(1, k * 9));
  }

  // 舱内暖光轻微呼吸
  for (let i = 0; i < warmLights.length; i++) {
    warmLights[i].intensity = warmLights[i].userData.base || (warmLights[i].userData.base = warmLights[i].intensity);
    warmLights[i].intensity = warmLights[i].userData.base * (0.94 + Math.sin(t * 1.3 + i * 1.7) * 0.06);
  }

  controls.update();
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(animate);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
