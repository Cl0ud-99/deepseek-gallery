<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>云端蒸汽飞艇邮政局 · Cloud Post Office</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a1120; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; width: 100%; height: 100%; }
  /* atmospheric falloff only — not UI */
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(125% 95% at 50% 44%, rgba(0,0,0,0) 42%, rgba(8,14,28,0.38) 82%, rgba(6,10,20,0.62) 100%);
  }
  #grain {
    position: fixed; inset: 0; pointer-events: none; opacity: 0.05; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='0.55'/></svg>");
  }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="vignette"></div>
  <div id="grain"></div>

  <script src="vendor/three.min.js"></script>
  <script src="js/util.js"></script>
  <script src="js/sky.js"></script>
  <script src="js/base.js"></script>
  <script src="js/airship.js"></script>
  <script src="js/building.js"></script>
  <script src="js/props.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
