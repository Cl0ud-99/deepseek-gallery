        s8.connect(lp8); env(lp8, gain * 1.4, 1.2, 0, 3.4); s8.start(t); s8.stop(t + 3.6);
        break;
      case 'frog':
        for (var q = 0; q < 2; q++) {
          var of = ctx.createOscillator(); of.type = 'square'; of.frequency.value = rnd(160, 260);
          var gf = ctx.createGain();
          var tq = t + q * 0.16;
          gf.gain.setValueAtTime(0.0001, tq);
          gf.gain.exponentialRampToValueAtTime(Math.max(gain * 0.5, 0.0002), tq + 0.01);
          gf.gain.exponentialRampToValueAtTime(0.0001, tq + 0.09);
          of.connect(gf); gf.connect(dest); of.start(tq); of.stop(tq + 0.11);
        }
        break;
    }
  }

  /* ---------- 构建整条链路 ---------- */
  function build(ctx, dest, p, offline) {
    var master = ctx.createGain(); master.gain.value = p.g;
    var comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.ratio.value = 3.5; comp.attack.value = 0.01; comp.release.value = 0.3;
    master.connect(comp); comp.connect(dest);

    /* 噪声床 */
    if (p.bed) {
      var b = p.bed;
      var src = ctx.createBufferSource();
      src.buffer = noiseBuf(ctx, b.n, 4); src.loop = true;
      var flt = ctx.createBiquadFilter(); flt.type = b.t; flt.frequency.value = b.f; flt.Q.value = b.q || 0.7;
      var bg = ctx.createGain(); bg.gain.value = b.v;
      src.connect(flt); flt.connect(bg); bg.connect(master);
      if (b.lfo) {
        var l = ctx.createOscillator(); l.type = 'sine'; l.frequency.value = b.lfo[0];
        var lg = ctx.createGain(); lg.gain.value = b.lfo[1] * b.v;
        l.connect(lg); lg.connect(bg.gain); l.start();
      }
      src.start();
    }

    /* 低频 drone */
    if (p.drone) {
      var d = p.drone;
      var dlp = ctx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = d.lp || 300;
      var dg = ctx.createGain(); dg.gain.value = d.v;
      dlp.connect(dg); dg.connect(master);
      for (var i = 0; i < d.f.length; i++) {
        var o = ctx.createOscillator();
        o.type = d.type; o.frequency.value = d.f[i];
        o.detune.value = (i - 1) * 7;
        o.connect(dlp); o.start();
      }
      if (d.lfo) {
        var l2 = ctx.createOscillator(); l2.type = 'sine'; l2.frequency.value = d.lfo[0];
        var lg2 = ctx.createGain(); lg2.gain.value = d.lfo[1] * d.v * 0.8;
        l2.connect(lg2); lg2.connect(dg.gain); l2.start();
      }
    }

    /* 事件调度 */
    var timers = [];
    (p.ev || []).forEach(function (e) {
      var kind = e[0], lo = e[1], hi = e[2], g = e[3];
      if (offline) {
        var t = 0;
        while (t < offline.duration) { t += rnd(lo, hi); if (t < offline.duration) fire(ctx, master, kind, t, g); }
      } else {
        (function loop() {
          var wait = rnd(lo, hi) * 1000;
          timers.push(setTimeout(function () {
            try { fire(ctx, master, kind, ctx.currentTime + 0.02, g); } catch (err) {}
            loop();
          }, wait));
        })();
      }
    });

    return { master: master, stop: function () {
      timers.forEach(clearTimeout);
      try { master.disconnect(); } catch (e) {}
    } };
  }

  /* ---------- 离线渲染（自检用） ---------- */
  function renderOffline(id, secs) {
    var p = PRESETS[id]; if (!p) return Promise.resolve(null);
    var SR = 44100;
    var ctx = new OfflineAudioContext(2, Math.floor(SR * secs), SR);
    build(ctx, ctx.destination, p, { duration: secs - 0.2 });
    return ctx.startRendering().then(function (buf) {
      var d = buf.getChannelData(0), sum = 0, peak = 0;
      for (var i = 0; i < d.length; i++) { sum += d[i] * d[i]; var a = Math.abs(d[i]); if (a > peak) peak = a; }
      return { rms: Math.sqrt(sum / d.length), peak: peak };
    });
  }

  /* ---------- 运行时挂载 ---------- */
  var ctx = null, graph = null, muted = false, btn = null;

  function ui() {
    var css = 'position:fixed;z-index:2147483000;font:12px/1.4 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;'
      + 'right:14px;bottom:14px;padding:7px 12px;border-radius:999px;cursor:pointer;user-select:none;'
      + 'background:rgba(10,12,17,.72);color:#e9ecf3;border:1px solid rgba(255,255,255,.16);'
      + 'backdrop-filter:blur(8px);opacity:.55;transition:opacity .2s';
    btn = document.createElement('div');
    btn.title = '程序化环境声（?nosound=1 可关闭）';
    btn.style.cssText = css;
    btn.textContent = '🔈 点击开启环境声';
    btn.onmouseenter = function () { btn.style.opacity = 1; };
    btn.onmouseleave = function () { if (ctx) btn.style.opacity = .55; };
    btn.onclick = start;
    document.body.appendChild(btn);
  }

  function start() {
    if (ctx) { muted = !muted; if (graph) graph.master.gain.value = muted ? 0 : PRESETS[presetId].g; btn.textContent = muted ? '🔇 环境声已静音' : '🔊 环境声'; return; }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { btn.textContent = '浏览器不支持 Web Audio'; return; }
    ctx = new AC();
    var p = PRESETS[presetId];
    if (!p) { btn.textContent = '（此场景暂无环境声）'; return; }
    graph = build(ctx, ctx.destination, p, false);
    btn.textContent = '🔊 环境声';
    btn.style.opacity = .55;
    if (ctx.state === 'suspended') ctx.resume();
  }

  var presetId = window.__AMB_PRESET__ || null;

  /* ---------- 试听用：多实例 ---------- */
  var sharedCtx = null, instances = [];

  function auditionCtx() {
    if (!sharedCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      sharedCtx = new AC();
    }
    if (sharedCtx.state === 'suspended') sharedCtx.resume();
    return sharedCtx;
  }

  var A = {
    presets: PRESETS,
    play: function (id) {
      var p = PRESETS[id];
      if (!p) return null;
      var c = auditionCtx();
      var g = c.createGain(); g.gain.value = 0.9;
      var comp = c.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.25;
      g.connect(comp); comp.connect(c.destination);
      var h = build(c, g, p, false);
      var inst = {
        id: id,
        volume: function (v) { g.gain.value = v; },
        stop: function () {
          h.stop();
          try { g.disconnect(); comp.disconnect(); } catch (e) {}
          instances = instances.filter(function (x) { return x !== inst; });
        }
      };
      instances.push(inst);
      return inst;
    },
    stopAll: function () { instances.slice().forEach(function (i) { i.stop(); }); },
    active: function () { return instances.map(function (i) { return i.id; }); },
    renderOffline: renderOffline,
    mount: function (id) { presetId = id; },
    start: start,
    state: function () {
      return { preset: presetId, started: !!ctx, ctxState: ctx ? ctx.state : null,
               muted: muted, presetCount: Object.keys(PRESETS).length };
    }
  };
  window.Ambience = A;

  if (!presetId) return;
  if (/(?:^|[?&])nosound=1/.test(location.search)) return;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ui);
  else ui();
})();
</script>
<!-- AMB:end -->
</body>
</html>
