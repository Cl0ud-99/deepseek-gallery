<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jiangnan Garden</title>
<link rel="icon" href="data:,">
<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: radial-gradient(120% 94% at 50% 32%, #fdf8ea 0%, #ece2ca 34%, #cfc3a6 70%, #ada18a 100%);
  }
  #stage {
    position: fixed;
    inset: 0;
    touch-action: none;
    cursor: grab;
  }
  #stage:active { cursor: grabbing; }
  canvas { display: block; filter: saturate(1.07) contrast(1.04); }
  #fallback {
    position: fixed;
    inset: 0;
    display: none;
    place-content: center;
    padding: 0 12%;
    text-align: center;
    font: 400 15px/2.1 "Songti SC", "SimSun", "Noto Serif SC", serif;
    letter-spacing: .06em;
    color: #6b5b42;
    background: radial-gradient(120% 94% at 50% 32%, #fdf8ea, #e6dcc4);
  }
  #fallback b { display: block; font-size: 19px; font-weight: 500; letter-spacing: .18em; margin-bottom: 10px; color: #4d4030; }
  /* quiet paper vignette, no interface */
  #stage::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(90% 80% at 50% 45%, rgba(255,255,255,0) 48%, rgba(86,70,46,0.10) 100%),
      linear-gradient(180deg, rgba(255,252,242,0.12), rgba(127,108,72,0.06));
    mix-blend-mode: multiply;
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="fallback">
  <b>未能开启 WebGL</b>
  这幅荷风小景需要浏览器的硬件加速支持。<br>
  请换用 Chrome / Edge / Safari 的新版本，或在设置中开启“使用硬件加速”，然后刷新页面。
</div>
<script>
  // only shows if the scene never reaches its first frame
  setTimeout(function () {
    if (window.__gardenReady) return;
    var el = document.getElementById('fallback');
    if (el) el.style.display = 'grid';
  }, 7000);
</script>
