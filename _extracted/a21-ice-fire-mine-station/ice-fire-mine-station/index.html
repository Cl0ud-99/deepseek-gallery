<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<link rel="icon" href="data:,">

<script type="importmap">

  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
/* ==== 00-core.js ==== */
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================
   00 · CORE — 渲染器 / 相机 / 灯光 / 材质 / 通用构件
   ============================================================ */

/* ---------- 确定性随机 ---------- */
let _seed = 20261030;
function srnd() { _seed = (_seed * 16807) % 2147483647; return (_seed - 1) / 2147483646; }
const rnd = (a, b) => a + srnd() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const pick = (arr) => arr[Math.floor(srnd() * arr.length)];
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------- 渲染器 ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
const BASE_DPR = Math.min(window.devicePixelRatio || 1, 1.6);
let curDPR = BASE_DPR;
renderer.setPixelRatio(curDPR);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.14;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a1424, 0.021);

const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(-8.3, 9.5, 13.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.15, 0.92, 0.3);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.rotateSpeed = 0.72;
controls.zoomSpeed = 0.8;
controls.panSpeed = 0.6;
controls.minDistance = 7.5;
controls.maxDistance = 30;
controls.minPolarAngle = 0.18;
controls.maxPolarAngle = Math.PI * 0.495;
controls.enablePan = true;
controls.screenSpacePanning = false;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.22;
let userTouched = false;
const stopAuto = () => { if (!userTouched) { userTouched = true; controls.autoRotate = false; } };
renderer.domElement.addEventListener('pointerdown', stopAuto, { once: true });
/* 调试相机参数 */
{
  const q = new URLSearchParams(location.search);
  if (q.get('cam')) { const v = q.get('cam').split(',').map(Number); camera.position.set(v[0], v[1], v[2]); }
  if (q.get('tgt')) { const v = q.get('tgt').split(',').map(Number); controls.target.set(v[0], v[1], v[2]); }
  if (q.get('cam') || q.get('tgt')) { controls.autoRotate = false; userTouched = true; }
}
renderer.domElement.addEventListener('wheel', stopAuto, { once: true, passive: true });
renderer.domElement.addEventListener('touchstart', stopAuto, { once: true, passive: true });

/* 限制平移范围，别把模型推出画面 */
const _tgt = new THREE.Vector3();
controls.addEventListener('change', () => {
  _tgt.copy(controls.target);
  _tgt.x = THREE.MathUtils.clamp(_tgt.x, -2.6, 2.6);
  _tgt.y = THREE.MathUtils.clamp(_tgt.y, -0.2, 3.4);
  _tgt.z = THREE.MathUtils.clamp(_tgt.z, -2.6, 2.6);
  controls.target.copy(_tgt);
});

/* ---------- 背景穹顶（夜色渐变） ---------- */
{
  const geo = new THREE.SphereGeometry(60, 32, 20);
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      cTop: { value: new THREE.Color(0x0b1730) },
      cMid: { value: new THREE.Color(0x142a44) },
      cBot: { value: new THREE.Color(0x05070d) },
      cWarm: { value: new THREE.Color(0x3a1c18) }
    },
    vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `
      varying vec3 vP; uniform vec3 cTop,cMid,cBot,cWarm;
      void main(){
        float h = clamp(normalize(vP).y * 0.5 + 0.5, 0.0, 1.0);
        vec3 c = mix(cBot, cMid, smoothstep(0.30, 0.62, h));
        c = mix(c, cTop, smoothstep(0.58, 1.0, h));
        float warm = smoothstep(0.42, 0.0, abs(h - 0.46)) * smoothstep(0.55, 1.0, normalize(vP).x * -0.5 + 0.5);
        c += cWarm * warm * 0.55;
        gl_FragColor = vec4(c, 1.0);
      }`
  });
  const sky = new THREE.Mesh(geo, mat);
  sky.frustumCulled = false;
  scene.add(sky);
}

/* ---------- 灯光 ---------- */
const hemi = new THREE.HemisphereLight(0xa6c6f2, 0x6a4228, 1.2);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xffe6c8, 3.3);
keyLight.position.set(8.5, 13, 7.5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1536, 1536);
keyLight.shadow.camera.left = -9; keyLight.shadow.camera.right = 9;
keyLight.shadow.camera.top = 9; keyLight.shadow.camera.bottom = -9;
keyLight.shadow.camera.near = 1; keyLight.shadow.camera.far = 42;
keyLight.shadow.bias = -0.0009;
keyLight.shadow.normalBias = 0.022;
keyLight.shadow.radius = 2.2;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x74b4ff, 1.75);
rimLight.position.set(-9, 6.5, -8);
scene.add(rimLight);

const fillLight = new THREE.DirectionalLight(0xff9a5c, 1.15);
fillLight.position.set(-4, 2, 9);
scene.add(fillLight);

const amb = new THREE.AmbientLight(0x475a78, 0.75);
scene.add(amb);

/* ---------- 色板 ---------- */
const PAL = {
  woodDark: 0x4d3122, wood: 0x6b452d, woodLite: 0x8a5c3b, woodWarm: 0xa8724a,
  iron: 0x2b2f38, ironLite: 0x474e5b, ironRust: 0x5c3a2c, brass: 0xc08a45, copper: 0x8f5a34,
  stone: 0x565f6b, stoneDark: 0x3a4149, stoneLite: 0x717c88,
  snow: 0xe8f3ff, snowShade: 0xc2d8ee, ash: 0x24242a,
  ice: 0x8ee2ff, iceDeep: 0x2f7ba8, iceDark: 0x1d4a6b,
  lava: 0xff5a1c, lavaHot: 0xffc25a, lavaDark: 0x8a1f0c,
  crys: 0xa96bff, gold: 0xffd070, teal: 0x3fd8c8,
  warm: 0xffb266, warmHot: 0xffd9a0,
  leaf: 0x2f5b46
};

/* ---------- 材质工厂 ---------- */
function makeGradient(steps) {
  const data = new Uint8Array(steps);
  for (let i = 0; i < steps; i++) data[i] = Math.round(lerp(88, 255, i / (steps - 1)));
  const t = new THREE.DataTexture(data, steps, 1, THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.needsUpdate = true;
  return t;
}
const GRAD = makeGradient(4);

const _matCache = new Map();
function tm(color, opts = {}) {
  const key = color + '|' + JSON.stringify(opts);
  if (!_matCache.has(key)) {
    _matCache.set(key, new THREE.MeshToonMaterial(Object.assign({ color, gradientMap: GRAD }, opts)));
  }
  return _matCache.get(key);
}
function em(color, intensity = 1.8, base = 0x0a0a12) {
  return tm(base, { emissive: color, emissiveIntensity: intensity });
}

/* 发光贴图（径向渐变） */
function radialTex(inner = 'rgba(255,255,255,1)', mid = 'rgba(255,255,255,0.35)', size = 128) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const g = cv.getContext('2d');
  const grd = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  grd.addColorStop(0, inner);
  grd.addColorStop(0.42, mid);
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, size, size);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const TEX_GLOW = radialTex();
const TEX_SOFT = radialTex('rgba(255,255,255,0.85)', 'rgba(255,255,255,0.22)', 128);

function glowSprite(color, size, opacity, x, y, z, parent) {
  const m = new THREE.SpriteMaterial({
    map: TEX_SOFT, color, transparent: true, opacity,
    blending: THREE.AdditiveBlending, depthWrite: false, fog: false
  });
  const s = new THREE.Sprite(m);
  s.scale.set(size, size, 1);
  s.position.set(x, y, z);
  (parent || world).add(s);
  return s;
}

/* ---------- 场景根 ---------- */
const world = new THREE.Group();
scene.add(world);

/* ---------- 构件助手（y 为底面高度） ---------- */
const G = (parent) => { const g = new THREE.Group(); (parent || world).add(g); return g; };

function B(w, h, d, mat, x, yb, z, parent, outline = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, yb + h / 2, z);
  m.castShadow = true; m.receiveShadow = true;
  m.userData.outline = outline;
  (parent || world).add(m);
  return m;
}
function C(rt, rb, h, seg, mat, x, yb, z, parent, outline = true) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, yb + h / 2, z);
  m.castShadow = true; m.receiveShadow = true;
  m.userData.outline = outline;
  (parent || world).add(m);
  return m;
}
function S(r, seg, mat, x, y, z, parent, outline = false) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, seg, Math.max(6, seg >> 1)), mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  m.userData.outline = outline;
  (parent || world).add(m);
  return m;
}
function Plane(w, h, mat, x, y, z, parent, outline = false) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  m.position.set(x, y, z);
  m.userData.outline = outline;
  (parent || world).add(m);
  return m;
}
/* 两点之间的圆柱（线缆 / 管道 / 扶手） */
function beam(a, b, r, mat, parent, seg = 6) {
  const A = new THREE.Vector3(...a), Bv = new THREE.Vector3(...b);
  const dir = new THREE.Vector3().subVectors(Bv, A);
  const len = dir.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg, 1, false), mat);
  m.position.copy(A).add(Bv).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  m.castShadow = true;
  m.userData.outline = false;
  (parent || world).add(m);
  return m;
}
/* 低模岩石 */
const _rockGeoCache = [];
function rockGeo(radius = 1, detail = 0, jitter = 0.26, seed = 0) {
  const g = new THREE.IcosahedronGeometry(radius, detail);
  const pos = g.attributes.position;
  const v = new THREE.Vector3();
  const s = seed * 7.13 + 1.7;
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const n = Math.sin(v.x * 3.1 + s) * Math.cos(v.y * 2.7 + s * 1.7) * Math.sin(v.z * 3.5 + s * 2.3);
    v.multiplyScalar(1 + n * jitter);
    v.y *= 0.78;
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  return g;
}
function rock(r, mat, x, y, z, parent, jitter = 0.28, seed = rnd(0, 99), detail = 0) {
  const m = new THREE.Mesh(rockGeo(r, detail, jitter, seed), mat);
  m.position.set(x, y, z);
  m.rotation.set(rnd(-0.3, 0.3), rnd(0, 6.28), rnd(-0.3, 0.3));
  m.castShadow = true; m.receiveShadow = true;
  m.userData.outline = true;
  (parent || world).add(m);
  return m;
}
/* 尖晶 / 晶体 */
function crystalGeo(r, h, sides = 6) {
  const g = new THREE.ConeGeometry(r, h, sides, 1);
  // 削成双锥：上半保留，底部收一点
  return g;
}
function crystal(r, h, mat, x, y, z, parent, tilt = 0) {
  const m = new THREE.Mesh(crystalGeo(r, h, 6), mat);
  m.position.set(x, y + h / 2, z);
  m.rotation.set(rnd(-0.12, 0.12) + tilt, rnd(0, 6.28), rnd(-0.12, 0.12));
  m.castShadow = true;
  m.userData.outline = true;
  (parent || world).add(m);
  return m;
}

/* ---------- 画布文字贴图 ---------- */
function canvasTex(w, h, draw) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  draw(g, w, h);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function signMat(tex, emissive = 0x000000, ei = 0) {
  return new THREE.MeshBasicMaterial({ map: tex, transparent: true, toneMapped: true, side: THREE.DoubleSide });
}

/* ---------- 轮廓线收集 ---------- */
const OUTLINE_T = 0.021;
function buildOutlines() {
  const geos = [];
  world.updateMatrixWorld(true);
  world.traverse((o) => {
    if (o.isMesh && o.userData.outline && o.geometry) {
      let g = o.geometry.clone();
      if (g.index) g = g.toNonIndexed();
      g.applyMatrix4(o.matrixWorld);
      for (const k of Object.keys(g.attributes)) {
        if (k !== 'position' && k !== 'normal') g.deleteAttribute(k);
      }
      if (!g.attributes.normal) g.computeVertexNormals();
      if (g.attributes.position.count < 3000) geos.push(g);
    }
  });
  const merged = mergeGeometries(geos, false);
  if (!merged) return;
  const mat = new THREE.ShaderMaterial({
    uniforms: { uColor: { value: new THREE.Color(0x0a0c14) }, uT: { value: OUTLINE_T } },
    vertexShader: `
      uniform float uT;
      void main(){
        vec3 p = position + normalize(normal) * uT;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
      }`,
    fragmentShader: `uniform vec3 uColor; void main(){ gl_FragColor = vec4(uColor, 1.0); }`,
    side: THREE.BackSide
  });
  const mesh = new THREE.Mesh(merged, mat);
  mesh.frustumCulled = false;
  mesh.renderOrder = -1;
  scene.add(mesh);
}
/* 动态物体的子级轮廓 */
const outlineMatChild = new THREE.ShaderMaterial({
  uniforms: { uColor: { value: new THREE.Color(0x0a0c14) }, uT: { value: 0.02 } },
  vertexShader: `
    uniform float uT;
    void main(){
      vec3 p = position + normalize(normal) * uT;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }`,
  fragmentShader: `uniform vec3 uColor; void main(){ gl_FragColor = vec4(uColor, 1.0); }`,
  side: THREE.BackSide
});
function childOutline(mesh, t = 0.02) {
  const m = new THREE.Mesh(mesh.geometry, outlineMatChild.clone());
  m.material.uniforms.uT.value = t;
  m.scale.setScalar(1.0);
  mesh.add(m);
  return m;
}

/* ---------- 后期 ---------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth * 0.6, window.innerHeight * 0.6), 0.32, 0.52, 1.02);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  bloom.setSize(window.innerWidth * 0.6, window.innerHeight * 0.6);
}
window.addEventListener('resize', onResize);

/* ---------- 自适应画质 ---------- */
let _ft = 0, _fn = 0, _adapt = 0;
function adaptQuality(dt) {
  if (_adapt > 2) return;
  _ft += dt; _fn++;
  if (_fn < 90) return;
  const avg = _ft / _fn;
  _ft = 0; _fn = 0;
  if (avg > 0.034 && curDPR > 0.85) {
    curDPR = Math.max(0.85, curDPR - 0.3);
    renderer.setPixelRatio(curDPR);
    composer.setSize(window.innerWidth, window.innerHeight);
    _adapt++;
  } else {
    _adapt = 3;
  }
}

/* ---------- 时间与动画注册 ---------- */
const clock = new THREE.Clock();
const updaters = [];
const onFrame = (fn) => updaters.push(fn);

/* ==== 10-base.js ==== */
/* ============================================================
   10 · BASE — 冰火交融底座 / 熔岩瀑布 / 冰川深潭 / 伴生水晶
   ============================================================ */

const HALF = 5.5;          // 底座半宽
const STREET_Y = 0;
const BX0 = -2.9, BX1 = 1.3, BZ0 = -3.9, BZ1 = -0.6;   // 建筑占地
const SHELF_Y = 1.28;      // 熔岩台地高度
const POOL_Y = -0.52;      // 冰潭水面
const FALL_Z = 1.15;       // 熔岩瀑布落点 z
const CONTACT = new THREE.Vector3(-3.72, POOL_Y, 1.55);

const FX = { lava: [], steam: [], drips: [], spirits: [], pulses: [] };

/* ---------- 熔岩 / 水面着色器 ---------- */
const NOISE_GLSL = `
  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
  float vnoise(vec2 p){
    vec2 i = floor(p), f = fract(p);
    f = f*f*(3.0-2.0*f);
    return mix(mix(hash(i), hash(i+vec2(1.0,0.0)), f.x),
               mix(hash(i+vec2(0.0,1.0)), hash(i+vec2(1.0,1.0)), f.x), f.y);
  }
  float fbm(vec2 p){ return vnoise(p)*0.55 + vnoise(p*2.3+11.0)*0.28 + vnoise(p*5.1+31.0)*0.17; }
`;

function lavaMaterial(speed = 1.0, hot = 1.0) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uT: { value: 0 }, uSpeed: { value: speed }, uHot: { value: hot },
      cA: { value: new THREE.Color(0x4a0a04) },
      cB: { value: new THREE.Color(0xff5a14) },
      cC: { value: new THREE.Color(0xffd66a) }
    },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: NOISE_GLSL + `
      varying vec2 vUv; uniform float uT, uSpeed, uHot; uniform vec3 cA, cB, cC;
      void main(){
        vec2 uv = vUv;
        float t = uT * uSpeed;
        float n1 = fbm(vec2(uv.x*7.0, uv.y*4.5 - t*1.15));
        float n2 = fbm(vec2(uv.x*16.0 + 7.0, uv.y*9.0 - t*2.3));
        float v = n1*0.62 + n2*0.38;
        v += 0.09 * sin(uv.x*26.0 + n1*7.0);           // 纵向流纹
        vec3 hot = mix(cB, cC, smoothstep(0.44, 0.74, v));
        // 冷却黑壳与热缝
        vec3 col = mix(cA, hot, smoothstep(0.40, 0.53, v));
        col = mix(col, cC, smoothstep(0.60, 0.84, v) * uHot);
        // 流芯
        float core = smoothstep(0.62, 0.0, abs(uv.x - 0.5));
        col += cC * core * 0.18 * uHot;
        // 纵向流丝（增强"向下倾倒"的观感）
        float streak = smoothstep(0.55, 1.0, sin(uv.x*34.0 + n1*9.0)*0.5 + 0.5);
        col += cC * streak * 0.16 * uHot;
        // 底部接近落点更亮
        col *= mix(0.92, 1.22, smoothstep(0.55, 1.0, uv.y));
        // 冷却壳
        float edge = smoothstep(0.0, 0.13, uv.x) * smoothstep(1.0, 0.87, uv.x);
        col *= mix(0.3, 1.0, edge);
        gl_FragColor = vec4(col, 1.0);
      }`
  });
}
function waterMaterial() {
  return new THREE.ShaderMaterial({
    transparent: true,
    uniforms: {
      uT: { value: 0 },
      cDeep: { value: new THREE.Color(0x07243a) },
      cMid: { value: new THREE.Color(0x1d6f9c) },
      cIce: { value: new THREE.Color(0x9fe8ff) }
    },
    vertexShader: `varying vec2 vUv; varying vec3 vP; void main(){ vUv = uv; vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `

function dualCrystal(r, h, x, y, z, parent, tiltX = 0, tiltZ = 0) {
  let g = new THREE.ConeGeometry(r, h, 6, 4, false).toNonIndexed();
  g.computeVertexNormals();
  const pos = g.attributes.position;
  const col = new Float32Array(pos.count * 3);
  const cIce = new THREE.Color(0x35c8ff), cViolet = new THREE.Color(0x9a3cff), cGold = new THREE.Color(0xffc247);
  const tmp = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const t = THREE.MathUtils.clamp(pos.getY(i) / h + 0.5, 0, 1);
    if (t < 0.55) tmp.copy(cIce).lerp(cViolet, t / 0.55);
    else tmp.copy(cViolet).lerp(cGold, (t - 0.55) / 0.45);
    col[i * 3] = tmp.r; col[i * 3 + 1] = tmp.g; col[i * 3 + 2] = tmp.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const m = new THREE.Mesh(g, crystalMat);
  m.position.set(x, y + h / 2, z);
  m.rotation.set(tiltX, rnd(0, 6.28), tiltZ);
  m.castShadow = true;
  m.userData.outline = true;
  (parent || world).add(m);
  return m;
}

function cobbleTexture() {
  return canvasTex(768, 768, (g, w, h) => {
    g.fillStyle = '#1d2530'; g.fillRect(0, 0, w, h);
    const N = 7, cell = w / N;
    for (let i = 0; i < N; i++) {
      for (let j = 0; j < N; j++) {
        const jx = (srnd() - 0.5) * cell * 0.16, jy = (srnd() - 0.5) * cell * 0.16;
        const x = i * cell + 4 + jx, y = j * cell + 4 + jy;
        const ww = cell - 8 + (srnd() - 0.5) * 5, hh = cell - 8 + (srnd() - 0.5) * 5;
        const v = 80 + srnd() * 44;
        const r = Math.round(v * 0.94 + srnd() * 12);
        const gg = Math.round(v * 0.98 + srnd() * 10);
        const b = Math.round(v * 1.06 + srnd() * 12);
        g.fillStyle = `rgb(${r},${gg},${b})`;
        roundRect(g, x, y, ww, hh, 12 + srnd() * 10);
        g.fill();
        // 石面高光
        g.fillStyle = `rgba(${r + 42},${gg + 46},${b + 56},0.5)`;
        roundRect(g, x + 5, y + 4, ww - 12, hh * 0.42, 10);
        g.fill();

function woodTexture(base = '#8a5f40', dark = '#3f2a1a', plankCount = 8) {
  return canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    const pw = w / plankCount;
    for (let i = 0; i < plankCount; i++) {
      const x = i * pw;
      const shade = 0.82 + srnd() * 0.3;
      g.fillStyle = `rgba(${Math.round(58 * shade)},${Math.round(36 * shade)},${Math.round(24 * shade)},0.55)`;
      g.fillRect(x, 0, pw - 1, h);
      // 木纹
      for (let k = 0; k < 7; k++) {
        g.strokeStyle = `rgba(${30 + srnd() * 40},${18 + srnd() * 24},${10 + srnd() * 16},${0.15 + srnd() * 0.25})`;
        g.lineWidth = 0.8 + srnd() * 1.8;
        g.beginPath();
        const gx = x + 4 + srnd() * (pw - 8);
        g.moveTo(gx, 0);
        for (let y = 0; y < h; y += 32) g.lineTo(gx + Math.sin(y * 0.05 + k) * 2.2, y);
        g.stroke();
      }
      // 板缝
      g.fillStyle = dark; g.fillRect(x + pw - 2, 0, 2, h);
      // 钉子
      g.fillStyle = 'rgba(150,150,160,0.5)';
      g.beginPath(); g.arc(x + pw * 0.5, 14, 2.4, 0, 6.3); g.fill();
      g.beginPath(); g.arc(x + pw * 0.5, h - 14, 2.4, 0, 6.3); g.fill();
    }
  });
}

function chamferShape(w, h, c) {
  const s = new THREE.Shape();
  s.moveTo(-w / 2, -h / 2);
  s.lineTo(w / 2, -h / 2);
  s.lineTo(w / 2, h / 2 - c);
  s.lineTo(w / 2 - c, h / 2);
  s.lineTo(-w / 2 + c, h / 2);
  s.lineTo(-w / 2, h / 2 - c);
  s.closePath();
  return s;
}
function innerChamfer(w, h, c, b) {
  const s = new THREE.Shape();
  s.moveTo(-w / 2 + b, -h / 2 + b);
  s.lineTo(w / 2 - b, -h / 2 + b);
  s.lineTo(w / 2 - b, h / 2 - c);
  s.lineTo(w / 2 - c, h / 2 - b);
  s.lineTo(-w / 2 + c, h / 2 - b);
  s.lineTo(-w / 2 + b, h / 2 - c);
  s.closePath();
  return s;
}

function makeSteam(cfg) {
  const n = cfg.n;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(n * 3);
  const alpha = new Float32Array(n);
  const size = new Float32Array(n);
  const data = [];
  for (let i = 0; i < n; i++) {
    const life = rnd(0, 1);
    data.push({ life, sp: rnd(0.55, 1.1), dx: rnd(-1, 1), dz: rnd(-1, 1), ph: rnd(0, 6.28) });
    pos[i * 3] = cfg.x; pos[i * 3 + 1] = cfg.y; pos[i * 3 + 2] = cfg.z;
    alpha[i] = 0; size[i] = cfg.small ? rnd(0.12, 0.28) : rnd(0.3, 0.7);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aAlpha', new THREE.BufferAttribute(alpha, 1));
  geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTex: { value: TEX_SOFT }, uColor: { value: new THREE.Color(cfg.color) }, uOpacity: { value: cfg.opacity || 0.1 } },
    vertexShader: `
      attribute float aAlpha; attribute float aSize;
      varying float vA;
      void main(){
        vA = aAlpha;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = aSize * 420.0 / max(0.001, -mv.z);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform sampler2D uTex; uniform vec3 uColor; uniform float uOpacity;
      varying float vA;
      void main(){
        vec4 tx = texture2D(uTex, gl_PointCoord);
        gl_FragColor = vec4(uColor, tx.a * vA * uOpacity);
      }`,
    transparent: true, depthWrite: false, blending: THREE.NormalBlending
  });
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  FXG.add(pts);
  return { pts, geo, pos, alpha, size, data, cfg };
}

/* ============================================================
   动画
   ============================================================ */
let lastT = 0;
onFrame((dt, t) => {
  /* 熔岩 / 水 */
  for (const m of FX.lava) m.uniforms.uT.value = t;
  waterMat.uniforms.uT.value = t;
  crystalMat.uniforms.uT.value = t;

  /* 雨 */
  for (let i = 0; i < RAIN_N; i++) {
    const o = i * 6;
    const v = rainVel[i] * dt;
    rainPos[o + 1] -= v; rainPos[o + 4] -= v;
    rainPos[o] -= v * 0.09; rainPos[o + 3] -= v * 0.09;
    if (rainPos[o + 4] < -0.4) {
      const [x, z] = respawnXZ();
      const y = rnd(8.4, 9.6);
      const len = rainLen[i];
      rainPos[o] = x; rainPos[o + 1] = y; rainPos[o + 2] = z;
      rainPos[o + 3] = x + 0.03; rainPos[o + 4] = y - len; rainPos[o + 5] = z;
    }
  }
  rainGeo.attributes.position.needsUpdate = true;

  /* 雪 */
  for (let i = 0; i < SNOW_N; i++) {
    const d = snowData[i];
    snowPos[i * 3 + 1] -= d.v * dt;
    snowPos[i * 3] += Math.sin(t * d.sp + d.ph) * d.amp * dt;
    snowPos[i * 3 + 2] += Math.cos(t * d.sp * 0.8 + d.ph) * d.amp * 0.7 * dt;
    if (snowPos[i * 3 + 1] < -0.3) {
      const [x, z] = respawnXZ();
      snowPos[i * 3] = x; snowPos[i * 3 + 1] = rnd(7.5, 9.2); snowPos[i * 3 + 2] = z;
    }
  }
  snowGeo.attributes.position.needsUpdate = true;

  /* 蒸汽 */
  for (const st of steams) {
    const { pos, alpha, size, data, cfg } = st;
    for (let i = 0; i < data.length; i++) {
      const d = data[i];
      d.life += dt * 0.16 * d.sp;
      if (d.life > 1) { d.life = 0; d.dx = rnd(-1, 1); d.dz = rnd(-1, 1); d.ph = rnd(0, 6.28); }
      const l = d.life;
      pos[i * 3] = cfg.x + d.dx * cfg.spread * (0.35 + l * 1.5) + Math.sin(t * 0.9 + d.ph) * 0.09 * l;
      pos[i * 3 + 1] = cfg.y + l * cfg.up * 2.6;
      pos[i * 3 + 2] = cfg.z + d.dz * cfg.spread * (0.35 + l * 1.4) + Math.cos(t * 0.7 + d.ph) * 0.08 * l;
      alpha[i] = Math.sin(l * Math.PI) * (1 - l * 0.25);
      size[i] = (cfg.small ? 0.12 : 0.26) * (0.5 + l * 2.0);
    }
    st.geo.attributes.position.needsUpdate = true;
    st.geo.attributes.aAlpha.needsUpdate = true;
    st.geo.attributes.aSize.needsUpdate = true;
  }

  /* 火星 */
  for (let i = 0; i < SPARK_N; i++) {
    const s = sparkData[i];
    s.life -= dt * 0.7;
    if (s.life <= 0) resetSpark(s);
    s.vy -= dt * 2.2;
    s.x += s.vx * dt; s.y += s.vy * dt; s.z += s.vz * dt;
    sparkPos[i * 3] = s.x; sparkPos[i * 3 + 1] = s.y; sparkPos[i * 3 + 2] = s.z;
  }
  sparkGeo.attributes.position.needsUpdate = true;

  /* 滴水 */
  for (const d of drips) {
    d.t -= dt;
    if (d.t <= 0) {
      d.t = rnd(1.4, 3.6);
      d.m.visible = true;
      d.m.position.set(d.x, d.y, d.z);
      d.vy = 0;
      d.falling = true;
      d.ring.visible = false;
    }
    if (d.falling) {
      d.vy += 9.5 * dt;

        var lfo = ctx.createOscillator(); lfo.type = 'square'; lfo.frequency.value = rnd(3, 9);
        lfo.connect(trem.gain); o.connect(trem); env(trem, gain, 0.03, 0, 0.6);
        o.start(t); lfo.start(t); o.stop(t + 0.65); lfo.stop(t + 0.65);
        break;
      case 'glitch':
        o = ctx.createOscillator(); o.type = 'square'; o.frequency.value = rnd(200, 900);
        env(o, gain, 0.001, 0, 0.06); o.start(t); o.stop(t + 0.08);
        var o4 = ctx.createOscillator(); o4.type = 'square'; o4.frequency.value = rnd(200, 900);
        env(o4, gain * 0.7, 0.001, 0, 0.05); o4.start(t + 0.09); o4.stop(t + 0.16);
        break;
      case 'alarm':
        o = ctx.createOscillator(); o.type = 'sine';
        o.frequency.setValueAtTime(440, t); o.frequency.linearRampToValueAtTime(330, t + 0.9);
        env(o, gain * 0.8, 0.2, 0, 1.0); o.start(t); o.stop(t + 1.05);
        break;
      case 'ice':
        var s6 = ctx.createBufferSource(); s6.buffer = noiseBuf(ctx, 'white', 0.5); s6.loop = true;
        var bp6 = ctx.createBiquadFilter(); bp6.type = 'bandpass'; bp6.frequency.value = rnd(1800, 4200); bp6.Q.value = 3;
        s6.connect(bp6); env(bp6, gain * 1.8, 0.01, 0, 0.45); s6.start(t); s6.stop(t + 0.5);
        break;
      case 'tram':
        o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = rnd(660, 760);
        env(o, gain * 0.9, 0.01, 0, 0.7); o.start(t); o.stop(t + 0.75);
        var o5 = ctx.createOscillator(); o5.type = 'sine'; o5.frequency.value = 520;
        env(o5, gain * 0.5, 0.01, 0, 0.5); o5.start(t + 0.12); o5.stop(t + 0.65);
        break;
      case 'gramo':
        var s7 = ctx.createBufferSource(); s7.buffer = noiseBuf(ctx, 'white', 1.2); s7.loop = true;
        var bp7 = ctx.createBiquadFilter(); bp7.type = 'bandpass'; bp7.frequency.value = 1400; bp7.Q.value = 0.9;
        s7.connect(bp7); env(bp7, gain * 0.5, 0.4, 0, 1.6); s7.start(t); s7.stop(t + 1.7);
        var om = ctx.createOscillator(); om.type = 'triangle'; om.frequency.value = rnd(220, 330);
        var fm = ctx.createBiquadFilter(); fm.type = 'lowpass'; fm.frequency.value = 1400;
        om.connect(fm); env(fm, gain * 0.55, 0.15, 0, 1.4); om.start(t); om.stop(t + 1.5);
        break;
      case 'lava':
        var s9 = ctx.createBufferSource(); s9.buffer = noiseBuf(ctx, 'brown', 0.35); s9.loop = true;
        var lp9 = ctx.createBiquadFilter(); lp9.type = 'lowpass'; lp9.frequency.value = rnd(180, 430);
        s9.connect(lp9); env(lp9, gain * 1.8, 0.025, 0, 0.5); s9.start(t); s9.stop(t + 0.55);
        var o9 = ctx.createOscillator(); o9.type = 'sine';
        o9.frequency.setValueAtTime(rnd(80, 150), t);
        o9.frequency.exponentialRampToValueAtTime(rnd(38, 62), t + 0.24);
        env(o9, gain * 0.7, 0.006, 0, 0.3); o9.start(t); o9.stop(t + 0.35);
        break;
      case 'truck':
        var s8 = ctx.createBufferSource(); s8.buffer = noiseBuf(ctx, 'brown', 1.5); s8.loop = true;
        var lp8 = ctx.createBiquadFilter(); lp8.type = 'lowpass'; lp8.frequency.value = 340;
        s8.connect(lp8); env(lp8, gain * 1.4, 1.2, 0, 3.4); s8.start(t); s8.stop(t + 3.6);
        break;
      case 'frog':
        for (var q = 0; q < 2; q++) {
          var of = ctx.createOscillator(); of.type = 'square'; of.frequency.value = rnd(160, 260);
          var gf = ctx.createGain();
          var tq = t + q * 0.16;
          gf.gain.setValueAtTime(0.0001, tq);
          gf.gain.exponentialRampToValueAtTime(Math.max(gain * 0.5, 0.0002), tq + 0.01);
          gf.gain.exponentialRampToValueAtTime(0.0001, tq + 0.09);
          of.connect(gf); gf.connect(dest); of.start(tq); of.stop(tq + 0.11);
        }
        break;
    }
  }

  /* ---------- 构建整条链路 ---------- */
  function build(ctx, dest, p, offline) {
    var master = ctx.createGain(); master.gain.value = p.g;
    var comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.ratio.value = 3.5; comp.attack.value = 0.01; comp.release.value = 0.3;
    master.connect(comp); comp.connect(dest);

    /* 噪声床 */
    if (p.bed) {
      var b = p.bed;
      var src = ctx.createBufferSource();
      src.buffer = noiseBuf(ctx, b.n, 4); src.loop = true;
      var flt = ctx.createBiquadFilter(); flt.type = b.t; flt.frequency.value = b.f; flt.Q.value = b.q || 0.7;
      var bg = ctx.createGain(); bg.gain.value = b.v;
      src.connect(flt); flt.connect(bg); bg.connect(master);
      if (b.lfo) {
        var l = ctx.createOscillator(); l.type = 'sine'; l.frequency.value = b.lfo[0];
        var lg = ctx.createGain(); lg.gain.value = b.lfo[1] * b.v;
        l.connect(lg); lg.connect(bg.gain); l.start();
      }
      src.start();
    }

    /* 低频 drone */
    if (p.drone) {
      var d = p.drone;
      var dlp = ctx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = d.lp || 300;
      var dg = ctx.createGain(); dg.gain.value = d.v;
      dlp.connect(dg); dg.connect(master);
      for (var i = 0; i < d.f.length; i++) {
        var o = ctx.createOscillator();
        o.type = d.type; o.frequency.value = d.f[i];
        o.detune.value = (i - 1) * 7;
        o.connect(dlp); o.start();
      }
      if (d.lfo) {
        var l2 = ctx.createOscillator(); l2.type = 'sine'; l2.frequency.value = d.lfo[0];
        var lg2 = ctx.createGain(); lg2.gain.value = d.lfo[1] * d.v * 0.8;
        l2.connect(lg2); lg2.connect(dg.gain); l2.start();
      }
    }

    /* 事件调度 */
    var timers = [];
    (p.ev || []).forEach(function (e) {
      var kind = e[0], lo = e[1], hi = e[2], g = e[3];
      if (offline) {
        var t = 0;
        while (t < offline.duration) { t += rnd(lo, hi); if (t < offline.duration) fire(ctx, master, kind, t, g); }
      } else {
        (function loop() {
          var wait = rnd(lo, hi) * 1000;
          timers.push(setTimeout(function () {
            try { fire(ctx, master, kind, ctx.currentTime + 0.02, g); } catch (err) {}
            loop();
          }, wait));
        })();
      }
    });

    return { master: master, stop: function () {
      timers.forEach(clearTimeout);
      try { master.disconnect(); } catch (e) {}
    } };
  }

  /* ---------- 离线渲染（自检用） ---------- */
  function renderOffline(id, secs) {
    var p = PRESETS[id]; if (!p) return Promise.resolve(null);
    var SR = 44100;
    var ctx = new OfflineAudioContext(2, Math.floor(SR * secs), SR);
    build(ctx, ctx.destination, p, { duration: secs - 0.2 });
    return ctx.startRendering().then(function (buf) {
      var d = buf.getChannelData(0), sum = 0, peak = 0;
      for (var i = 0; i < d.length; i++) { sum += d[i] * d[i]; var a = Math.abs(d[i]); if (a > peak) peak = a; }
      return { rms: Math.sqrt(sum / d.length), peak: peak };
    });
  }

  /* ---------- 运行时挂载 ---------- */
  var ctx = null, graph = null, muted = false, btn = null;

  function ui() {
    /* 被画廊嵌进 iframe 时不生成自带按钮——外层已有音效开关 */
    if (window.top !== window.self) return;
    var css = 'position:fixed;z-index:2147483000;font:12px/1.4 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;'
      + 'right:14px;bottom:14px;padding:7px 12px;border-radius:999px;cursor:pointer;user-select:none;'
      + 'background:rgba(10,12,17,.72);color:#e9ecf3;border:1px solid rgba(255,255,255,.16);'
      + 'backdrop-filter:blur(8px);opacity:.55;transition:opacity .2s';
    btn = document.createElement('div');
    btn.title = '程序化环境声（?nosound=1 可关闭）';
    btn.style.cssText = css;
    btn.textContent = '🔈 点击开启环境声';
    btn.onmouseenter = function () { btn.style.opacity = 1; };
    btn.onmouseleave = function () { if (ctx) btn.style.opacity = .55; };
    btn.onclick = start;
    document.body.appendChild(btn);
  }

  function start() {
    if (ctx) { muted = !muted; if (graph) graph.master.gain.value = muted ? 0 : PRESETS[presetId].g; btn.textContent = muted ? '🔇 环境声已静音' : '🔊 环境声'; return; }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { btn.textContent = '浏览器不支持 Web Audio'; return; }
    ctx = new AC();
    var p = PRESETS[presetId];
    if (!p) { btn.textContent = '（此场景暂无环境声）'; return; }
    graph = build(ctx, ctx.destination, p, false);
    btn.textContent = '🔊 环境声';
    btn.style.opacity = .55;
    if (ctx.state === 'suspended') ctx.resume();
  }

  var presetId = window.__AMB_PRESET__ || null;

  /* ---------- 试听用：多实例 ---------- */
  var sharedCtx = null, instances = [];

  function auditionCtx() {
    if (!sharedCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      sharedCtx = new AC();
    }
    if (sharedCtx.state === 'suspended') sharedCtx.resume();
    return sharedCtx;
  }

  var A = {
    presets: PRESETS,
    play: function (id) {
      var p = PRESETS[id];
      if (!p) return null;
      var c = auditionCtx();
      var g = c.createGain(); g.gain.value = 0.9;
      var comp = c.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.25;
      g.connect(comp); comp.connect(c.destination);
      var h = build(c, g, p, false);
      var inst = {
        id: id,
        volume: function (v) { g.gain.value = v; },
        stop: function () {
          h.stop();
          try { g.disconnect(); comp.disconnect(); } catch (e) {}
          instances = instances.filter(function (x) { return x !== inst; });
        }
      };
      instances.push(inst);
      return inst;
    },
    stopAll: function () {
      instances.slice().forEach(function (i) { i.stop(); });
      /* 单场景模式下 instances 是空的，必须同时把本实例静音，
         否则外层开关只能开、关不掉 */
      if (ctx) { muted = true; if (graph) graph.master.gain.value = 0; }
    },
    on: function () {
      if (!ctx) { start(); return; }
      muted = false;
      if (graph) graph.master.gain.value = PRESETS[presetId].g;
    },
    off: function () {
      if (!ctx) return;
      muted = true;
      if (graph) graph.master.gain.value = 0;
    },
    active: function () { return instances.map(function (i) { return i.id; }); },
    renderOffline: renderOffline,
    mount: function (id) { presetId = id; },
    start: start,
    state: function () {
      return { preset: presetId, started: !!ctx, ctxState: ctx ? ctx.state : null,
               muted: muted, presetCount: Object.keys(PRESETS).length };
    }
  };
  window.Ambience = A;

  if (!presetId) return;
  if (/(?:^|[?&])nosound=1/.test(location.search)) return;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ui);
  else ui();
})();
</script>
<!-- AMB:end -->
</body>
</html>
