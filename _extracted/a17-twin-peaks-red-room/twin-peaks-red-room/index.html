<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>The Red Room</title>
<link rel="icon" href="data:,">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: radial-gradient(ellipse at 50% 45%, #0b1417 0%, #04090b 48%, #010203 100%);
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  #scene {
    display: block; width: 100vw; height: 100vh;
    touch-action: none; cursor: grab; outline: none;
    -webkit-user-select: none; user-select: none;
  }
  #scene:active { cursor: grabbing; }
  ::selection { background: transparent; }
</style>
<!-- longpress:off -->
<style>
  html, body, canvas { -webkit-touch-callout: none; -webkit-user-select: none; -moz-user-select: none; user-select: none; }
</style>
<script>
  (function () {
    function stop(e) { e.preventDefault(); }
    document.addEventListener('contextmenu', stop, { passive: false });
    document.addEventListener('selectstart', stop, true);
    document.addEventListener('dragstart', stop, true);
  })();
</script>
</head>
<body>
<canvas id="scene"></canvas>
<script src="vendor/three.min.js"></script>
<script src="src/core.js"></script>
<script src="src/textures.js"></script>
<script src="src/ground.js"></script>
<script src="src/forest.js"></script>
<script src="src/room.js"></script>
<script src="src/furniture.js"></script>
<script src="src/props.js"></script>
<script src="src/effects.js"></script>
<script src="src/main.js"></script>
</body>
</html>
