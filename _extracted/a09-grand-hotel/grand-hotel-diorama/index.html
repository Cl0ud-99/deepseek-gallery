<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Grand Hotel</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #180d16; overflow: hidden;
  }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; width: 100%; height: 100%; }
  #veil {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(120% 100% at 50% 42%, #3a2131 0%, #180d16 62%, #0d060c 100%);
    transition: opacity 1.3s ease;
    opacity: 1;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
<!-- longpress:off -->
<style>
  html, body, canvas { -webkit-touch-callout: none; -webkit-user-select: none; -moz-user-select: none; user-select: none; }
</style>
<script>
  (function () {
    function stop(e) { e.preventDefault(); }
    document.addEventListener('contextmenu', stop, { passive: false });
    document.addEventListener('selectstart', stop, true);
    document.addEventListener('dragstart', stop, true);
  })();
</script>
</head>
<body>
  <div id="app"></div>
  <div id="veil"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
