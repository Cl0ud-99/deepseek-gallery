<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6d9d4" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23ffd9df'/%3E%3Cpath d='M7 18c4-8 14-10 18-3-5-2-10 0-13 5-1 2-3 1-5-2z' fill='%23fff5e8'/%3E%3C/svg%3E" />
  <title>晚霞织梦染坊 · Sunset Dream Loom</title>
  <style>
:root {
  color-scheme: light;
  --ink: #694e63;
}
* { box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 68% 34%, #fff1c7 0%, rgba(255,231,198,.75) 16%, rgba(255,211,199,.18) 42%, transparent 62%),
    radial-gradient(ellipse at 22% 12%, #e7d6ff 0%, transparent 58%),
    linear-gradient(160deg, #b9e7f7 0%, #dbd8fb 28%, #ffd5e3 55%, #ffc9b1 78%, #ffe3c8 100%);
  font-family: ui-rounded, "Hiragino Maru Gothic ProN", "Nunito", "Yuanti SC", "PingFang SC", sans-serif;
  -webkit-tap-highlight-color: transparent;
}
body {
  position: relative;
  min-height: 100svh;
  overscroll-behavior: none;
}
.stage-wrap {
  position: fixed;
  inset: 0;
  overflow: hidden;
  isolation: isolate;
}
canvas#stage {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  opacity: 0;
  transform: scale(1.015);
  transition: opacity 1.5s ease, transform 2.6s cubic-bezier(.16,.8,.25,1);
  cursor: grab;
  outline: none;
  touch-action: none;
}
canvas#stage.is-ready {
  opacity: 1;
  transform: scale(1);
}
canvas#stage:active { cursor: grabbing; }
.vignette {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 3;
  background:
    radial-gradient(ellipse at 50% 44%, transparent 48%, rgba(102,63,91,.11) 80%, rgba(88,53,82,.24) 110%),
    linear-gradient(180deg, rgba(255,255,255,.06), transparent 24%, transparent 76%, rgba(149,97,121,.08));
}
.nojs {
  position: fixed; inset: 0; display: grid; place-items: center;
  color: var(--ink); background: #ffe7e2; z-index: 9; font-size: 15px; letter-spacing: .06em;
}
@media (max-width: 720px) {
  .vignette { background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(88,53,82,.18) 110%); }
}
@media (prefers-reduced-motion: reduce) {
  canvas#stage { transition: opacity .4s ease; transform: none; }
}
</style>

  /* ---------- 构建整条链路 ---------- */

      var dg = ctx.createGain(); dg.gain.value = d.v;

            loop();

      timers.forEach(clearTimeout);
      try { master.disconnect(); } catch (e) {}
    } };
  }

  }

  function start() {
    if (ctx) { muted = !muted; if (graph) graph.master.gain.value = muted ? 0 : PRESETS[presetId].g; btn.textContent = muted ? '🔇 环境声已静音' : '🔊 环境声'; return; }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { btn.textContent = '浏览器不支持 Web Audio'; return; }
    ctx = new AC();
    var p = PRESETS[presetId];
    if (!p) { btn.textContent = '（此场景暂无环境声）'; return; }
    graph = build(ctx, ctx.destination, p, false);
    btn.textContent = '🔊 环境声';
    btn.style.opacity = .55;
    if (ctx.state === 'suspended') ctx.resume();
  }

  var presetId = window.__AMB_PRESET__ || null;

  /* ---------- 试听用：多实例 ---------- */
  var sharedCtx = null, instances = [];

  function auditionCtx() {
    if (!sharedCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      sharedCtx = new AC();
    }
    if (sharedCtx.state === 'suspended') sharedCtx.resume();
    return sharedCtx;
  }

  var A = {
    presets: PRESETS,
    play: function (id) {
      var p = PRESETS[id];
      if (!p) return null;
      var c = auditionCtx();
      var g = c.createGain(); g.gain.value = 0.9;
      var comp = c.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.25;
      g.connect(comp); comp.connect(c.destination);
      var h = build(c, g, p, false);
      var inst = {
        id: id,
        volume: function (v) { g.gain.value = v; },
        stop: function () {
          h.stop();
          try { g.disconnect(); comp.disconnect(); } catch (e) {}
          instances = instances.filter(function (x) { return x !== inst; });
        }
      };
      instances.push(inst);
      return inst;
    },
    stopAll: function () { instances.slice().forEach(function (i) { i.stop(); }); },
    active: function () { return instances.map(function (i) { return i.id; }); },
    renderOffline: renderOffline,
    mount: function (id) { presetId = id; },
    start: start,
    state: function () {
      return { preset: presetId, started: !!ctx, ctxState: ctx ? ctx.state : null,
               muted: muted, presetCount: Object.keys(PRESETS).length };
    }
  };
  window.Ambience = A;

  if (!presetId) return;
  if (/(?:^|[?&])nosound=1/.test(location.search)) return;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ui);
  else ui();
})();
</script>
<!-- AMB:end -->
