<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>环境声试听 · 19 件</title>
<style>
  :root{--bg:#080a0f;--panel:#11151d;--panel2:#161b25;--line:rgba(255,255,255,.08);
        --text:#e9ecf3;--dim:#8a92a6;--dim2:#5d6478;--amber:#ffb46b;--amber-dim:rgba(255,180,107,.13)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(80% 50% at 50% 0%,rgba(255,150,90,.07),transparent 70%),var(--bg);
       color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       padding:44px 36px 80px;-webkit-font-smoothing:antialiased}
  header{max-width:1400px;margin:0 auto 26px}
  .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--amber);margin-bottom:12px}
  h1{font-size:30px;font-weight:650;letter-spacing:-.02em}
  .lede{margin-top:12px;max-width:760px;color:var(--dim);font-size:13.5px;line-height:1.8}
  .bar{display:flex;gap:12px;align-items:center;margin-top:22px;flex-wrap:wrap}
  button.b{font:inherit;font-size:12.5px;padding:8px 15px;border-radius:8px;cursor:pointer;
    border:1px solid var(--line);background:var(--panel);color:var(--text);transition:.15s}
  button.b:hover{border-color:rgba(255,180,107,.5);color:var(--amber)}
  button.b.on{background:var(--amber-dim);border-color:rgba(255,180,107,.55);color:var(--amber)}
  .count{font-size:12px;color:var(--dim2);margin-left:auto;font-variant-numeric:tabular-nums}
  .grid{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px 16px 13px;
        transition:.18s;position:relative;overflow:hidden}
  .card:hover{border-color:rgba(255,255,255,.18)}
  .card.playing{border-color:rgba(255,180,107,.55);box-shadow:0 0 0 1px rgba(255,180,107,.18) inset}
  .top{display:flex;align-items:flex-start;gap:12px}
  .meta{flex:1;min-width:0}
  .id{font-size:10.5px;letter-spacing:.16em;color:var(--amber);font-weight:600}
  .nm{font-size:15px;font-weight:600;margin-top:2px;letter-spacing:-.01em}
  .sd{font-size:12px;color:var(--dim);margin-top:5px}
  .play{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,180,107,.4);
        background:var(--amber-dim);color:var(--amber);cursor:pointer;font-size:15px;line-height:1;
        display:flex;align-items:center;justify-content:center;transition:.15s}
  .play:hover{background:rgba(255,180,107,.25);border-color:rgba(255,180,107,.7)}
  .card.playing .play{background:rgba(255,180,107,.28);border-color:rgba(255,180,107,.8)}
  .bottom{display:flex;align-items:center;gap:10px;margin-top:13px;padding-top:11px;border-top:1px solid var(--line)}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:3px;border-radius:2px;
    background:rgba(255,255,255,.14);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;
    background:var(--amber);cursor:pointer}
  .open{font-size:11.5px;color:var(--dim2);text-decoration:none;white-space:nowrap}
  .open:hover{color:var(--amber)}
  .hint{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);font-size:12.5px;color:var(--dim);
        background:rgba(10,12,17,.9);border:1px solid var(--line);padding:9px 16px;border-radius:99px;
        backdrop-filter:blur(8px);transition:opacity .4s}
  .hint.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<header>
  <div class="eyebrow">Ambience Lab · 试听</div>
  <h1>19 件场景的环境声</h1>
  <p class="lede">全部由 Web Audio 现场合成，包里没有任何音频文件。噪声床管雨、风和海，低频 drone 管压迫感，随机事件负责钟声、滴水、雷、海鸥、金属、蒸汽这些点缀。点 ▶ 单独试听，可以同时开几件做 A/B。</p>
  <div class="bar">
    <button class="b" id="stopAll">■ 全部停止</button>
    <button class="b" id="oneAtATime">单曲模式</button>
    <span class="count" id="count">正在播放 0</span>
  </div>
</header>
<main class="grid" id="grid"></main>
<div class="hint" id="hint">点任意 ▶ 开始（浏览器要求先有一次点击）</div>

<script>
/*__ENGINE__*/
</script>
<script>
(function () {
  var NAMES = __NAMES__;
  var SOUND = __SOUND__;
  var LINKS = __LINKS__;
  var grid = document.getElementById('grid');
  var cards = {};
  var oneAtATime = false;

  Object.keys(window.Ambience.presets).forEach(function (id) {
    var el = document.createElement('div');
    el.className = 'card';
    el.innerHTML =
      '<div class="top">' +
        '<div class="meta">' +
          '<div class="id">' + id + '</div>' +
          '<div class="nm">' + (NAMES[id] || id) + '</div>' +
          '<div class="sd">' + (SOUND[id] || '') + '</div>' +
        '</div>' +
        '<button class="play" type="button" title="试听">▶</button>' +
      '</div>' +
      '<div class="bottom">' +
        '<input type="range" min="0" max="1.6" step="0.01" value="0.9" title="音量">' +
        '<a class="open" href="' + (LINKS[id] || '#') + '" target="_blank" rel="noopener">打开场景 ↗</a>' +
      '</div>';
    grid.appendChild(el);
    var btn = el.querySelector('.play');
    var slider = el.querySelector('input');
    var inst = null;

    function setIcon() { btn.textContent = inst ? '■' : '▶'; el.classList.toggle('playing', !!inst); refresh(); }

    btn.onclick = function () {
      if (inst) { inst.stop(); inst = null; setIcon(); return; }
      if (oneAtATime) { window.Ambience.stopAll(); Object.keys(cards).forEach(function (k) { if (cards[k].reset) cards[k].reset(); }); }
      inst = window.Ambience.play(id);
      if (inst) { inst.volume(parseFloat(slider.value)); setIcon(); }
      document.getElementById('hint').classList.add('hide');
    };
    slider.oninput = function () { if (inst) inst.volume(parseFloat(slider.value)); };
    cards[id] = { reset: function () { inst = null; setIcon(); } };
    setIcon();
  });

  function refresh() {
    var a = window.Ambience.active ? window.Ambience.active() : [];
    document.getElementById('count').textContent = '正在播放 ' + a.length;
  }

  document.getElementById('stopAll').onclick = function () {
    window.Ambience.stopAll();
    Object.keys(cards).forEach(function (k) { cards[k].reset(); });
  };
  var modeBtn = document.getElementById('oneAtATime');
  modeBtn.onclick = function () {
    oneAtATime = !oneAtATime;
    modeBtn.classList.toggle('on', oneAtATime);
    modeBtn.textContent = oneAtATime ? '单曲模式（开）' : '单曲模式';
  };
  setInterval(refresh, 500);
})();
</script>
</body>
</html>
